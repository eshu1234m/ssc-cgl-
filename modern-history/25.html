raphic notes that he started legal practice in Bombay after returning in 1891."}, {"q": "Why did Gandhi travel to South Africa in 1893?", "o": ["To establish an ashram", "To fight a legal case for Dada Abdullah", "To join the British Army", "To study medicine"], "a": 1, "e": "He travelled to South Africa to handle the case of Dada Abdullah."}, {"q": "Where did Gandhi reach in South Africa?", "o": ["Cape Town", "Natal", "Johannesburg", "Pretoria"], "a": 1, "e": "The infographic identifies Natal, South Africa, as his destination."}, {"q": "Which firm was associated with Gandhi's South African legal work?", "o": ["Phoenix & Company", "Dada Abdullah & Company", "Natal Trading Company", "Tolstoy & Sons"], "a": 1, "e": "Gandhi went to South Africa for the case of Dada Abdullah & Company."}, {"q": "What was the case value mentioned in the infographic?", "o": ["£10,000", "£20,000", "£40,000", "£50,000"], "a": 2, "e": "The infographic gives the case value as £40,000."}, {"q": "What monthly salary is shown for Gandhi's South African assignment?", "o": ["£50", "£105", "£150", "£205"], "a": 1, "e": "The infographic lists a salary of £105 per month."}, {"q": "What was the duration of Gandhi's initial South African contract?", "o": ["Six months", "One year", "Two years", "Three years"], "a": 1, "e": "The infographic lists a one-year contract."}, {"q": "Which class ticket did Gandhi have for the train journey during the Pietermaritzburg incident?", "o": ["Second class", "Third class", "First class", "No ticket"], "a": 2, "e": "The infographic lists a first-class ticket. Gandhi was travelling in a first-class compartment when he was ordered to leave it."}, {"q": "What happened to Gandhi at Pietermaritzburg railway station?", "o": ["He was arrested for protesting", "He was pushed out of the train", "He was denied a passport", "He was removed from a courtroom"], "a": 1, "e": "Gandhi was forcibly removed from a train at Pietermaritzburg because of racial discrimination."}, {"q": "The graha in South Africa"], "a": 1, "e": "Gandhi wrote Hind Swaraj in 1909; the infographic places it under 1910, so check the date against your standard textbook."}, {"q": "What was the Tolstoy Farm?", "o": ["A legal office in Bombay", "A settlement established by Gandhi in Johannesburg", "A school in Porbandar", "A British military camp"], "a": 1, "e": "Tolstoy Farm was established by Gandhi and his associates near Johannesburg in South Africa."}, {"q": "In which year was Tolstoy Farm established, according to the infographic?", "o": ["1904", "1908", "1910", "1917"], "a": 2, "e": "The infographic lists Tolstoy Farm under 1910."}, {"q": "Where was the Phoenix Ashram established?", "o": ["Porbandar", "South Africa", "Bombay", "Sabarmati"], "a": 1, "e": "The Phoenix settlement/ashram was established in South Africa."}, {"q": "When did Gandhi return permanently to India?", "o": ["2 October 1910", "9 January 1915", "15 August 1917", "1 January 1920"], "a": 1, "e": "Gandhi returned permanently to India on 9 January 1915."}, {"q": "Which Indian leader advised Gandhi to travel throughout India?", "o": ["Bal Gangadhar Tilak", "Gopal Krishna Gokhale", "Dadabhai Naoroji", "Lala Lajpat Rai"], "a": 1, "e": "Gopal Krishna Gokhale advised Gandhi to travel around India to understand the country."}, {"q": "Which ashram was established at Kochrab in 1915?", "o": ["Phoenix Ashram", "Satyagraha Ashram", "Tolstoy Farm", "Sevagram Ashram"], "a": 1, "e": "Gandhi established the Satyagraha Ashram at Kochrab, Ahmedabad, in 1915."}, {"q": "Where was Kochrab village located?", "o": ["Ahmedabad", "Porbandar", "Bombay", "Surat"], "a": 0, "e": "Kochrab is in Ahmedabad, Gujarat."}, {"q": "In which year did Gandhi shift to Sabarmati Ashram?", "o": ["1915", "1916", "1917", "1919"], "a": 2, "e": "The infographic gives 1917 as the year Gandhi shifted to Sabarmati Ashram."}, {"q": "Where is Sabarmati Ashram located?", "o": ["Rajkot", "Ahmedabad, Gujarat", "Porbandar", "Pune"], "a": 1, "e": "Sabarmati Ashram is in Ahmedabad, Gujarat."}, {"q": "Which period of Gandhi's life at Sabarmati Ashram is shown in the infographic?", "o": ["1905–1915", "1917–1933", "1919–1947", "1920–1942"], "a": 1, "e": "The infographic lists the period as 1917–1933."}, {"q": "Who provided financial assistance for Gandhi's Sabarmati Ashram, according to the infographic?", "o": ["Jamnalal Bajaj", "Ambalal Sarabhai", "G.D. Birla", "J.R.D. Tata"], "a": 1, "e": "Ambalal Sarabhai is named as the financial assistant in the infographic."}, {"q": "What was Gandhi's cottage at Sabarmati called, according to the infographic?", "o": ["Hriday Kunj", "Nandini", "Anand Bhavan", "Sevagram"], "a": 0, "e": "Gandhi's cottage at Sabarmati Ashram is known as Hriday Kunj."}, {"q": "What was the name of the guest house at Sabarmati Ashram shown in the infographic?", "o": ["Hriday Kunj", "Nandini", "Kasturba Kutir", "Tolstoy House"], "a": 1, "e": "The infographic identifies the guest house as Nandini."}, {"q": "During the First World War, what did Gandhi appeal to Indians to do?", "o": ["Boycott all taxes", "Join the British Army", "Refuse all government jobs", "Leave India"], "a": 1, "e": "The infographic says Gandhi appealed to Indians to join the British Army and called himself a 'Recruiting Sergeant'."}, {"q": "Which title was conferred on Gandhi by the British Government in 1915?", "o": ["Rai Bahadur", "Kaiser-i-Hind", "Sir", "Mahatma"], "a": 1, "e": "The British Government conferred the Kaiser-i-Hind medal/title on Gandhi in 1915."}, {"q": "Who was Gandhi's political guru?", "o": ["Raychandbhai", "Gopal Krishna Gokhale", "John Ruskin", "Leo Tolstoy"], "a": 1, "e": "Gopal Krishna Gokhale is widely described as Gandhi's political guru."}, {"q": "Who was Gandhi's spiritual guru, according to the infographic?", "o": ["Gopal Krishna Gokhale", "Raychandbhai (Raichandbhai)", "John Ruskin", "Leo Tolstoy"], "a": 1, "e": "The infographic identifies Raychandbhai, also known as Shrimad Rajchandra, as Gandhi's spiritual guide."}, {"q": "Who inspired Gandhi's idea of hunger strike, according to the infographic?", "o": ["Leo Tolstoy", "John Ruskin", "Gopal Krishna Gokhale", "Henry David Thoreau"], "a": 1, "e": "The infographic links John Ruskin with the inspiration for hunger strike and lists his book Unto This Last."}, {"q": "Which book by John Ruskin is mentioned in the infographic?", "o": ["War and Peace", "Unto This Last", "Anna Karenina", "Hind Swaraj"], "a": 1, "e": "Unto This Last by John Ruskin influenced Gandhi's thinking."}, {"q": "Who is listed as an inspiration for Gandhi's movement?", "o": ["Leo Tolstoy", "Karl Marx", "Adam Smith", "Thomas Paine"], "a": 0, "e": "The infographic names Leo Tolstoy as an inspiration for Gandhi's movement."}, {"q": "Which two books by Leo Tolstoy are mentioned?", "o": ["War and Peace and Anna Karenina", "Unto This Last and Hind Swaraj", "The Republic and Politics", "Das Kapital and The Communist Manifesto"], "a": 0, "e": "The infographic lists War and Peace and Anna Karenina."}, {"q": "Which method did Gandhi use to organise the Indian community in South Africa?", "o": ["Armed rebellion", "Satyagraha, non-violence and civil resistance", "Secret revolutionary cells", "Constitutional petitions only"], "a": 1, "e": "The infographic highlights Satyagraha, non-violence and civil resistance as methods Gandhi used."}, {"q": "Which of the following is NOT listed among Gandhi's principles?", "o": ["Satya", "Ahimsa", "Swadeshi", "Militarism"], "a": 3, "e": "The listed principles are truth (Satya), non-violence (Ahimsa), Satyagraha, Swadeshi and Sarvodaya."}, {"q": "What does Sarvodaya mean in Gandhi's principles?", "o": ["Rule by one person", "Welfare of all", "Foreign trade", "Passive obedience"], "a": 1, "e": "Sarvodaya means the welfare or uplift of all."}];
let cur=0,ans=Array(data.length).fill(null),done=Array(data.length).fill(false);
const el=id=>document.getElementById(id);
function persist(){try{localStorage.setItem('modernHistoryPage25',JSON.stringify({cur,ans,done}))}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem('modernHistoryPage25'));if(s&&s.ans?.length===data.length){cur=s.cur||0;ans=s.ans;done=s.done}}catch(e){}}
function render(){el('quiz').style.display='block';el('result').classList.remove('show');const q=data[cur];el('counter').textContent=`Question ${cur+1} of ${data.length}`;el('answered').textContent=`Answered: ${ans.filter(x=>x!==null).length}`;el('bar').style.width=((cur+1)/data.length*100)+'%';el('question').textContent=q.q;el('options').innerHTML='';
q.o.forEach((v,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+v;if(ans[cur]===i)b.classList.add('sel');if(done[cur]){if(i===q.a)b.classList.add('right');else if(ans[cur]===i)b.classList.add('wrong')}b.disabled=done[cur];b.onclick=()=>{ans[cur]=i;persist();render()};el('options').appendChild(b)});
const f=el('feedback');f.className='feedback';if(done[cur]){f.classList.add('show',ans[cur]===q.a?'good':'bad');f.innerHTML=`<b>${ans[cur]===q.a?'Correct!':'Incorrect.'}</b> Correct answer: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}<br><br>${q.e}`}

const start=Math.max(0,Math.min(cur-2,data.length-5)),end=Math.min(data.length,start+5);el('jump').innerHTML='';if(start>0){const x=document.createElement('button');x.textContent='…';x.onclick=()=>go(start-1);el('jump').appendChild(x)}for(let i=start;i<end;i++){const b=document.createElement('button');b.textContent=i+1;if(i===cur)b.classList.add('active');if(ans[i]!==null)b.style.fontWeight='800';b.onclick=()=>go(i);el('jump').appendChild(b)}if(end<data.length){const x=document.createElement('button');x.textContent='…';x.onclick=()=>go(end);el('jump').appendChild(x)}}
function go(i){cur=Math.max(0,Math.min(data.length-1,i));persist();render()}
function submit(){if(ans[cur]===null)return;done[cur]=true;persist();render()}
function finish(){const score=ans.reduce((n,a,i)=>n+(a===data[i].a?1:0),0);el('quiz').style.display='none';el('result').classList.add('show');el('score').textContent=`${score} / ${data.length}`;el('summary').textContent=`Accuracy: ${Math.round(score/data.length*100)}%. Correct: ${score}; incorrect: ${ans.filter((a,i)=>a!==null&&a!==data[i].a).length}; unanswered: ${ans.filter(a=>a===null).length}.`;el('review').innerHTML='';data.forEach((q,i)=>{if(ans[i]!==q.a){const d=document.createElement('div');d.className='review';d.innerHTML=`<b>Q${i+1}. ${q.q}</b><br>Your answer: ${ans[i]===null?'Not answered':q.o[ans[i]]}<br>Correct answer: ${q.o[q.a]}<br>${q.e}`;el('review').appendChild(d)}});persist()}
function restart(){cur=0;ans=Array(data.length).fill(null);done=Array(data.length).fill(false);persist();render()}
el('submit').onclick=submit;el('prev').onclick=()=>go(cur-1);el('skip').onclick=()=>go(cur+1);el('next').onclick=()=>{if(cur===data.length-1)finish();else go(cur+1)};
