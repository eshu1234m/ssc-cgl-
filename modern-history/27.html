<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}

<header><h1>NON-COOPERATION MOVEMENT</h1><p>Modern Indian History · Page 27 · 38 MCQs</p></header>
<main>
<section class="panel" id="quiz">
<div class="stats"><span id="counter">Question 1 of 35</span><span id="answered">Answered: 0 / 35</span><span id="scoreLive">Correct: 0</span></div>

<script>
const questions = [["The Non-Cooperation Movement was described in the notes as India's first:", ["Mass movement", "Peasant revolt", "Revolutionary conspiracy", "Constitutional agitation"], 0, "The notes identify the Non-Cooperation Movement as the first mass movement."], ["According to the notes, the Non-Cooperation Movement was launched on:", ["1 August 1920", "20 July 1920", "4 February 1922", "12 February 1922"], 0, "The launch date given is 1 August 1920. The announcement had been made on 20 July 1920."], ["Which set contains the objectives of the Non-Cooperation Movement listed in the notes?", ["Justice for Jallianwala Bagh victims, Swaraj, and justice for the Khilafat Movement", "Separate electorates, dominion status, and expansion of councils", "Abolition of zamindari, universal education, and complete disarmament", "Support for British war efforts, constitutional reforms, and recruitment"], 0, "The listed objectives were justice for the victims of the Jallianwala Bagh massacre, attainment of Swaraj (self-rule), and justice for the Khilafat Movement."], ["Which of the following was NOT listed as a cause of the Non-Cooperation Movement?", ["Rowlatt Act", "Jallianwala Bagh Massacre", "Hunter Committee Report", "Ilbert Bill"], 3, "The notes list the Rowlatt Act, Jallianwala Bagh Massacre, Hunter Committee Report, Khilafat Movement, and unsuccessful Montagu–Chelmsford Reforms."], ["The proposal for the Non-Cooperation Movement was placed at the September 1920 special session held at:", ["Calcutta", "Nagpur", "Ahmedabad", "Gaya"], 0, "The proposal was considered at the Calcutta Special Session in September 1920."], ["Who presided over the September 1920 Calcutta Special Session, according to the notes?", ["Lala Lajpat Rai", "Mahatma Gandhi", "Hakim Ajmal Khan", "C. R. Das"], 0, "The notes identify Lala Lajpat Rai as the president of the Calcutta Special Session."], ["At which Congress session was the Non-Cooperation proposal approved?", ["Nagpur Session, 1920", "Calcutta Session, 1917", "Gaya Session, 1922", "Lucknow Session, 1916"], 0, "The proposal was approved at the Nagpur Session of 1920."], ["Which fund was established as a decision of the Nagpur Session?", ["Tilak Swaraj Fund", "Gandhi Peace Fund", "Swaraj Revenue Fund", "Khilafat Relief Fund"], 0, "The Nagpur Session decisions included the establishment of the Tilak Swaraj Fund."], ["At the Nagpur Session, the Congress membership fee was fixed at:", ["4 annas", "1 anna", "8 annas", "1 rupee"], 0, "The notes state that Congress membership fee was fixed at 4 annas."], ["What time limit did Gandhi declare for achieving Swaraj at the Nagpur Session?", ["Within one year", "Within six months", "Within five years", "Within ten years"], 0, "Gandhi declared that Swaraj would be achieved within one year."], ["Which of the following was included in the boycott programme?", ["Courts and legal practice", "Only foreign military officers", "Only railway travel", "Only private banks"], 0, "The boycott list included courts/legal practice, titles, educational institutions, government jobs, and legislative councils."], ["Which item was part of the constructive programme?", ["Removal of untouchability", "Expansion of legislative councils", "Promotion of liquor consumption", "Compulsory foreign cloth imports"], 0, "The constructive programme included prohibition of liquor, removal of untouchability, national unity, cleanliness, and economic equality."], ["Which group of leaders is correctly associated with leaving legal practice during the movement?", ["Motilal Nehru, Jawaharlal Nehru, C. Rajagopalachari and C. R. Das", "Lord Curzon, Lord Minto, Lord Ripon and Lord Lytton", "W. C. Bonnerjee, Dadabhai Naoroji, Gopal Krishna Gokhale and Lord Chelmsford", "B. G. Tilak, Aurobindo Ghosh, Bhagat Singh and Subhas Chandra Bose"], 0, "The notes list Motilal Nehru, Jawaharlal Nehru, C. Rajagopalachari, Chittaranjan Das, Lala Lajpat Rai, Vallabhbhai Patel and others."], ["Which institution was among those established during the Non-Cooperation period?", ["Jamia Millia Islamia", "Fort William College", "Hindu College, Calcutta", "Aligarh Scientific Society"], 0, "The notes list Gujarat Vidyapith, Jamia Millia Islamia, and Tilak Maharashtra Vidyapeeth."], ["Which honours did Gandhi return, according to the notes?", ["Kaiser-i-Hind, Boer War Medal and Zulu War Medal", "Bharat Ratna, Padma Shri and Padma Bhushan", "Victoria Cross, Order of Merit and Knight Bachelor", "Only the Kaiser-i-Hind medal"], 0, "The infographic lists the Kaiser-i-Hind, Boer War Medal, and Zulu War Medal."], ["Who visited India in February 1921, whose welcome Gandhi opposed?", ["Duke of Connaught", "Prince of Wales", "King George V", "Lord Reading"], 0, "The notes state that the Duke of Connaught visited India in February 1921 and Gandhi opposed his welcome."], ["The arrival of the Prince of Wales in December 1921 was met with:", ["Boycott and black-flag demonstrations", "A nationwide celebration", "A formal Congress welcome", "A military parade organised by Congress"], 0, "The notes mention boycott, pressure on the government, violent clashes, and black-flag demonstrations."], ["Approximately how many people were arrested during the December 1921 protests, according to the infographic?", ["30,000", "3,000", "50,000", "1,000"], 0, "The infographic gives the arrest figure as about 30,000."], ["At the protest in Calcutta, which leaders were arrested and what imprisonment terms are shown?", ["Chittaranjan Das – 6 months; Abul Kalam Azad – 1 year", "Motilal Nehru – 1 year; Gandhi – 6 months", "Lala Lajpat Rai – 2 years; Hakim Ajmal Khan – 1 year", "Jawaharlal Nehru – 6 months; Vallabhbhai Patel – 2 years"], 0, "The infographic states that Chittaranjan Das was imprisoned for six months and Abul Kalam Azad for one year."], ["Who presided over the Ahmedabad Session of 1921?", ["Hakim Ajmal Khan", "Lala Lajpat Rai", "C. R. Das", "Motilal Nehru"], 0, "The notes identify Hakim Ajmal Khan as president of the Ahmedabad Session (1921)."], ["What did Gandhi declare about the charkha at the Ahmedabad Session, as represented in the notes?", ["Everyone should spin the charkha", "Only Congress leaders should spin it", "It should be replaced by imported cloth", "It should be used only during festivals"], 0, "The decisions included the importance of khadi and that everyone should spin the charkha."], ["On 1 February 1922, Gandhi announced:", ["Civil disobedience", "The Quit India Movement", "The Dandi March", "The Individual Satyagraha"], 0, "The infographic states that Gandhi announced civil disobedience on 1 February 1922 and gave one week's notice."], ["The Chauri Chaura incident took place on:", ["4 February 1922", "12 February 1922", "10 March 1922", "1 August 1920"], 0, "The date shown for the Chauri Chaura incident is 4 February 1922."], ["Where did the Chauri Chaura incident occur?", ["Gorakhpur, United Provinces", "Calcutta, Bengal", "Nagpur, Central Provinces", "Ahmedabad, Gujarat"], 0, "The notes place the incident at Gorakhpur in the United Provinces (present-day Uttar Pradesh)."], ["Who is named as the leader associated with the Chauri Chaura incident in the infographic?", ["Bhagwan Ahir", "Chittaranjan Das", "Hakim Ajmal Khan", "Motilal Nehru"], 0, "The infographic names Bhagwan Ahir as the leader."], ["What happened during the Chauri Chaura incident, according to the notes?", ["22 policemen were burnt alive", "A railway station was captured", "The Viceroy was attacked", "A legislative council was dissolved"], 0, "The infographic states that 22 policemen were burnt alive."], ["On what date was the Non-Cooperation Movement suspended?", ["12 February 1922", "4 February 1922", "10 March 1922", "5 February 1924"], 0, "The movement was suspended on 12 February 1922, following the Chauri Chaura incident."], ["Which was NOT listed as a reason for suspending the Non-Cooperation Movement?", ["Chauri Chaura incident", "Gandhi's policy of non-violence", "Director's order", "Strategic failure"], 2, "The infographic lists the Chauri Chaura incident, Gandhi's policy of non-violence, Director's order, and strategic failure. 'Director's order' is reproduced as printed in the notes, though it may be a transcription error and should be checked against the original source."], ["Who described the suspension of the movement as a great mistake?", ["Abul Kalam Azad", "Motilal Nehru", "Lala Lajpat Rai", "C. Rajagopalachari"], 0, "The notes attribute the description of the suspension as a great mistake to Abul Kalam Azad."], ["When was Gandhi arrested, and what sentence is shown in the infographic?", ["10 March 1922; six years' imprisonment", "12 February 1922; two years' imprisonment", "4 February 1922; life imprisonment", "5 February 1924; six months' imprisonment"], 0, "The infographic gives 10 March 1922 as the arrest date and a sentence of six years' imprisonment."], ["According to the infographic, when was Gandhi released from prison?", ["5 February 1924", "10 March 1924", "12 February 1922", "1 August 1923"], 0, "The release date shown is 5 February 1924."], ["Who presided over the Gaya Session of 1922?", ["Chittaranjan Das", "Hakim Ajmal Khan", "Lala Lajpat Rai", "Mahatma Gandhi"], 0, "The Gaya Session (1922) was presided over by Chittaranjan Das."], ["What proposal was associated with the Gaya Session?", ["Contest elections or continue constructive work", "Launch the Quit India Movement", "Accept office under the British immediately", "End the Congress organisation"], 0, "The debate centred on whether to contest elections or continue constructive work."], ["Who were the Pro-Changers?", ["Chittaranjan Das, Motilal Nehru and Vithalbhai Patel", "Vallabhbhai Patel, C. Rajagopalachari and Rajendra Prasad", "Gandhi, Hakim Ajmal Khan and Lala Lajpat Rai", "Jawaharlal Nehru, Abul Kalam Azad and Bhagwan Ahir"], 0, "The infographic lists Chittaranjan Das, Motilal Nehru and Vithalbhai Patel as Pro-Changers."], ["Which group is identified as the No-Changers?", ["Sardar Vallabhbhai Patel, C. Rajagopalachari and Dr. Rajendra Prasad", "Chittaranjan Das, Motilal Nehru and Vithalbhai Patel", "Lala Lajpat Rai, Hakim Ajmal Khan and Abul Kalam Azad", "Gandhi, Jawaharlal Nehru and Bhagwan Ahir"], 0, "The No-Changers listed are Sardar Vallabhbhai Patel, C. Rajagopalachari and Dr. Rajendra Prasad."], ["The Swaraj Party was founded in 1923 by:", ["Chittaranjan Das and Motilal Nehru", "Gandhi and Jawaharlal Nehru", "Lala Lajpat Rai and Madan Mohan Malaviya", "Vallabhbhai Patel and Rajendra Prasad"], 0, "The infographic gives 1923 as the year and names Chittaranjan Das and Motilal Nehru as founders."], ["How many seats did the Swaraj Party win in the 1923 elections, according to the notes?", ["42 out of 105", "52 out of 100", "32 out of 75", "62 out of 120"], 0, "The infographic states that the party won 42 out of 105 seats."], ["In which year did Chittaranjan Das die, according to the infographic?", ["1925", "1923", "1924", "1927"], 0, "The infographic places Chittaranjan Das's death in 1925."]];
let current=0, answers=Array(questions.length).fill(null), checked=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 const q=questions[current]; $('counter').textContent=`Question ${current+1} of ${questions.length}`;
 $('answered').textContent=`Answered: ${answers.filter(x=>x!==null).length} / ${questions.length}`;
 $('scoreLive').textContent=`Correct: ${answers.reduce((n,a,i)=>n+(a!==null&&a===questions[i][2]?1:0),0)}`;
 $('progress').style.width=((current+1)/questions.length*100)+'%';
 $('question').textContent=q[0]; $('options').innerHTML='';
 q[1].forEach((opt,i)=>{let b=document.createElement('button');b.className='option';if(answers[current]===i)b.classList.add('selected');if(checked[current]){b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===answers[current])b.classList.add('wrong')}
 let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];let t=document.createElement('span');t.textContent=opt;b.append(letter,t);b.onclick=()=>choose(i);$('options').append(b)});
 let f=$('feedback');f.className='feedback';f.textContent='';
 if(checked[current]){f.classList.add('show',answers[current]===q[2]?'good':'bad');f.innerHTML=(answers[current]===q[2]?'Correct! ':'Not quite. Correct answer: '+htmlEscape(q[1][q[2]])+'. ')+htmlEscape(q[3])}
 $('prev').disabled=current===0;$('next').textContent=current===questions.length-1?'Finish':'Next →';
 renderNav();
}
function choose(i){if(checked[current])return;answers[current]=i;checked[current]=true;render()}
function move(n){current=Math.max(0,Math.min(questions.length-1,n));render()}
function renderNav(){let nav=$('nav');nav.innerHTML='';let start=Math.max(0,Math.min(current-1,questions.length-4));let end=Math.min(questions.length,start+4);
 let p=document.createElement('button');p.className='arrow';p.textContent='‹ Prev';p.disabled=current===0;p.onclick=()=>move(current-1);nav.append(p);
 for(let i=start;i<end;i++){let b=document.createElement('button');b.textContent=i+1;if(i===current)b.classList.add('active');else if(checked[i])b.classList.add('done');b.onclick=()=>move(i);nav.append(b)}
 let n=document.createElement('button');n.className='arrow';n.textContent='Next ›';n.disabled=current===questions.length-1;n.onclick=()=>move(current+1);nav.append(n)}
function htmlEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('prev').onclick=()=>move(current-1);$('skip').onclick=()=>move(current+1);$('next').onclick=()=>{if(current===questions.length-1)finish();else move(current+1)};
function finish(){let correct=answers.reduce((n,a,i)=>n+(a===questions[i][2]?1:0),0);$('quiz').style.display='none';$('result').style.display='block';$('finalScore').textContent=`${correct} / ${questions.length}`;$('summary').textContent=`Accuracy: ${Math.round(correct/questions.length*100)}% · Answered: ${answers.filter(a=>a!==null).length} · Skipped: ${answers.filter(a=>a===null).length}`;
 let wrong=questions.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==x.q[2]);$('review').innerHTML='<h3>Review incorrect and skipped questions</h3>'+(wrong.length?wrong.map(x=>`<div class="review-item"><b>Q${x.i+1}. ${htmlEscape(x.q[0])}</b><br><span class="muted">Your answer: ${answers[x.i]===null?'Skipped':htmlEscape(x.q[1][answers[x.i]])}<br>Correct: ${htmlEscape(x.q[1][x.q[2]])}<br>${htmlEscape(x.q[3])}</span></div>`).join(''):'<p>Excellent! All answers are correct.</p>')}
function restart(){current=0;answers=Array(questions.length).fill(null);checked=Array(questions.length).fill(false);$('quiz').style.display='block';$('result').style.display='none';render()}
render();
</script></body></html>
