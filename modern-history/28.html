<script>
const questions=[["When was Bhagat Singh born, according to the notes?", ["28 September 1907", "24 August 1908", "15 May 1907", "23 March 1931"], 0, "The infographic gives Bhagat Singh's birth date as 28 September 1907."], ["Where was Bhagat Singh born?", ["Banga village, Lyallpur District", "Pune, Maharashtra", "Lahore city", "Amritsar, Punjab"], 0, "The notes identify Banga village in Lyallpur District, in present-day Faisalabad, Pakistan."], ["Who was Bhagat Singh's father?", ["Kishan Singh", "Hari Narayan", "Ramlal", "Ajit Singh"], 0, "Bhagat Singh's father is listed as Kishan Singh."], ["Who was Bhagat Singh's mother?", ["Vidyavati Kaur", "Parvati Bai", "Ralli Devi", "Durga Devi"], 0, "The infographic names Vidyavati Kaur as his mother."], ["Which of the following is listed as one of Bhagat Singh's favourite books?", ["Why I Am an Atheist", "Discovery of India", "Hind Swaraj", "The Indian Struggle"], 0, "Why I Am an Atheist is one of the books listed in the infographic."], ["In which year did Bhagat Singh take admission in B.A.?", ["1923", "1926", "1928", "1930"], 0, "The notes state that he took admission in B.A. in 1923."], ["Why did Bhagat Singh leave home?", ["To avoid marriage", "To join the British army", "To study law in London", "To work for a newspaper in Lahore"], 0, "The infographic says he left home to avoid marriage."], ["In Kanpur, Bhagat Singh worked for which publication?", ["Pratap Patrika", "The Tribune", "Kesari", "Young India"], 0, "The notes state that he worked for Pratap Patrika in Kanpur."], ["What pen name did Bhagat Singh use while working for Pratap Patrika?", ["Balwant", "Azad", "Vijay", "Inquilab"], 0, "The pen name given in the infographic is Balwant."], ["Under whom did Bhagat Singh work at Ganesh Shankar Vidyarthi's institution?", ["Ganesh Shankar Vidyarthi", "Lala Lajpat Rai", "Chittaranjan Das", "Madan Mohan Malaviya"], 0, "The notes say he worked under Ganesh Shankar Vidyarthi."], ["Who was Durga Bhabhi?", ["Wife of Bhagwati Charan Vohra", "Mother of Bhagat Singh", "Sister of Sukhdev", "Wife of Rajguru"], 0, "The infographic identifies Durga Bhabhi as the wife of Bhagwati Charan Vohra."], ["In which year was the Naujawan Bharat Sabha established, according to the notes?", ["1926", "1923", "1928", "1931"], 0, "The infographic gives 1926 as the year of establishment."], ["What motto is associated with Bhagat Singh in the infographic?", ["Service, Sacrifice and Suffering", "Swaraj is my birthright", "Do or Die", "Unity and Discipline"], 0, "The motto shown is 'Service, Sacrifice and Suffering'."], ["When did the Simon Commission arrive in Lahore?", ["30 October 1928", "17 November 1928", "17 December 1928", "8 April 1929"], 0, "The timeline gives 30 October 1928 for the Simon Commission's arrival in Lahore."], ["When did Lala Lajpat Rai die, according to the infographic?", ["17 November 1928", "30 October 1928", "17 December 1928", "23 March 1931"], 0, "The date shown for Lala Lajpat Rai's death is 17 November 1928."], ["When was J. P. Saunders assassinated?", ["17 December 1928", "30 October 1928", "8 April 1929", "10 July 1929"], 0, "The infographic gives 17 December 1928 as the date of Saunders' assassination."], ["The first arrest in the Lahore Dussehra Bomb Case is dated to which year?", ["1926", "1928", "1929", "1931"], 0, "The notes state that the first arrest in the Lahore Dussehra Bomb Case occurred in 1926."], ["Who are named in connection with the first arrest in the Lahore Dussehra Bomb Case?", ["B. B. S. Chahal, S. P. Scott and A. S. P. Saunders", "Bhagat Singh, Rajguru and Sukhdev", "Gandhi, Irwin and Malaviya", "Lala Lajpat Rai and Madan Mohan Malaviya"], 0, "These are the names listed in the infographic for the 1926 arrest entry."], ["When did the Central Legislative Assembly Bomb Case take place?", ["8 April 1929", "17 December 1928", "10 July 1929", "23 March 1931"], 0, "The Assembly bomb incident is dated 8 April 1929."], ["Who threw the bombs in the Central Legislative Assembly, according to the notes?", ["Bhagat Singh and Batukeshwar Dutt", "Rajguru and Sukhdev", "Bhagat Singh and Rajguru", "Batukeshwar Dutt and Sukhdev"], 0, "The infographic names Bhagat Singh and Batukeshwar Dutt."], ["What was the stated purpose of the Assembly bombing?", ["To make the deaf hear", "To kill the Viceroy", "To destroy the Assembly building", "To stop the Simon Commission"], 0, "The notes state that the purpose was 'to make the deaf hear'."], ["Which slogan is associated with the Assembly bombing?", ["Inquilab Zindabad", "Jai Jawan Jai Kisan", "Vande Mataram", "Simon Go Back"], 0, "The slogan shown is 'Inquilab Zindabad'."], ["Who was arrested in connection with the Lahore Conspiracy Case on 10 July 1929, according to the infographic?", ["Tri Lal Began", "Madan Mohan Malaviya", "G. C. Hilton", "Lord Irwin"], 0, "The infographic names Tri Lal Began in its 10 July 1929 entry."], ["Who delivered the judgment in the case on 7 October 1930, as shown in the notes?", ["Judge G. C. Hilton", "Lord Irwin", "Madan Mohan Malaviya", "Lala Lajpat Rai"], 0, "The judgment entry names Judge G. C. Hilton."], ["Who were hanged on 23 March 1931?", ["Bhagat Singh, Rajguru and Sukhdev", "Bhagat Singh, Batukeshwar Dutt and Rajguru", "Rajguru, Sukhdev and Durga Bhabhi", "Bhagat Singh, Kishan Singh and Sukhdev"], 0, "The infographic states that Bhagat Singh, Rajguru and Sukhdev were hanged on 23 March 1931."], ["How long did Bhagat Singh observe a hunger strike in Lahore Jail, according to the notes?", ["81 days", "63 days", "61 days", "85 days"], 0, "The infographic gives Bhagat Singh's hunger strike as 81 days."], ["How long did Batukeshwar Dutt's hunger strike last, according to the infographic?", ["81 days", "63 days", "61 days", "71 days"], 0, "The notes state that Batukeshwar Dutt also went on hunger strike for 81 days."], ["How long did Jatin Das's hunger strike last?", ["63 days", "81 days", "61 days", "90 days"], 0, "The infographic gives Jatin Das's hunger strike as 63 days, ending in his martyrdom."], ["Who appealed to convert the death sentence to life imprisonment?", ["Swami/Madan Mohan Malaviya", "Lord Irwin", "Lala Lajpat Rai", "Ganesh Shankar Vidyarthi"], 0, "The infographic says Swami/Madan Mohan Malaviya appealed for conversion of the death sentence to life imprisonment."], ["When did Gandhi meet Lord Irwin, according to the infographic?", ["17 February 1931", "5 March 1931", "23 March 1931", "8 April 1929"], 0, "The meeting between Gandhi and Lord Irwin is dated 17 February 1931."], ["When was the Gandhi–Irwin Pact signed?", ["5 March 1931", "17 February 1931", "23 March 1931", "10 March 1931"], 0, "The infographic gives 5 March 1931 as the date of the Gandhi–Irwin Pact."], ["Which conference is linked to the Gandhi–Irwin Pact in the notes?", ["Round Table Conference", "First Indian National Congress", "Cabinet Mission Conference", "Simla Conference"], 0, "The infographic says the pact led to the Round Table Conference and release of political prisoners."], ["What does HSRA stand for?", ["Hindustan Socialist Republican Association", "Hindustan Swaraj Revolutionary Army", "Hindu Socialist Reform Association", "Home Rule Socialist Republican Alliance"], 0, "HSRA stands for Hindustan Socialist Republican Association."], ["What was the stated ideal of HSRA?", ["Socialist India based on equality and justice", "Restoration of princely states", "Separate electorates for all communities", "Expansion of British rule"], 0, "The infographic says HSRA stood for freedom through revolution and a socialist India based on equality and justice."], ["At what age did Bhagat Singh sacrifice his life, according to the infographic?", ["23 years", "21 years", "25 years", "28 years"], 0, "The notes state that he sacrificed his life at the age of 23."], ["Which phrase is identified as Bhagat Singh's famous slogan?", ["Inquilab Zindabad", "Satyameva Jayate", "Delhi Chalo", "Jai Hind"], 0, "The infographic identifies 'Inquilab Zindabad' as his famous slogan."]];let current=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=questions[current];$('counter').textContent=`Question ${current+1} of ${questions.length}`;$('answered').textContent=`Answered: ${answers.filter(x=>x!==null).length}/${questions.length}`;$('scoreLive').textContent=`Correct: ${answers.reduce((n,a,i)=>n+(a===questions[i][2]?1:0),0)}`;$('progress').style.width=((current+1)/questions.length*100)+'%';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='option';if(answers[current]===i)b.classList.add('selected');if(checked[current]){b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===answers[current])b.classList.add('wrong')}let l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];let t=document.createElement('span');t.textContent=o;b.append(l,t);b.onclick=()=>choose(i);$('options').append(b)});let f=$('feedback');f.className='feedback';f.textContent='';if(checked[current]){f.classList.add('show',answers[current]===q[2]?'good':'bad');f.innerHTML=(answers[current]===q[2]?'Correct! ':'Incorrect. Correct answer: '+esc(q[1][q[2]])+'. ')+esc(q[3])}$('prev').disabled=current===0;$('next').textContent=current===questions.length-1?'Finish':'Next →';renderNav()}
function choose(i){if(checked[current])return;answers[current]=i;checked[current]=true;render()}
function move(n){current=Math.max(0,Math.min(questions.length-1,n));render()}
function renderNav(){let nav=$('nav');nav.innerHTML='';let start=Math.max(0,Math.min(current-1,questions.length-4)),end=Math.min(questions.length,start+4);let p=document.createElement('button');p.className='arrow';p.textContent='‹ Prev';p.disabled=current===0;p.onclick=()=>move(current-1);nav.append(p);for(let i=start;i<end;i++){let b=document.createElement('button');b.textContent=i+1;if(i===current)b.classList.add('active');else if(checked[i])b.classList.add('done');b.onclick=()=>move(i);nav.append(b)}let n=document.createElement('button');n.className='arrow';n.textContent='Next ›';n.disabled=current===questions.length-1;n.onclick=()=>move(current+1);nav.append(n)}
$('prev').onclick=()=>move(current-1);$('skip').onclick=()=>move(current+1);$('next').onclick=()=>current===questions.length-1?finish():move(current+1);
function finish(){let correct=answers.reduce((n,a,i)=>n+(a===questions[i][2]?1:0),0);$('quiz').style.display='none';$('result').style.display='block';$('finalScore').textContent=`${correct} / ${questions.length}`;$('summary').textContent=`Accuracy: ${Math.round(correct/questions.length*100)}% · Answered: ${answers.filter(a=>a!==null).length} · Skipped: ${answers.filter(a=>a===null).length}`;let wrong=questions.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==x.q[2]);$('review').innerHTML='<h3>Incorrect and skipped questions</h3>'+(wrong.length?wrong.map(x=>`<div class="review-item"><b>Q${x.i+1}. ${esc(x.q[0])}</b><br><span class="muted">Your answer: ${answers[x.i]===null?'Skipped':esc(x.q[1][answers[x.i]])}<br>Correct: ${esc(x.q[1][x.q[2]])}<br>${esc(x.q[3])}</span></div>`).join(''):'<p>Excellent! All answers are correct.</p>')}
function restart(){current=0;answers=Array(questions.length).fill(null);checked=Array(questions.length).fill(false);$('quiz').style.display='block';$('result').style.display='none';render()}render();
</script></body></html>
