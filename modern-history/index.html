
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Modern History | SSC CGL Practice</title>

<style>
:root {
  --bg: #0b1020;
  --card: #19243b;
  --text: #f3f6ff;
  --muted: #a5b1c8;
  --blue: #a9c0ff;
  --border: #293650;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 28px;
}

.search {
  width: 100%;
  padding: 15px;
  margin-bottom: 22px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: white;
  font-size: 16px;
}

.quiz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}

.quiz-link {
  display: block;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--blue);
  text-decoration: none;
  transition: 0.2s;
}

.quiz-link:hover {
  background: #263653;
  border-color: var(--blue);
  transform: translateY(-2px);
}

.quiz-link small {
  display: block;
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
}

#noResults {
  display: none;
  color: var(--muted);
  padding: 20px 0;
}

.back {
  display: inline-block;
  margin-top: 28px;
  color: var(--blue);
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Modern History</h1>

<p class="subtitle">
SSC CGL Chapter-wise MCQ Practice
</p>

<h2>Available Quizzes (36)</h2>

<input
  type="text"
  id="search"
  class="search"
  placeholder="Search Modern History quizzes..."
  oninput="filterQuizzes()"
>

<div class="quiz-grid" id="quizList"></div>

<p id="noResults">No matching quizzes found.</p>

<a class="back" href="../index.html">
← Back to SSC CGL Home
</a>

</div>

<script>

// Automatically generate links for all 36 quizzes

const quizList = document.getElementById("quizList");

for (let number = 1; number <= 36; number++) {

  const link = document.createElement("a");

  link.className = "quiz-link";

  link.href = number + ".html";

  link.innerHTML =
    "Modern History Quiz " + number +
    "<small>Quiz " + number + "</small>";

  quizList.appendChild(link);

}

// Search functionality

function filterQuizzes() {

  const search = document.getElementById("search")
    .value.toLowerCase();

  const links = document.querySelectorAll(".quiz-link");

  let visible = 0;

  links.forEach(link => {

    const matches = link.textContent
      .toLowerCase()
      .includes(search);

    link.style.display = matches ? "block" : "none";

    if (matches) visible++;

  });

  document.getElementById("noResults").style.display =
    visible === 0 ? "block" : "none";

}

</script>

</body>
</html>
