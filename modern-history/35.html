<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern History Page 29 – HRA & HSRA Quiz</title>
<style>
:root{--navy:#102b63;--purple:#63339a;--green:#187447;--red:#b52d2d;--ink:#172033;--muted:#647084;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.5}
.wrap{max-width:760px;margin:auto;padding:16px}.top{background:linear-gradient(120deg,#102b63,#56328b);color:white;padding:20px;border-radius:18px}
h1{font-size:23px;line-height:1.2;margin:0 0 8px}.sub{opacity:.9;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{background:#ffffff20;border:1px solid #ffffff40;padding:6px 10px;border-radius:30px;font-size:13px}
.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #102b6310}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:13px}.bar{height:8px;background:#e7ebf2;border-radius:20px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#19a36b;width:0}
.q{font-size:20px;font-weight:750;margin:8px 0 16px}.option{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1.5px solid #d8deea;border-radius:12px;background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.option:disabled{cursor:default}.option.selected{border-color:#345da7;background:#eef4ff}.option.correct{border-color:#16824e;background:#eaf8f0}.option.wrong{border-color:#c53a3a;background:#fff0f0}
.feedback{padding:13px;border-radius:12px;margin-top:14px;font-size:14px}.good{background:#eaf8f0;border:1px solid #a9dfbf}.bad{background:#fff2f0;border:1px solid #efb8b0}
.controls{display:flex;gap:9px;margin-top:16px}.btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:white;flex:1}.secondary{background:#e9edf5;color:#24334f}.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:16px}.nav button{min-width:38px;height:36px;border:1px solid #d5dbea;background:#fff;border-radius:9px;color:#33415c;font-weight:700}.nav button.active{background:var(--navy);color:white;border-color:var(--navy)}.nav button.done{background:#e6f5ed;border-color:#a9dfbf}.nav .prevnext{padding:0 12px;min-width:auto}
.small{font-size:12px;color:var(--muted);text-align:center;margin-top:9px}.hide{display:none}.result{text-align:center}.score{font-size:44px;font-weight:850;color:var(--green)}.reviewitem{text-align:left;border-top:1px solid #e4e8ef;padding:12px 0}
@media(max-width:420px){.wrap{padding:10px}.card{padding:15px}.q{font-size:18px}.btn{padding:11px 12px}}
</style></head><body><main class="wrap">
<header class="top"><h1>Modern History – Quit India Movement (1942)</h1><div class="sub">Page 35 • 35 exam-oriented MCQs • Mixed difficulty</div><div class="stats"><span class="pill">One question at a time</span><span class="pill">Instant feedback</span><span class="pill">Detailed explanations</span></div></header>
<section class="card" id="quiz"><div class="row"><span id="counter">Question 1 of 35</span><span id="answered">0 answered</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div id="feedback"></div>
<div class="controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="skip">Skip</button><button class="btn primary" id="next">Next →</button></div>
<div class="nav" id="nav"></div><div class="small">Use the small question shortcuts to jump. Unanswered questions can be skipped and revisited.</div></section>
<section class="card result hide" id="result"><h2>Quiz completed!</h2><div class="score" id="score"></div><p id="summary"></p><button class="btn primary" onclick="restart()">Retry quiz</button><div id="review" style="margin-top:20px;text-align:left"></div></section>
</main><script>
const data = [["What is another name for the Quit India Movement?", ["August Revolution", "Swadeshi Movement", "Home Rule Movement", "Khilafat Movement"], 0, "The Quit India Movement is also known as the August Revolution."], ["On what date was the Quit India Resolution introduced at the Wardha Session, according to the infographic?", ["14 July 1942", "8 August 1942", "9 August 1942", "15 June 1943"], 0, "The infographic gives 14 July 1942 for its introduction at the Wardha Session."], ["On what date was the Quit India Resolution passed?", ["14 July 1942", "8 August 1942", "9 August 1942", "11 August 1942"], 1, "The resolution was passed on 8 August 1942."], ["Where was the Quit India Resolution passed?", ["Wardha", "Lahore", "Bombay, at Gowalia Tank Maidan", "Calcutta"], 2, "It was passed at the Bombay Session held at Gowalia Tank Maidan, now August Kranti Maidan."], ["Which session is associated with the passage of the Quit India Resolution?", ["Bombay Session", "Karachi Session", "Lahore Session", "Lucknow Session"], 0, "The resolution was passed at the Bombay Session in August 1942."], ["Which leader is shown in the infographic as supporting the Quit India Resolution?", ["Sardar Vallabhbhai Patel", "Lord Linlithgow", "Muhammad Ali Jinnah", "Sir Stafford Cripps"], 0, "Sardar Vallabhbhai Patel is specifically listed as supporting the resolution."], ["Which of the following was a main objective of the Quit India Movement?", ["Complete independence for the Princely States", "Complete independence for India", "Separate electorates for all communities", "Dominion Status after the war"], 1, "The infographic lists complete independence as a main objective."], ["Which action did the movement urge government officials to take?", ["Resign from their posts", "Join the British Army", "Collect higher taxes", "Move the capital to Delhi"], 0, "One objective was for government officials to resign from their posts."], ["What did the movement ask farmers to do, according to the infographic?", ["Stop paying taxes", "Pay double revenue", "Join the police", "Support the war effort"], 0, "The notes list stopping tax payments by farmers as an objective."], ["What did the Quit India Movement ask Indian soldiers not to do?", ["Fight for the British", "Leave the country", "Join the Congress", "Serve in the Indian National Army"], 0, "The infographic says Indian soldiers should not fight for the British."], ["What slogan is associated with Mahatma Gandhi during the Quit India Movement?", ["Do or Die", "Delhi Chalo", "Jai Hind", "Simon Go Back"], 0, "Gandhi gave the famous 'Do or Die' call during the Quit India Movement."], ["How long was Gandhi’s speech, according to the infographic?", ["30 minutes", "45 minutes", "70 minutes", "Two hours"], 2, "The infographic records the duration of Gandhi’s speech as 70 minutes."], ["Which phrase did Jawaharlal Nehru use in his speech, as shown in the notes?", ["We are in the last phase of the fight for freedom", "Do or Die", "This is a people’s revolution", "Give me blood, and I will give you freedom"], 0, "The quotation is attributed to Jawaharlal Nehru in the infographic."], ["Who described the movement as 'a people’s revolution' in the infographic?", ["Mahatma Gandhi", "Jawaharlal Nehru", "Jayaprakash Narayan", "Lal Bahadur Shastri"], 2, "The phrase is attributed to Jayaprakash Narayan."], ["What happened on 9 August 1942 under Operation Zero Hour?", ["Mass arrests of national leaders", "The Cripps Mission arrived", "The Quit India Resolution was first drafted", "The movement was officially withdrawn"], 0, "The infographic describes mass arrests of national leaders on 9 August 1942."], ["Where was Mahatma Gandhi arrested?", ["Ahmednagar Fort", "Aga Khan Palace, Pune", "Bankipur Jail, Patna", "Cellular Jail"], 1, "Gandhi was detained at Aga Khan Palace in Pune."], ["Which of the following was among the leaders arrested on 9 August 1942?", ["Kasturba Gandhi", "Subhas Chandra Bose", "Bal Gangadhar Tilak", "Dadabhai Naoroji"], 0, "Kasturba Gandhi is included in the infographic’s list of arrested leaders."], ["Where were Jawaharlal Nehru, Sardar Vallabhbhai Patel and J. B. Kripalani held, according to the infographic?", ["Aga Khan Palace", "Ahmednagar Fort", "Yerwada Jail", "Alipore Jail"], 1, "The infographic lists these leaders under arrests at Ahmednagar Fort."], ["Where was Rajendra Prasad held, according to the infographic?", ["Bankipur Jail, Patna", "Ahmednagar Fort", "Aga Khan Palace", "Cellular Jail"], 0, "The page lists Rajendra Prasad under Bankipur Jail, Patna."], ["What was the immediate character of the Quit India Movement after the arrests?", ["A spontaneous mass uprising", "A purely constitutional campaign", "A movement limited to one city", "A campaign led only by elected ministers"], 0, "The infographic describes the result as a spontaneous revolution and self-driven mass uprising."], ["Who hoisted the national flag at Gowalia Tank Maidan on 9 August 1942?", ["Aruna Asaf Ali", "Sarojini Naidu", "Annie Besant", "Kasturba Gandhi"], 0, "Aruna Asaf Ali hoisted the national flag at Gowalia Tank Maidan."], ["Which title is associated with Aruna Asaf Ali in the infographic?", ["Grand Old Lady", "Nightingale of India", "Iron Lady of India", "Mother of the Nation"], 0, "The infographic gives her the title 'Grand Old Lady'."], ["Which slogan is associated with Lal Bahadur Shastri in the infographic?", ["Don't Die, Kill", "Do or Die", "Jai Jawan, Jai Kisan", "Inquilab Zindabad"], 0, "The infographic associates 'Don't Die, Kill' with Lal Bahadur Shastri."], ["Which incident took place at the Patna Secretariat on 11 August 1942?", ["A group of protesters were killed", "The Quit India Resolution was passed", "Gandhi was arrested", "Congress Radio began broadcasting"], 0, "The infographic records martyrs in the Patna Secretariat incident on 11 August 1942."], ["Which of the following is listed among the Patna Secretariat martyrs?", ["Umakant Prasad Sinha", "Vinoba Bhave", "B. G. Kher", "C. Rajagopalachari"], 0, "Umakant Prasad Sinha is one of the names listed."], ["Who is identified as the 73-year-old 'Old Gandhi' of Bengal?", ["Matangini Hazra", "Kanaklata Barua", "Aruna Asaf Ali", "Sarojini Naidu"], 0, "Matangini Hazra is described as 'Old Gandhi' of Bengal and was 73 years old."], ["Who is highlighted in the infographic under Assam?", ["Kanaklata Barua", "Matangini Hazra", "Usha Mehta", "Sucheta Kripalani"], 0, "Kanaklata Barua is the Assam figure highlighted on the page."], ["Which sectors were targeted in the first strike listed in the infographic?", ["Railways, roads, government offices and records", "Factories, ports and universities only", "Banks and private homes only", "Courts and religious institutions only"], 0, "The first-strike panel lists railways, roads, government offices and government records."], ["Which symbol is associated with the Quit India Movement in the infographic?", ["Congress Radio", "Spinning wheel only", "A sword", "A ship"], 0, "The infographic identifies Congress Radio as the symbol of the movement."], ["When did Congress Radio begin, according to the infographic?", ["15 June 1943", "14 August 1942", "9 August 1942", "11 August 1942"], 0, "The date shown for the start of Congress Radio is 15 June 1943."], ["Who founded the underground radio service known as Voice of Freedom?", ["Usha Mehta", "Aruna Asaf Ali", "Matangini Hazra", "Kanaklata Barua"], 0, "Usha Mehta is identified as the founder."], ["When did the underground radio begin broadcasting?", ["14 August 1942", "8 August 1942", "15 June 1943", "11 August 1942"], 0, "The infographic gives 14 August 1942 as the start date."], ["Where was the underground radio service based?", ["Bombay", "Delhi", "Patna", "Calcutta"], 0, "Bombay is listed as its location."], ["What was the programme name of the underground radio?", ["Voice for Freedom", "Jai Hind Radio", "Azad Hind Broadcast", "Congress Bulletin"], 0, "The programme is listed as 'Voice for Freedom'."], ["Who was the founder of the parallel government at Ballia in Uttar Pradesh?", ["Chittu Pandey", "Nana Patil", "Y. B. Chavan", "Satish Chandra Samanta"], 0, "Chittu Pandey is listed as the founder of the Ballia parallel government."]];
let index=0, answers=Array(data.length).fill(null), checked=Array(data.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 $('quiz').classList.remove('hide');$('result').classList.add('hide');
 $('counter').textContent=`Question ${index+1} of ${data.length}`;
 $('answered').textContent=`${answers.filter(x=>x!==null).length} answered`;
 $('fill').style.width=`${(answers.filter(x=>x!==null).length/data.length)*100}%`;
 $('question').textContent=data[index][0];$('options').innerHTML='';$('feedback').innerHTML='';
 data[index][1].forEach((op,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+op;
 if(answers[index]!==null){b.disabled=true;if(i===data[index][2])b.classList.add('correct');else if(i===answers[index])b.classList.add('wrong')}
 b.onclick=()=>choose(i);$('options').appendChild(b)});
 if(checked[index])showFeedback();
 $('prev').disabled=index===0;$('next').textContent=index===data.length-1?'Finish':'Next →';
 renderNav();
}
function choose(i){if(answers[index]!==null)return;answers[index]=i;checked[index]=true;render();}
function showFeedback(){let correct=answers[index]===data[index][2];$('feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'Correct!':'Not quite.'}</b><br>${correct?'Well done.':'Correct answer: '+String.fromCharCode(65+data[index][2])+'. '+data[index][1][data[index][2]]}<br><br><b>Explanation:</b> ${data[index][3]}</div>`}
function renderNav(){let n=$('nav');n.innerHTML='';let p=document.createElement('button');p.textContent='‹';p.className='prevnext';p.disabled=index===0;p.onclick=()=>go(index-1);n.appendChild(p);
 let start=Math.max(0,Math.min(index-2,data.length-5));let end=Math.min(data.length,start+5);
 for(let i=start;i<end;i++){let b=document.createElement('button');b.textContent=i+1;if(i===index)b.classList.add('active');if(answers[i]!==null)b.classList.add('done');b.onclick=()=>go(i);n.appendChild(b)}
 let nx=document.createElement('button');nx.textContent='›';nx.className='prevnext';nx.disabled=index===data.length-1;nx.onclick=()=>go(index+1);n.appendChild(nx);
}
function go(i){if(i<0||i>=data.length)return;index=i;render()}
$('prev').onclick=()=>go(index-1);$('skip').onclick=()=>go(index+1);$('next').onclick=()=>{if(index===data.length-1)finish();else go(index+1)};
function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let attempted=answers.filter(x=>x!==null).length;let score=answers.reduce((s,a,i)=>s+(a===data[i][2]?1:0),0);$('score').textContent=`${score} / ${data.length}`;$('summary').textContent=`${attempted} attempted • ${data.length-attempted} skipped • ${Math.round(score/data.length*100)}% accuracy (based on all questions)`;let wrong=data.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==data[x.i][2]);$('review').innerHTML='<h3>Incorrect / skipped questions for revision</h3>'+(wrong.length?wrong.map(({q,i})=>`<div class="reviewitem"><b>Q${i+1}. ${q[0]}</b><br>Correct answer: ${q[1][q[2]]}<br><span style="color:#647084">${q[3]}</span></div>`).join(''):'<p>Excellent! No incorrect or skipped questions.</p>')}
function restart(){index=0;answers=Array(data.length).fill(null);checked=Array(data.length).fill(false);render()}
render();
</script></body></html>
