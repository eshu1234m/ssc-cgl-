<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern History Page 29 – HRA & HSRA Quiz</title>
<style>
:root{--navy:#102b63;--purple:#63339a;--green:#187447;--red:#b52d2d;--ink:#172033;--muted:#647084;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.5}
.wrap{max-width:760px;margin:auto;padding:16px}.top{background:linear-gradient(120deg,#102b63,#56328b);color:white;padding:20px;border-radius:18px}
h1{font-size:23px;line-height:1.2;margin:0 0 8px}.sub{opacity:.9;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{background:#ffffff20;border:1px solid #ffffff40;padding:6px 10px;border-radius:30px;font-size:13px}
.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #102b6310}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:13px}.bar{height:8px;background:#e7ebf2;border-radius:20px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#19a36b;width:0}
.q{font-size:20px;font-weight:750;margin:8px 0 16px}.option{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1.5px solid #d8deea;border-radius:12px;background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.option:disabled{cursor:default}.option.selected{border-color:#345da7;background:#eef4ff}.option.correct{border-color:#16824e;background:#eaf8f0}.option.wrong{border-color:#c53a3a;background:#fff0f0}
.feedback{padding:13px;border-radius:12px;margin-top:14px;font-size:14px}.good{background:#eaf8f0;border:1px solid #a9dfbf}.bad{background:#fff2f0;border:1px solid #efb8b0}
.controls{display:flex;gap:9px;margin-top:16px}.btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:white;flex:1}.secondary{background:#e9edf5;color:#24334f}.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:16px}.nav button{min-width:38px;height:36px;border:1px solid #d5dbea;background:#fff;border-radius:9px;color:#33415c;font-weight:700}.nav button.active{background:var(--navy);color:white;border-color:var(--navy)}.nav button.done{background:#e6f5ed;border-color:#a9dfbf}.nav .prevnext{padding:0 12px;min-width:auto}
.small{font-size:12px;color:var(--muted);text-align:center;margin-top:9px}.hide{display:none}.result{text-align:center}.score{font-size:44px;font-weight:850;color:var(--green)}.reviewitem{text-align:left;border-top:1px solid #e4e8ef;padding:12px 0}
@media(max-width:420px){.wrap{padding:10px}.card{padding:15px}.q{font-size:18px}.btn{padding:11px 12px}}
</style></head><body><main class="wrap">
<header class="top"><h1>Modern History – Subhas Chandra Bose & INA</h1><div class="sub">Page 36 • 35 exam-oriented MCQs • Mixed difficulty</div><div class="stats"><span class="pill">One question at a time</span><span class="pill">Instant feedback</span><span class="pill">Detailed explanations</span></div></header>
<section class="card" id="quiz"><div class="row"><span id="counter">Question 1 of 35</span><span id="answered">0 answered</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div id="feedback"></div>
<div class="controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="skip">Skip</button><button class="btn primary" id="next">Next →</button></div>
<div class="nav" id="nav"></div><div class="small">Use the small question shortcuts to jump. Unanswered questions can be skipped and revisited.</div></section>
<section class="card result hide" id="result"><h2>Quiz completed!</h2><div class="score" id="score"></div><p id="summary"></p><button class="btn primary" onclick="restart()">Retry quiz</button><div id="review" style="margin-top:20px;text-align:left"></div></section>
</main><script>
const data = [["When was Subhas Chandra Bose born?", ["23 January 1897", "15 August 1885", "2 October 1869", "26 January 1901"], 0, "Subhas Chandra Bose was born on 23 January 1897."], ["Where was Subhas Chandra Bose born?", ["Calcutta, Bengal", "Cuttack, Odisha", "Patna, Bihar", "Rangoon, Burma"], 1, "The infographic gives Cuttack, Odisha, as his birthplace."], ["Who was Subhas Chandra Bose’s father?", ["Janakinath Bose", "Chittaranjan Das", "Rash Behari Bose", "Mohan Singh"], 0, "His father was Janakinath Bose."], ["Who was Subhas Chandra Bose’s mother?", ["Sarojini Naidu", "Prabhavati Devi", "Kasturba Gandhi", "Basanti Devi"], 1, "His mother was Prabhavati Devi."], ["In which year did Bose pass the Indian Civil Services examination?", ["1919", "1920", "1921", "1924"], 1, "Bose passed the ICS examination in 1920 and secured fourth rank."], ["What did Bose do in 1921?", ["Joined the British Army", "Resigned from the ICS and joined the Indian freedom movement", "Founded the Forward Bloc", "Took command of the INA"], 1, "In 1921, he resigned from the ICS and joined the freedom movement."], ["Who was Bose’s political guru?", ["Mahatma Gandhi", "Chittaranjan (C. R.) Das", "Jawaharlal Nehru", "Bal Gangadhar Tilak"], 1, "Chittaranjan Das is identified as Bose’s political guru."], ["What position did C. R. Das receive in the Calcutta Municipal Corporation in 1924?", ["Mayor", "Chief Executive Officer", "Governor", "Police Commissioner"], 1, "The infographic states that C. R. Das was appointed Chief Executive Officer in 1924."], ["In which year did C. R. Das become Mayor of Calcutta?", ["1924", "1928", "1930", "1935"], 2, "C. R. Das became Mayor of Calcutta in 1930."], ["Which book was written by Subhas Chandra Bose?", ["The Indian Struggle (1929–1939)", "Hind Swaraj", "Discovery of India", "India Wins Freedom"], 0, "The infographic lists The Indian Struggle and The Indian Pilgrim among Bose’s books. The date range printed in the image may vary by edition."], ["At which Congress session was Bose elected President in 1938?", ["Tripuri", "Haripura", "Lahore", "Karachi"], 1, "Bose was elected Congress President at the Haripura Session in Gujarat in 1938."], ["Whom did Bose defeat in the 1939 Congress presidential election at Tripuri?", ["Pattabhi Sitaramayya", "M. K. Gandhi", "C. Rajagopalachari", "Rajendra Prasad"], 0, "Bose defeated Pattabhi Sitaramayya at the Tripuri Session in 1939."], ["In which year did Subhas Chandra Bose establish the Forward Bloc?", ["1937", "1938", "1939", "1941"], 2, "Bose established the Forward Bloc in 1939."], ["In which year did Bose escape from India, according to the infographic?", ["1939", "1940", "1941", "1943"], 2, "The infographic shows that Bose escaped from India in 1941."], ["Which sequence shows the escape route displayed in the infographic?", ["India–Kabul–Moscow–Germany", "India–Singapore–Tokyo–Germany", "India–Rangoon–London–Germany", "India–Kabul–Tokyo–Italy"], 0, "The illustrated route is India to Kabul, then Moscow, and finally Germany."], ["Which disguises are listed as used by Bose during his escape?", ["Mohammad Ziauddin and Orlando Mazzotta", "Nehru and Gandhi", "Shah Nawaz Khan and Abid Hasan", "Mohan Singh and Rash Behari Bose"], 0, "The infographic lists the disguises Mohammad Ziauddin and Orlando Mazzotta."], ["Which organisations were established in Germany in 1941, according to the infographic?", ["Free India Centre and Azad Hind Radio", "Forward Bloc and Congress Radio", "Indian National Congress and Muslim League", "Azad Hind Government and INA"], 0, "The Germany panel lists the Free India Centre and Azad Hind Radio."], ["Who granted permission to start Azad Hind Radio, according to the infographic?", ["Winston Churchill", "Adolf Hitler", "Franklin D. Roosevelt", "Joseph Stalin"], 1, "The infographic states that Hitler granted permission to start Azad Hind Radio."], ["Who gave the slogan 'Jai Hind'?", ["Abid Hasan Safrani", "Mahatma Gandhi", "Subhas Chandra Bose", "Shah Nawaz Khan"], 0, "The infographic credits Abid Hasan Safrani with the slogan 'Jai Hind'."], ["What is the full form of INA?", ["Indian National Army", "Indian National Association", "International National Army", "Indian Naval Association"], 0, "INA stands for Indian National Army; it was also called Azad Hind Fauj."], ["Who initially formed the Indian National Army (INA)?", ["Captain Mohan Singh", "Subhas Chandra Bose", "Rash Behari Bose", "Shah Nawaz Khan"], 0, "The infographic identifies Captain Mohan Singh as the initial organiser of the INA."], ["Approximately how many soldiers are mentioned in the INA formation panel?", ["2,000", "10,000", "20,000", "50,000"], 2, "The infographic gives an approximate strength of 20,000 soldiers."], ["Who reorganised the INA before Bose took command?", ["Rash Behari Bose", "Mohan Das Karamchand Gandhi", "Jawaharlal Nehru", "C. R. Das"], 0, "Rash Behari Bose is listed under the INA reorganisation section."], ["On what date did Subhas Chandra Bose take command of the INA?", ["4 July 1943", "5 July 1943", "21 October 1943", "18 March 1944"], 0, "The infographic gives 4 July 1943 as the date Bose took command of the INA."], ["Which title was given to Subhas Chandra Bose?", ["Deshbandhu", "Netaji", "Lokmanya", "Punjab Kesari"], 1, "Bose is popularly known by the title Netaji."], ["On 5 July 1943, which slogan did Bose give, and where?", ["Delhi Chalo, Singapore", "Jai Hind, Rangoon", "Do or Die, Bombay", "Inquilab Zindabad, Berlin"], 0, "The infographic records the slogan 'Delhi Chalo' at Singapore on 5 July 1943."], ["Who was the military commander named in the 5 July 1943 panel?", ["Major Habib-ur-Rahman", "Shah Nawaz Khan", "Mohan Singh", "Gulzara Singh"], 0, "Major Habib-ur-Rahman is named as the military commander in the infographic."], ["Who led the Rani Jhansi Regiment of the INA?", ["Captain Lakshmi Swaminathan", "Aruna Asaf Ali", "Usha Mehta", "Matangini Hazra"], 0, "The Rani Jhansi Regiment was led by Captain Lakshmi Swaminathan, also known as Lakshmi Sahgal."], ["Which INA brigade was commanded by Shah Nawaz Khan?", ["Gandhi Brigade", "Subhas Regiment", "Azad Brigade", "Rani Jhansi Regiment"], 1, "The infographic pairs the Subhas Regiment with Shah Nawaz Khan."], ["Who led the Gandhi Brigade?", ["Inayat Kiani", "Abid Hasan", "Gulzara Singh", "Lakshmi Sahgal"], 0, "Inayat Kiani is listed as the leader of the Gandhi Brigade."], ["When was the Provisional Government of Azad Hind established?", ["4 July 1943", "5 July 1943", "21 October 1943", "18 March 1944"], 2, "The Provisional Government of Azad Hind was established on 21 October 1943."], ["Which places are listed as headquarters of the Provisional Government of Azad Hind?", ["Singapore and Rangoon", "Delhi and Calcutta", "Kabul and Moscow", "Tokyo and Berlin"], 0, "The infographic lists Singapore and Rangoon as its headquarters."], ["Which country is NOT among the countries shown as recognising the Provisional Government of Azad Hind?", ["Japan", "Germany", "Italy", "United States"], 3, "The infographic lists Japan, Germany, Burma and Italy among the recognisers, not the United States."], ["On what date did the Azad Hind Fauj enter India, according to the infographic?", ["18 March 1944", "21 October 1943", "4 July 1943", "15 August 1945"], 0, "The date shown is 18 March 1944."], ["Which operation is associated with the INA’s entry into India?", ["Operation U-Go", "Operation Zero Hour", "Operation Vijay", "Operation Blue Star"], 0, "The infographic identifies the operation as U-Go."]];
let index=0, answers=Array(data.length).fill(null), checked=Array(data.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 $('quiz').classList.remove('hide');$('result').classList.add('hide');
 $('counter').textContent=`Question ${index+1} of ${data.length}`;
 $('answered').textContent=`${answers.filter(x=>x!==null).length} answered`;
 $('fill').style.width=`${(answers.filter(x=>x!==null).length/data.length)*100}%`;
 $('question').textContent=data[index][0];$('options').innerHTML='';$('feedback').innerHTML='';
 data[index][1].forEach((op,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+op;
 if(answers[index]!==null){b.disabled=true;if(i===data[index][2])b.classList.add('correct');else if(i===answers[index])b.classList.add('wrong')}
 b.onclick=()=>choose(i);$('options').appendChild(b)});
 if(checked[index])showFeedback();
 $('prev').disabled=index===0;$('next').textContent=index===data.length-1?'Finish':'Next →';
 renderNav();
}
function choose(i){if(answers[index]!==null)return;answers[index]=i;checked[index]=true;render();}
function showFeedback(){let correct=answers[index]===data[index][2];$('feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'Correct!':'Not quite.'}</b><br>${correct?'Well done.':'Correct answer: '+String.fromCharCode(65+data[index][2])+'. '+data[index][1][data[index][2]]}<br><br><b>Explanation:</b> ${data[index][3]}</div>`}
function renderNav(){let n=$('nav');n.innerHTML='';let p=document.createElement('button');p.textContent='‹';p.className='prevnext';p.disabled=index===0;p.onclick=()=>go(index-1);n.appendChild(p);
 let start=Math.max(0,Math.min(index-2,data.length-5));let end=Math.min(data.length,start+5);
 for(let i=start;i<end;i++){let b=document.createElement('button');b.textContent=i+1;if(i===index)b.classList.add('active');if(answers[i]!==null)b.classList.add('done');b.onclick=()=>go(i);n.appendChild(b)}
 let nx=document.createElement('button');nx.textContent='›';nx.className='prevnext';nx.disabled=index===data.length-1;nx.onclick=()=>go(index+1);n.appendChild(nx);
}
function go(i){if(i<0||i>=data.length)return;index=i;render()}
$('prev').onclick=()=>go(index-1);$('skip').onclick=()=>go(index+1);$('next').onclick=()=>{if(index===data.length-1)finish();else go(index+1)};
function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let attempted=answers.filter(x=>x!==null).length;let score=answers.reduce((s,a,i)=>s+(a===data[i][2]?1:0),0);$('score').textContent=`${score} / ${data.length}`;$('summary').textContent=`${attempted} attempted • ${data.length-attempted} skipped • ${Math.round(score/data.length*100)}% accuracy (based on all questions)`;let wrong=data.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==data[x.i][2]);$('review').innerHTML='<h3>Incorrect / skipped questions for revision</h3>'+(wrong.length?wrong.map(({q,i})=>`<div class="reviewitem"><b>Q${i+1}. ${q[0]}</b><br>Correct answer: ${q[1][q[2]]}<br><span style="color:#647084">${q[3]}</span></div>`).join(''):'<p>Excellent! No incorrect or skipped questions.</p>')}
function restart(){index=0;answers=Array(data.length).fill(null);checked=Array(data.length).fill(false);render()}
render();
</script></body></html>
