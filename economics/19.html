uring Sector as other names."}, {"q": "The basic concept of the secondary sector is:", "o": ["Knowledge → decisions", "Natural resources → raw materials only", "Services → consumers", "Raw materials + industry/machines → finished products"], "a": 3, "e": "Secondary activities process raw materials using industry or machines into finished products."}, {"q": "Cotton processed in a mill to make cloth is an example of:", "o": ["Secondary activity", "Primary activity", "Quinary activity", "Non-economic activity"], "a": 0, "e": "The chart shows cotton plus machinery producing cloth."}, {"q": "Sugarcane processed into sugar or jaggery is an example of:", "o": ["Secondary activity", "Primary activity", "Quaternary activity", "Non-economic activity"], "a": 0, "e": "The chart shows sugarcane processed by industry into sugar/jaggery."}, {"q": "Wood processed into furniture is an example of:", "o": ["Tertiary activity", "Primary activity", "Quinary activity", "Secondary activity"], "a": 3, "e": "The chart shows wood plus machinery producing furniture."}, {"q": "Which sequence correctly describes manufacturing?", "o": ["Finished product → raw material → mine", "Raw material → processing → finished product", "Service → raw material → forest", "Consumer → service → natural resource"], "a": 1, "e": "Manufacturing transforms raw materials into finished products."}, {"q": "Which is an example of a secondary-sector industry shown?", "o": ["Pilgrimage", "Hospital", "Banking", "Cottage industry"], "a": 3, "e": "Cottage industries are included in the examples of industries."}, {"q": "Which of these is listed as an industry example?", "o": ["MSME", "Teacher", "Hospital", "Tourism"], "a": 0, "e": "MSME appears in the chart's examples of industries."}, {"q": "Thermal power is listed under:", "o": ["Quinary activities", "Primary activities", "Examples of secondary-sector industries", "Non-economic activities"], "a": 2, "e": "Thermal power appears in the secondary-sector industry list."}, {"q ulation/employment."}, {"q": "The tertiary sector acts as a link between:", "o": ["The primary and secondary sectors", "Only consumers and government", "The quaternary and quinary sectors only", "Only imports and exports"], "a": 0, "e": "The service sector connects the other two traditional sectors."}, {"q": "Which sequence illustrates the service-sector link in the chart?", "o": ["Farm → crop → raw cotton", "Wood → machine → furniture", "Transportation → goods → market", "Cotton → machine → cloth"], "a": 2, "e": "Transportation connects production and goods with the market."}, {"q": "Which is a tertiary-sector example?", "o": ["Cotton cultivation", "Forestry", "Hospital", "Mining"], "a": 2, "e": "Hospitals are listed as tertiary activities."}, {"q": "Which group contains only tertiary-sector examples from the chart?", "o": ["Cottage industries, steel, MSME, refineries, thermal power", "IT, software, apps, data management, science", "Transport, hospitals, education, hotels, internet", "Agriculture, mining, fishing, forestry, animal husbandry"], "a": 2, "e": "All five are shown in the tertiary-sector examples."}, {"q": "Banking belongs to which sector?", "o": ["Tertiary", "Secondary", "Quaternary", "Primary"], "a": 0, "e": "Banking is listed as a tertiary/service activity."}, {"q": "Tourism belongs to which sector in the chart?", "o": ["Secondary", "Primary", "Quinary", "Tertiary"], "a": 3, "e": "Tourism appears among tertiary activities."}, {"q": "Trade and commerce are classified under:", "o": ["Tertiary sector", "Primary sector", "Quaternary sector", "Secondary sector"], "a": 0, "e": "Trade and commerce are listed as tertiary activities."}, {"q": "Teachers and doctors are included in which sector in the chart?", "o": ["Quinary sector", "Tertiary sector", "Secondary sector", "Primary sector"], "a": 1, "e": "Teachers and doctors appear in the tertiary-sector examples."}, {"q": "Advocates are listed as an example of:", "o": ["Tertiary activity", "Primary activity", "Secondary activity", "Non-economic activity"], "a": 0, "e": "Advocates are included in the tertiary-sector examples."}, {"q": "The quaternary sector is also called the:", "o": ["Knowledge sector", "Manufacturing sector", "Service sector", "Agriculture sector"], "a": 0, "e": "The chart names the quaternary sector the Knowledge Sector."}, {"q": "The quaternary sector is also described as the:", "o": ["Informal sector", "Primary sector", "Middle sector", "Intellectual sector"], "a": 3, "e": "The chart says it is also called the Intellectual Sector."}, {"q": "Which activity belongs to the quaternary sector in the chart?", "o": ["Agriculture", "Mining", "Banking", "IT sector"], "a": 3, "e": "IT is one of the quaternary-sector examples."}, {"q": "Which set contains only quaternary-sector examples shown?", "o": ["Hospitals, hotels, tourism, banking", "IT, software, apps, data management", "Agriculture, animal husbandry, fishing, mining", "Government, universities, science, media"], "a": 1, "e": "These four examples are shown in the quaternary panel."}, {"q": "Data management belongs to which sector?", "o": ["Secondary", "Tertiary", "Primary", "Quaternary"], "a": 3, "e": "Data management is listed as a quaternary-sector example."}, {"q": "Software and apps are classified under:", "o": ["Primary sector", "Secondary sector", "Non-economic activities", "Quaternary sector"], "a": 3, "e": "Software and apps are listed under the knowledge/intellectual sector."}, {"q": "The quinary sector consists of:", "o": ["All manufacturing units", "All transport services", "All agricultural workers", "Top-level decision-making institutions or organisations"], "a": 3, "e": "The chart defines the quinary sector in terms of top-level decision-making institutions/organisations."}, {"q": "Which is an example of the quinary sector?", "o": ["Textile manufacturing", "Fishing", "Tourism", "Government"], "a": 3, "e": "Government is one of the examples in the quinary-sector panel."}, {"q": "Universities are shown under which sector?", "o": ["Quinary", "Tertiary", "Secondary", "Primary"], "a": 0, "e": "Universities are listed as quinary-sector examples in this chart."}, {"q": "Science is included in which sector in the chart?", "o": ["Quinary", "Primary", "Tertiary", "Secondary"], "a": 0, "e": "Science appears in the quinary-sector examples."}, {"q": "Media is classified under which sector in the supplied chart?", "o": ["Primary", "Secondary", "Quinary", "Tertiary"], "a": 2, "e": "Media is listed in the quinary-sector panel."}, {"q": "Which sector is matched with 'Agriculture & Allied Activities'?", "o": ["Primary", "Tertiary", "Secondary", "Quaternary"], "a": 0, "e": "The revision table gives Agriculture & Allied Activities as the other name for the primary sector."}, {"q": "Which sector is matched with 'Industrial / Middle / Manufacturing Sector'?", "o": ["Tertiary", "Secondary", "Primary", "Quinary"], "a": 1, "e": "These are the other names for the secondary sector."}, {"q": "Which sector is matched with 'Service Sector'?", "o": ["Secondary", "Quinary", "Tertiary", "Primary"], "a": 2, "e": "Service Sector is the other name for the tertiary sector."}, {"q": "Which sector is matched with 'Knowledge / Intellectual Sector'?", "o": ["Primary", "Quaternary", "Quinary", "Secondary"], "a": 1, "e": "The revision table gives Knowledge/Intellectual Sector for quaternary."}, {"q": "Which row correctly matches the primary sector with its examples?", "o": ["IT, software, apps, data management", "Transport, hospitals, education, hotels, banking", "Government, universities, science, media", "Agriculture, animal husbandry, fishing, forestry, mining"], "a": 3, "e": "These are the primary-sector examples in the revision table."}, {"q": "Which row correctly matches the secondary sector with its examples?", "o": ["IT, software, apps, data management", "Industries, manufacturing, MSME, power, refineries", "Transport, hospitals, banking, tourism", "Agriculture, fishing, forestry, mining"], "a": 1, "e": "The revision table lists industries, manufacturing, MSME, power and refineries."}, {"q": "Which row correctly matches the tertiary sector with its examples?", "o": ["Mining, forestry, fishing, agriculture", "Transport, hospitals, education, hotels, banking, tourism", "IT, software, apps, data management", "Steel, cotton mills, sugar mills, furniture"], "a": 1, "e": "These are examples listed for the service sector."}, {"q": "Which row correctly matches the quaternary sector with its examples?", "o": ["IT, software, apps, data management", "Government, universities, science, media", "Transport, hospitals, hotels, banking", "Agriculture, fishing, mining, forestry"], "a": 0, "e": "These are the knowledge/intellectual sector examples."}, {"q": "Which row correctly matches the quinary sector with its examples?", "o": ["Agriculture, animal husbandry, fishing", "Government, universities, science, media", "Manufacturing, MSME, refineries", "IT, software, apps, data management"], "a": 1, "e": "These are the examples printed under the quinary sector."}, {"q": "A farmer grows cotton. The activity of growing cotton is:", "o": ["Secondary", "Primary", "Quinary", "Tertiary"], "a": 1, "e": "Growing cotton is an agricultural activity and therefore primary."}, {"q": "A textile mill converts cotton into cloth. The mill's activity is:", "o": ["Tertiary", "Quaternary", "Secondary", "Primary"], "a": 2, "e": "Processing cotton into cloth is manufacturing, a secondary activity."}, {"q": "A transport company moves cloth to a shop. This is:", "o": ["Secondary", "Quinary", "Tertiary", "Primary"], "a": 2, "e": "Transportation is a service-sector activity."}, {"q": "A software developer creates an application. In this chart, the activity belongs to:", "o": ["Primary", "Quaternary", "Quinary", "Secondary"], "a": 1, "e": "Apps and software are listed under the quaternary sector."}, {"q": "A senior government body makes high-level policy decisions. This best fits:", "o": ["Tertiary sector", "Secondary sector", "Primary sector", "Quinary sector"], "a": 3, "e": "The quinary sector is associated with top-level decision-making institutions."}, {"q": "Which sector directly extracts or obtains resources from nature?", "o": ["Quaternary", "Secondary", "Primary", "Tertiary"], "a": 2, "e": "Primary activities rely directly on natural resources."}, {"q": "Which sector changes raw materials into finished products?", "o": ["Secondary", "Primary", "Tertiary", "Quinary"], "a": 0, "e": "Manufacturing and processing define the secondary sector."}, {"q": "Which sector supports production and distribution through services?", "o": ["Primary", "Quinary", "Tertiary", "Secondary"], "a": 2, "e": "The tertiary sector provides services to primary and secondary activities."}, {"q": "Which two sectors are connected by the tertiary sector according to the chart?", "o": ["Primary and quinary", "Quaternary and quinary", "Secondary and quinary", "Primary and secondary"], "a": 3, "e": "The chart explicitly says the tertiary sector links the other two sectors."}, {"q": "Which statement is correct according to the supplied page?", "o": ["Tertiary activities extract minerals", "Primary activities use natural resources", "Quinary activities manufacture cloth", "Secondary activities provide only intellectual services"], "a": 1, "e": "Primary activities are based on natural resources."}, {"q": "Which statement about the primary sector is printed in the chart?", "o": ["It contributes the highest share of GDP", "It provides employment to the largest number of people (54%)", "It has the least employment", "It consists mainly of software and apps"], "a": 1, "e": "The chart states 54% employment for primary activities."}, {"q": "Which statement about the tertiary sector is printed in the chart?", "o": ["It makes the highest contribution to GDP", "It makes the lowest contribution to GDP", "It uses only natural resources", "It is another name for the manufacturing sector"], "a": 0,
