le of moral suasion?", ["A bank accepts a fixed deposit", "RBI cancels a bank's licence", "RBI sells Government Securities", "RBI urges banks to follow a particular lending policy"], 3, "Moral suasion is persuasive rather than a direct punitive action."], ["What is direct action?", ["Banks deposit surplus funds with RBI", "Banks lend against collateral", "RBI takes direct action against banks that do not follow its rules or policies", "RBI persuades banks informally only"], 2, "Direct action is a stronger measure taken against non-compliant banks."], ["Under direct action, RBI may:", ["Cancel or revoke a commercial bank's licence", "Create a new private bank account for every citizen", "Set the price of all goods", "Guarantee every loan"], 0, "The chart specifically gives cancellation/revocation of a bank's licence as an example."], ["Direct action may be taken when commercial banks:", ["Maintain required reserves", "Provide loans in the normal course", "Do not follow RBI rules or policies", "Accept customer deposits"], 2, "The chart says RBI can act against banks that fail to follow its rules or policies."], ["Which instrument is more directly coercive than moral suasion?", ["Direct action", "SDF", "Margin requirement", "Credit rationing"], 0, "Direct action involves RBI taking action against a non-compliant bank, whereas moral suasion relies on persuasion."], ["Which pairing is correctly matched?", ["Credit rationing — no collateral deposit with RBI", "Margin requirement — RBI cancels licence", "Direct action — collateral value above loan", "Moral suasion — persuasion/pressure by RBI"], 3, "Moral suasion means persuasion or pressure by RBI."], ["Which pairing is correctly matched?", ["Direct action — collateral must be greater than loan", "Direct action — RBI deposits excess liquidity", "Direct action — RBI may cancel/revoke a bank's licence", "Direct action — RBI sets a sector-wise credit ceiling only"], 2, "The chart identifies licence cancellation/revocation as
