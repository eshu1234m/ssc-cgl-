:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

const questions=[{"id": 1, "q": "What was the original name of Ghiyasuddin Balban?", "opts": ["Bahauddin", "Ulugh Khan", "Jalaluddin", "Nasiruddin"], "ans": 0, "exp": "The infographic gives Balban's original name as Bahauddin."}, {"id": 2, "q": "During which period did Ghiyasuddin Balban rule?", "opts": ["1246–1265 AD", "1266–1287 AD", "1287–1290 AD", "1206–1210 AD"], "ans": 1, "exp": "Balban ruled from 1266 to 1287 AD."}, {"id": 3, "q": "Which title was given to Balban by Nasiruddin Mahmud?", "opts": ["Lakh Baksh", "Ulugh Khan", "Amir-i-Shikar", "Zill-i-Ilahi"], "ans": 1, "exp": "Nasiruddin Mahmud gave Balban the title Ulugh Khan."}, {"id": 4, "q": "Balban's reign is considered the beginning of which dynasty?", "opts": ["First Ilbari Dynasty", "Second Ilbari (Balbani) Dynasty", "Khilji Dynasty", "Tughlaq Dynasty"], "ans": 1, "exp": "The page describes Balban's reign as the beginning of the Second Ilbari or Balbani Dynasty."}, {"id": 5, "q": "Balban claimed descent from which Iranian hero?", "opts": ["Rostam", "Afrasiab", "Cyrus", "Darius"], "ans": 1, "exp": "The royal-lineage panel says Balban claimed descent from the Iranian hero Afrasiab."}, {"id": 6, "q": "Which post did Balban hold during Bahram Shah's reign?", "opts": ["Amir-i-Hajib", "Amir-i-Shikar", "Naib-i-Mumlikat", "Wazir"], "ans": 1, "exp": "He served as Amir-i-Shikar, meaning Master of the Hunt."}, {"id": 7, "q": "What position did Balban hold during Masud Shah's reign?", "opts": ["Amir-i-Hajib", "Amir-i-Shikar", "Diwan-i-Arz", "Amir-i-Akhur"], "ans": 0, "exp": "During Masud Shah's reign, Balban served as Amir-i-Hajib, Head of the Royal Court."}, {"id": 8, "q": "Which position did Balban attain during Nasiruddin Mahmud's reign?", "opts": ["Wazir", "Naib-i-Mumlikat", "Amir-i-Shikar", "Amir-i-Hajib"], "ans": 1, "exp": "Balban became Naib-i-Mumlikat, or Deputy of the Sultan."}, {"id": 9, "q": "How did Balban describe himself under his theory of kingship?", "opts": ["Servant of the People", "Shadow of God", "Protector of Trade", "Leader of the Army"], "ans": 1, "exp": "Balban called himself the Shadow of God, or Zill-i-Ilahi."}, {"id": 10, "q": "Balban considered himself the representative of whom?", "opts": ["The Caliph", "God", "The Turkish nobles", "The Mongol ruler"], "ans": 1, "exp": "The theory of kingship panel says Balban considered himself God's representative."}, {"id": 11, "q": "Which court custom involved prostration before the Sultan?", "opts": ["Paibos", "Sijda", "Navroz", "Khilat"], "ans": 1, "exp": "Sijda was the practice of prostration before the Sultan."}, {"id": 12, "q": "What did Paibos involve?", "opts": ["Kissing the Sultan's feet", "Touching the royal crown", "Offering a sword", "Reading the khutba"], "ans": 0, "exp": "Paibos involved kissing the Sultan's feet."}, {"id": 13, "q": "Which festival's celebration did Balban introduce at court?", "opts": ["Diwali", "Navroz", "Eid-ul-Fitr", "Nowruz-e-Sultan"], "ans": 1, "exp": "The infographic says Balban introduced the celebration of the Navroz festival."}, {"id": 14, "q": "What type of judicial conduct did Balban introduce?", "opts": ["Flexible judicial etiquette", "Strict judicial etiquette", "Village-based justice", "Trial by combat"], "ans": 1, "exp": "The page states that Balban introduced strict judicial etiquette."}, {"id": 15, "q": "What did Balban do to the Turkān-e-Chahalgani?", "opts": ["Expanded it", "Abolished it", "Renamed it", "Transferred it to Bengal"], "ans": 1, "exp": "Balban abolished the Turkān-e-Chahalgani, the Group of Forty Nobles."}, {"id": 16, "q": "Which policy did Balban adopt against the Mewatis?", "opts": ["Blood and Iron", "Divide and Rule", "Non-Alignment", "Subsidiary Alliance"], "ans": 0, "exp": "The infographic identifies Balban's policy against the Mewatis as Blood and Iron."}, {"id": 17, "q": "Which non-Islamic cultural practices did Balban introduce into the royal court?", "opts": ["Persian customs", "Greek customs", "Chinese customs", "Roman customs"], "ans": 0, "exp": "The page says he introduced non-Islamic Persian customs into the royal court."}, {"id": 18, "q": "Which department did Balban establish for military administration?", "opts": ["Diwan-i-Insha", "Diwan-i-Arz", "Diwan-i-Risalat", "Diwan-i-Wizarat"], "ans": 1, "exp": "The military administration panel names Diwan-i-Arz."}, {"id": 19, "q": "Who is named as Balban's Army Minister?", "opts": ["Imad-ul-Mulk", "Bughra Khan", "Jalaluddin Khilji", "Tughril Khan"], "ans": 0, "exp": "The infographic names Imad-ul-Mulk as Army Minister."}, {"id": 20, "q": "What was Balban's plan regarding soldiers' salaries?", "opts": ["Pay them in land only", "Introduce cash salaries", "Pay them twice a year", "Replace salaries with jagirs"], "ans": 1, "exp": "Balban tried to introduce cash salaries for soldiers, but the plan was unsuccessful."}, {"id": 21, "q": "What was the name of Balban's intelligence department?", "opts": ["Barid-i-Mumalik", "Diwan-i-Arz", "Amir-i-Hajib", "Diwan-i-Kohi"], "ans": 0, "exp": "The intelligence department was called Barid-i-Mumalik."}, {"id": 22, "q": "Who revolted against Balban in Bengal in 1279 AD?", "opts": ["Bughra Khan", "Tughril Khan", "Kaiqubad", "Kayumars"], "ans": 1, "exp": "Tughril Khan, the Governor of Bengal, revolted in 1279 AD."}, {"id": 23, "q": "What did Tughril Khan do during his revolt?", "opts": ["Accepted the Sultan's authority", "Declared himself independent", "Moved the capital to Delhi", "Joined the Mongols"], "ans": 1, "exp": "The page says Tughril declared himself independent and assumed royal authority."}, {"id": 24, "q": "Who was appointed Iqtedar (Governor) of Bengal after the revolt?", "opts": ["Bughra Khan", "Kaiqubad", "Imad-ul-Mulk", "Jalaluddin Khilji"], "ans": 0, "exp": "After the revolt, Bughra Khan was appointed Iqtedar or Governor of Bengal."}, {"id": 25, "q": "In which years did Mongol invasions occur during Balban's reign, according to the infographic?", "opts": ["1266 and 1270", "1279 and 1285", "1287 and 1290", "1241 and 1246"], "ans": 1, "exp": "The page lists Mongol invasions in 1279 and 1285."}, {"id": 26, "q": "In which year did Balban die?", "opts": ["1279 AD", "1285 AD", "1287 AD", "1290 AD"], "ans": 2, "exp": "Balban died in 1287 AD."}, {"id": 27, "q": "Where is Balban's tomb located according to the infographic?", "opts": ["Mehrauli, New Delhi", "Agra", "Lahore", "Ajmer"], "ans": 0, "exp": "The infographic locates Balban's tomb at Mehrauli, New Delhi."}, {"id": 28, "q": "Who was Kaiqubad?", "opts": ["Son of Balban", "Son of Bughra Khan and grandson of Balban", "Brother of Balban", "Governor of Bengal"], "ans": 1, "exp": "Kaiqubad was the son of Bughra Khan and grandson of Balban."}, {"id": 29, "q": "During which period did Kaiqubad rule?", "opts": ["1266–1287 AD", "1287–1290 AD", "1289–1290 AD", "1290–1320 AD"], "ans": 1, "exp": "Kaiqubad ruled from 1287 to 1290 AD."}, {"id": 30, "q": "Which fort was built by Kaiqubad?", "opts": ["Tughlaqabad Fort", "Kilokhari Fort", "Agra Fort", "Siri Fort"], "ans": 1, "exp": "The infographic credits Kaiqubad with building Kilokhari Fort."}, {"id": 31, "q": "At what approximate age did Kayumars become Sultan?", "opts": ["1 year", "3 years", "8 years", "12 years"], "ans": 1, "exp": "Kayumars became Sultan at about three years of age."}, {"id": 32, "q": "Kayumars is considered the last ruler of which dynasty?", "opts": ["Khilji", "Slave (Mamluk)", "Tughlaq", "Sayyid"], "ans": 1, "exp": "The page identifies Kayumars as the last ruler of the Slave or Mamluk dynasty."}, {"id": 33, "q": "Who killed Kayumars?", "opts": ["Balban", "Jalaluddin Khilji", "Tughril Khan", "Bughra Khan"], "ans": 1, "exp": "Jalaluddin Khilji, Governor of Bulandshahr, killed Kayumars according to the infographic."}, {"id": 34, "q": "Which dynasty did Jalaluddin Khilji establish?", "opts": ["Tughlaq", "Khilji", "Lodi", "Sayyid"], "ans": 1, "exp": "After killing Kayumars, Jalaluddin Khilji established the Khilji Dynasty."}, {"id": 35, "q": "Which sequence correctly follows the memory trick shown for rulers after Razia?", "opts": ["Ruknuddin–Razia–Bahram–Masud–Nasiruddin–Balban–Kaiqubad–Kayumars", "Razia–Ruknuddin–Masud–Bahram–Balban–Nasiruddin–Kayumars–Kaiqubad", "Ruknuddin–Bahram–Razia–Masud–Balban–Nasiruddin–Kaiqubad–Kayumars", "Ruknuddin–Razia–Masud–Bahram–Nasiruddin–Kaiqubad–Balban–Kayumars"], "ans": 0, "exp": "The memory trick gives R–R–B–M–N–B–K–K: Ruknuddin, Razia, Bahram, Masud, Nasiruddin, Balban, Kaiqubad and Kayumars."}],KEY='balban_kaiqubad_page6_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
