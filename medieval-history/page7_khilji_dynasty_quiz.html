: "The infographic gives Amir Khusro's original name as Abul Hasan."}, {"id": 18, "q": "Where was Amir Khusro born?", "opts": ["Delhi", "Patiyali, Uttar Pradesh", "Ajmer, Rajasthan", "Lahore"], "ans": 1, "exp": "His birthplace is given as Patiyali in Uttar Pradesh."}, {"id": 19, "q": "Who was Amir Khusro's spiritual teacher?", "opts": ["Khwaja Moinuddin Chishti", "Nizamuddin Auliya", "Qutbuddin Bakhtiyar Kaki", "Bahauddin Zakariya"], "ans": 1, "exp": "The infographic identifies Nizamuddin Auliya as Amir Khusro's spiritual teacher."}, {"id": 20, "q": "Which title is associated with Amir Khusro?", "opts": ["Tuti-e-Hind", "Zill-i-Ilahi", "Ulugh Khan", "Lakh Baksh"], "ans": 0, "exp": "Amir Khusro was known by the title Tuti-e-Hind, meaning Parrot of India."}, {"id": 21, "q": "Which work by Amir Khusro describes the victories of Alauddin Khilji?", "opts": ["Khaza'in-ul-Futuh", "Khalik Bari", "Miftah-ul-Futuh", "Laila Majnun"], "ans": 0, "exp": "Khaza'in-ul-Futuh is described as recording the victories of Alauddin Khilji."}, {"id": 22, "q": "Which work by Amir Khusro is described as a Hindi–Persian dictionary?", "opts": ["Nuh Sipihr", "Khalik Bari", "Tughlaqnama", "Ashiq(a)"], "ans": 1, "exp": "Khalik Bari is identified as a Hindi–Persian dictionary."}, {"id": 23, "q": "Nizamuddin Auliya is described as the spiritual guide of how many Sultans?", "opts": ["Three", "Five", "Seven", "Ten"], "ans": 2, "exp": "The infographic says Nizamuddin Auliya was the spiritual guide of seven Sultans."}, {"id": 24, "q": "Where is the shrine of Nizamuddin Auliya located?", "opts": ["Agra", "Delhi", "Ajmer", "Patiyali"], "ans": 1, "exp": "The page states that his shrine is located in Delhi."}, {"id": 25, "q": "Which language form did Amir Khusro promote, according to the infographic?", "opts": ["Braj Bhasha", "Khari Boli Hindi", "Awadhi", "Sanskrit"], "ans": 1, "exp": "The infographic credits Amir Khusro with promoting the use of Khari Boli Hindi."}, {"id": 26, "q": "Which musical and literary forms are included among Amir Khusro's contributions?", "opts": ["Qawwali, Ghazal and Paheli", "Dhrupad, Bhajan and Doha only", "Thumri, Kajri and Chaiti", "Vedic chants and Sanskrit drama"], "ans": 0, "exp": "The contribution panel lists Qawwali, Ghazal, Paheli, Sitar and Tabla."}, {"id": 27, "q": "In which year was Jalaluddin Khilji murdered?", "opts": ["1290", "1292", "1296", "1316"], "ans": 2, "exp": "The infographic gives 1296 AD as the year of his murder."}, {"id": 28, "q": "Who murdered Jalaluddin Khilji?", "opts": ["Malik Chhajju", "Alauddin Khilji", "Arkali Khan", "Kaiqubad"], "ans": 1, "exp": "The death panel states that Alauddin Khilji murdered Jalaluddin Khilji."}, {"id": 29, "q": "Before becoming Sultan, what position did Alauddin Khilji hold?", "opts": ["Governor of Samana", "Governor of Kara-Manikpur", "Governor of Multan", "Governor of Bengal"], "ans": 1, "exp": "The infographic says Alauddin was the Governor of Kara-Manikpur before becoming Sultan."}, {"id": 30, "q": "During which period did Alauddin Khilji rule?", "opts": ["1290–1296 AD", "1296–1316 AD", "1316–1320 AD", "1287–1290 AD"], "ans": 1, "exp": "Alauddin Khilji ruled from 1296 to 1316 AD."}, {"id": 31, "q": "On what date was Alauddin Khilji crowned Sultan?", "opts": ["26 February 1296", "20 July 1296", "13 October 1296", "15 August 1296"], "ans": 1, "exp": "The infographic gives 20 July 1296 as his coronation date."}, {"id": 32, "q": "Which place did Alauddin Khilji attack in the Devgiri campaign of 1296?", "opts": ["Warangal", "Devgiri", "Chittor", "Multan"], "ans": 1, "exp": "The page identifies Devgiri, present-day Daulatabad, as the target."}, {"id": 33, "q": "Who was the ruler of Devgiri at the time of Alauddin's campaign?", "opts": ["Ramachandra Dev", "Raja Raja Chola", "Prithviraj Chauhan", "Bhima I"], "ans": 0, "exp": "The infographic names Ramachandra Dev as the ruler of Devgiri."}, {"id": 34, "q": "How much gold did Alauddin Khilji capture in the Devgiri campaign, according to the page?", "opts": ["800 kilograms", "8,000 kilograms", "80 kilograms", "18,000 kilograms"], "ans": 1, "exp": "The infographic states that 8,000 kilograms of gold were captured."}, {"id": 35, "q": "What date is given for Alauddin's victory in the Devgiri campaign?", "opts": ["20 July 1296", "26 February 1296", "26 February 1301", "20 July 1316"], "ans": 1, "exp": "The campaign panel gives 26 February 1296 as the date of victory."}],KEY='khilji_dynasty_page7_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
