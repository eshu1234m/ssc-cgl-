:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}
</style></head><body><div class="wrap"><header><h1>Page 9: Muhammad bin Tughlaq (1325–1351 AD)</h1><div class="sub">35 MCQs · Mixed difficulty · One question at a time · Instant feedback</div></header>

<script>
const questions=[{"id": 1, "q": "What was the childhood name of Muhammad bin Tughlaq?", "opts": ["Jauna Khan", "Ulugh Khan", "Ghazi Malik", "Nasiruddin"], "ans": 0, "exp": "The infographic gives Jauna Khan as Muhammad bin Tughlaq's childhood name."}, {"id": 2, "q": "Who was Muhammad bin Tughlaq's father?", "opts": ["Balban", "Ghiyasuddin Tughlaq", "Firoz Shah Tughlaq", "Alauddin Khilji"], "ans": 1, "exp": "His father was Ghiyasuddin Tughlaq."}, {"id": 3, "q": "Who was Muhammad bin Tughlaq's mother?", "opts": ["Deval Rani", "Turkan Begum", "Makhdu-ma-i-Jahan", "Razia Sultan"], "ans": 2, "exp": "The family panel names Makhdu-ma-i-Jahan as his mother."}, {"id": 4, "q": "Muhammad bin Tughlaq is described as which kind of Delhi Sultanate ruler?", "opts": ["The least educated", "The most educated", "The first woman ruler", "The first Afghan ruler"], "ans": 1, "exp": "The infographic describes him as the most educated ruler of the Delhi Sultanate."}, {"id": 5, "q": "Which set of subjects is listed among Muhammad bin Tughlaq's areas of knowledge?", "opts": ["Mathematics, astronomy and philosophy", "Medicine, law and music", "Geography, chemistry and biology", "Poetry, painting and architecture"], "ans": 0, "exp": "The infographic lists mathematics, astronomy and philosophy in addition to Arabic and Persian."}, {"id": 6, "q": "Who is named as the spiritual successor of Nizamuddin Auliya?", "opts": ["Amir Khusro", "Nasiruddin Chiragh-i-Delhi", "Ibn Battuta", "Hasan Gangu"], "ans": 1, "exp": "The infographic names Nasiruddin Chiragh-i-Delhi as Nizamuddin Auliya's spiritual successor."}, {"id": 7, "q": "During which years did Muhammad bin Tughlaq transfer the capital?", "opts": ["1320–1325 AD", "1327–1328 AD", "1329–1330 AD", "1333–1337 AD"], "ans": 1, "exp": "The capital-transfer experiment is dated 1327–1328 AD."}, {"id": 8, "q": "From which city to which city was the capital shifted?", "opts": ["Agra to Delhi", "Delhi to Daulatabad (Devagiri)", "Lahore to Delhi", "Delhi to Warangal"], "ans": 1, "exp": "The infographic says the capital was shifted from Delhi to Daulatabad (Devagiri)."}, {"id": 9, "q": "What was the result of the capital-transfer experiment?", "opts": ["Successful", "Unsuccessful", "It lasted only one month", "The capital was shifted to Lahore"], "ans": 1, "exp": "The infographic marks the experiment as unsuccessful."}, {"id": 10, "q": "How long did Muhammad bin Tughlaq spend developing Daulatabad, according to the note?", "opts": ["Six months", "One year", "2.5 years", "Five years"], "ans": 2, "exp": "The additional note says he spent 2.5 years developing Daulatabad."}, {"id": 11, "q": "When was token currency introduced?", "opts": ["1327–1328 AD", "1329–1330 AD", "1330–1331 AD", "1333–1337 AD"], "ans": 1, "exp": "The infographic dates the token-currency experiment to 1329–1330 AD."}, {"id": 12, "q": "Which coin did the token-currency experiment replace?", "opts": ["Gold Dinar", "Silver Tanka", "Copper Jital", "Silver Rupiya"], "ans": 1, "exp": "The page says copper Jital coins replaced the silver Tanka."}, {"id": 13, "q": "What was the objective of the Khurasan Campaign (1330–1331 AD)?", "opts": ["To conquer China", "To conquer Iraq", "To conquer Bengal", "To conquer Gujarat"], "ans": 1, "exp": "The objective shown for the Khurasan Campaign was to conquer Iraq."}, {"id": 14, "q": "What was the objective of the Karachil Campaign (1333–1337 AD)?", "opts": ["To conquer Iraq", "To conquer China", "To capture Delhi", "To invade Bengal"], "ans": 1, "exp": "The stated objective of the Karachil Campaign was to conquer China."}, {"id": 15, "q": "In which years did the Mongol invasion shown on the page take place?", "opts": ["1320–1321 AD", "1327–1328 AD", "1328–1329 AD", "1333–1334 AD"], "ans": 2, "exp": "The infographic dates this Mongol invasion to 1328–1329 AD."}, {"id": 16, "q": "By what percentage was the tax increased in the Doab region?", "opts": ["10%", "25%", "50%", "100%"], "ans": 2, "exp": "The Doab tax was increased by 50%, according to the infographic."}, {"id": 17, "q": "Which department did Muhammad bin Tughlaq establish for farmers' welfare?", "opts": ["Diwan-i-Arz", "Amir-i-Kohi", "Diwan-i-Insha", "Diwan-i-Risalat"], "ans": 1, "exp": "Amir-i-Kohi was established for the welfare of farmers."}, {"id": 18, "q": "How much financial assistance is mentioned for the agricultural measures?", "opts": ["7 lakh Tankas", "17 lakh Tankas", "70 lakh Tankas", "1 crore Tankas"], "ans": 2, "exp": "The infographic mentions financial assistance of 70 lakh Tankas."}, {"id": 19, "q": "In which year did the Nagarkot Campaign take place?", "opts": ["1330", "1333", "1337", "1340"], "ans": 2, "exp": "The infographic gives 1337 as the year of the Nagarkot Campaign."}, {"id": 20, "q": "Who was Muhammad bin Tughlaq's opponent in the Singoli Battle of 1336?", "opts": ["Rana Sanga", "Hammir Dev of Mewar", "Prithviraj Chauhan", "Ramachandra Dev"], "ans": 1, "exp": "The page identifies Hammir Dev of Mewar as his opponent."}, {"id": 21, "q": "When did Ibn Battuta arrive in India?", "opts": ["1325 AD", "1333 AD", "1342 AD", "1351 AD"], "ans": 1, "exp": "Ibn Battuta's arrival in India is dated 1333 AD."}, {"id": 22, "q": "Which book did Ibn Battuta write?", "opts": ["Kitab-ul-Rehla", "Khaza'in-ul-Futuh", "Futuh-us-Salatin", "Fawaid-ul-Fuad"], "ans": 0, "exp": "The infographic lists Kitab-ul-Rehla, in Arabic, as Ibn Battuta's book."}, {"id": 23, "q": "Which role did Muhammad bin Tughlaq give Ibn Battuta?", "opts": ["Army commander", "Chief Qazi of Delhi", "Governor of Bengal", "Finance minister"], "ans": 1, "exp": "Muhammad bin Tughlaq appointed Ibn Battuta as Chief Qazi (Head of the Judicial Department) of Delhi."}, {"id": 24, "q": "In which year was Ibn Battuta sent as an ambassador to China?", "opts": ["1333", "1337", "1340", "1342"], "ans": 3, "exp": "The infographic says he was sent as an ambassador to China in 1342."}, {"id": 25, "q": "In which year did the Vijayanagara Empire become independent from the Delhi Sultanate?", "opts": ["1320", "1336", "1347", "1351"], "ans": 1, "exp": "The infographic gives 1336 as the year of Vijayanagara's independence."}, {"id": 26, "q": "Who founded the Vijayanagara Empire, according to the page?", "opts": ["Harihara and Bukka", "Hasan Gangu and Bukka", "Harihara and Madhavacharya", "Bukka and Muhammad bin Tughlaq"], "ans": 0, "exp": "The founders listed are Harihara and Bukka."}, {"id": 27, "q": "Who is named as the minister of the Vijayanagara Empire?", "opts": ["Vidyaranya (Madhavacharya)", "Amir Khusro", "Ibn Battuta", "Nasiruddin Chiragh-i-Delhi"], "ans": 0, "exp": "The infographic names Madhavacharya (Vidyaranya) as minister."}, {"id": 28, "q": "In which year was the Bahmani Dynasty founded?", "opts": ["1336", "1340", "1347", "1351"], "ans": 2, "exp": "The page dates the founding of the Bahmani Dynasty to 1347."}, {"id": 29, "q": "Who founded the Bahmani Dynasty?", "opts": ["Harihara", "Bukka", "Hasan Gangu", "Tughril Khan"], "ans": 2, "exp": "Hasan Gangu is named as the founder of the Bahmani Dynasty."}, {"id": 30, "q": "How many revolts took place during Muhammad bin Tughlaq's reign, according to the infographic?", "opts": ["12", "17", "22", "29"], "ans": 2, "exp": "The page states that 22 revolts took place during his reign."}, {"id": 31, "q": "In which year did Shamsuddin declare independence in Bengal?", "opts": ["1336", "1337", "1340", "1350"], "ans": 2, "exp": "The Bengal panel gives 1340 as the year Shamsuddin declared independence."}, {"id": 32, "q": "Who led the Gujarat revolt of 1350–1351?", "opts": ["Tughril Khan", "Taghi", "Shamsuddin", "Hammir Dev"], "ans": 1, "exp": "The infographic names Taghi as the rebel leader."}, {"id": 33, "q": "On what date did Muhammad bin Tughlaq die?", "opts": ["20 March 1351", "20 July 1351", "26 February 1351", "15 March 1350"], "ans": 0, "exp": "The death panel gives 20 March 1351."}, {"id": 34, "q": "Near which place did Muhammad bin Tughlaq die?", "opts": ["Delhi", "Daulatabad", "Thatta, Sindh", "Bengal"], "ans": 2, "exp": "The infographic says he died near Thatta in Sindh during the Gujarat campaign."}, {"id": 35, "q": "Which remark is attributed to Balban in the infographic?", "opts": ["The Sultan got freedom from his subjects, and the subjects got freedom from the Sultan.", "Delhi is still far away.", "Blood and Iron shall rule.", "The king is the shadow of God."], "ans": 0, "exp": "The page attributes this remark about mutual freedom between Sultan and subjects to Balban."}],KEY='muhammad_bin_tughlaq_page9_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
