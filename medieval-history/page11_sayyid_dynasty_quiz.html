const questions=[{"id": 1, "q": "What was the period of the Sayyid Dynasty?", "opts": ["1206–1290 AD", "1290–1320 AD", "1414–1451 AD", "1451–1526 AD"], "ans": 2, "exp": "The Sayyid Dynasty ruled from 1414 to 1451 AD."}, {"id": 2, "q": "How long did the Sayyid Dynasty rule?", "opts": ["27 years", "32 years", "37 years", "40 years"], "ans": 2, "exp": "The infographic gives the total duration as 37 years."}, {"id": 3, "q": "Who founded the Sayyid Dynasty?", "opts": ["Mubarak Shah", "Khizr Khan", "Muhammad Shah", "Alam Shah"], "ans": 1, "exp": "Khizr Khan founded the Sayyid Dynasty."}, {"id": 4, "q": "What was Khizr Khan's position before becoming ruler?", "opts": ["Governor of Bengal", "Governor of Multan", "Governor of Lahore", "Governor of Jaunpur"], "ans": 1, "exp": "The infographic says Khizr Khan was Governor of Multan during Firoz Shah Tughlaq's reign."}, {"id": 5, "q": "Who appointed Khizr Khan as governor of Lahore, Multan and Dipalpur?", "opts": ["Firoz Shah Tughlaq", "Timur", "Mubarak Shah", "Bahlol Lodi"], "ans": 1, "exp": "While returning from India, Timur appointed Khizr Khan governor of Lahore, Multan and Dipalpur."}, {"id": 6, "q": "Khizr Khan considered himself a descendant of whom?", "opts": ["Alexander the Great", "Prophet Muhammad", "Mahmud of Ghazni", "Timur"], "ans": 1, "exp": "The infographic states that Khizr Khan considered himself a descendant of Prophet Muhammad."}, {"id": 7, "q": "Which title did Khizr Khan assume?", "opts": ["Sultan", "Shah", "Raiyat-i-Ala", "Khan-i-Khanan"], "ans": 2, "exp": "Khizr Khan did not assume the title of Sultan; he used the title Raiyat-i-Ala."}, {"id": 8, "q": "When did Khizr Khan die?", "opts": ["20 May 1421", "20 March 1421", "14 February 1434", "15 August 1420"], "ans": 0, "exp": "Khizr Khan died on 20 May 1421."}, {"id": 9, "q": "Who succeeded Khizr Khan?", "opts": ["Muhammad Shah", "Alauddin Alam Shah", "Mubarak Shah", "Bahlol Lodi"], "ans": 2, "exp": "Mubarak Shah succeeded his father Khizr Khan in 1421 AD."}, {"id": 10, "q": "What was Mubarak Shah's relationship to Khizr Khan?", "opts": ["Younger brother", "Son", "Minister", "Nephew"], "ans": 1, "exp": "Mubarak Shah was the son of Khizr Khan."}, {"id": 11, "q": "Which titles did Mubarak Shah assume?", "opts": ["Raiyat-i-Ala and Ghazi", "Sultan and Shah", "Khan-i-Khanan and Shah", "Amir and Malik"], "ans": 1, "exp": "The infographic lists the titles Sultan and Shah for Mubarak Shah."}, {"id": 12, "q": "What did Mubarak Shah have read in his own name?", "opts": ["The Friday sermon (Khutba)", "The royal chronicle", "The Quran only", "A military decree"], "ans": 0, "exp": "The infographic notes that Mubarak Shah had the Khutba read in his own name."}, {"id": 13, "q": "Who murdered Mubarak Shah?", "opts": ["Jasrath", "Sarwar-ul-Mulk", "Hamid Khan", "Bahlol Lodi"], "ans": 1, "exp": "Mubarak Shah was murdered by his Prime Minister, Sarwar-ul-Mulk."}, {"id": 14, "q": "Who wrote Tarikh-i-Mubarak Shahi?", "opts": ["Ziauddin Barani", "Yahya bin Ahmad Sirhindi", "Amir Khusro", "Ibn Battuta"], "ans": 1, "exp": "The work Tarikh-i-Mubarak Shahi is attributed to Yahya bin Ahmad Sirhindi."}, {"id": 15, "q": "Which city was founded by Mubarak Shah?", "opts": ["Mubarakabad", "Jaunpur", "Fatehabad", "Daulatabad"], "ans": 0, "exp": "The infographic says Mubarak Shah founded the city of Mubarakabad."}, {"id": 16, "q": "Who was considered the most capable ruler of the Sayyid Dynasty?", "opts": ["Khizr Khan", "Mubarak Shah", "Muhammad Shah", "Alauddin Alam Shah"], "ans": 1, "exp": "Mubarak Shah is described as the most capable ruler of the Sayyid Dynasty."}, {"id": 17, "q": "Who led the Khokhar revolt during Mubarak Shah's reign?", "opts": ["Ibrahim Shah", "Jasrath", "Hamid Khan", "Sarwar-ul-Mulk"], "ans": 1, "exp": "Jasrath is named as the leader of the Khokhar revolt."}, {"id": 18, "q": "Who led the Jaunpur revolt during Mubarak Shah's reign?", "opts": ["Jasrath", "Ibrahim Shah", "Hoshang Shah", "Bahlol Lodi"], "ans": 1, "exp": "The infographic identifies Ibrahim Shah as the leader of the Jaunpur revolt, which was unsuccessful."}, {"id": 19, "q": "Who led the Gwalior revolt during Mubarak Shah's reign?", "opts": ["Hoshang Shah", "Jasrath", "Ibrahim Shah", "Hamid Khan"], "ans": 0, "exp": "Hoshang Shah led the Gwalior revolt, which was unsuccessful."}, {"id": 20, "q": "What was the original name of Muhammad Shah?", "opts": ["Jauna Khan", "Farid Khan", "Kamaluddin Firoz", "Ghazi Malik"], "ans": 1, "exp": "The infographic gives Farid Khan as Muhammad Shah's original name."}, {"id": 21, "q": "What was Muhammad Shah's relationship to Mubarak Shah?", "opts": ["Son", "Younger brother", "Father", "Minister"], "ans": 1, "exp": "Muhammad Shah was the younger brother of Mubarak Shah."}, {"id": 22, "q": "In which year did Mahmud Khilji of Malwa attack Delhi?", "opts": ["1434 AD", "1440 AD", "1445 AD", "1451 AD"], "ans": 1, "exp": "The infographic dates Mahmud Khilji of Malwa's attack on Delhi to 1440 AD."}, {"id": 23, "q": "From whom did Muhammad Shah receive help during the attack on Delhi?", "opts": ["Timur", "Bahlol Lodi", "Hamid Khan", "Ibrahim Shah"], "ans": 1, "exp": "Muhammad Shah received help from Bahlol Lodi."}, {"id": 24, "q": "Whom did Muhammad Shah adopt as his son and confer the title Khan-i-Khanan?", "opts": ["Hamid Khan", "Bahlol Lodi", "Mahmud Khilji", "Sarwar-ul-Mulk"], "ans": 1, "exp": "The infographic says Muhammad Shah adopted Bahlol Lodi as his son and conferred the title Khan-i-Khanan upon him."}, {"id": 25, "q": "When did Muhammad Shah die?", "opts": ["1434 AD", "1440 AD", "1445 AD", "1451 AD"], "ans": 2, "exp": "Muhammad Shah died in 1445 AD."}, {"id": 26, "q": "Who succeeded Muhammad Shah?", "opts": ["Khizr Khan", "Mubarak Shah", "Alauddin Ahmad Shah (Alam Shah)", "Bahlol Lodi"], "ans": 2, "exp": "Alauddin Ahmad Shah, also called Alam Shah, succeeded Muhammad Shah in 1445 AD."}, {"id": 27, "q": "What was Alauddin Ahmad Shah's relationship to Muhammad Shah?", "opts": ["Younger brother", "Son", "Father", "Minister"], "ans": 1, "exp": "Alauddin Ahmad Shah was the son of Muhammad Shah."}, {"id": 28, "q": "How is Alauddin Ahmad Shah described in the infographic?", "opts": ["Most capable ruler", "Most incompetent ruler of the Sayyid Dynasty", "Founder of the dynasty", "The longest-reigning ruler"], "ans": 1, "exp": "The infographic describes him as the most incompetent ruler of the Sayyid Dynasty."}, {"id": 29, "q": "Why did Alauddin Ahmad Shah leave Delhi?", "opts": ["Mongol invasion", "Conflicts with Hamid Khan", "Attack by Timur", "Revolt by Jasrath"], "ans": 1, "exp": "Due to conflicts with Hamid Khan, he left Delhi and went to Badaun."}, {"id": 30, "q": "To whom did Hamid Khan hand over the kingdom of Delhi?", "opts": ["Ibrahim Shah", "Bahlol Lodi", "Mahmud Khilji", "Sarwar-ul-Mulk"], "ans": 1, "exp": "The infographic says Hamid Khan handed over the kingdom of Delhi to Bahlol Lodi, ending the Sayyid Dynasty."}, {"id": 31, "q": "In which year did the Sayyid Dynasty come to an end?", "opts": ["1434 AD", "1445 AD", "1451 AD", "1526 AD"], "ans": 2, "exp": "The Sayyid Dynasty ended in 1451 AD when Delhi was handed over to Bahlol Lodi."}, {"id": 32, "q": "Who invaded India in 1398 AD during Nasiruddin Mahmud Shah's reign, according to the quick facts?", "opts": ["Babur", "Timur", "Nadir Shah", "Ahmad Shah Abdali"], "ans": 1, "exp": "The quick facts state that Timur invaded India in 1398 AD during Nasiruddin Mahmud Shah's reign."}, {"id": 33, "q": "Which ruler is identified as the most capable ruler of the Sayyid Dynasty?", "opts": ["Khizr Khan", "Mubarak Shah", "Muhammad Shah", "Alauddin Ahmad Shah"], "ans": 1, "exp": "Mubarak Shah is identified as the most capable ruler."}, {"id": 34, "q": "Which ruler is identified as the most incompetent ruler of the Sayyid Dynasty?", "opts": ["Khizr Khan", "Mubarak Shah", "Muhammad Shah", "Alauddin Ahmad Shah"], "ans": 3, "exp": "Alauddin Ahmad Shah is identified as the most incompetent ruler."}, {"id": 35, "q": "Which is the correct chronological order of the four Sayyid rulers shown?", "opts": ["Khizr Khan → Mubarak Shah → Muhammad Shah → Alauddin Ahmad Shah", "Mubarak Shah → Khizr Khan → Alauddin Ahmad Shah → Muhammad Shah", "Khizr Khan → Muhammad Shah → Mubarak Shah → Alauddin Ahmad Shah", "Muhammad Shah → Khizr Khan → Mubarak Shah → Alauddin Ahmad Shah"], "ans": 0, "exp": "The rulers and periods are Khizr Khan (1414–1421), Mubarak Shah (1421–1434), Muhammad Shah (1434–1445), and Alauddin Ahmad Shah (1445–1451)."}],KEY='sayyid_dynasty_page11_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
