const questions=[{"id": 1, "q": "What was the period of Shah Jahan's reign as shown in the infographic?", "opts": ["1605–1627 AD", "1627–1658 AD", "1658–1707 AD", "1540–1555 AD"], "ans": 1, "exp": "The infographic gives Shah Jahan's reign as 1627–1658 AD."}, {"id": 2, "q": "What was Shah Jahan's childhood name?", "opts": ["Salim", "Khurram", "Dara", "Murad"], "ans": 1, "exp": "Shah Jahan's childhood name was Khurram."}, {"id": 3, "q": "Who was Shah Jahan's father?", "opts": ["Akbar", "Jahangir", "Humayun", "Babur"], "ans": 1, "exp": "Jahangir was Shah Jahan's father."}, {"id": 4, "q": "Who was Shah Jahan's mother?", "opts": ["Nur Jahan", "Jagat Gosain", "Mumtaz Mahal", "Jahanara Begum"], "ans": 1, "exp": "His mother was Jagat Gosain, also known as Jodh Bai of Marwar."}, {"id": 5, "q": "Whom did Shah Jahan marry?", "opts": ["Mehr-un-Nissa", "Arjumand Banu Begum", "Jahanara Begum", "Roshanara Begum"], "ans": 1, "exp": "Shah Jahan married Arjumand Banu Begum, known as Mumtaz Mahal."}, {"id": 6, "q": "How many children did Shah Jahan have, and how many survived according to the infographic?", "opts": ["4; all survived", "14; 7 survived", "8; 4 survived", "10; 5 survived"], "ans": 1, "exp": "The infographic states that he had 14 children, of whom 7 survived."}, {"id": 7, "q": "Which of Shah Jahan's sons was born in Punjab in 1615?", "opts": ["Shah Shuja", "Dara Shikoh", "Aurangzeb", "Murad Baksh"], "ans": 1, "exp": "Dara Shikoh was born in Punjab in 1615."}, {"id": 8, "q": "Which son of Shah Jahan was born in Bengal in 1616?", "opts": ["Dara Shikoh", "Shah Shuja", "Aurangzeb", "Murad Baksh"], "ans": 1, "exp": "Shah Shuja was born in Bengal in 1616."}, {"id": 9, "q": "Which son was born in the Deccan in 1618?", "opts": ["Aurangzeb", "Dara Shikoh", "Shah Shuja", "Murad Baksh"], "ans": 0, "exp": "Aurangzeb was born in the Deccan in 1618."}, {"id": 10, "q": "Which son of Shah Jahan was born in Gujarat in 1624?", "opts": ["Dara Shikoh", "Shah Shuja", "Murad Baksh", "Aurangzeb"], "ans": 2, "exp": "Murad Baksh was born in Gujarat in 1624."}, {"id": 11, "q": "Which daughter of Shah Jahan was born in 1614?", "opts": ["Roshanara Begum", "Jahanara Begum", "Gauhar Ara Begum", "Ladli Begum"], "ans": 1, "exp": "Jahanara Begum was born in 1614."}, {"id": 12, "q": "Who was born in 1617 among Shah Jahan's daughters?", "opts": ["Jahanara Begum", "Roshanara Begum", "Gauhar Ara Begum", "Mumtaz Mahal"], "ans": 1, "exp": "Roshanara Begum was born in 1617."}, {"id": 13, "q": "Which daughter was born in 1631?", "opts": ["Jahanara Begum", "Roshanara Begum", "Gauhar Ara Begum", "Ladli Begum"], "ans": 2, "exp": "Gauhar Ara Begum was born in 1631."}, {"id": 14, "q": "What mansab is listed for Shah Jahan?", "opts": ["5,000 zat and 5,000 sawar", "7,000 zat and 7,000 sawar", "10,000 zat and 10,000 sawar", "7,000 zat and 5,000 sawar"], "ans": 1, "exp": "The infographic lists a mansab of 7,000 zat and 7,000 sawar."}, {"id": 15, "q": "When did Shah Jahan become a member of the Nur Jahan Group?", "opts": ["1606", "1611", "1622", "1627"], "ans": 1, "exp": "The infographic says Shah Jahan became a member of the Nur Jahan Group in 1611."}, {"id": 16, "q": "In which year did Shah Jahan lead the Kandahar campaign mentioned in the infographic?", "opts": ["1615", "1622", "1623", "1627"], "ans": 1, "exp": "The infographic records the Kandahar campaign in 1622."}, {"id": 17, "q": "When did Shah Jahan rebel against Jahangir, according to the infographic?", "opts": ["1611", "1622", "1623", "1628"], "ans": 2, "exp": "The infographic gives 1623 as the year of his rebellion against Jahangir."}, {"id": 18, "q": "On what date was Shah Jahan crowned?", "opts": ["3 November 1605", "24 February 1628", "8 June 1658", "10 June 1658"], "ans": 1, "exp": "Shah Jahan's coronation date is given as 24 February 1628."}, {"id": 19, "q": "Where did Shah Jahan's coronation take place?", "opts": ["Delhi", "Agra", "Lahore", "Ajmer"], "ans": 1, "exp": "The coronation took place at Agra."}, {"id": 20, "q": "Which city did Shah Jahan make the capital in 1628?", "opts": ["Delhi", "Agra", "Lahore", "Fatehpur Sikri"], "ans": 1, "exp": "The infographic says Agra was made the capital in 1628."}, {"id": 21, "q": "Which city became the capital after the shift in 1638?", "opts": ["Agra", "Delhi", "Lahore", "Kabul"], "ans": 1, "exp": "In 1638, Shah Jahan shifted the capital from Agra to Delhi."}, {"id": 22, "q": "Who led the Bundelkhand Revolt (1628–1635)?", "opts": ["Jujhar Singh", "Khan-i-Jahan Lodi", "Guru Hargobind Singh", "Mahabat Khan"], "ans": 0, "exp": "Jujhar Singh led the Bundelkhand Revolt."}, {"id": 23, "q": "Who led the Khan-i-Jahan Lodi revolt (1628–1631)?", "opts": ["Jujhar Singh", "Khan-i-Jahan Lodi", "Daulat Khan", "Rana Amar Singh"], "ans": 1, "exp": "The revolt was led by Khan-i-Jahan Lodi."}, {"id": 24, "q": "Who was appointed Khan-i-Khanan after Mahabat Khan?", "opts": ["Jujhar Singh", "Mahabat Khan", "Abdul Hamid Lahori", "Murshid Quli Khan"], "ans": 1, "exp": "The infographic notes that Mahabat Khan was appointed Khan-i-Khanan in this context."}, {"id": 25, "q": "Who was the leader of the Sikh Revolt mentioned in the infographic?", "opts": ["Guru Arjan Dev", "Guru Hargobind Singh", "Guru Gobind Singh", "Guru Tegh Bahadur"], "ans": 1, "exp": "Guru Hargobind Singh, the sixth Sikh Guru, is named as the leader."}, {"id": 26, "q": "Which ruler was conquered in the Ahmadnagar campaign of 1633?", "opts": ["Fateh Khan", "Abdullah Qutb Shah", "Ali Adil Shah", "Daud Khan"], "ans": 0, "exp": "The Ahmadnagar campaign of 1633 names Fateh Khan as the ruler."}, {"id": 27, "q": "In which year did Shah Jahan conquer Golconda?", "opts": ["1633", "1636", "1644", "1656"], "ans": 1, "exp": "The infographic dates the Golconda campaign to 1636."}, {"id": 28, "q": "Who was the ruler of Golconda during the 1636 campaign?", "opts": ["Fateh Khan", "Abdullah Qutb Shah", "Ali Adil Shah", "Jujhar Singh"], "ans": 1, "exp": "Abdullah Qutb Shah is identified as the Golconda ruler."}, {"id": 29, "q": "In which year did Shah Jahan conquer Bijapur in the first campaign shown?", "opts": ["1633", "1636", "1644", "1656"], "ans": 1, "exp": "The first Bijapur campaign is dated 1636."}, {"id": 30, "q": "When did Shah Jahan again attack Golconda and Bijapur?", "opts": ["1644", "1652", "1656", "1658"], "ans": 2, "exp": "The infographic dates the second Golconda and Bijapur campaigns to 1656."}, {"id": 31, "q": "What was the capital of Aurangzeb's first Deccan viceroyalty (1636–1644)?", "opts": ["Aurangabad", "Kh dki (Aurangabad)", "Delhi", "Agra"], "ans": 1, "exp": "The infographic gives Khadki (Aurangabad) as the capital."}, {"id": 32, "q": "What was the capital during Aurangzeb's second Deccan viceroyalty (1652–1657)?", "opts": ["Khadki", "Aurangabad", "Bijapur", "Golconda"], "ans": 1, "exp": "The capital is listed as Aurangabad."}, {"id": 33, "q": "Which Mughal governor in the south carried out land reforms?", "opts": ["Murshid Quli Khan", "Khwaja Abul Hasan", "Abdul Hamid Lahori", "Inayat Khan"], "ans": 0, "exp": "Murshid Quli Khan is credited with carrying out land reforms."}, {"id": 34, "q": "Which court poet wrote Padshahnama?", "opts": ["Inayat Khan", "Abdul Hamid Lahori", "Chandrabhan Brahman", "Sundardas"], "ans": 1, "exp": "Abdul Hamid Lahori wrote Padshahnama."}, {"id": 35, "q": "Who wrote Shahjahannama?", "opts": ["Inayat Khan", "Abu Talib Kalim", "Pandit Jagannath", "Kavindra Acharya Saraswati"], "ans": 0, "exp": "Inayat Khan wrote Shahjahannama."}, {"id": 36, "q": "Who wrote Char Chaman?", "opts": ["Sundardas", "Chandrabhan Brahman", "Abdul Hakim", "Abu Talib Kalim"], "ans": 1, "exp": "Chandrabhan Brahman wrote Char Chaman."}, {"id": 37, "q": "Who translated the Ramayana?", "opts": ["Abdul Hakim", "Sundardas", "Pandit Jagannath", "Inayat Khan"], "ans": 0, "exp": "Abdul Hakim is listed as the translator of the Ramayana."}, {"id": 38, "q": "Which works are associated with Sundardas?", "opts": ["Singhasan Battisi and Barahmasa", "Padshahnama and Shahjahannama", "Char Chaman and Ramayana", "Majma-ul-Bahrain and Sirr-i-Akbar"], "ans": 0, "exp": "The infographic associates Sundardas with Singhasan Battisi and Barahmasa."}, {"id": 39, "q": "What was Shah Jahan's religious policy described as?", "opts": ["He performed pilgrimages and abolished the Sijda and Paibos customs", "He introduced Din-i-Ilahi", "He abolished all taxes", "He established the Ibadat Khana"], "ans": 0, "exp": "The infographic says he performed pilgrimages and abolished the Sijda and Paibos customs."}, {"id": 40, "q": "Shah Jahan's reign is known as the Golden Age of which field?", "opts": ["Painting", "Architecture", "Literature", "Music"], "ans": 1, "exp": "Shah Jahan's reign is known as the Golden Age of Architecture."}, {"id": 41, "q": "What title was given to Tansen in the Shah Jahan section?", "opts": ["Nadir-ul-Asr", "Mughal Gandharva", "English Khan", "Nadir-uz-Zaman"], "ans": 1, "exp": "The infographic says Tansen was given the title Mughal Gandharva."}, {"id": 42, "q": "Which Mughal governor in the south is listed alongside Murshid Quli Khan?", "opts": ["Khwaja Abul Hasan", "Fateh Khan", "Abdul Hakim", "Asaf Khan"], "ans": 0, "exp": "Khwaja Abul Hasan is listed among the Mughal governors in the south."}, {"id": 43, "q": "Which event is dated 1656 in the infographic's southern campaigns section?", "opts": ["Ali Adil Shah died and Badi Sahiba Begum became regent", "Shah Jahan shifted the capital to Delhi", "Shah Jahan was crowned", "The Battle of Dharmat took place"], "ans": 0, "exp": "The 1656 note states that Ali Adil Shah died and Badi Sahiba Begum became regent."}, {"id": 44, "q": "Which three places are named in the 1656 campaign note?", "opts": ["Bidar Fort, Kalyani Fort and Siege of Mughal territories", "Agra, Delhi and Lahore", "Ajmer, Ujjain and Samugarh", "Kandahar, Kabul and Multan"], "ans": 0, "exp": "The infographic lists Bidar Fort, Kalyani Fort and the siege of Mughal territories."}, {"id": 45, "q": "What was Dara Shikoh's pen name?", "opts": ["Qadiri", "Mian", "Nadir-ul-Asr", "Mughal Gandharva"], "ans": 0, "exp": "Dara Shikoh's pen name is given as Qadiri."}, {"id": 46, "q": "Which work by Dara Shikoh is described as a Persian translation of the Upanishads?", "opts": ["Majma-ul-Bahrain", "Sirr-i-Akbar", "Padshahnama", "Tuzuk-i-Jahangiri"], "ans": 1, "exp": "Sirr-i-Akbar is identified as Dara Shikoh's Persian translation of the Upanishads."}, {"id": 47, "q": "Who was Dara Shikoh's spiritual guide?", "opts": ["Guru Har Rai", "Guru Hargobind Singh", "Abdul Hakim", "Murshid Quli Khan"], "ans": 0, "exp": "The infographic names Guru Har Rai as Dara Shikoh's spiritual guide."}, {"id": 48, "q": "Which battle of the war of succession took place at Ujjain on 8 June 1658?", "opts": ["Battle of Samugarh", "Battle of Dharmat", "Battle of Deorai", "Battle of Haldighati"], "ans": 1, "exp": "The Battle of Dharmat took place at Ujjain on 8 June 1658."}, {"id": 49, "q": "When was the Battle of Samugarh fought?", "opts": ["8 June 1658", "10 June 1658", "1659", "24 February 1628"], "ans": 1, "exp": "The infographic gives 10 June 1658 for the Battle of Samugarh, near Agra."}, {"id": 50, "q": "Which battle of the war of succession is dated 1659 and associated with Ajmer?", "opts": ["Battle of Dharmat", "Battle of Samugarh", "Battle of Deorai", "Battle of Chausa"], "ans": 2, "exp": "The Battle of Deorai is dated 1659 and located near Ajmer in the infographic."}, {"id": 51, "q": "Who won the three battles listed in the war of succession section?", "opts": ["Dara Shikoh", "Aurangzeb", "Shah Shuja", "Murad Baksh"], "ans": 1, "exp": "The infographic records Aurangzeb as the winner in all three listed battles."}, {"id": 52, "q": "For how many years was Shah Jahan imprisoned in Agra Fort, according to the infographic?", "opts": ["5 years", "8 years", "10 years", "14 years"], "ans": 1, "exp": "The infographic states that Shah Jahan was imprisoned in Agra Fort (Shah Burj) for eight years."}, {"id": 53, "q": "In which year did Shah Jahan die?", "opts": ["1658", "1666", "1670", "1680"], "ans": 1, "exp": "Shah Jahan died in 1666 AD."}, {"id": 54, "q": "Where is Shah Jahan's tomb located according to the infographic?", "opts": ["Lahore", "Delhi", "Sikandra", "Sasaram"], "ans": 0, "exp": "The infographic identifies Lahore as the tomb location."}],KEY='shah_jahan_page19_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
