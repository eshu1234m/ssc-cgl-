<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}
</style></head><body><div class="wrap"><header><h1>Page 16: Akbar (1556–1605 AD)</h1><div class="sub">35 MCQs · Mixed difficulty · One question at a time · Instant feedback</div></header>
<section class="panel" id="quiz"><div class="row"><span class="qnum" id="counter"></span><span class="muted" id="saved">Progress saves on this device</span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="question" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" id="prev">Previous</button><div style="display:flex;gap:10px"><button class="secondary" id="reset">Reset</button><button class="primary" id="submit">Submit answer</button><button class="primary hidden" id="next">Next</button></div></div></section>
<section class="panel hidden result" id="result"><h2>Quiz completed!</h2><div class="score" id="score"></div><div id="summary"></div><div class="actions"><button class="secondary" id="reviewBtn">Review incorrect answers</button><button class="primary" id="retake">Retake quiz</button></div><div class="review hidden" id="review"></div></section><p class="small">Progress is stored locally in this browser. It does not sync across devices.</p></div>
<script>
const questions=[{"id": 1, "q": "On which date was Akbar born?", "opts": ["15 October 1542 AD", "5 November 1556 AD", "25 December 1540 AD", "15 August 1545 AD"], "ans": 0, "exp": "The infographic gives Akbar's birth date as 15 October 1542 AD."}, {"id": 2, "q": "What was Akbar's childhood name?", "opts": ["Farid", "Badr-ud-din Muhammad Akbar", "Jalal Khan", "Nasir-ud-din Muhammad"], "ans": 1, "exp": "The infographic gives his childhood name as Badr-ud-din Muhammad Akbar."}, {"id": 3, "q": "Who was Akbar's foster mother?", "opts": ["Maham Anaga", "Jiji Anaga", "Hamida Banu Begum", "Salima Begum"], "ans": 1, "exp": "Jiji Anaga is identified as Akbar's foster mother."}, {"id": 4, "q": "Who was Akbar's teacher?", "opts": ["Abul Fazl", "Bairam Khan", "Abdul Latif", "Todar Mal"], "ans": 2, "exp": "The infographic names Abdul Latif as Akbar's teacher."}, {"id": 5, "q": "Where was Akbar crowned in 1556?", "opts": ["Kalanur village near Gurdaspur, Punjab", "Agra Fort", "Delhi", "Umarkot"], "ans": 0, "exp": "Akbar's coronation was held at Kalanur village near Gurdaspur in Punjab."}, {"id": 6, "q": "When was the Second Battle of Panipat fought?", "opts": ["5 November 1556", "15 October 1542", "17 May 1540", "26 June 1539"], "ans": 0, "exp": "The Second Battle of Panipat took place on 5 November 1556."}, {"id": 7, "q": "Who were the opponents in the Second Battle of Panipat?", "opts": ["Humayun and Sher Shah", "Hemu and Akbar", "Akbar and Bairam Khan", "Ibrahim Lodi and Babur"], "ans": 1, "exp": "The battle was fought between Hemu and Akbar's forces."}, {"id": 8, "q": "Who commanded Akbar's forces in the Second Battle of Panipat?", "opts": ["Bairam Khan", "Hemu", "Todar Mal", "Abul Fazl"], "ans": 0, "exp": "Bairam Khan was the commander of Akbar's forces."}, {"id": 9, "q": "What was Bairam Khan's role during Akbar's early reign?", "opts": ["Regent and chief guardian of the empire", "Governor of Bengal", "Chief justice", "Head of the translation department"], "ans": 0, "exp": "Bairam Khan served as regent (Vakil-us-Saltanat) from 1556 to 1560."}, {"id": 10, "q": "Where was Bairam Khan sent on a pilgrimage?", "opts": ["Mecca", "Jerusalem", "Karbala", "Medina"], "ans": 0, "exp": "On Maham Anaga's advice, Bairam Khan was sent on a pilgrimage to Mecca."}, {"id": 11, "q": "Who murdered Bairam Khan while he was travelling to Mecca?", "opts": ["Mubarak Khan", "Hemu", "Rao Maldeo", "Kirat Singh"], "ans": 0, "exp": "The infographic states that Bairam Khan was murdered by Mubarak Khan in Patan, Gujarat."}, {"id": 12, "q": "In which year did Akbar become free from the influence of the Harem Party?", "opts": ["1556", "1560", "1562", "1575"], "ans": 2, "exp": "The infographic marks 1562 as the year Akbar became free from the Harem Party's influence."}, {"id": 13, "q": "Which social practice did Akbar abolish in 1562, according to the infographic?", "opts": ["Child marriage", "Sati", "Untouchability", "Purdah"], "ans": 0, "exp": "The infographic lists the abolition of child marriage in 1562."}, {"id": 14, "q": "Which tax did Akbar abolish in 1564?", "opts": ["Jizya", "Pilgrimage tax", "Land revenue", "Customs duty"], "ans": 0, "exp": "Akbar abolished the Jizya tax in 1564."}, {"id": 15, "q": "Where was the Ibadat Khana established?", "opts": ["Agra", "Fatehpur Sikri", "Delhi", "Lahore"], "ans": 1, "exp": "The Ibadat Khana was established at Fatehpur Sikri in 1575."}, {"id": 16, "q": "Which of the following was a Jain representative listed in the infographic?", "opts": ["Shantichandra Suri", "Purushottam", "Dastur Meherji Rana", "Monserrate"], "ans": 0, "exp": "Shantichandra Suri is listed among the Jain representatives."}, {"id": 17, "q": "Who represented the Christians in the infographic?", "opts": ["Birbal", "Monserrate", "Abul Fazl", "Haji Ibrahim"], "ans": 1, "exp": "Monserrate is named as the Christian representative."}, {"id": 18, "q": "Which of the following was an objective of Sulh-i-Kul?", "opts": ["Religious unity and cultural unity", "Expansion through naval warfare", "Abolition of all languages", "Replacing all local officials"], "ans": 0, "exp": "The infographic lists religious unity, cultural unity, national integration and equal taxation among its objectives."}, {"id": 19, "q": "Who established the translation department under Akbar?", "opts": ["Maktab Khana", "Diwan-i-Qaza", "Ibadat Khana", "Dak Chowki"], "ans": 0, "exp": "The translation department was called Maktab Khana."}, {"id": 20, "q": "Who translated the Mahabharata into Persian as Razmnama, according to the infographic?", "opts": ["Faizi and Badauni", "Abul Fazl and Birbal", "Haji Ibrahim and Monserrate", "Todar Mal and Bairam Khan"], "ans": 0, "exp": "The infographic credits Faizi and Badauni with the Persian translation titled Razmnama."}, {"id": 21, "q": "In which year did Akbar introduce the Mansabdari System?", "opts": ["1560", "1575", "1580", "1582"], "ans": 1, "exp": "The infographic gives 1575 as the year of introduction of the Mansabdari System."}, {"id": 22, "q": "What was the branding system for horses called?", "opts": ["Dagh", "Zat", "Sawar", "Qabuliyat"], "ans": 0, "exp": "Dagh was the horse-branding system."}, {"id": 23, "q": "Into how many grades were mansabdars classified, according to the infographic?", "opts": ["16", "33", "66", "99"], "ans": 2, "exp": "The infographic states that mansabdars were classified into 66 grades."}, {"id": 24, "q": "Who is associated with the Dahsala land-revenue system?", "opts": ["Todar Mal", "Bairam Khan", "Abul Fazl", "Birbal"], "ans": 0, "exp": "Todar Mal is associated with the Dahsala System."}, {"id": 25, "q": "What was the state's share of produce under the Dahsala system shown?", "opts": ["One-fourth", "One-third", "One-half", "Two-thirds"], "ans": 1, "exp": "The infographic gives the state's share as one-third of the produce."}, {"id": 26, "q": "What was the title Akbar received after the Mahzar of 1579?", "opts": ["Imam-i-Adil", "Hazrat-e-Aala", "Ghazi", "Padshah"], "ans": 0, "exp": "The infographic says Akbar was given the title Imam-i-Adil, meaning Just Ruler."}, {"id": 27, "q": "Who prepared the Mahzar of 1579?", "opts": ["Sheikh Mubarak and Abul Fazl", "Bairam Khan and Todar Mal", "Faizi and Badauni", "Birbal and Monserrate"], "ans": 0, "exp": "The infographic names Sheikh Mubarak and Abul Fazl as its preparers."}, {"id": 28, "q": "How many people accepted Din-i-Ilahi, according to the infographic?", "opts": ["9", "19", "29", "99"], "ans": 1, "exp": "The infographic states that 19 people accepted it."}, {"id": 29, "q": "Who was the chief disciple of Din-i-Ilahi?", "opts": ["Birbal", "Abul Fazl", "Todar Mal", "Faizi"], "ans": 1, "exp": "Abul Fazl is named as the chief disciple."}, {"id": 30, "q": "Which coinage did Akbar standardize, according to the infographic?", "opts": ["Silver Rupiya and copper Dam", "Gold dinar and silver tanka", "Only copper jital", "Paper currency"], "ans": 0, "exp": "The infographic says Akbar standardized the silver Rupiya and copper Dam."}, {"id": 31, "q": "Which road did Akbar improve from Bengal to Kabul?", "opts": ["Grand Trunk Road", "Dakshinapatha", "Silk Road", "Royal Road to Gujarat"], "ans": 0, "exp": "The infographic credits Akbar with improving the Grand Trunk Road from Bengal to Kabul."}, {"id": 32, "q": "What were the centres of Akbar's postal system called?", "opts": ["Dak Chowkis", "Maktab Khanas", "Sarais", "Mansabs"], "ans": 0, "exp": "The postal system used centres called Dak Chowkis."}, {"id": 33, "q": "Which of the following is listed as a city founded by Akbar?", "opts": ["Fatehpur Sikri", "Umarkot", "Sasaram", "Chunar"], "ans": 0, "exp": "Fatehpur Sikri is among the cities listed as founded by Akbar."}, {"id": 34, "q": "Which city is listed as reconstructed by Akbar?", "opts": ["Lahore", "Agra", "Delhi", "Jaipur"], "ans": 0, "exp": "The infographic lists Lahore as reconstructed."}, {"id": 35, "q": "How long was Akbar's reign, according to the infographic?", "opts": ["29 years", "39 years", "49 years", "59 years"], "ans": 2, "exp": "The infographic gives the period 1556–1605 AD and a total of 49 years."}],KEY='akbar_page16_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
