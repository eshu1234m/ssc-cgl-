const questions=[{"id": 1, "q": "What was the original name of Muhammad Ghori according to the notes?", "opts": ["Shihabuddin", "Alauddin", "Muizzuddin", "Qutbuddin"], "ans": 0, "exp": "The infographic gives Muhammad Ghori's original name as Shihabuddin."}, {"id": 2, "q": "In which year was Muhammad Ghori born, according to the infographic?", "opts": ["1147 AD", "1149 AD", "1157 AD", "1163 AD"], "ans": 1, "exp": "The page lists his birth year as 1149 AD."}, {"id": 3, "q": "In which year did Muhammad Ghori die?", "opts": ["1192 AD", "1203 AD", "1206 AD", "1216 AD"], "ans": 2, "exp": "The infographic gives 1206 AD as his death year."}, {"id": 4, "q": "In which year did Muhammad Ghori obtain the kingdom of Ghor?", "opts": ["1173 AD", "1175 AD", "1178 AD", "1186 AD"], "ans": 0, "exp": "The page states that he obtained the kingdom of Ghor in 1173 AD."}, {"id": 5, "q": "The Ghor region is described as lying between which two areas?", "opts": ["Arabia and Egypt", "Iran and Kashmir", "Punjab and Bengal", "Sindh and Gujarat"], "ans": 1, "exp": "The geographical position panel places Ghor between Iran and Kashmir."}, {"id": 6, "q": "Who is identified as the elder brother of Muhammad Ghori?", "opts": ["Qutbuddin Aibak", "Ghiyasuddin", "Tajuddin Yildiz", "Bakhtiyar Khilji"], "ans": 1, "exp": "Ghiyasuddin (1163–1202) is identified as Muhammad Ghori's elder brother."}, {"id": 7, "q": "Which place was the site of Muhammad Ghori's first invasion of India in 1175 AD?", "opts": ["Multan", "Lahore", "Ajmer", "Peshawar"], "ans": 0, "exp": "The first invasion panel gives Multan as the place in 1175 AD."}, {"id": 8, "q": "In which year did Muhammad Ghori attack Patan in Gujarat?", "opts": ["1175 AD", "1178 AD", "1186 AD", "1191 AD"], "ans": 1, "exp": "The attack on Patan is dated to 1178 AD."}, {"id": 9, "q": "Who is named as the queen who opposed Ghori at Patan?", "opts": ["Naikidevi", "Sanyogita", "Rudrama Devi", "Durgavati"], "ans": 0, "exp": "The page names Queen Naikidevi."}, {"id": 10, "q": "What is the name given to the battle associated with Ghori's attack on Patan?", "opts": ["Battle of Waihind", "Battle of Kayadara", "Battle of Chandawar", "First Battle of Tarain"], "ans": 1, "exp": "The infographic calls it the Battle of Kayadara."}, {"id": 11, "q": "Which dynasty ruled Kannauj among the contemporary kingdoms listed?", "opts": ["Chandela", "Gahadavala", "Pala", "Chauhan"], "ans": 1, "exp": "Kannauj is associated with the Gahadavala dynasty in the chart."}, {"id": 12, "q": "Which dynasty is associated with Bundelkhand in the contemporary kingdoms panel?", "opts": ["Chandela", "Sena", "Chaulukya", "Gahadavala"], "ans": 0, "exp": "The infographic lists the Chandela dynasty for Bundelkhand."}, {"id": 13, "q": "Which dynasty is associated with Kalachuri region in the panel?", "opts": ["Pala", "Chedi", "Chauhan", "Sena"], "ans": 1, "exp": "The Kalachuri region is associated with the Chedi dynasty."}, {"id": 14, "q": "Which dynasty is associated with Bengal in the infographic?", "opts": ["Pala", "Sena", "Chandela", "Gahadavala"], "ans": 1, "exp": "The Bengal entry names the Sena dynasty."}, {"id": 15, "q": "Who won Peshawar, Kashmir and Sindh in 1179 AD, according to the expansion timeline?", "opts": ["Muhammad Ghori", "Prithviraj Chauhan", "Qutbuddin Aibak", "Jayachandra"], "ans": 0, "exp": "The 1179 AD timeline entry attributes the conquests to Muhammad Ghori."}, {"id": 16, "q": "Which city did Ghori capture in 1186 AD?", "opts": ["Multan", "Lahore", "Delhi", "Ajmer"], "ans": 1, "exp": "The timeline says Lahore was captured in 1186 AD."}, {"id": 17, "q": "Which place did Ghori capture in 1188 AD?", "opts": ["Bhatinda", "Kannauj", "Patan", "Thanesar"], "ans": 0, "exp": "The timeline lists Bhatinda (Punjab) in 1188 AD."}, {"id": 18, "q": "When was the First Battle of Tarain fought?", "opts": ["1178 AD", "1186 AD", "1191 AD", "1192 AD"], "ans": 2, "exp": "The infographic dates the First Battle of Tarain to 1191 AD."}, {"id": 19, "q": "Who defeated Muhammad Ghori in the First Battle of Tarain, according to the notes?", "opts": ["Jayachandra", "Prithviraj Chauhan III", "Mularaja II", "Vidyadhara"], "ans": 1, "exp": "The notes identify Prithviraj Chauhan III (Rai Pithora) as Ghori's opponent and victor."}, {"id": 20, "q": "When was the Second Battle of Tarain fought?", "opts": ["1191 AD", "1192 AD", "1194 AD", "1206 AD"], "ans": 1, "exp": "The Second Battle of Tarain is dated to 1192 AD."}, {"id": 21, "q": "Who won the Second Battle of Tarain?", "opts": ["Prithviraj Chauhan III", "Muhammad Ghori", "Jayachandra", "Qutbuddin Aibak"], "ans": 1, "exp": "The infographic states that Muhammad Ghori was victorious in 1192 AD."}, {"id": 22, "q": "Which text is mentioned as a source about Prithviraj Chauhan?", "opts": ["Prithviraj Raso", "Kitab-ul-Hind", "Shahnameh", "Kitab-ul-Yamini"], "ans": 0, "exp": "The book mentioned is Prithviraj Raso, attributed in the infographic to Chand Bardai."}, {"id": 23, "q": "Who is named as the author of Prithviraj Raso?", "opts": ["Jagnik", "Chand Bardai", "Utbi", "Firdawsi"], "ans": 1, "exp": "The infographic identifies Chand Bardai as the author."}, {"id": 24, "q": "To whom did Muhammad Ghori transfer his conquered Indian territories?", "opts": ["Tajuddin Yildiz", "Qutb-ud-din Aibak", "Bakhtiyar Khilji", "Ghiyasuddin"], "ans": 1, "exp": "The transfer of territories is attributed to Qutb-ud-din Aibak."}, {"id": 25, "q": "Which successor of Muhammad Ghori is associated with ruling Ghazni?", "opts": ["Qutb-ud-din Aibak", "Tajuddin Yildiz", "Qubacha", "Bakhtiyar Khilji"], "ans": 1, "exp": "The successors panel links Tajuddin Yildiz with Ghazni."}, {"id": 26, "q": "Which successor is associated with Sindh?", "opts": ["Qubacha", "Aibak", "Yildiz", "Bakhtiyar Khilji"], "ans": 0, "exp": "The infographic states that Qubacha ruled Sindh."}, {"id": 27, "q": "Which successor conquered Bihar and Bengal?", "opts": ["Qutb-ud-din Aibak", "Tajuddin Yildiz", "Qubacha", "Bakhtiyar Khilji"], "ans": 3, "exp": "Bakhtiyar Khilji is listed as the conqueror of Bihar and Bengal."}, {"id": 28, "q": "Which universities are listed under the destruction of universities?", "opts": ["Nalanda, Odantapuri and Vikramashila", "Taxila, Vallabhi and Kanchi", "Nalanda, Taxila and Ujjain", "Vikramashila, Kanchi and Madurai"], "ans": 0, "exp": "The infographic names Nalanda, Odantapuri and Vikramashila."}, {"id": 29, "q": "What was the reign of Prithviraj Chauhan according to the page?", "opts": ["1173–1206 AD", "1178–1192 AD", "1191–1206 AD", "1163–1202 AD"], "ans": 1, "exp": "The page gives Prithviraj Chauhan's reign as 1178–1192 AD."}, {"id": 30, "q": "Who is identified as Prithviraj Chauhan's father?", "opts": ["Jayachandra", "Someshwar Chauhan", "Anganpal Tomar", "Mularaja II"], "ans": 1, "exp": "The infographic names Someshwar Chauhan as his father."}, {"id": 31, "q": "Which ruler is mentioned as the founder of Delhi in the infographic?", "opts": ["Anangpal Tomar (Anangpal II)", "Prithviraj Chauhan", "Jayachandra", "Qutbuddin Aibak"], "ans": 0, "exp": "The infographic identifies Anangpal Tomar (Anangpal II) as the founder of Delhi."}, {"id": 32, "q": "Who was Prithviraj Chauhan's opponent in the Battle of Chandawar (1194 AD)?", "opts": ["Muhammad Ghori", "Qutbuddin Aibak", "Tajuddin Yildiz", "Bakhtiyar Khilji"], "ans": 0, "exp": "The Battle of Chandawar panel lists Muhammad Ghori and Jayachandra's Gahadavala dynasty."}, {"id": 33, "q": "Where was the Battle of Chandawar fought according to the infographic?", "opts": ["On the banks of the Yamuna River", "On the banks of the Ganga River", "Near the Ravi River", "Near the Indus River"], "ans": 0, "exp": "The place is given as Chandawar, Etawah, Uttar Pradesh, on the banks of the Yamuna."}, {"id": 34, "q": "In which year did Khwaja Moinuddin Chishti arrive in India?", "opts": ["1178 AD", "1192 AD", "1194 AD", "1203 AD"], "ans": 1, "exp": "The infographic dates his arrival to 1192 AD."}, {"id": 35, "q": "Where did Muhammad Ghori die in 1206 AD according to the infographic?", "opts": ["Damayak (Sindh)", "Ghazni", "Lahore", "Ajmer"], "ans": 0, "exp": "The infographic gives Damayak (Sindh) as the place of his death."}],KEY='ghori_prithviraj_page3_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
