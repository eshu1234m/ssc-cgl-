<script>
const questions=[{"id": 1, "q": "When was Aurangzeb born?", "opts": ["3 November 1618", "15 October 1542", "24 February 1628", "31 July 1658"], "ans": 0, "exp": "Aurangzeb was born on 3 November 1618."}, {"id": 2, "q": "Who was Aurangzeb's father?", "opts": ["Jahangir", "Shah Jahan", "Akbar", "Humayun"], "ans": 1, "exp": "Shah Jahan was Aurangzeb's father."}, {"id": 3, "q": "Who was Aurangzeb's mother?", "opts": ["Jagat Gosain", "Nur Jahan", "Mumtaz Mahal", "Jahanara Begum"], "ans": 2, "exp": "Mumtaz Mahal was his mother."}, {"id": 4, "q": "Who was Aurangzeb's wife according to the infographic?", "opts": ["Dilras Banu Begum", "Mumtaz Mahal", "Nur Jahan", "Roshanara Begum"], "ans": 0, "exp": "The infographic names Dilras Banu Begum as Aurangzeb's wife."}, {"id": 5, "q": "Who was Aurangzeb's teacher?", "opts": ["Abul Fazl", "Mir Muhammad Hashim Gilani", "Abdul Latif", "Bairam Khan"], "ans": 1, "exp": "Mir Muhammad Hashim Gilani is named as his teacher."}, {"id": 6, "q": "Which of the following is a title of Aurangzeb?", "opts": ["Bahadur", "Jahangir", "Sher Shah", "Padshah Begum"], "ans": 0, "exp": "Bahadur is one of the titles listed for Aurangzeb; the other titles shown are Zinda Pir, Alamgir and Shahi Darvesh."}, {"id": 7, "q": "When was Aurangzeb's first coronation?", "opts": ["31 July 1658", "15 June 1659", "8 June 1658", "10 June 1658"], "ans": 0, "exp": "His first coronation took place on 31 July 1658 at Agra."}, {"id": 8, "q": "Where did Aurangzeb hold his second coronation?", "opts": ["Agra", "Lahore", "Delhi", "Khuldabad"], "ans": 2, "exp": "The second coronation was held in Delhi."}, {"id": 9, "q": "When was Aurangzeb's second coronation?", "opts": ["31 July 1658", "15 June 1659", "3 November 1618", "24 February 1628"], "ans": 1, "exp": "The second coronation took place on 15 June 1659."}, {"id": 10, "q": "Which son later became known as Bahadur Shah I?", "opts": ["Muhammad Sultan", "Muazzam", "Azam Shah", "Kam Baksh"], "ans": 1, "exp": "Muazzam later became Bahadur Shah I."}, {"id": 11, "q": "Which daughter of Aurangzeb is named in the infographic?", "opts": ["Jahanara Begum", "Roshanara Begum", "Zeb-un-Nissa", "Gauhar Ara Begum"], "ans": 2, "exp": "Zeb-un-Nissa is listed as Aurangzeb's daughter."}, {"id": 12, "q": "Which tax did Aurangzeb reimpose?", "opts": ["Jizya", "Zakat", "Chauth", "Kharaj"], "ans": 0, "exp": "Aurangzeb reimposed the Jizya tax."}, {"id": 13, "q": "Which other tax did Aurangzeb reimpose, according to the infographic?", "opts": ["Pilgrimage tax", "Salt tax", "Land revenue", "Customs duty"], "ans": 0, "exp": "The infographic states that he reimposed the pilgrimage tax."}, {"id": 14, "q": "Which customs did Aurangzeb oppose?", "opts": ["Sijda and Paibos", "Tilak and Jharokha Darshan", "Both A and B", "None of these"], "ans": 2, "exp": "The infographic lists Tilak, Tuladan and Jharokha Darshan among opposed practices, along with other restrictions."}, {"id": 15, "q": "Which of the following festivals is listed among those opposed under Aurangzeb's religious policy?", "opts": ["Holi", "Eid", "Christmas", "Baisakhi"], "ans": 0, "exp": "Holi appears in the infographic's list of opposed festivals."}, {"id": 16, "q": "Who was Zeb-un-Nissa?", "opts": ["Aurangzeb's daughter and a noted poetess", "Shah Jahan's wife", "A Rajput queen", "A Deccan governor"], "ans": 0, "exp": "Zeb-un-Nissa was Aurangzeb's daughter and a noted poetess."}, {"id": 17, "q": "What title was given to Jahanara Begum by Aurangzeb?", "opts": ["Padshah Begum", "Zinda Pir", "Alamgir", "Shahi Darvesh"], "ans": 0, "exp": "The infographic says Aurangzeb gave Jahanara Begum the title Padshah Begum."}, {"id": 18, "q": "During which period did Aurangzeb serve as Viceroy of the Deccan in his first term?", "opts": ["1636–1644", "1652–1657", "1658–1666", "1669–1681"], "ans": 0, "exp": "His first Deccan viceroyalty is dated 1636–1644."}, {"id": 19, "q": "What was the period of Aurangzeb's second Deccan viceroyalty?", "opts": ["1636–1644", "1652–1657", "1661–1663", "1687–1701"], "ans": 1, "exp": "The second term is given as 1652–1657."}, {"id": 20, "q": "Which regions did Aurangzeb govern or serve as viceroy of, as listed?", "opts": ["Balakh, Kandahar and Gujarat", "Bengal, Bihar and Orissa", "Kabul, Kashmir and Sindh", "Malwa, Mewar and Marwar"], "ans": 0, "exp": "The infographic lists Viceroy of Balakh, Governor of Kandahar and Governor of Gujarat."}, {"id": 21, "q": "Who led the Jat Revolt of 1669?", "opts": ["Gokul", "Kabir", "Guru Tegh Bahadur", "Durgadas Rathore"], "ans": 0, "exp": "Gokul led the Jat Revolt of 1669."}, {"id": 22, "q": "Approximately how many peasants participated in the Jat Revolt?", "opts": ["2,000", "10,000", "20,000", "50,000"], "ans": 2, "exp": "The infographic says about 20,000 peasants participated."}, {"id": 23, "q": "Which temple is said to have been destroyed in the Jat revolt section?", "opts": ["Keshav Rai Temple", "Somnath Temple", "Brihadeeswara Temple", "Jagannath Temple"], "ans": 0, "exp": "The infographic names the Keshav Rai Temple."}, {"id": 24, "q": "Who led the Satnami Revolt of 1672?", "opts": ["Followers of Kabir", "Gokul", "Durgadas Rathore", "Prince Akbar"], "ans": 0, "exp": "The Satnami revolt was led by followers of Kabir, according to the infographic."}, {"id": 25, "q": "Where did the Satnami Revolt take place?", "opts": ["Near Narnaul", "Near Agra", "At Ujjain", "At Ajmer"], "ans": 0, "exp": "The infographic locates it near Narnaul."}, {"id": 26, "q": "About how many Satnamis participated in the revolt?", "opts": ["500", "2,000", "20,000", "50,000"], "ans": 1, "exp": "About 2,000 Satnamis participated."}, {"id": 27, "q": "Who was the ninth Sikh Guru mentioned in the Sikh revolt section?", "opts": ["Guru Hargobind", "Guru Har Rai", "Guru Tegh Bahadur", "Guru Gobind Singh"], "ans": 2, "exp": "Guru Tegh Bahadur was the ninth Sikh Guru."}, {"id": 28, "q": "Who was the eighth Sikh Guru?", "opts": ["Guru Har Krishan", "Guru Tegh Bahadur", "Guru Hargobind", "Guru Nanak"], "ans": 0, "exp": "Guru Har Krishan was the eighth Sikh Guru."}, {"id": 29, "q": "In which year did Guru Har Krishan die?", "opts": ["1664", "1675", "1679", "1681"], "ans": 0, "exp": "The infographic gives 1664 as the year of Guru Har Krishan's death."}, {"id": 30, "q": "In which year was Guru Tegh Bahadur executed?", "opts": ["1664", "1675", "1679", "1707"], "ans": 1, "exp": "The infographic states that Guru Tegh Bahadur was executed in 1675."}, {"id": 31, "q": "Who was ordered to appear before Aurangzeb in the Sikh revolt section?", "opts": ["Guru Har Rai", "Guru Har Krishan", "Guru Tegh Bahadur", "Guru Gobind Singh"], "ans": 0, "exp": "The infographic says Aurangzeb ordered Guru Har Rai to appear before the court."}, {"id": 32, "q": "In which year did Aurangzeb occupy Marwar?", "opts": ["1669", "1678", "1687", "1701"], "ans": 1, "exp": "The Marwar section gives 1678 as the year Aurangzeb occupied Marwar."}, {"id": 33, "q": "Which ruler's mother supported Marwar?", "opts": ["Ajit Singh", "Rao Maldeo", "Jaswant Singh", "Rana Raj Singh"], "ans": 0, "exp": "The infographic says the mother of Ajit Singh belonged to Mewar and Mewar supported Marwar."}, {"id": 34, "q": "Who led the Mewar resistance mentioned in the infographic?", "opts": ["Rana Raj Singh", "Jaswant Singh", "Ajit Singh", "Durgadas Rathore"], "ans": 0, "exp": "Rana Raj Singh is listed as the Mewar ruler."}, {"id": 35, "q": "When did Marwar become independent according to the infographic?", "opts": ["1681–1687", "1687–1701", "1701–1707", "1678–1681"], "ans": 2, "exp": "The infographic states that Marwar became independent during 1701–1707."}, {"id": 36, "q": "Who was appointed Governor of Gujarat in the Marwar struggle section?", "opts": ["Rana Raj Singh", "Jaswant Singh", "Ajit Singh", "Prince Akbar"], "ans": 2, "exp": "Ajit Singh is listed as appointed Governor of Gujarat."}, {"id": 37, "q": "Who was appointed Governor of the Deccan?", "opts": ["Prince Akbar", "Ajit Singh", "Durgadas Rathore", "Jaswant Singh"], "ans": 0, "exp": "Prince Akbar is listed as appointed Governor of the Deccan."}, {"id": 38, "q": "Which prince revolted against Aurangzeb in 1681?", "opts": ["Prince Akbar", "Muazzam", "Azam Shah", "Kam Baksh"], "ans": 0, "exp": "The revolt of Prince Akbar is dated 1681."}, {"id": 39, "q": "Who was among the opponents of Prince Akbar?", "opts": ["Durgadas Rathore", "Gokul", "Guru Tegh Bahadur", "Mir Jumla"], "ans": 0, "exp": "Durgadas Rathore is named among the opponents."}, {"id": 40, "q": "Where did Prince Akbar flee after his defeat?", "opts": ["To Persia", "To Bengal", "To Kabul", "To Delhi"], "ans": 0, "exp": "The infographic says he later fled to Persia."}, {"id": 41, "q": "Who led the Mughal campaign against Assam?", "opts": ["Mir Jumla", "Fateh Khan", "Abul Hasan", "Abdullah Pani"], "ans": 0, "exp": "Mir Jumla led the Mughal campaign against Assam."}, {"id": 42, "q": "In which years did the Assam campaign take place?", "opts": ["1636–1644", "1661–1663", "1686–1687", "1701–1707"], "ans": 1, "exp": "The infographic dates the Assam campaign to 1661–1663."}, {"id": 43, "q": "Who became Governor of Assam after Mir Jumla's death?", "opts": ["His son", "Aurangzeb", "Abul Hasan", "Bahadur Khan"], "ans": 0, "exp": "The infographic states that Mir Jumla's son became Governor of Assam."}, {"id": 44, "q": "In which year did Assam become independent, according to the infographic?", "opts": ["1663", "1670", "1687", "1700"], "ans": 1, "exp": "The infographic gives 1670 as the year Assam became independent."}, {"id": 45, "q": "In which year did Aurangzeb conquer Bijapur?", "opts": ["1656", "1686", "1687", "1707"], "ans": 1, "exp": "The Bijapur campaign is dated 1686."}, {"id": 46, "q": "Who was the ruler of Bijapur at the time of its conquest?", "opts": ["Abul Hasan Qutb Shah", "Sikandar Adil Shah", "Abdullah Pani", "Ali Adil Shah"], "ans": 1, "exp": "Sikandar Adil Shah is named as the ruler of Bijapur."}, {"id": 47, "q": "Who was appointed Governor of Bijapur and the Maratha region?", "opts": ["Bahadur Khan", "Mir Jumla", "Fateh Khan", "Durgadas Rathore"], "ans": 0, "exp": "Bahadur Khan was appointed Governor of Bijapur and the Maratha region."}, {"id": 48, "q": "In which year did Aurangzeb conquer Golconda?", "opts": ["1686", "1687", "1669", "1707"], "ans": 1, "exp": "The Golconda campaign is dated 1687."}, {"id": 49, "q": "Who was the ruler of Golconda during its conquest?", "opts": ["Sikandar Adil Shah", "Abul Hasan Qutb Shah", "Abdullah Pani", "Fateh Khan"], "ans": 1, "exp": "Abul Hasan Qutb Shah was the ruler of Golconda."}, {"id": 50, "q": "Who is identified as a traitor in the Golconda campaign section?", "opts": ["Abdullah Pani", "Bahadur Khan", "Mir Jumla", "Durgadas Rathore"], "ans": 0, "exp": "The infographic names Abdullah Pani as the traitor."}, {"id": 51, "q": "How many provinces did the Mughal Empire have during Aurangzeb's reign, according to the infographic?", "opts": ["12", "15", "21", "25"], "ans": 2, "exp": "The infographic lists 21 provinces."}, {"id": 52, "q": "Who established the Bayt-ul-Ulum Library?", "opts": ["Zeb-un-Nissa", "Jahanara Begum", "Dilras Banu Begum", "Roshanara Begum"], "ans": 0, "exp": "Zeb-un-Nissa is credited with establishing the Bayt-ul-Ulum Library."}, {"id": 53, "q": "What percentage of mansabdars were Hindus during Aurangzeb's reign, according to the infographic?", "opts": ["10%", "21%", "33%", "50%"], "ans": 2, "exp": "The infographic states that 33% of the mansabdars were Hindus."}, {"id": 54, "q": "Which three foreign travellers are listed for Aurangzeb's reign?", "opts": ["Tavernier, Manucci and John Fryer", "Hawkins, Roe and Edward Terry", "Bernier, Megasthenes and Fa-Hien", "Ibn Battuta, Al-Biruni and Marco Polo"], "ans": 0, "exp": "The travellers listed are Jean-Baptiste Tavernier (France), Niccolao Manucci (Italy) and John Fryer (Britain)."}, {"id": 55, "q": "In which year did Aurangzeb die?", "opts": ["1687", "1701", "1707", "1712"], "ans": 2, "exp": "Aurangzeb died in 1707."}, {"id": 56, "q": "Where is Aurangzeb's tomb located?", "opts": ["Agra", "Delhi", "Khuldabad, Aurangabad", "Lahore"], "ans": 2, "exp": "The infographic locates his tomb at Khuldabad, Aurangabad, Maharashtra."}],KEY='aurangzeb_page20_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
