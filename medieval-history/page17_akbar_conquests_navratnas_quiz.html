:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

const questions=[{"id": 1, "q": "In which year did Akbar conquer Malwa?", "opts": ["1556", "1561", "1567", "1572"], "ans": 1, "exp": "Akbar conquered Malwa in 1561; Baz Bahadur was its ruler."}, {"id": 2, "q": "Who was the ruler of Malwa during Akbar's 1561 campaign?", "opts": ["Rana Udai Singh", "Baz Bahadur", "Raja Bharmal", "Daud Khan"], "ans": 1, "exp": "Baz Bahadur was the ruler of Malwa when Akbar conquered it."}, {"id": 3, "q": "What happened during the Amer campaign of 1562?", "opts": ["Akbar conquered Chittor", "Akbar formed an alliance with Amer", "Akbar conquered Bengal", "Akbar invaded Mewar"], "ans": 1, "exp": "In 1562, Akbar formed an alliance with Amer."}, {"id": 4, "q": "Who was the ruler of Amer associated with Akbar's alliance?", "opts": ["Raja Bharmal", "Rana Udai Singh", "Rao Surjan Hada", "Raja Kalyanmal"], "ans": 0, "exp": "Raja Bharmal, also called Bihari Mal, was the ruler of Amer."}, {"id": 5, "q": "In which year did Akbar conquer Merta?", "opts": ["1561", "1562", "1567", "1568"], "ans": 1, "exp": "Akbar conquered Merta in 1562."}, {"id": 6, "q": "Which region did Akbar invade in 1567?", "opts": ["Marwar", "Mewar", "Gondwana", "Gujarat"], "ans": 1, "exp": "The infographic dates Akbar's invasion of Mewar to 1567."}, {"id": 7, "q": "Who were the defenders of Chittor named in the infographic?", "opts": ["Jaita and Kumpa", "Jaimall and Patta", "Hakim Khan Sur and Jhala Maan", "Man Singh and Asaf Khan"], "ans": 1, "exp": "Jaimall and Patta are listed as defenders of Chittor."}, {"id": 8, "q": "What did Akbar order after capturing Chittor?", "opts": ["Construction of Fatehpur Sikri", "Preparation of the Fathnama-i-Chittor", "Abolition of jizya", "Construction of Humayun's Tomb"], "ans": 1, "exp": "The infographic notes that Akbar ordered the preparation of the Fathnama-i-Chittor."}, {"id": 9, "q": "Who was the ruler of Gondwana during Akbar's campaign?", "opts": ["Rani Durgavati", "Rani Roopmati", "Rani Karnavati", "Jodha Bai"], "ans": 0, "exp": "Rani Durgavati ruled Gondwana; her husband was Dalpat Shah."}, {"id": 10, "q": "Who was the son of Rani Durgavati and Dalpat Shah?", "opts": ["Veer Narayan", "Man Singh", "Bhagwant Das", "Raja Ramchandra"], "ans": 0, "exp": "Their son was Veer Narayan."}, {"id": 11, "q": "Who was the ruler associated with the Kalinjar campaign of 1569?", "opts": ["Raja Ramchandra", "Rao Surjan Hada", "Baz Bahadur", "Rana Udai Singh"], "ans": 0, "exp": "Raja Ramchandra is listed as the ruler in the Kalinjar campaign."}, {"id": 12, "q": "Which places are listed under the Marwar campaign of 1570?", "opts": ["Ajmer and Nagaur", "Jaisalmer and Bikaner", "Agra and Delhi", "Kabul and Kandahar"], "ans": 1, "exp": "The infographic lists Jaisalmer and Bikaner for the Marwar campaign."}, {"id": 13, "q": "Why was Akbar's Gujarat campaign called the Lightning Campaign?", "opts": ["It lasted 43 days", "It lasted 4 years", "It was fought only at night", "It involved only naval forces"], "ans": 0, "exp": "The infographic says Akbar completed the campaign in 43 days, covering about 450 miles."}, {"id": 14, "q": "Which building did Akbar build to commemorate his Gujarat victory?", "opts": ["Buland Darwaza", "Charminar", "Qutub Minar", "Tomb of Sher Shah"], "ans": 0, "exp": "Akbar built the Buland Darwaza to commemorate the Gujarat victory."}, {"id": 15, "q": "Who were the two governors appointed in the Gujarat section?", "opts": ["Mirza Aziz Koka and Mirza Khan (Khan-i-Azam)", "Adham Khan and Abdullah Uzbek", "Man Singh and Sultan Khan", "Abdur Rahim and Bairam Khan"], "ans": 0, "exp": "The infographic lists Mirza Aziz Koka and Mirza Khan (Khan-i-Azam)."}, {"id": 16, "q": "Who was the ruler of Bengal during Akbar's 1576 campaign?", "opts": ["Daud Khan", "Jani Beg", "Baz Bahadur", "Raja Bharmal"], "ans": 0, "exp": "The Bengal campaign is dated 1576 and names Daud Khan as ruler."}, {"id": 17, "q": "Who was appointed governor after the conquest of Kashmir?", "opts": ["Man Singh", "Abdur Rahim Khan-i-Khanan", "Asaf Khan", "Sultan Khan"], "ans": 0, "exp": "Man Singh is listed as the appointed governor of Kashmir."}, {"id": 18, "q": "In which year did Akbar conquer Sindh?", "opts": ["1586", "1591", "1600", "1601"], "ans": 1, "exp": "Akbar conquered Sindh in 1591; Jani Beg was its ruler."}, {"id": 19, "q": "Which regions were conquered in Akbar's Deccan campaign of 1600?", "opts": ["Ahmednagar and Bijapur", "Gujarat and Malwa", "Bengal and Kashmir", "Kabul and Kandahar"], "ans": 0, "exp": "The infographic says Akbar conquered Ahmednagar and Bijapur in 1600; Chand Bibi is named as ruler and is noted as having committed suicide."}, {"id": 20, "q": "Which fort did Akbar conquer in 1601?", "opts": ["Ranthambore", "Asirgarh", "Chunar", "Kalinjar"], "ans": 1, "exp": "Akbar conquered Asirgarh Fort in 1601."}, {"id": 21, "q": "When did Akbar die?", "opts": ["6 January 1601", "25 October 1605", "18 June 1576", "15 October 1542"], "ans": 1, "exp": "Akbar died on 25 October 1605."}, {"id": 22, "q": "Where is Akbar's tomb located?", "opts": ["Delhi", "Sikandra, Agra", "Fatehpur Sikri", "Sasaram"], "ans": 1, "exp": "Akbar's tomb is at Sikandra near Agra."}, {"id": 23, "q": "Who wrote Akbarnama?", "opts": ["Faizi", "Abul Fazl", "Raja Todar Mal", "Abdur Rahim Khan-i-Khanan"], "ans": 1, "exp": "Abul Fazl, son of Sheikh Mubarak Nagauri, wrote Akbarnama."}, {"id": 24, "q": "How many volumes does Akbarnama have, and what is its third part called?", "opts": ["3 volumes; Ain-i-Akbari", "7 volumes; Ain-i-Akbari", "5 volumes; Baburnama", "2 volumes; Humayun-nama"], "ans": 1, "exp": "The infographic describes Akbarnama as having seven volumes and identifies Ain-i-Akbari as its third part."}, {"id": 25, "q": "Who introduced the Dahsala revenue system?", "opts": ["Birbal", "Raja Todar Mal", "Faizi", "Tansen"], "ans": 1, "exp": "Raja Todar Mal, Akbar's finance minister, introduced the Dahsala revenue system."}, {"id": 26, "q": "Which land-measurement unit is listed with Raja Todar Mal?", "opts": ["Jari made of bamboo", "Gaz-i-Ilahi", "Bigha of stone", "Dakh"], "ans": 0, "exp": "The infographic lists a bamboo measuring rod called Jari, with a length of 33 inches."}, {"id": 27, "q": "Who was Akbar's court musician whose childhood name was Ramtanu Pandey?", "opts": ["Birbal", "Tansen", "Faizi", "Mulla Do Pyaza"], "ans": 1, "exp": "Tansen's childhood name was Ramtanu Pandey; he was known as Swami Haridas's disciple and received the title Mian."}, {"id": 28, "q": "Which musical instrument is listed with Tansen?", "opts": ["Rabab", "Sitar", "Tabla", "Veena"], "ans": 0, "exp": "The infographic lists the Rabab as Tansen's musical instrument."}, {"id": 29, "q": "Who was considered Birbal's rival?", "opts": ["Mulla Do Pyaza", "Fakir Aziao-din", "Raja Man Singh", "Tansen"], "ans": 0, "exp": "Mulla Do Pyaza is described in the infographic as Birbal's rival."}, {"id": 30, "q": "Who was the minister for religious affairs?", "opts": ["Fakir Aziao-din", "Raja Todar Mal", "Tansen", "Abul Fazl"], "ans": 0, "exp": "Fakir Aziao-din is listed as the minister for religious affairs."}, {"id": 31, "q": "What was the date of the Battle of Haldighati shown in the infographic?", "opts": ["18 June 1576", "18 June 1568", "6 January 1601", "25 October 1605"], "ans": 0, "exp": "The Battle of Haldighati is dated 18 June 1576 in the infographic."}, {"id": 32, "q": "Who commanded the Mughal army at the Battle of Haldighati according to the infographic?", "opts": ["Sultan Khan", "Man Singh", "Asaf Khan", "Adham Khan"], "ans": 0, "exp": "Sultan Khan is shown as the Mughal commander in this infographic."}, {"id": 33, "q": "Which of the following was listed among the Mewar army at Haldighati?", "opts": ["Hakim Khan Sur", "Abdullah Uzbek", "Mirza Aziz Koka", "Daud Khan"], "ans": 0, "exp": "Hakim Khan Sur is listed among the Mewar army alongside Bhil forces, Rana Punja and Jhala Maan."}, {"id": 34, "q": "What was the result of the Battle of Haldighati according to the infographic?", "opts": ["Mewar victory", "Mughal victory", "Decisive victory for the Afghans", "A peace treaty"], "ans": 1, "exp": "The infographic records a Mughal victory and names Sultan Khan as the Mughal commander."}, {"id": 35, "q": "Which battle is called the Marathon of Mewar in the infographic?", "opts": ["Battle of Dewair", "Battle of Haldighati", "Battle of Chittor", "Battle of Samel"], "ans": 0, "exp": "The Battle of Dewair in 1582 is described as the Marathon of Mewar."}],KEY='akbar_page17_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
