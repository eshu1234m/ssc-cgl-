nd famine alone"], "ans": 0, "exp": "The four listed causes are religious policy, nobles (Umra), religious and economic tensions, and Maratha conflict."}, {"id": 10, "q": "When was the War of Jajau fought?", "opts": ["June 1707", "January 1709", "February 1739", "June 1658"], "ans": 0, "exp": "The War of Jajau is dated June 1707."}, {"id": 11, "q": "Who fought against Muazzam in the War of Jajau?", "opts": ["Kam Baksh and Jahandar Shah", "Azam Shah", "Farrukhsiyar and Rafi-us-Shan", "Nadir Shah"], "ans": 1, "exp": "Muazzam fought Azam Shah at Jajau and emerged victorious."}, {"id": 12, "q": "Who won the War of Jajau?", "opts": ["Azam Shah", "Kam Baksh", "Muazzam", "Jahandar Shah"], "ans": 2, "exp": "Muazzam was victorious in the War of Jajau."}, {"id": 13, "q": "In which year did Bahadur Shah defeat Kam Baksh?", "opts": ["1707", "1709", "1712", "1717"], "ans": 1, "exp": "Bahadur Shah defeated Kam Baksh in 1709."}, {"id": 14, "q": "What was the result of the War of Jajau?", "opts": ["Azam Shah became emperor", "Muazzam was victorious", "Kam Baksh captured Delhi", "The Mughal Empire ended"], "ans": 1, "exp": "The infographic records Muazzam as the victor."}, {"id": 15, "q": "Which title did Bahadur Shah give to Juviyana?", "opts": ["Bibi", "Padshah Begum", "Shah-e-Bekhabar", "Begum Sahib"], "ans": 0, "exp": "The infographic states that Bahadur Shah gave Juviyana the title 'Bibi'."}, {"id": 16, "q": "How many sons of Bahadur Shah I are listed?", "opts": ["Two", "Three", "Four", "Five"], "ans": 2, "exp": "The four sons listed are Jahandar Shah, Azim-us-Shan, Rafi-us-Shan and Jahan Shah."}, {"id": 17, "q": "Who was the first of Bahadur Shah I's four sons listed in the infographic?", "opts": ["Jahandar Shah", "Azim-us-Shan", "Rafi-us-Shan", "Jahan Shah"], "ans": 0, "exp": "Jahandar Shah is listed first among Bahadur Shah I's four sons."}, {"id": 18, "q": "What happened during Bahadur Shah I's reign that contributed to the decline of the Mughal Empire?", "opts": ["The background for the decline was created", "The empire expanded to all of India", "The capital shifted to Calcutta", "The British took over Delhi"], "ans": 0, "exp": "The infographic says the background for the Mughal Empire's decline was created during his reign."}, {"id": 19, "q": "What was Jahandar Shah's reign?", "opts": ["1707–1712 AD", "1712–1713 AD", "1713–1719 AD", "1719–1748 AD"], "ans": 1, "exp": "Jahandar Shah ruled from 1712 to 1713 AD."}, {"id": 20, "q": "Which tax did Jahandar Shah end?", "opts": ["Jizya tax", "Zakat", "Chauth", "Pilgrimage tax"], "ans": 0, "exp": "The infographic states that Jahandar Shah ended the Jizya tax."}, {"id": 21, "q": "What was Jahandar Shah's nickname?", "opts": ["Shah-e-Bekhabar", "Lammat Murkh (Foolish Ruler)", "Rangeela", "Zinda Pir"], "ans": 1, "exp": "His nickname is given as Lammat Murkh, meaning Foolish Ruler."}, {"id": 22, "q": "Who was the Wazir of Jahandar Shah?", "opts": ["Zulfiqar Khan", "Abdullah Khan", "Husain Ali", "Nizam-ul-Mulk"], "ans": 0, "exp": "Zulfiqar Khan was Jahandar Shah's Wazir."}, {"id": 23, "q": "With whom was Jahandar Shah closely associated?", "opts": ["Lal Kunwar", "Nur Jahan", "Mumtaz Mahal", "Jahanara Begum"], "ans": 0, "exp": "The infographic notes his close association with Lal Kunwar, also called Imtiyaz Mahal."}, {"id": 24, "q": "What was Farrukhsiyar's reign?", "opts": ["1712–1713 AD", "1713–1719 AD", "1719–1748 AD", "1748–1754 AD"], "ans": 1, "exp": "Farrukhsiyar ruled from 1713 to 1719 AD."}, {"id": 25, "q": "What nickname is given to Farrukhsiyar?", "opts": ["Foolish Ruler", "Disguising Ruler", "Rangeela", "Shah-e-Bekhabar"], "ans": 1, "exp": "The infographic calls Farrukhsiyar the 'Disguising Ruler'."}, {"id": 26, "q": "Which British delegation arrived in India during Farrukhsiyar's reign?", "opts": ["John Surman and Dr. Hamilton", "William Hawkins and Edward Terry", "Thomas Roe and Paul Canning", "Tavernier and Manucci"], "ans": 0, "exp": "The delegation listed consists of John Surman and Dr. Hamilton."}, {"id": 27, "q": "In which year did Farrukhsiyar issue the famous Farman?", "opts": ["1600", "1615", "1717", "1739"], "ans": 2, "exp": "Farrukhsiyar issued the famous Farman in 1717."}, {"id": 28, "q": "The Farman of 1717 is often called what in the infographic?", "opts": ["Magna Carta of the East India Company", "Treaty of Allahabad", "Charter of the Mughal Empire", "Permanent Settlement"], "ans": 0, "exp": "It is described as the Magna Carta of the East India Company."}, {"id": 29, "q": "Which regions were granted duty-free trade under the Farman of 1717?", "opts": ["Bengal, Bihar and Odisha", "Punjab, Sindh and Kashmir", "Gujarat, Malwa and Mewar", "Delhi, Agra and Lahore"], "ans": 0, "exp": "The infographic lists Bengal, Bihar and Odisha."}, {"id": 30, "q": "Who were the Sayyid Brothers?", "opts": ["Husain Ali and Abdullah Khan", "John Surman and Dr. Hamilton", "Nizam-ul-Mulk and Saadat Khan", "Azam Shah and Kam Baksh"], "ans": 0, "exp": "The Sayyid Brothers were Husain Ali and Abdullah Khan, known as king-makers."}, {"id": 31, "q": "Which region was Husain Ali governor of?", "opts": ["Deccan and Patna", "Awadh and Allahabad", "Bengal and Bihar", "Delhi and Agra"], "ans": 0, "exp": "Husain Ali is listed as Governor of the Deccan and Patna."}, {"id": 32, "q": "Which offices did Abdullah Khan hold according to the infographic?", "opts": ["Governor (Wazir) and Governor of Allahabad", "Governor of Deccan and Patna", "Governor of Bengal and Bihar", "Governor of Gujarat and Malwa"], "ans": 0, "exp": "Abdullah Khan is listed as Governor (Wazir) and Governor of Allahabad."}, {"id": 33, "q": "How did Farrukhsiyar die?", "opts": ["He was killed by the Sayyid Brothers", "He died in battle against Nadir Shah", "He was exiled to Rangoon", "He was defeated at Jajau"], "ans": 0, "exp": "The infographic states that Farrukhsiyar was killed by the Sayyid Brothers."}, {"id": 34, "q": "Who was Rafi-ud-Darajat?", "opts": ["Son of Rafi-us-Shan and grandson of Bahadur Shah I", "Son of Farrukhsiyar", "Brother of Nadir Shah", "Son of Muhammad Shah"], "ans": 0, "exp": "Rafi-ud-Darajat is described as the son of Rafi-us-Shan and grandson of Bahadur Shah I."}, {"id": 35, "q": "How long did Rafi-ud-Darajat rule?", "opts": ["Three months", "Three years", "Six months", "One year"], "ans": 0, "exp": "The infographic states that he ruled for three months in 1719."}, {"id": 36, "q": "By what other name was Rafi-ud-Daulah known?", "opts": ["Shah Jahan II", "Shah Alam I", "Alamgir II", "Bahadur Shah II"], "ans": 0, "exp": "Rafi-ud-Daulah was also known as Shah Jahan II."}, {"id": 37, "q": "What was Muhammad Shah's nickname?", "opts": ["Rangeela", "Zinda Pir", "Shah-e-Bekhabar", "Lammat Murkh"], "ans": 0, "exp": "Muhammad Shah (1719–1748) was known as Rangeela."}, {"id": 38, "q": "Which state became independent in 1724 during Muhammad Shah's reign?", "opts": ["Hyderabad", "Awadh", "Bengal", "Bharatpur"], "ans": 0, "exp": "Hyderabad became independent in 1724; its founder was Nizam-ul-Mulk (Chin Qilich Khan)."}, {"id": 39, "q": "Who founded Awadh as an independent state according to the infographic?", "opts": ["Saadat Khan (Burhan-ul-Mulk)", "Nizam-ul-Mulk", "Murshid Quli Khan", "Abdullah Khan"], "ans": 0, "exp": "Saadat Khan (Burhan-ul-Mulk) is named as the founder of Awadh."}, {"id": 40, "q": "Who founded Bengal as an independent state according to the infographic?", "opts": ["Murshid Quli Khan", "Saadat Khan", "Nizam-ul-Mulk", "Husain Ali"], "ans": 0, "exp": "Murshid Quli Khan is named as the founder of Bengal."}, {"id": 41, "q": "Which state is identified as a Jat state in the infographic?", "opts": ["Bharatpur (Mathura)", "Hyderabad", "Awadh", "Bengal"], "ans": 0, "exp": "Bharatpur (Mathura) is identified as a Jat state."}, {"id": 42, "q": "Who invaded Delhi in 1739?", "opts": ["Ahmad Shah Abdali", "Nadir Shah", "Babur", "Timur"], "ans": 1, "exp": "Nadir Shah invaded Delhi in 1739."}, {"id": 43, "q": "On what date was the Battle of Karn
