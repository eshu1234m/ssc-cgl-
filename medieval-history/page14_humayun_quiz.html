:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

were assigned to Kamran?", "opts": ["Agra and Delhi", "Kabul and Kandahar", "Mewat and Sambhal", "Gujarat and Malwa"], "ans": 1, "exp": "Kamran received Kabul and Kandahar."}, {"id": 10, "q": "What did Humayun conquer in the Kalinjar campaign of 1531?", "opts": ["Kalinjar", "Chittor", "Raisen", "Chunar"], "ans": 0, "exp": "The Kalinjar campaign of 1531 was successful, according to the infographic."}, {"id": 11, "q": "Who was the ruler of Kalinjar during Humayun's 1531 campaign?", "opts": ["Rani Karnavati", "Pratap Rudra Dev", "Raja Man Singh", "Vikramaditya"], "ans": 1, "exp": "Pratap Rudra Dev is identified as the ruler of Kalinjar."}, {"id": 12, "q": "In which year did Bahadur Shah conquer Malwa?", "opts": ["1531", "1532", "1533", "1535"], "ans": 0, "exp": "The infographic lists Bahadur Shah's conquest of Malwa in 1531."}, {"id": 13, "q": "Which fort did Bahadur Shah capture in 1532?", "opts": ["Chunar Fort", "Raisen Fort", "Kalinjar Fort", "Agra Fort"], "ans": 1, "exp": "Bahadur Shah captured Raisen Fort in 1532."}, {"id": 14, "q": "Who was appointed governor of Gujarat by Humayun?", "opts": ["Hindal", "Kamran", "Askari", "Akbar"], "ans": 2, "exp": "Humayun appointed his brother Askari as governor of Gujarat."}, {"id": 15, "q": "What was the result of Humayun's Dadra campaign in 1532?", "opts": ["Defeat", "Successful", "Inconclusive", "Peace treaty without a campaign"], "ans": 1, "exp": "The infographic records the Dadra campaign as successful for Humayun."}, {"id": 16, "q": "Which city did Humayun found in 1533?", "opts": ["Fatehpur Sikri", "Dinpanah", "Jannatabad", "Agra"], "ans": 1, "exp": "Humayun founded the city of Dinpanah in 1533."}, {"id": 17, "q": "In which year did Humayun conquer Gujarat?", "opts": ["1531", "1533", "1535", "1537"], "ans": 2, "exp": "The infographic dates Humayun's conquest of Gujarat to 1535."}, {"id": 18, "q": "What happened during the Bengal campaign while Humayun was away?", "opts": ["Askari declared himself emperor", "Hindal killed Sheikh Bahlol and declared himself Emperor of Delhi", "Kamran captured Agra", "Akbar became governor of Bengal"], "ans": 1, "exp": "The infographic states that Hindal killed Sheikh Bahlol and declared himself Emperor of Delhi."}, {"id": 19, "q": "How long did Humayun besiege Chunar Fort during Sher Shah's campaign?", "opts": ["Two months", "Four months", "Six months", "One year"], "ans": 2, "exp": "The infographic says Humayun besieged Chunar Fort for six months, but Sher Shah escaped."}, {"id": 20, "q": "When was the Battle of Chausa fought?", "opts": ["26 June 1539", "17 May 1540", "16 March 1527", "6 May 1529"], "ans": 0, "exp": "The Battle of Chausa took place on 26 June 1539."}, {"id": 21, "q": "Where was the Battle of Chausa fought?", "opts": ["Between the Karmanasa River and the Ganga River", "Near the Yamuna and Chambal rivers", "On the banks of the Indus", "Near the Ravi and Sutlej rivers"], "ans": 0, "exp": "The infographic locates the battle between the Karmanasa and Ganga rivers."}, {"id": 22, "q": "Which title did Sher Shah assume after his victory at Chausa?", "opts": ["Ghazi", "Sher Shah", "Padshah", "Qalandar"], "ans": 1, "exp": "After the victory at Chausa, Sher Shah assumed the title Sher Shah."}, {"id": 23, "q": "When was the Battle of Kannauj (Bilgram) fought?", "opts": ["26 June 1539", "17 May 1540", "18 May 1541", "22 June 1555"], "ans": 1, "exp": "The Battle of Kannauj, also called Bilgram, was fought on 17 May 1540."}, {"id": 24, "q": "Who founded the Second Afghan Empire (Sur Dynasty)?", "opts": ["Bahlol Lodi", "Sher Shah Suri", "Ibrahim Lodi", "Sikandar Shah Suri"], "ans": 1, "exp": "Sher Shah Suri founded the Second Afghan Empire, also known as the Sur Dynasty."}, {"id": 25, "q": "In which year did Humayun marry Hamida Banu Begum?", "opts": ["1535", "1540", "1541", "1555"], "ans": 2, "exp": "The infographic gives 1541 as the year of Humayun's marriage to Hamida Banu Begum."}, {"id": 26, "q": "In which year did Humayun reconquer Kabul and Kandahar from Askari and Kamran?", "opts": ["1540", "1545", "1555", "1556"], "ans": 1, "exp": "Humayun reconquered Kabul and Kandahar in 1545."}, {"id": 27, "q": "Who were Humayun's opponents in the Battle of Machhiwara (1555)?", "opts": ["Sher Shah and Humayun", "Sikandar Shah Suri and forces led by Bairam Khan", "Rana Sanga and Ibrahim Lodi", "Bahadur Shah and Mahmud Lodi"], "ans": 1, "exp": "The infographic lists Sikandar Shah Suri and forces led by Bairam Khan among the opponents."}, {"id": 28, "q": "What happened after the Battle of Sirhind in 1555?", "opts": ["Humayun lost Kabul", "Humayun won and regained Delhi", "Sher Shah regained Bengal", "Akbar became emperor immediately"], "ans": 1, "exp": "Humayun's victory at Sirhind enabled him to regain Delhi."}, {"id": 29, "q": "How did Humayun die in 1556?", "opts": ["In battle at Panipat", "After falling from the stairs of Dinpanah Library", "From a throat disease", "During the siege of Chittor"], "ans": 1, "exp": "The infographic says Humayun died after falling from the stairs of the Dinpanah Library."}, {"id": 30, "q": "Who wrote Humayun-nama?", "opts": ["Gulbadan Begum", "Hamida Banu Begum", "Maham Begum", "Rani Karnavati"], "ans": 0, "exp": "Gulbadan Begum wrote Humayun-nama, which is shown as being in Persian."}, {"id": 31, "q": "Which of the following painters is listed as active during Humayun's reign?", "opts": ["Mir Sayyid Ali", "Abul Fazl", "Tansen", "Bairam Khan"], "ans": 0, "exp": "Mir Sayyid Ali is one of the painters listed, alongside Yusuf, Abdus Samad and Khwaja Musavvir."}, {"id": 32, "q": "Who built Humayun's Tomb?", "opts": ["Mirak Mirza Ghiyas", "Ustad Ahmad Lahori", "Haji Begum", "Shah Jahan"], "ans": 2, "exp": "The infographic says Humayun's Tomb was built by Haji Begum; Mirak Mirza Ghiyas is named as its architect."}, {"id": 33, "q": "In which city is Humayun's Tomb located?", "opts": ["Agra", "Delhi", "Kabul", "Lahore"], "ans": 1, "exp": "Humayun's Tomb is located in Delhi."}, {"id": 34, "q": "During which period was Humayun's Tomb constructed?", "opts": ["1530–1540", "1555–1556", "1566–1572", "1605–1627"], "ans": 2, "exp": "The infographic gives the construction period as 1566–1572."}, {"id": 35, "q": "Which architectural feature is associated with Humayun's Tomb in the infographic?", "opts": ["First garden tomb in India", "First stone fort in India", "First Mughal mosque in India", "First minaret in Delhi"], "ans": 0, "exp": "The infographic describes it as the first garden tomb in India and a model that inspired the Taj Mahal."}],KEY='humayun_page14_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
