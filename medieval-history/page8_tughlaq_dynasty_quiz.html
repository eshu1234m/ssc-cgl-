<script>
const questions=[{"id": 1, "q": "Who founded the Tughlaq Dynasty?", "opts": ["Muhammad bin Tughlaq", "Ghiyasuddin Tughlaq", "Firoz Shah Tughlaq", "Ghazi Malik"], "ans": 1, "exp": "Ghiyasuddin Tughlaq, also known as Ghazi Malik, founded the Tughlaq Dynasty."}, {"id": 2, "q": "During which period did Ghiyasuddin Tughlaq rule?", "opts": ["1320–1325 AD", "1325–1351 AD", "1351–1388 AD", "1316–1320 AD"], "ans": 0, "exp": "The infographic gives his reign as 1320–1325 AD."}, {"id": 3, "q": "What was Malik Kafur's action after Alauddin Khilji's death, according to the infographic?", "opts": ["He founded the Tughlaq Dynasty", "He occupied the throne for 36 days", "He became governor of Bengal", "He married Deval Rani"], "ans": 1, "exp": "The infographic says Malik Kafur occupied the throne for 36 days after Alauddin Khilji's death."}, {"id": 4, "q": "Who became ruler after Malik Kafur?", "opts": ["Mubarak Shah Khilji", "Khusrav Khan", "Ghiyasuddin Tughlaq", "Muhammad bin Tughlaq"], "ans": 0, "exp": "Mubarak Shah Khilji became ruler after Malik Kafur."}, {"id": 5, "q": "Mubarak Shah Khilji ruled during which period?", "opts": ["1296–1316 AD", "1316–1320 AD", "1320–1325 AD", "1325–1351 AD"], "ans": 1, "exp": "The page gives Mubarak Shah Khilji's reign as 1316–1320 AD."}, {"id": 6, "q": "Mubarak Shah Khilji was the son of whom?", "opts": ["Jalaluddin Khilji", "Alauddin Khilji", "Malik Kafur", "Ghiyasuddin Tughlaq"], "ans": 1, "exp": "Mubarak Shah is identified as the son of Alauddin Khilji."}, {"id": 7, "q": "At what age did Mubarak Shah Khilji succeed to the throne?", "opts": ["16 years", "18 years", "20 years", "22 years"], "ans": 1, "exp": "The infographic states that he succeeded to the throne at 18 years of age."}, {"id": 8, "q": "Whom did Mubarak Shah Khilji marry?", "opts": ["Razia Sultan", "Deval Rani", "Turkan Begum", "Rani Padmini"], "ans": 1, "exp": "The infographic names Deval Rani as Mubarak Shah's wife."}, {"id": 9, "q": "Whom did Mubarak Shah appoint as his favourite?", "opts": ["Ghazi Malik", "Khusrav Khan (Mubarak Hasan)", "Malik Kafur", "Qutlugh Khan"], "ans": 1, "exp": "Khusrav Khan, also called Mubarak Hasan, was appointed as his favourite."}, {"id": 10, "q": "How long did Khusrav Khan rule after causing Mubarak Shah Khilji's death?", "opts": ["36 days", "4.5 months", "8 months", "2 years"], "ans": 1, "exp": "The infographic says Khusrav Khan ruled for 4.5 months."}, {"id": 11, "q": "Khusrav Khan is described as the last ruler of which dynasty?", "opts": ["Slave Dynasty", "Khilji Dynasty", "Tughlaq Dynasty", "Sayyid Dynasty"], "ans": 1, "exp": "The infographic says Khusrav Khan ruled for 4.5 months after Mubarak Shah Khilji's death."}, {"id": 12, "q": "What was the immediate reason given for the revolt against Khusrav Khan?", "opts": ["His marriage with Deval Rani", "His appointment of Malik Kafur", "His conversion/marriage involving Deval Rani", "His attack on Bengal"], "ans": 2, "exp": "The infographic lists his marriage with Deval Rani as the reason for the revolt."}, {"id": 13, "q": "According to the infographic, what event triggered the revolt against Khusrav Khan?", "opts": ["His marriage with Deval Rani", "His appointment as Governor of Dipalpur", "His attack on Warangal", "His alliance with the Mongols"], "ans": 0, "exp": "The infographic lists his marriage with Deval Rani as the reason for the revolt."}, {"id": 14, "q": "What was Ghazi Malik's position before the revolt?", "opts": ["Governor of Dipalpur", "Governor of Multan", "Governor of Bengal", "Governor of Samana"], "ans": 0, "exp": "He is identified as the Governor of Dipalpur in Punjab."}, {"id": 15, "q": "Which book is associated with Marco Polo?", "opts": ["The Travels of Marco Polo", "Tughlaqnama", "Kitab-ul-Rehla", "Futuhat-i-Firoz Shahi"], "ans": 0, "exp": "His book is titled The Travels of Marco Polo."}, {"id": 16, "q": "What administrative policy did Ghiyasuddin Tughlaq adopt after ascending the throne?", "opts": ["Blood and Iron", "Policy of Moderation (Rasm-i-Miyan)", "Divide and Rule", "Market-control policy"], "ans": 1, "exp": "The infographic calls his policy the Policy of Moderation, or Rasm-i-Miyan."}, {"id": 17, "q": "Which measures are listed as features of Ghiyasuddin Tughlaq's administrative policy?", "opts": ["Relief during famine, reduction of taxes and construction of canals", "Higher taxes, forced migration and market control", "Abolition of land revenue and army reforms only", "Expansion of trade and naval reforms"], "ans": 0, "exp": "The page lists famine relief, tax reduction and canal construction as main features."}, {"id": 18, "q": "Which work by Amir Khusro is listed among the historical sources?", "opts": ["Tughlaqnama", "Khaza'in-ul-Futuh", "Kitab-ul-Rehla", "Futuhat-i-Firoz Shahi"], "ans": 1, "exp": "Khaza'in-ul-Futuh is attributed to Amir Khusro in the infographic."}, {"id": 19, "q": "Who wrote Kitab-ul-Rehla?", "opts": ["Amir Khusro", "Ibn Battuta", "Isami", "Firoz Shah Tughlaq"], "ans": 1, "exp": "The infographic attributes Kitab-ul-Rehla to Ibn Battuta."}, {"id": 20, "q": "Who wrote Futuh-us-Salatin?", "opts": ["Isami", "Yahya bin Ahmad Sirhindi", "Amir Hasan Sijzi", "Ibn Battuta"], "ans": 0, "exp": "Futuh-us-Salatin is attributed to Isami."}, {"id": 21, "q": "Who wrote Tarikh-i-Mubarak Shahi?", "opts": ["Ibn Battuta", "Yahya bin Ahmad Sirhindi", "Isami", "Amir Khusro"], "ans": 1, "exp": "The work is attributed to Yahya bin Ahmad Sirhindi."}, {"id": 22, "q": "After defeating how many Mongol invasions did Ghiyasuddin Tughlaq assume the title Ghazi, according to the page?", "opts": ["17", "27", "29", "39"], "ans": 2, "exp": "The infographic says he assumed the title Ghazi after defeating 29 Mongol invasions."}, {"id": 23, "q": "Which title did Ghiyasuddin Tughlaq assume after defeating the Mongols?", "opts": ["Ulugh Khan", "Ghazi", "Zill-i-Ilahi", "Lakh Baksh"], "ans": 1, "exp": "Ghazi means a warrior who fights in the cause of Islam; the page records this title."}, {"id": 24, "q": "Ghiyasuddin Tughlaq is described as the first Sultan of the Delhi Sultanate to do what?", "opts": ["Construct canals", "Introduce token currency", "Build a new capital at Daulatabad", "Abolish the Iqta system"], "ans": 0, "exp": "The infographic calls him the first Sultan of the Delhi Sultanate to construct canals."}, {"id": 25, "q": "Where did Ghiyasuddin Tughlaq's coronation take place?", "opts": ["Qutub Minar", "Hazar Sutoon (Thousand Pillar) Palace", "Tughlaqabad Fort", "Siri Fort"], "ans": 1, "exp": "The infographic says his coronation took place at the Hazar Sutoon, or Thousand Pillar, Palace."}, {"id": 26, "q": "Which two forts are listed among Ghiyasuddin Tughlaq's constructions?", "opts": ["Siri Fort and Agra Fort", "Tughlaqabad Fort and Chhappan Kot Fort", "Kilokhari Fort and Red Fort", "Gwalior Fort and Chittor Fort"], "ans": 1, "exp": "The page lists Tughlaqabad Fort and Chhappan Kot Fort."}, {"id": 27, "q": "Which campaign took place during 1321–1323 AD?", "opts": ["Bengal Campaign", "Warangal Campaign", "Mongol Campaign", "Devgiri Campaign"], "ans": 1, "exp": "The military expeditions panel dates the Warangal Campaign to 1321–1323."}, {"id": 28, "q": "In which year did the Mongol Campaign take place according to the infographic?", "opts": ["1321", "1323", "1324", "1325"], "ans": 2, "exp": "The infographic lists the Mongol Campaign under 1324."}, {"id": 29, "q": "After the military campaigns, by what name did Ghiyasuddin Tughlaq become known?", "opts": ["Ulugh Khan", "Ghazi Malik", "Mubarak Hasan", "Qutlugh Khan"], "ans": 0, "exp": "The page states that after these campaigns he came to be known as Ulugh Khan."}, {"id": 30, "q": "In which year did Ghiyasuddin Tughlaq die?", "opts": ["1320", "1324", "1325", "1351"], "ans": 2, "exp": "The infographic gives 1325 AD as the year of his death."}, {"id": 31, "q": "How did Ghiyasuddin Tughlaq die, according to the infographic?", "opts": ["In a battlefield", "After being crushed under a wooden pavilion", "During a hunting expedition", "In a Mongol attack"], "ans": 1, "exp": "The page says he died while returning from the Bengal Campaign after being crushed under a wooden pavilion."}, {"id": 32, "q": "Who was the spiritual teacher of Nizamuddin Auliya?", "opts": ["Amir Khusro", "Fariduddin Ganj-i-Shakar", "Khwaja Moinuddin Chishti", "Qutbuddin Bakhtiyar Kaki"], "ans": 1, "exp": "The infographic identifies Fariduddin Ganj-i-Shakar as Nizamuddin Auliya's spiritual teacher."}, {"id": 33, "q": "Which statement is associated with Nizamuddin Auliya in the infographic?", "opts": ["Hunuz Dilli Dur Ast", "Rasm-i-Miyan", "Paibos", "Zill-i-Ilahi"], "ans": 0, "exp": "The famous statement is 'Hunuz Dilli Dur Ast', meaning Delhi is still far away."}, {"id": 34, "q": "Which biography of Nizamuddin Auliya is listed?", "opts": ["Fawaid-ul-Fuad", "Tughlaqnama", "Taj-ul-Maasir", "Tabaqat-i-Nasiri"], "ans": 0, "exp": "The infographic lists Fawaid-ul-Fuad as his biography."}, {"id": 35, "q": "Which sequence correctly lists the three Tughlaq rulers shown in the infographic?", "opts": ["Ghiyasuddin Tughlaq → Muhammad bin Tughlaq → Firoz Shah Tughlaq", "Muhammad bin Tughlaq → Ghiyasuddin Tughlaq → Firoz Shah Tughlaq", "Ghiyasuddin Tughlaq → Firoz Shah Tughlaq → Muhammad bin Tughlaq", "Firoz Shah Tughlaq → Ghiyasuddin Tughlaq → Muhammad bin Tughlaq"], "ans": 0, "exp": "The page lists Ghiyasuddin Tughlaq (1320–1325), Muhammad bin Tughlaq (1325–1351) and Firoz Shah Tughlaq (1351–1388)."}],KEY='tughlaq_dynasty_page8_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
