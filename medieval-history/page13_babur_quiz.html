:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

const questions=[{"id": 1, "q": "What is the period of the Mughal Empire shown in the infographic?", "opts": ["1206–1526 AD", "1526–1857 AD", "1526–1557 AD", "1556–1707 AD"], "ans": 1, "exp": "The infographic gives the Mughal Empire period as 1526–1857 AD."}, {"id": 2, "q": "Who founded the Mughal Empire in India?", "opts": ["Humayun", "Akbar", "Babur", "Shah Jahan"], "ans": 2, "exp": "Babur is identified as the founder of the Mughal Empire in India."}, {"id": 3, "q": "What was Babur's full name as given in the infographic?", "opts": ["Zahir-ud-din Muhammad Babur", "Nasir-ud-din Muhammad Humayun", "Jalal-ud-din Muhammad Akbar", "Shahab-ud-din Muhammad Shah Jahan"], "ans": 0, "exp": "The infographic gives his name as Zahir-ud-din Muhammad Babur."}, {"id": 4, "q": "Where was Babur born?", "opts": ["Samarkand", "Kabul", "Fargana, Uzbekistan", "Delhi"], "ans": 2, "exp": "The infographic gives Fargana (Fergana), Uzbekistan, as Babur's birthplace."}, {"id": 5, "q": "Babur's mother's ancestry is traced to whom?", "opts": ["Timur", "Genghis Khan", "Uzbeg Khan Mirza", "Ibrahim Lodi"], "ans": 1, "exp": "On his mother's side, Babur is described as a 14th-generation descendant of Genghis Khan."}, {"id": 6, "q": "In which year did Babur's father die?", "opts": ["1483", "1494", "1504", "1519"], "ans": 1, "exp": "Babur's father died in 1494 AD, according to the infographic."}, {"id": 7, "q": "How old was Babur when he became ruler after his father's death?", "opts": ["9 years and 4 months", "11 years and 4 months", "14 years", "16 years"], "ans": 1, "exp": "The infographic states that Babur became ruler at the age of 11 years and 4 months."}, {"id": 8, "q": "What was the result of Babur's first attempt to capture Samarkand in 1494?", "opts": ["He gained control for 100 days", "It was unsuccessful", "He controlled it for eight months", "He permanently annexed it"], "ans": 1, "exp": "The first attempt in 1494 was unsuccessful."}, {"id": 9, "q": "What happened during Babur's second attempt to capture Samarkand in 1497?", "opts": ["He gained control for 100 days", "He controlled it for eight months", "He was defeated at Panipat", "He captured Kabul"], "ans": 0, "exp": "The infographic says Babur gained control of Samarkand for 100 days in 1497."}, {"id": 10, "q": "In which year did Babur conquer Kabul?", "opts": ["1494", "1497", "1501", "1504"], "ans": 3, "exp": "Babur conquered Kabul in 1504 AD."}, {"id": 11, "q": "Which title did Babur assume in 1507?", "opts": ["Sultan", "Padshah", "Qalandar", "Ghazi"], "ans": 1, "exp": "Babur assumed the title Padshah in 1507, according to the infographic."}, {"id": 12, "q": "Which Rajput ruler is listed among the contemporary kingdoms during Babur's time?", "opts": ["Rana Sanga", "Raja Man Singh", "Hammir Dev", "Vikramaditya Singh"], "ans": 0, "exp": "The infographic lists Rana Sangram Singh (Rana Sanga) under Rajputana."}, {"id": 13, "q": "Which Vijayanagara ruler is listed as a contemporary of Babur?", "opts": ["Krishnadevaraya", "Harihara I", "Bukka Raya I", "Devaraya II"], "ans": 0, "exp": "The infographic lists Krishnadevaraya as the Vijayanagara ruler."}, {"id": 14, "q": "Which quality of Babur is highlighted in the infographic?", "opts": ["Excellent horseman", "Expert shipbuilder", "Famous architect", "Renowned astronomer"], "ans": 0, "exp": "The qualities panel describes Babur as an excellent horseman, skilled hunter, great military commander and practical strategist."}, {"id": 15, "q": "Which places did Babur conquer during his first invasion of India?", "opts": ["Yusufzai Valley, Bajaur and Bhera", "Peshawar and Sialkot", "Lahore and Dipalpur", "Kabul and Samarkand"], "ans": 0, "exp": "The infographic lists Yusufzai Valley, Bajaur and Bhera for the first invasion."}, {"id": 16, "q": "Which place did Babur conquer during his third invasion in 1520?", "opts": ["Sialkot", "Bhera", "Dipalpur", "Kabul"], "ans": 0, "exp": "The third invasion in 1520 resulted in the conquest of Sialkot."}, {"id": 17, "q": "When was the First Battle of Panipat fought?", "opts": ["21 April 1526", "16 March 1527", "29 January 1528", "6 May 1529"], "ans": 0, "exp": "The First Battle of Panipat was fought on 21 April 1526."}, {"id": 18, "q": "Who were the main opponents in the First Battle of Panipat?", "opts": ["Babur and Rana Sanga", "Babur and Ibrahim Lodi", "Babur and Medini Rai", "Babur and Mahmud Lodi"], "ans": 1, "exp": "The battle was fought between Babur and Ibrahim Lodi."}, {"id": 19, "q": "Who was an ally of Ibrahim Lodi mentioned in the infographic?", "opts": ["Alam Khan Lodi", "Hasan Khan Mewati", "Mahmud Lodi", "Rana Sanga"], "ans": 0, "exp": "Alam Khan Lodi is listed as an ally of Ibrahim Lodi."}, {"id": 20, "q": "Which title did Babur assume after the First Battle of Panipat, according to the infographic?", "opts": ["Padshah", "Qalandar", "Ghazi", "Khan-i-Khanan"], "ans": 1, "exp": "The infographic says Babur assumed the title Qalandar after the battle."}, {"id": 21, "q": "What was Babur's military strategy based on Turkish and Ottoman methods called?", "opts": ["Dagh system", "Tulughma Policy", "Mansabdari system", "Iqta system"], "ans": 1, "exp": "Babur used the Tulughma Policy, based on Turkish and Ottoman methods."}, {"id": 22, "q": "When was the Battle of Khanwa fought?", "opts": ["21 April 1526", "16 March 1527", "29 January 1528", "6 May 1529"], "ans": 1, "exp": "The Battle of Khanwa took place on 16 March 1527."}, {"id": 23, "q": "Which title did Babur assume after the Battle of Khanwa?", "opts": ["Qalandar", "Ghazi", "Padshah", "Sultan"], "ans": 1, "exp": "The infographic states that Babur assumed the title Ghazi after the victory at Khanwa."}, {"id": 24, "q": "When was the Battle of Chanderi fought?", "opts": ["16 March 1527", "29 January 1528", "6 May 1529", "21 April 1526"], "ans": 1, "exp": "The Battle of Chanderi was fought on 29 January 1528."}, {"id": 25, "q": "Who was Babur's opponent in the Battle of Chanderi?", "opts": ["Medini Rai", "Rana Sanga", "Mahmud Lodi", "Ibrahim Lodi"], "ans": 0, "exp": "The Battle of Chanderi was fought against Medini Rai, and Babur won."}, {"id": 26, "q": "When was the Battle of Ghaghra fought?", "opts": ["29 January 1528", "16 March 1527", "6 May 1529", "14 February 1530"], "ans": 2, "exp": "The Battle of Ghaghra took place on 6 May 1529."}, {"id": 27, "q": "Which opponents did Babur face in the Battle of Ghaghra?", "opts": ["Rana Sanga and Medini Rai", "Mahmud Lodi and Nasrat Shah", "Ibrahim Lodi and Alam Khan", "Daulat Khan Lodi and Rana Sanga"], "ans": 1, "exp": "The infographic lists Mahmud Lodi, Nasrat Shah (ruler of Bengal) and the Bengal Army as opponents."}, {"id": 28, "q": "Which autobiography was written by Babur?", "opts": ["Akbarnama", "Baburnama", "Humayun-nama", "Tuzuk-i-Jahangiri"], "ans": 1, "exp": "Baburnama is Babur's autobiography."}, {"id": 29, "q": "In which language was Baburnama originally written?", "opts": ["Persian", "Arabic", "Chagatai Turkish", "Sanskrit"], "ans": 2, "exp": "The infographic gives Chagatai Turkish as the original language of Baburnama."}, {"id": 30, "q": "Who translated Baburnama into Persian?", "opts": ["Abdur Rahim Khan-i-Khanan", "John Leyden", "William Erskine", "Mirza Haidar Dughlat"], "ans": 0, "exp": "Abdur Rahim Khan-i-Khanan is named as the Persian translator."}, {"id": 31, "q": "Who translated Baburnama into English, according to the infographic?", "opts": ["John Leyden and William Erskine", "Abdur Rahim Khan-i-Khanan and Mirza Haidar", "Ziauddin Barani and Amir Khusro", "Nazim Ahmad and Azizuddin Khan"], "ans": 0, "exp": "The infographic lists John Leyden and William Erskine as the English translators."}, {"id": 32, "q": "Which of the following is listed as another work of Babur?", "opts": ["Mubaiyan", "Tarikh-i-Rashidi", "Lazzat-e-Sikandar Shahi", "Futuhat-i-Firozshahi"], "ans": 0, "exp": "Mubaiyan (on Islamic law) and Diwan are listed as other works of Babur."}, {"id": 33, "q": "Who wrote Tarikh-i-Rashidi during Babur's reign?", "opts": ["Abdur Rahim Khan-i-Khanan", "Mirza Haidar Dughlat", "Ustad Ali Quli", "Mustafa Rumi"], "ans": 1, "exp": "The infographic names Mirza Haidar Dughlat as the author of Tarikh-i-Rashidi."}, {"id": 34, "q": "In which year did Babur die?", "opts": ["1526", "1527", "1529", "1530"], "ans": 3, "exp": "Babur died in 1530 AD."}, {"id": 35, "q": "Which set correctly lists Babur's four sons shown in the infographic?", "opts": ["Humayun, Kamran, Askari and Hindal", "Humayun, Akbar, Jahangir and Hindal", "Kamran, Askari, Akbar and Dara", "Humayun, Kamran, Salim and Hindal"], "ans": 0, "exp": "The four sons shown are Humayun, Kamran, Askari and Hindal."}],KEY='babur_page13_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
