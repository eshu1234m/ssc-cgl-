<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page 4 — Delhi Sultanate Quiz</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}
</style></head><body><div class="wrap"><header><h1>Page 4: From Qutbuddin Aibak to Iltutmish</h1><div class="sub">35 MCQs · Mixed difficulty · One question at a time · Instant feedback</div></header>
<section class="panel" id="quiz"><div class="row"><span class="qnum" id="counter"></span><span class="muted" id="saved">Progress saves on this device</span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="question" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" id="prev">Previous</button><div style="display:flex;gap:10px"><button class="secondary" id="reset">Reset</button><button class="primary" id="submit">Submit answer</button><button class="primary hidden" id="next">Next</button></div></div></section>
<section class="panel hidden result" id="result"><h2>Quiz completed!</h2><div class="score" id="score"></div><div id="summary"></div><div class="actions"><button class="secondary" id="reviewBtn">Review incorrect answers</button><button class="primary" id="retake">Retake quiz</button></div><div class="review hidden" id="review"></div></section><p class="small">Progress is stored locally in this browser. It does not sync across devices.</p></div>
<script>
const questions=[{"id": 1, "q": "What period is given for the Delhi Sultanate in the infographic?", "opts": ["1206–1526 AD", "1192–1526 AD", "1206–1556 AD", "1211–1526 AD"], "ans": 0, "exp": "The infographic gives the Delhi Sultanate period as 1206–1526 AD."}, {"id": 2, "q": "How long did the Delhi Sultanate last according to the page?", "opts": ["300 years", "320 years", "340 years", "350 years"], "ans": 1, "exp": "The page states a total duration of 320 years."}, {"id": 3, "q": "How many dynasties ruled during the Delhi Sultanate, according to the overview?", "opts": ["Four", "Five", "Six", "Seven"], "ans": 1, "exp": "The overview lists five dynasties."}, {"id": 4, "q": "Which dynasty ruled from 1206 to 1290 AD?", "opts": ["Khilji", "Tughlaq", "Slave (Mamluk/Ghulam)", "Sayyid"], "ans": 2, "exp": "The Slave or Mamluk dynasty is listed for 1206–1290 AD."}, {"id": 5, "q": "Which Delhi Sultanate dynasty had the shortest period of rule in the table?", "opts": ["Slave", "Khilji", "Tughlaq", "Lodi"], "ans": 1, "exp": "The Khilji dynasty is shown with 30 years, the shortest duration in the table."}, {"id": 6, "q": "Which dynasty had the longest period of rule in the overview table?", "opts": ["Tughlaq", "Lodi", "Slave", "Sayyid"], "ans": 0, "exp": "The Tughlaq dynasty is shown as lasting 94 years, the longest in the table."}, {"id": 7, "q": "The Sayyid dynasty is dated to which period in the infographic?", "opts": ["1320–1414 AD", "1414–1451 AD", "1451–1526 AD", "1290–1320 AD"], "ans": 1, "exp": "The infographic lists the Sayyid dynasty from 1414 to 1451 AD."}, {"id": 8, "q": "The Lodi dynasty ruled during which period?", "opts": ["1414–1451 AD", "1451–1526 AD", "1320–1414 AD", "1206–1290 AD"], "ans": 1, "exp": "The Lodi dynasty is listed for 1451–1526 AD."}, {"id": 9, "q": "The Slave dynasty is also known by which two names in the infographic?", "opts": ["Mamluk and Ghulam", "Khalji and Khilji", "Shamsi and Balbani", "Lodi and Sayyid"], "ans": 0, "exp": "The page also calls it the Mamluk or Ghulam dynasty."}, {"id": 10, "q": "How many rulers are stated to have belonged to the Slave dynasty?", "opts": ["9", "10", "11", "13"], "ans": 2, "exp": "The infographic states that there were 11 rulers in the dynasty."}, {"id": 11, "q": "Who is identified as the founder of the Slave dynasty?", "opts": ["Iltutmish", "Balban", "Qutbuddin Aibak", "Aram Shah"], "ans": 2, "exp": "Qutbuddin Aibak is identified as the founder."}, {"id": 12, "q": "Which city is given as the capital of the Slave dynasty in the infographic?", "opts": ["Delhi", "Lahore", "Ajmer", "Ghazni"], "ans": 1, "exp": "The infographic lists Lahore as the capital of the Slave dynasty."}, {"id": 13, "q": "Which branch of the Slave dynasty is associated with Qutbuddin Aibak?", "opts": ["Shamsi dynasty", "Balbani dynasty", "Qutbi dynasty", "Khilji dynasty"], "ans": 2, "exp": "The Qutbi branch is linked with Qutbuddin Aibak."}, {"id": 14, "q": "Who purchased Qutbuddin Aibak, according to the background panel?", "opts": ["Qazi Fakhruddin Abdul Aziz Kufi", "Muhammad Ghori", "Ghiyasuddin", "Hasan Nizami"], "ans": 0, "exp": "The background panel says he was purchased by Qazi Fakhruddin Abdul Aziz Kufi."}, {"id": 15, "q": "To whom was Qutbuddin Aibak later sold?", "opts": ["Prithviraj Chauhan", "Muhammad Ghori", "Iltutmish", "Aram Shah"], "ans": 1, "exp": "The infographic states that he was later sold to Muhammad Ghori."}, {"id": 16, "q": "Which position did Aibak serve in before becoming ruler, according to the page?", "opts": ["Wazir", "Amir-i-Akhur (Head of the Royal Stable)", "Qazi", "Governor of Lahore"], "ans": 1, "exp": "The notes say he served as Amir-i-Akhur, the head of the royal stable."}, {"id": 17, "q": "Which set contains names or titles given for Qutbuddin Aibak in the infographic?", "opts": ["Lakh Baksh, Peel Baksh, Hatim II, Quran Khan", "Sultan, Shah, Amir-i-Umra, Sikandar", "Yamin-ud-Daula, Al-Mansur, Khalifa, Malik", "Ghazi, Zill-i-Ilahi, Nasir, Muizz"], "ans": 0, "exp": "These four names are listed in the 'Other Names' panel."}, {"id": 18, "q": "Which two titles did Aibak use, according to the infographic?", "opts": ["Malik and Sipahsalar", "Sultan and Caliph", "Amir and Shahenshah", "Khan and Ghazi"], "ans": 0, "exp": "The notes state that Aibak used only the titles Malik and Sipahsalar."}, {"id": 19, "q": "Which statement about Aibak's coins and khutba is given in the notes?", "opts": ["He issued gold coins and read the khutba in his name", "He neither issued coins in his own name nor had the khutba read in his name", "He issued only silver coins bearing his portrait", "He adopted the Caliph's name on all coins"], "ans": 1, "exp": "The infographic says he neither issued coins in his own name nor had the khutba read in his name."}, {"id": 20, "q": "Qutbuddin Aibak is described as a disciple of whom?", "opts": ["Khwaja Moinuddin Chishti", "Khwaja Qutbuddin Bakhtiyar Kaki", "Nizamuddin Auliya", "Bahauddin Zakariya"], "ans": 1, "exp": "The page identifies him as a disciple of Khwaja Qutbuddin Bakhtiyar Kaki."}, {"id": 21, "q": "Which mosque is listed among Aibak's architectural works?", "opts": ["Quwwat-ul-Islam Mosque", "Jama Masjid, Delhi", "Adhai Din Ka Jhonpra", "Moti Masjid"], "ans": 0, "exp": "Quwwat-ul-Islam Mosque is listed as one of Aibak's works."}, {"id": 22, "q": "Adhai Din Ka Jhonpra is located in which city according to the infographic?", "opts": ["Delhi", "Lahore", "Ajmer", "Agra"], "ans": 2, "exp": "The infographic places Adhai Din Ka Jhonpra in Ajmer, Rajasthan."}, {"id": 23, "q": "Construction of which monument did Aibak start, according to the page?", "opts": ["Alai Darwaza", "Qutub Minar", "Tughlaqabad Fort", "Humayun's Tomb"], "ans": 1, "exp": "The page says Aibak started the construction of the Qutub Minar."}, {"id": 24, "q": "Which architectural style is Aibak associated with in the infographic?", "opts": ["Dome and arch architecture", "Dravidian temple architecture", "Buddhist rock-cut architecture", "Indo-Greek architecture"], "ans": 0, "exp": "He is described as the Father of Dome Architecture and Arch Architecture."}, {"id": 25, "q": "Who is named as Aibak's court poet?", "opts": ["Minhaj-us-Siraj", "Hasan Nizami", "Amir Khusrau", "Ziauddin Barani"], "ans": 1, "exp": "Hasan Nizami is identified as the court poet."}, {"id": 26, "q": "Which book by Hasan Nizami is mentioned?", "opts": ["Tabaqat-i-Nasiri", "Taj-ul-Maasir", "Tarikh-i-Firoz Shahi", "Kitab-ul-Hind"], "ans": 1, "exp": "The book named is Taj-ul-Maasir."}, {"id": 27, "q": "How did Qutbuddin Aibak die, according to the infographic?", "opts": ["In a battle", "While playing polo (Chaugan)", "During a hunting expedition", "In a rebellion"], "ans": 1, "exp": "The infographic states that he died while playing polo, also called Chaugan."}, {"id": 28, "q": "How long did Aram Shah rule according to the page?", "opts": ["About 8 months", "About 8 years", "About 18 months", "About 2 years"], "ans": 0, "exp": "Aram Shah's reign is shown as only eight months."}, {"id": 29, "q": "Iltutmish ruled during which period?", "opts": ["1206–1210 AD", "1211–1236 AD", "1236–1240 AD", "1246–1266 AD"], "ans": 1, "exp": "The infographic gives Iltutmish's reign as 1211–1236 AD."}, {"id": 30, "q": "Iltutmish belonged to which Turkish dynasty?", "opts": ["Qutbi (Aibak)", "Shamsi (Dairi)", "Balbani", "Khilji"], "ans": 1, "exp": "The notes state that Iltutmish belonged to the Shamsi (Dairi) Turkish dynasty."}, {"id": 31, "q": "Iltutmish was related to Qutbuddin Aibak in which way?", "opts": ["His son-in-law", "His elder brother", "His father", "His nephew"], "ans": 0, "exp": "The infographic identifies Iltutmish as Aibak's son-in-law."}, {"id": 32, "q": "Which title is given to Iltutmish in the infographic?", "opts": ["Amir-ul-Umra", "Lakh Baksh", "Sultan-i-Azam", "Yamin-ud-Daula"], "ans": 0, "exp": "The page lists the title Amir-ul-Umra."}, {"id": 33, "q": "Who is named as Iltutmish's father?", "opts": ["Ilam Khan", "Ghiyasuddin", "Fakhruddin Kufi", "Hasan Nizami"], "ans": 0, "exp": "The infographic names Ilam Khan as his father."}, {"id": 34, "q": "What is the meaning of 'Iqta' given in the notes?", "opts": ["A piece of land", "A military rank", "A royal tax", "A religious endowment"], "ans": 0, "exp": "The page defines Iqta as a piece of land."}, {"id": 35, "q": "What was the Turkān-e-Chahalgani?", "opts": ["A group of forty nobles", "A council of village elders", "A cavalry regiment of ten thousand", "A group of foreign merchants"], "ans": 0, "exp": "The infographic describes it as a group of forty nobles and says it included 40 nobles."}],KEY='delhi_sultanate_page4_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
