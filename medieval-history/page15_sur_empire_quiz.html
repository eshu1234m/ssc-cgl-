:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}
</style></head><body><div class="wrap"><header><h1>Page 15: Sur Empire (1540–1555 AD)</h1><div class="sub">35 MCQs · Mixed difficulty · One question at a time · Instant feedback</div></header>

<script>
const questions=[{"id": 1, "q": "What was the period of the Sur Empire shown in the infographic?", "opts": ["1526–1530 AD", "1540–1555 AD", "1555–1605 AD", "1451–1526 AD"], "ans": 1, "exp": "The Sur Empire ruled from 1540 to 1555 AD."}, {"id": 2, "q": "Who founded the Sur Empire?", "opts": ["Sher Shah Suri", "Jalal Khan", "Firoz Shah", "Sikandar Shah"], "ans": 0, "exp": "Sher Shah Suri was the founder of the Sur Empire."}, {"id": 3, "q": "In which year was Sher Shah Suri born, according to the infographic?", "opts": ["1472 AD", "1483 AD", "1494 AD", "1508 AD"], "ans": 0, "exp": "The infographic gives his birth year as 1472 AD."}, {"id": 4, "q": "Who was Sher Shah Suri's father?", "opts": ["Bahar Khan", "Hasan Khan", "Jamal Khan", "Nasrat Shah"], "ans": 1, "exp": "His father's name was Hasan Khan."}, {"id": 5, "q": "Who is named as the author of Tarikh-i-Sher Shahi?", "opts": ["Abbas Khan Sarwani", "Gulbadan Begum", "Mirza Haidar Dughlat", "Abdur Rahim Khan-i-Khanan"], "ans": 0, "exp": "Abbas Khan Sarwani is named as its author."}, {"id": 6, "q": "Under whom did Farid begin his early career?", "opts": ["Rana Sanga", "Bahar Khan Lohani", "Bahadur Shah", "Nasrat Shah"], "ans": 1, "exp": "Farid worked under Bahar Khan Lohani, the governor of Southern Bihar."}, {"id": 7, "q": "From whom did Farid receive the jagir of Jaunpur?", "opts": ["Jamal Khan", "Bahar Khan", "Hasan Khan", "Sher Shah"], "ans": 0, "exp": "The infographic says Farid received the jagir of Jaunpur from Jamal Khan."}, {"id": 8, "q": "What role did Farid perform in relation to the jagir?", "opts": ["Chief judge", "Manager", "Commander of the navy", "Revenue minister of Bengal"], "ans": 1, "exp": "Farid became the manager of the jagir."}, {"id": 9, "q": "How did Sher Shah obtain Chunar Fort in 1530 AD?", "opts": ["Through marriage", "By purchasing it", "Through a treaty with Humayun", "By defeating Rana Sanga"], "ans": 0, "exp": "The infographic states that he obtained Chunar Fort through marriage."}, {"id": 10, "q": "Where is Chunar Fort located?", "opts": ["Banda", "Mirzapur, Uttar Pradesh", "Sasaram, Bihar", "Jodhpur"], "ans": 1, "exp": "Chunar Fort is located in Mirzapur, Uttar Pradesh."}, {"id": 11, "q": "What was the result of the Battle of Kannauj (Bilgram) in 1540 AD?", "opts": ["Victory of Humayun", "Victory of Sher Shah", "Victory of Akbar", "Draw"], "ans": 1, "exp": "Sher Shah won the Battle of Kannauj (Bilgram) in 1540 AD."}, {"id": 12, "q": "In which year did Sher Shah conquer Bengal, according to the campaign timeline?", "opts": ["1539 AD", "1540 AD", "1541 AD", "1545 AD"], "ans": 2, "exp": "The infographic dates the Bengal campaign to 1541 AD."}, {"id": 13, "q": "Who was killed in the Malwa campaign?", "opts": ["Puranmal", "Mallu Khan of Qadir Shah", "Kirat Singh", "Rao Maldeo"], "ans": 1, "exp": "The infographic states that Mallu Khan of Qadir Shah was killed."}, {"id": 14, "q": "Which fort or territory was conquered in the Raisen campaign of 1543 AD?", "opts": ["Chunar", "Raisen", "Chittor", "Sasaram"], "ans": 1, "exp": "Sher Shah conquered Raisen in 1543 AD."}, {"id": 15, "q": "Which place was the target of the Kalinjar campaign in 1545 AD?", "opts": ["Banda, Uttar Pradesh", "Mirzapur, Uttar Pradesh", "Sasaram, Bihar", "Ajmer, Rajasthan"], "ans": 0, "exp": "The infographic gives Banda in Uttar Pradesh as the place of the Kalinjar campaign."}, {"id": 16, "q": "Who opposed Sher Shah in the Kalinjar campaign?", "opts": ["Rao Maldeo", "Kirat Singh", "Puranmal", "Mallu Khan"], "ans": 1, "exp": "Kirat Singh is named as the opponent."}, {"id": 17, "q": "Which battle was fought at Samel (Giri-Sumel) in 1544 AD?", "opts": ["Against Humayun", "Against Rao Maldeo", "Against Rana Sanga", "Against Ibrahim Lodi"], "ans": 1, "exp": "The Battle of Samel (Giri-Sumel) in Marwar was fought against Rao Maldeo."}, {"id": 18, "q": "Which two military leaders are associated with Maldeo in the infographic?", "opts": ["Jaita and Kumpa", "Bairam Khan and Hemu", "Mallu Khan and Puranmal", "Kirat Singh and Sikandar Shah"], "ans": 0, "exp": "Jaita and Kumpa are listed as military leaders associated with Maldeo."}, {"id": 19, "q": "Where is the tomb of Sher Shah Suri located?", "opts": ["Delhi", "Agra", "Sasaram, Bihar", "Chunar"], "ans": 2, "exp": "Sher Shah's tomb is located at Sasaram in Bihar."}, {"id": 20, "q": "On what basis was land revenue assessed under Sher Shah's reforms?", "opts": ["Based on the quality and quantity of production", "Only on the number of villages", "Only on the size of the kingdom", "At a fixed rate for every farmer"], "ans": 0, "exp": "The infographic says revenue was assessed on the basis of production."}, {"id": 21, "q": "What was the agreement called under the Patta system?", "opts": ["Qabuliyat", "Dagh", "Khutba", "Iqta"], "ans": 0, "exp": "The agreement under the Patta system was called Qabuliyat."}, {"id": 22, "q": "Which department was responsible for revenue and finance?", "opts": ["Diwan-i-Insha", "Diwan-i-Wizarat", "Diwan-i-Qaza", "Diwan-i-Arz"], "ans": 1, "exp": "Diwan-i-Wizarat was the revenue and finance department."}, {"id": 23, "q": "Which department was responsible for judicial matters?", "opts": ["Diwan-i-Qaza", "Diwan-i-Wizarat", "Diwan-i-Insha", "Diwan-i-Arz"], "ans": 0, "exp": "Diwan-i-Qaza was the judicial department."}, {"id": 24, "q": "Which currency reform is associated with Sher Shah Suri?", "opts": ["Introduction of the modern rupee", "Introduction of the dinar", "Abolition of silver coins", "Introduction of paper currency"], "ans": 0, "exp": "The infographic credits Sher Shah with introducing the modern rupee."}, {"id": 25, "q": "What was the name of Sher Shah's copper coin?", "opts": ["Rupiya", "Dam", "Mohur", "Dinar"], "ans": 1, "exp": "The copper coin was called the Dam and weighed 360 grains."}, {"id": 26, "q": "In which script was the coin inscription written?", "opts": ["Persian", "Arabic", "Devanagari", "Brahmi"], "ans": 2, "exp": "The infographic states that the inscription was written in Devanagari script."}, {"id": 27, "q": "What was the name of the centres in Sher Shah's postal system?", "opts": ["Sarais", "Dak Chowkis", "Iqta centres", "Mandi posts"], "ans": 1, "exp": "The postal system used centres called Dak Chowkis."}, {"id": 28, "q": "Which fort did Sher Shah strengthen?", "opts": ["Roh tasgarh Fort", "Agra Fort", "Red Fort", "Gwalior Fort"], "ans": 0, "exp": "The infographic states that he strengthened Rohtasgarh Fort."}, {"id": 29, "q": "What was the reign of Jalal Khan (Islam Shah)?", "opts": ["1540–1545 AD", "1545–1553 AD", "1553–1554 AD", "1554–1555 AD"], "ans": 1, "exp": "The infographic gives his reign as 1545–1553 AD."}, {"id": 30, "q": "What happened to Firoz Shah in 1553 AD?", "opts": ["He became emperor for 29 days", "He was murdered by Mubarak Khan", "He defeated Humayun", "He founded the Sur Empire"], "ans": 1, "exp": "Firoz Shah was murdered by Mubarak Khan in 1553 AD."}, {"id": 31, "q": "Who fought against Sikandar Shah among the successors shown?", "opts": ["Ibrahim Sur", "Firoz Shah", "Jalal Khan", "Mubarak Khan"], "ans": 0, "exp": "Ibrahim Sur is shown as an opponent who fought against Sikandar Shah."}, {"id": 32, "q": "Which battle in 1555 AD was fought by Sikandar Shah against Humayun?", "opts": ["Battle of Chausa", "Battle of Sirhind", "Battle of Samel", "Second Battle of Panipat"], "ans": 1, "exp": "The infographic associates Sikandar Shah with the Battle of Sirhind in 1555 AD against Humayun."}, {"id": 33, "q": "Who were the opponents in the Second Battle of Panipat (1556 AD)?", "opts": ["Humayun and Sher Shah", "Hemu and Akbar", "Akbar and Bairam Khan", "Ibrahim Lodi and Babur"], "ans": 1, "exp": "The Second Battle of Panipat in 1556 AD was fought between Hemu and Akbar's forces."}, {"id": 34, "q": "Who commanded Akbar's forces in the Second Battle of Panipat?", "opts": ["Bairam Khan", "Hemu", "Sher Shah", "Rao Maldeo"], "ans": 0, "exp": "Bairam Khan was the commander of Akbar's forces."}, {"id": 35, "q": "How long did Hemu rule as the last Hindu ruler of Delhi, according to the infographic?", "opts": ["7 days", "29 days", "40 days", "100 days"], "ans": 1, "exp": "The infographic states that Hemu's rule lasted 29 days."}],KEY='sur_empire_page15_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
