e."}, {"id": 19, "q": "What happened to Razia and Altunia after reconciliation?", "opts": ["They returned together", "They fled to Bengal", "They captured Lahore", "They joined the Mongols"], "ans": 0, "exp": "The additional notes say Razia and Altunia returned together after reconciliation."}, {"id": 20, "q": "What happened to Razia after she was captured?", "opts": ["She became queen again", "She was imprisoned", "She was appointed governor", "She escaped to Ghazni"], "ans": 1, "exp": "The additional notes state that Razia was imprisoned."}, {"id": 21, "q": "Where was Razia Sultan murdered?", "opts": ["Delhi", "Kaithal", "Lahore", "Bhatinda"], "ans": 1, "exp": "The infographic gives Kaithal as the place where Razia was murdered."}, {"id": 22, "q": "On what date was Razia Sultan murdered, according to the infographic?", "opts": ["13 October 1240", "13 October 1236", "24 October 1242", "15 August 1240"], "ans": 0, "exp": "The page gives the date as 13 October 1240."}, {"id": 23, "q": "Who became ruler after Razia Sultan?", "opts": ["Masud Shah", "Bahram Shah", "Nasiruddin Mahmud", "Ruknuddin Firoz"], "ans": 1, "exp": "The infographic states that Bahram Shah, the third son of Iltutmish, became ruler after Razia."}, {"id": 24, "q": "Which new post is shown as created after Razia's reign?", "opts": ["Amir-i-Akhur", "Naib-i-Mumlikat", "Amir-i-Hajib", "Diwan-i-Arz"], "ans": 1, "exp": "The infographic highlights the creation of the post Naib-i-Mumlikat."}, {"id": 25, "q": "Who is named as the first Naib-i-Mumlikat?", "opts": ["Ghiyasuddin Balban", "Aitigin", "Muhajabuddin", "Ghiyasuddin Hasan"], "ans": 2, "exp": "The infographic identifies Aitigin as the first Naib-i-Mumlikat, while the post is shown under Muhajabuddin in the chart."}, {"id": 26, "q": "Masud Shah ruled during which period?", "opts": ["1240–1242 AD", "1242–1246 AD", "1246–1265 AD", "1236–1240 AD"], "ans": 1, "exp": "The infographic says Aitigin became the first Naib-i-Mumlikat. The chart separately shows Muhajabuddin in the Wazir post."}, {"id": 27, "q": "Masud Shah was the son of whom?", "opts": ["Iltutmish", "Ruknuddin Firoz", "Bahram Shah", "Nasiruddin Mahmud"], "ans": 1, "exp": "The page states that Masud Shah was the son of Ruknuddin Firoz."}, {"id": 28, "q": "Who killed Masud Shah?", "opts": ["Balban", "Nasiruddin Mahmud", "Aitigin", "Altunia"], "ans": 1, "exp": "The infographic says Masud Shah was killed by Nasiruddin Mahmud."}, {"id": 29, "q": "Who ruled Delhi from 1246 to 1265 AD?", "opts": ["Bahram Shah", "Masud Shah", "Nasiruddin Mahmud", "Ruknuddin Firoz"], "ans": 2, "exp": "The timeline gives Nasiruddin Mahmud's reign as 1246–1265 AD."}, {"id": 30, "q": "Nasiruddin Mahmud was the son of whom?", "opts": ["Iltutmish", "Ruknuddin Firoz", "Bahram Shah", "Balban"], "ans": 0, "exp": "The infographic identifies Nasiruddin Mahmud as the son of Iltutmish."}, {"id": 31, "q": "What nickname is given to Nasiruddin Mahmud in the infographic?", "opts": ["Akbar of the Sultanate Period", "Aurangzeb of the Sultanate Period", "Sher Shah of the Sultanate Period", "Ashoka of the Sultanate Period"], "ans": 1, "exp": "The page calls him the 'Aurangzeb of the Sultanate Period'."}, {"id": 32, "q": "How did Nasiruddin Mahmud earn his livelihood, according to the page?", "opts": ["By trading horses", "By stitching caps", "By copying manuscripts", "By collecting taxes"], "ans": 1, "exp": "The infographic says he earned his livelihood by stitching caps."}, {"id": 33, "q": "Whom did Nasiruddin Mahmud appoint as Naib-i-Mumlikat (Prime Minister)?", "opts": ["Aitigin", "Balban", "Muhajabuddin", "Kabir Khan Ayaz"], "ans": 1, "exp": "The page states that Nasiruddin Mahmud appointed Balban as Naib-i-Mumlikat."}, {"id": 34, "q": "Mahmud was whose father-in-law?", "opts": ["Aitigin", "Balban", "Altunia", "Yakut"], "ans": 1, "exp": "The infographic says Mahmud was Balban's father-in-law."}, {"id": 35, "q": "Who held the Naib-i-Mumlikat position during the court politics shown for Masud Shah's reign?", "opts": ["Ghiyasuddin Balban (Balban)", "Muhajabuddin", "Ghiyasuddin Hasan", "Kabir Khan Ayaz"], "ans": 0, "exp": "The court-politics table lists Ghiyasuddin Balban (Balban) as Naib-i-Mumlikat."}],KEY='razia_nasiruddin_page5_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
