<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}
</style></head><body><div class="wrap"><header><h1>Page 2: Effects of Arab Invasion & Turkish Invasion of India</h1><div class="sub">35 MCQs · Mixed difficulty · One question at a time · Instant feedback</div></header>

<script>
const questions=[{"id": 1, "q": "Which four contributions are listed as introduced by the Arabs into India?", "opts": ["Camel rearing, cartography, monsoon knowledge and date cultivation", "Paper-making, printing, gunpowder and silk weaving", "Tea cultivation, railways, banking and shipbuilding", "Cotton spinning, iron smelting, chess and sugar refining"], "ans": 0, "exp": "The page lists camel rearing, map-making/cartography, knowledge of monsoons and cultivation of dates."}, {"id": 2, "q": "According to the notes, which type of knowledge reached Europe through Arab contacts?", "opts": ["Only military technology", "Philosophy, astrology, numerals and medicine", "Only agriculture and architecture", "Navigation, steam power and electricity"], "ans": 1, "exp": "The notes name philosophy, astrology, digits (numerals) and medicine as knowledge transmitted to Europe through Arabs."}, {"id": 3, "q": "Which scholar is associated with the book Brahmasphuta Siddhanta?", "opts": ["Aryabhata", "Varahamihira", "Brahmagupta", "Bhaskara II"], "ans": 2, "exp": "Brahmasphuta Siddhanta is attributed to Brahmagupta."}, {"id": 4, "q": "In which year was Brahmasphuta Siddhanta written, according to the page?", "opts": ["476 AD", "628 AD", "712 AD", "788 AD"], "ans": 1, "exp": "The infographic gives 628 AD as the year of composition."}, {"id": 5, "q": "Which formula for the sum of the first n squares is shown in the notes?", "opts": ["n(n+1)/2", "n²(n+1)²/4", "n(n+1)(2n+1)/6", "n(2n+1)/3"], "ans": 2, "exp": "The formula shown is 1² + 2² + … + n² = n(n+1)(2n+1)/6."}, {"id": 6, "q": "The alliance against Arab invasions is dated to which year in the infographic?", "opts": ["636 AD", "712 AD", "738 AD", "1001 AD"], "ans": 2, "exp": "The section heading identifies the Indian confederacy against Arab invasions as 738 AD."}, {"id": 7, "q": "Which ruler is associated with the Chalukya dynasty in the alliance list?", "opts": ["Pulakeshin (Vikramaditya II)", "Nagabhata I", "Dantidurga", "Bappa Rawal"], "ans": 0, "exp": "The infographic pairs Pulakeshin (Vikramaditya II) with the Chalukya dynasty."}, {"id": 8, "q": "Nagabhata I is associated with which dynasty in the alliance list?", "opts": ["Rashtrakuta", "Gurjara-Pratihara", "Chalukya", "Pala"], "ans": 1, "exp": "The page identifies Nagabhata I (730–760 AD) as a ruler of the Gurjara-Pratihara dynasty."}, {"id": 9, "q": "Dantidurga is linked with which dynasty?", "opts": ["Chola", "Pallava", "Rashtrakuta", "Gurjara-Pratihara"], "ans": 2, "exp": "Dantidurga is listed as the representative of the Rashtrakuta dynasty."}, {"id": 10, "q": "Bappa Rawal is associated with which region or ruling house in the infographic?", "opts": ["Mewar", "Kannauj", "Multan", "Gujarat"], "ans": 0, "exp": "The alliance list identifies Bappa Rawal with Mewar."}, {"id": 11, "q": "According to the infographic, the alliance checked Arab expansion in India for nearly how long?", "opts": ["50 years", "100 years", "200 years", "300 years"], "ans": 3, "exp": "The note below the alliance states that it checked Arab expansion for nearly 300 years."}, {"id": 12, "q": "Which dynasty was founded by Alptigin, according to the page?", "opts": ["Ghurid dynasty", "Ghaznavid (Yamini) dynasty", "Mamluk dynasty", "Khalji dynasty"], "ans": 1, "exp": "The infographic names Alptigin as the founder of the Ghaznavid (Yamini) dynasty."}, {"id": 13, "q": "What period is given for the Ghaznavid (Yamini) dynasty?", "opts": ["712–750 AD", "800–843 AD", "943–963 AD", "1001–1027 AD"], "ans": 2, "exp": "The dynasty panel gives 943–963 AD."}, {"id": 14, "q": "Which city is identified as the capital of the Ghaznavid dynasty?", "opts": ["Lahore", "Multan", "Baghdad", "Ghazni"], "ans": 3, "exp": "Ghazni is stated as the capital in the infographic."}, {"id": 15, "q": "Who ruled from 977 to 997 AD, according to the Subuktigin panel?", "opts": ["Alptigin", "Subuktigin", "Mahmud of Ghazni", "Al-Biruni"], "ans": 1, "exp": "The Subuktigin panel gives his reign as 977–997 AD."}, {"id": 16, "q": "Mahmud of Ghazni was the son of whom?", "opts": ["Alptigin", "Jayapala", "Subuktigin", "Bhim I"], "ans": 2, "exp": "The infographic explicitly states that Mahmud was the son of Subuktigin."}, {"id": 17, "q": "What reign is assigned to Mahmud of Ghazni in the infographic?", "opts": ["977–997 AD", "998–1030 AD", "1001–1027 AD", "1018–1040 AD"], "ans": 1, "exp": "The Mahmud panel states that he ruled from 998 AD to 1030 AD."}, {"id": 18, "q": "Which title is described as first being proclaimed for a ruler by the Caliph in the Mahmud section?", "opts": ["Sultan", "Kaiser", "Shahenshah", "Amir-ul-Umara"], "ans": 0, "exp": "The infographic says Mahmud was the first ruler to be proclaimed 'Sultan' by the Caliph."}, {"id": 19, "q": "What does the title 'Yamin-ud-Daula' mean in the notes?", "opts": ["Protector of Muslims", "Right Hand of the Empire", "King of the East", "Leader of the Faithful"], "ans": 1, "exp": "The notes translate Yamin-ud-Daula as 'Right Hand of the Empire'."}, {"id": 20, "q": "What does 'Yamin-ul-Millah' mean according to the infographic?", "opts": ["Right Hand of the Empire", "Ruler of Ghazni", "Protector of Muslims", "Friend of the Caliph"], "ans": 2, "exp": "The page gives the meaning 'Protector of Muslims'."}, {"id": 21, "q": "Which pair of objectives is listed for Mahmud of Ghazni's invasions?", "opts": ["Trade expansion and pilgrimage", "Territorial administration and irrigation", "Looting wealth and propagation of Islam", "Building universities and roads"], "ans": 2, "exp": "The infographic lists looting wealth and propagation of Islam as the objectives."}, {"id": 22, "q": "How many invasions of India are attributed to Mahmud of Ghazni in the infographic?", "opts": ["7", "12", "17", "27"], "ans": 2, "exp": "The page states that Mahmud conducted 17 invasions of India."}, {"id": 23, "q": "What event is associated with Mahmud's first successful invasion in 1001 AD?", "opts": ["Battle of Waihind", "Battle of Tarain", "Battle of Panipat", "Battle of Plassey"], "ans": 0, "exp": "The 1001 AD entry identifies the Battle of Waihind as the first successful invasion."}, {"id": 24, "q": "Who is named as Mahmud's opponent in the 1001 AD campaign?", "opts": ["Raja Dahir", "Jayapala", "Vidyadhara", "Bhim I"], "ans": 1, "exp": "The infographic names Jayapala of the Hindu Shahi dynasty as the opponent."}, {"id": 25, "q": "Which place is listed as invaded in 1005 AD?", "opts": ["Thanesar", "Nagarkot", "Multan", "Kannauj"], "ans": 2, "exp": "The 1005 AD campaign column states that Mahmud invaded Multan."}, {"id": 26, "q": "The 1008 AD campaign targeted which place?", "opts": ["Nagarkot", "Mathura", "Ajmer", "Somnath"], "ans": 0, "exp": "The 1008 AD column identifies Nagarkot as the target."}, {"id": 27, "q": "Which temple is specifically mentioned in connection with the 1008 AD campaign?", "opts": ["Somnath Temple", "Bhimadevi Temple", "Sun Temple at Konark", "Kashi Vishwanath Temple"], "ans": 1, "exp": "The notes state that Mahmud attacked the Bhimadevi Temple in Himachal Pradesh during the 1008 AD campaign."}, {"id": 28, "q": "Which place was invaded in 1014 AD?", "opts": ["Kannauj", "Thanesar", "Multan", "Nagarkot"], "ans": 1, "exp": "The 1014 AD entry states that Mahmud invaded Thanesar in present-day Haryana."}, {"id": 29, "q": "Which two places are named in the 1018 AD campaign?", "opts": ["Ajmer and Dhar", "Multan and Lahore", "Mathura and Vrindavan", "Kannauj and Thanesar"], "ans": 2, "exp": "The 1018 AD column names Mathura and Vrindavan."}, {"id": 30, "q": "Which ruler is mentioned as ruling Kannauj during the 1018 AD campaign?", "opts": ["Jayapala", "Rajyapala", "Vidyadhara", "Govindaraja II"], "ans": 1, "exp": "The infographic says Kannauj was ruled by Rajyapala."}, {"id": 31, "q": "Which ruler did Mahmud face at Kannauj in the 1021–1022 AD campaign?", "opts": ["Vidyadhara", "Bhim I", "Nagabhata I", "Dantidurga"], "ans": 0, "exp": "The 1021–1022 AD column says he faced King Vidyadhara."}, {"id": 32, "q": "The 1024 AD campaign is associated with which region or group?", "opts": ["Chauhans of Ajmer", "Chalukyas of Gujarat", "Hindu Shahis of Kabul", "Rashtrakutas of Deccan"], "ans": 0, "exp": "The final campaign column says Mahmud invaded the Chauhans of Ajmer in 1024 AD."}, {"id": 33, "q": "What was the target of the Somnath campaign of 1025 AD?", "opts": ["Bhimadevi Temple", "Somnath Temple in Gujarat", "Temple at Nagarkot", "Temple at Thanesar"], "ans": 1, "exp": "The Somnath campaign panel identifies the Somnath Temple in Gujarat as the target."}, {"id": 34, "q": "Who is identified as the ruler of Gujarat during the Somnath campaign?", "opts": ["Bhim I of the Chaulukya dynasty", "Jayapala of the Hindu Shahi dynasty", "Rajyapala of Kannauj", "Vidyadhara of Bundelkhand"], "ans": 0, "exp": "The panel names Bhima I (Chaulukya dynasty) as the ruler of Gujarat."}, {"id": 35, "q": "Which contemporary writer is described as Mahmud's court historian and author of Kitab-ul-Yamini?", "opts": ["Firdawsi", "Al-Biruni", "Utbi", "Amir Khusrau"], "ans": 2, "exp": "The infographic identifies Utbi as Mahmud's court historian and author of Kitab-ul-Yamini in Persian."}],KEY='arab_turkish_page2_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
