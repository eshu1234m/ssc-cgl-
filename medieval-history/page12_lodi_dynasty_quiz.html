<script>
const questions=[{"id": 1, "q": "What was the period of the Lodi Dynasty?", "opts": ["1206–1290 AD", "1290–1320 AD", "1414–1451 AD", "1451–1526 AD"], "ans": 3, "exp": "The infographic gives the Lodi Dynasty period as 1451–1526 AD."}, {"id": 2, "q": "For how many years did the Lodi Dynasty rule?", "opts": ["38 years", "50 years", "75 years", "85 years"], "ans": 2, "exp": "The infographic states that the Lodi Dynasty ruled for 75 years."}, {"id": 3, "q": "Who founded the Lodi Dynasty?", "opts": ["Sikandar Lodi", "Ibrahim Lodi", "Bahlol Lodi", "Daulat Khan Lodi"], "ans": 2, "exp": "Bahlol Lodi was the founder of the Lodi Dynasty."}, {"id": 4, "q": "How long did Bahlol Lodi rule?", "opts": ["27 years", "32 years", "38 years", "45 years"], "ans": 2, "exp": "Bahlol Lodi ruled from 1451 to 1489 AD, a period of 38 years."}, {"id": 5, "q": "What title did Bahlol Lodi assume at his accession?", "opts": ["Sultan Bahlol Shah Ghazi", "Raiyat-i-Ala", "Khan-i-Khanan", "Zill-i-Ilahi"], "ans": 0, "exp": "He assumed the title Sultan Bahlol Shah Ghazi on 19 April 1451."}, {"id": 6, "q": "Whom did Bahlol Lodi defeat in the Jaunpur campaign?", "opts": ["Ibrahim Shah", "Muhammad Shah", "Mahmud Khilji", "Rana Sanga"], "ans": 1, "exp": "Bahlol Lodi defeated Muhammad Shah, the ruler of Jaunpur."}, {"id": 7, "q": "Who helped Bahlol Lodi in the Jaunpur campaign?", "opts": ["Dariya Khan and Hamid Lodi", "Daulat Khan and Rana Sanga", "Babar and Alam Khan", "Bahar Khan and Raja Man Singh"], "ans": 0, "exp": "The infographic names Dariya Khan and Hamid Lodi as his helpers."}, {"id": 8, "q": "Bahlol Lodi was known by which historical comparison?", "opts": ["Second Alexander of India", "Second Bismarck of India", "Napoleon of India", "Akbar of the Delhi Sultanate"], "ans": 1, "exp": "The infographic says Bahlol Lodi was known as the Second Bismarck of India."}, {"id": 9, "q": "Who was the opponent in Bahlol Lodi's last campaign?", "opts": ["Raja Man Singh", "Rana Sanga", "Vikramaditya Singh", "Ibrahim Shah"], "ans": 0, "exp": "The infographic names Raja Man Singh as the opponent in the Gwalior campaign."}, {"id": 10, "q": "What tribute did Gwalior agree to pay after the treaty?", "opts": ["8 lakh tankas", "18 lakh tankas", "80 lakh tankas", "1 crore tankas"], "ans": 2, "exp": "Gwalior agreed to pay an annual tribute of 80 lakh tankas."}, {"id": 11, "q": "Where is Bahlol Lodi's tomb located?", "opts": ["Agra", "Delhi", "Jaunpur", "Gwalior"], "ans": 1, "exp": "The infographic places his tomb in Delhi."}, {"id": 12, "q": "What was Sikandar Lodi's relationship to Bahlol Lodi?", "opts": ["Eldest son", "Third son", "Younger brother", "Nephew"], "ans": 1, "exp": "Sikandar Lodi was the third son of Bahlol Lodi."}, {"id": 13, "q": "Under what pen name did Sikandar Lodi write poetry?", "opts": ["Gulrukhi", "Tuti-e-Hind", "Firdawsi", "Utbi"], "ans": 0, "exp": "The infographic says he wrote poetry under the pen name Gulrukhi."}, {"id": 14, "q": "Which Persian treatise on Indian music was written during Sikandar Lodi's reign?", "opts": ["Lazzat-e-Sikandar Shahi", "Tarikh-i-Mubarak Shahi", "Kitab-ul-Hind", "Futuhat-i-Firozshahi"], "ans": 0, "exp": "Lazzat-e-Sikandar Shahi was written by Nazim Ahmad during his reign."}, {"id": 15, "q": "Which book on Ayurveda was written by scholars during Sikandar Lodi's reign?", "opts": ["Tibb-e-Sikandari", "Farhang-e-Sikandari", "Rajatarangini", "Kitab-ul-Rehla"], "ans": 1, "exp": "The infographic lists Farhang-e-Sikandari as a book on Ayurveda."}, {"id": 16, "q": "Which land-measurement system did Sikandar Lodi introduce?", "opts": ["Dahsala system", "Gaj-e-Sikandari", "Iqta system", "Mansabdari system"], "ans": 1, "exp": "Sikandar Lodi introduced the Gaj-e-Sikandari for land measurement."}, {"id": 17, "q": "Which religious policy is attributed to Sikandar Lodi in the infographic?", "opts": ["He encouraged visits to Sufi shrines", "He prohibited visits to tombs of saints and Pirs", "He abolished all religious taxes", "He promoted the Muharram Tazia procession"], "ans": 1, "exp": "The infographic states that he prohibited visits to the tombs of saints and Pirs."}, {"id": 18, "q": "Which river bathing practice did Sikandar Lodi stop, according to the infographic?", "opts": ["Bathing in the Narmada and Godavari", "Bathing in the Ganga and Yamuna", "Bathing in the Indus and Jhelum", "Bathing in the Kaveri and Krishna"], "ans": 1, "exp": "The infographic says he stopped bathing in the Ganga and Yamuna."}, {"id": 19, "q": "What was the cause of Sikandar Lodi's death?", "opts": ["Battle wounds", "Throat disease", "Poisoning", "Fever"], "ans": 1, "exp": "The infographic states that Sikandar Lodi died due to a throat disease."}, {"id": 20, "q": "Which Sikh scripture is associated with Guru Nanak in the infographic?", "opts": ["Adi Granth", "Japji Sahib", "Dasam Granth", "Sukhmani Sahib"], "ans": 1, "exp": "The infographic lists Japji Sahib as the book associated with Guru Nanak."}, {"id": 21, "q": "Which works are associated with Kabir in the infographic?", "opts": ["Sakhis, Shabads and Ramainis", "Vedas, Puranas and Upanishads", "Akbarnama and Ain-i-Akbari", "Tibb-e-Sikandari and Farhang-e-Sikandari"], "ans": 0, "exp": "The infographic lists Sakhis, Shabads and Ramainis as works composed by Kabir."}, {"id": 22, "q": "In which year did Sikandar Lodi found Agra?", "opts": ["1501", "1504", "1506", "1517"], "ans": 1, "exp": "The infographic dates the founding of Agra to 1504 AD."}, {"id": 23, "q": "Which fort did Sikandar Lodi build at Agra?", "opts": ["Agra Fort", "Badalgarh Fort", "Red Fort", "Gwalior Fort"], "ans": 1, "exp": "The infographic states that he built the Badalgarh Fort."}, {"id": 24, "q": "In which year did Sikandar Lodi make Agra his capital?", "opts": ["1504", "1506", "1517", "1526"], "ans": 1, "exp": "Sikandar Lodi made Agra his capital in 1506 AD."}, {"id": 25, "q": "Who was the last ruler of the Lodi Dynasty?", "opts": ["Bahlol Lodi", "Sikandar Lodi", "Ibrahim Lodi", "Barbak Shah"], "ans": 2, "exp": "Ibrahim Lodi was the last ruler of the Lodi Dynasty, ruling from 1517 to 1526 AD."}, {"id": 26, "q": "Who defeated Vikramaditya Singh and conquered Gwalior during Ibrahim Lodi's reign?", "opts": ["Bahlol Lodi", "Sikandar Lodi", "Ibrahim Lodi", "Babur"], "ans": 2, "exp": "The infographic attributes the Gwalior victory over Vikramaditya Singh to Ibrahim Lodi."}, {"id": 27, "q": "Who were the opponents in the Battle of Khatoli (1518–1519)?", "opts": ["Ibrahim Lodi and Rana Sanga", "Ibrahim Lodi and Babur", "Babur and Daulat Khan Lodi", "Bahlol Lodi and Raja Man Singh"], "ans": 0, "exp": "The Battle of Khatoli was fought between Ibrahim Lodi and Rana Sanga; Rana Sanga was victorious."}, {"id": 28, "q": "What was the result of the Battle of Khatoli (1518–1519)?", "opts": ["Ibrahim Lodi won", "Rana Sanga won", "Babur won", "The battle ended without a result"], "ans": 1, "exp": "The infographic states that Rana Sanga was victorious."}, {"id": 29, "q": "When was the First Battle of Panipat fought?", "opts": ["21 April 1526", "19 April 1451", "20 May 1421", "15 August 1526"], "ans": 0, "exp": "The First Battle of Panipat took place on 21 April 1526."}, {"id": 30, "q": "Who fought against Ibrahim Lodi in the First Battle of Panipat?", "opts": ["Rana Sanga", "Babur", "Daulat Khan Lodi", "Mahmud Khilji"], "ans": 1, "exp": "Babur was Ibrahim Lodi's opponent at the First Battle of Panipat."}, {"id": 31, "q": "What was the outcome of the First Battle of Panipat?", "opts": ["Ibrahim Lodi won", "Babur won and Ibrahim Lodi was killed", "Rana Sanga won", "A peace treaty was signed"], "ans": 1, "exp": "Babur won the battle, and Ibrahim Lodi was killed on the battlefield."}, {"id": 32, "q": "Which region's revolt was led by Bahar Khan Lodi during Ibrahim Lodi's reign?", "opts": ["Bihar", "Punjab", "Mewar", "Gwalior"], "ans": 0, "exp": "The infographic says Bahar Khan Lodi declared himself an independent ruler in Bihar."}, {"id": 33, "q": "Who invited Babur to invade India?", "opts": ["Bahar Khan Lodi", "Daulat Khan Lodi", "Rana Sanga", "Raja Man Singh"], "ans": 1, "exp": "Daulat Khan Lodi of Punjab invited Babur to invade India."}, {"id": 34, "q": "Which ruler of Mewar also invited Babur to attack Ibrahim Lodi?", "opts": ["Rana Sanga", "Raja Man Singh", "Vikramaditya Singh", "Hammir Dev"], "ans": 0, "exp": "The infographic states that Rana Sanga invited Babur to attack Ibrahim Lodi."}, {"id": 35, "q": "What happened to the Lodi Dynasty after Ibrahim Lodi's defeat and death?", "opts": ["It continued under Barbak Shah", "It ended, bringing the Delhi Sultanate to an end", "It moved its capital to Agra", "It became the Mughal Dynasty"], "ans": 1, "exp": "The infographic states that the Lodi Dynasty and the Delhi Sultanate ended after Ibrahim Lodi's defeat and death in 1526."}],KEY='lodi_dynasty_page12_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
