:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

<script>
const questions=[{"id": 1, "q": "During which years did Jahangir rule the Mughal Empire?", "opts": ["1556–1605 AD", "1605–1627 AD", "1628–1658 AD", "1658–1707 AD"], "ans": 1, "exp": "Jahangir ruled from 1605 to 1627 AD."}, {"id": 2, "q": "In which year was Jahangir born, according to the infographic?", "opts": ["1569 AD", "1572 AD", "1580 AD", "1605 AD"], "ans": 0, "exp": "The infographic gives Jahangir's birth year as 1569 AD."}, {"id": 3, "q": "Who was Jahangir's father?", "opts": ["Humayun", "Akbar", "Shah Jahan", "Babur"], "ans": 1, "exp": "Akbar was Jahangir's father."}, {"id": 4, "q": "Who was Jahangir's mother?", "opts": ["Mumtaz Mahal", "Harka Bai (Amer)", "Nur Jahan", "Asmat Begum"], "ans": 1, "exp": "His mother is identified as Harka Bai of Amer."}, {"id": 5, "q": "Which two childhood names are associated with Jahangir?", "opts": ["Khurram and Khusrau", "Salim and Shekhu Baba", "Dara and Shuja", "Farid and Nizam"], "ans": 1, "exp": "Jahangir was known as Salim and Shekhu Baba in childhood."}, {"id": 6, "q": "Where and when was Jahangir crowned?", "opts": ["Delhi, 25 October 1605", "Agra Fort, 3 November 1605", "Lahore, 1611", "Fatehpur Sikri, 1606"], "ans": 1, "exp": "Jahangir's coronation took place at Agra Fort on 3 November 1605."}, {"id": 7, "q": "In which year did Khusrau revolt against Jahangir?", "opts": ["1605", "1606", "1611", "1626"], "ans": 1, "exp": "Khusrau revolted against Jahangir in 1606."}, {"id": 8, "q": "Who was among the supporters of Khusrau's revolt?", "opts": ["Man Singh", "Asaf Khan", "Mahabat Khan", "Sir Thomas Roe"], "ans": 0, "exp": "Man Singh is listed among the supporters of Khusrau."}, {"id": 9, "q": "Which Sikh Guru is named among the supporters of Khusrau?", "opts": ["Guru Nanak", "Guru Arjan Dev (Fifth Sikh Guru)", "Guru Gobind Singh", "Guru Tegh Bahadur"], "ans": 1, "exp": "The infographic names Arjun Dev, the Fifth Sikh Guru, among Khusrau's supporters."}, {"id": 10, "q": "Who provided financial assistance to Khusrau?", "opts": ["Abdur Rahim Khan-i-Khanan", "Raja Todar Mal", "Bairam Khan", "Asaf Khan"], "ans": 0, "exp": "Abdur Rahim Khan-i-Khanan is noted as having provided financial assistance."}, {"id": 11, "q": "Who was the governor of Agra listed among Khusrau's supporters?", "opts": ["Husain Beg", "Man Singh", "Prithvi Raj", "Arjun Dev"], "ans": 0, "exp": "Husain Beg is identified as the governor of Agra."}, {"id": 12, "q": "What happened to Salim in 1599, according to the additional notes?", "opts": ["He fled to the Deccan", "Akbar sent him to Allahabad", "He was crowned emperor", "He married Mehr-un-Nissa"], "ans": 1, "exp": "The infographic states that Akbar sent Salim to Allahabad in 1599."}, {"id": 13, "q": "What happened when Salim fled to Agra in 1606?", "opts": ["He was immediately crowned", "He was later captured", "He joined the Deccan forces", "He was sent to Bengal"], "ans": 1, "exp": "The additional note says Salim fled to Agra but was later captured."}, {"id": 14, "q": "In which year did Jahangir marry Mehr-un-Nissa?", "opts": ["1605", "1606", "1611", "1615"], "ans": 2, "exp": "Jahangir married Mehr-un-Nissa in 1611."}, {"id": 15, "q": "Which two titles did Mehr-un-Nissa receive after her marriage to Jahangir?", "opts": ["Mumtaz Mahal and Padshah Begum", "Nur Jahan and Noor Mahal", "Ladli Begum and Jahanara", "Jagat Gosain and Nur Mahal"], "ans": 1, "exp": "She received the titles Nur Jahan and Noor Mahal."}, {"id": 16, "q": "Who was Nur Jahan's father?", "opts": ["Asaf Khan", "Mirza Ghiyas Beg", "Abdur Rahim", "Man Bai"], "ans": 1, "exp": "Nur Jahan's father was Mirza Ghiyas Beg, who received the title Itimad-ud-Daulah."}, {"id": 17, "q": "Who was Nur Jahan's mother?", "opts": ["Asmat Begum", "Jagat Gosain", "Harka Bai", "Man Bai"], "ans": 0, "exp": "Asmat Begum was Nur Jahan's mother."}, {"id": 18, "q": "Which title was given to Nur Jahan's brother Asaf Khan?", "opts": ["Itimad-ud-Daulah", "Khan-i-Khanan", "Khan-i-Jahan", "Nadir-ul-Asr"], "ans": 1, "exp": "Asaf Khan received the title Khan-i-Khanan."}, {"id": 19, "q": "Who was Nur Jahan's daughter?", "opts": ["Jahanara", "Ladli Begum", "Roshanara", "Mumtaz Mahal"], "ans": 1, "exp": "Ladli Begum is identified as Nur Jahan's daughter."}, {"id": 20, "q": "Whom did Khurram marry, according to the infographic?", "opts": ["Ladli Begum", "Arjumand Banu Begum (Mumtaz Mahal)", "Mehr-un-Nissa", "Man Bai"], "ans": 1, "exp": "Khurram, later Shah Jahan, married Arjumand Banu Begum, known as Mumtaz Mahal."}, {"id": 21, "q": "Whom did Nur Jahan marry before Jahangir?", "opts": ["Ali Quli Beg (Sher Afghan)", "Mirza Ghiyas Beg", "Asaf Khan", "Man Singh"], "ans": 0, "exp": "Before marrying Jahangir, Nur Jahan was married to Sher Afghan, also known as Ali Quli Beg."}, {"id": 22, "q": "What administrative change was made in Bengal in 1606?", "opts": ["The governorship was transferred from Man Singh to Qutbuddin Khan", "Bengal was given to Khurram", "Bengal became independent", "The capital was shifted to Lahore"], "ans": 0, "exp": "The infographic says Bengal's governorship was taken away from Man Singh and given to Qutbuddin Khan."}, {"id": 23, "q": "Which two deaths are recorded in the infographic?", "opts": ["Asmat Begum in 1621 and Itimad-ud-Daulah in 1622", "Man Bai in 1621 and Asaf Khan in 1622", "Nur Jahan in 1621 and Khurram in 1622", "Khusrau in 1621 and Mahabat Khan in 1622"], "ans": 0, "exp": "The infographic records Asmat Begum's death in 1621 and Itimad-ud-Daulah's death in 1622."}, {"id": 24, "q": "In which year did Mahabat Khan revolt against Jahangir?", "opts": ["1611", "1615", "1621", "1626"], "ans": 3, "exp": "Mahabat Khan revolted against Jahangir in 1626 and later fled to the Deccan."}, {"id": 25, "q": "What did Jahangir establish at Agra?", "opts": ["A chain of justice (Zanjir-i-Adl)", "A new revenue system", "A naval dockyard", "A translation bureau"], "ans": 0, "exp": "Jahangir established the Chain of Justice, known as Zanjir-i-Adl, at Agra."}, {"id": 26, "q": "What permission did Jahangir grant to the British?", "opts": ["Permission to establish trade in India", "Permission to rule Bengal", "Permission to mint Mughal coins", "Permission to collect land revenue"], "ans": 0, "exp": "Jahangir granted the British permission to establish trade in India."}, {"id": 27, "q": "When did Captain William Hawkins depart from England?", "opts": ["24 August 1608", "16 April 1609", "3 November 1605", "24 August 1615"], "ans": 0, "exp": "The infographic gives 24 August 1608 as Hawkins's departure date."}, {"id": 28, "q": "When did Captain William Hawkins reach the Mughal court at Agra?", "opts": ["24 August 1608", "16 April 1609", "1612", "1615"], "ans": 1, "exp": "Hawkins reached the Mughal court at Agra on 16 April 1609."}, {"id": 29, "q": "Which honour did Jahangir grant to William Hawkins?", "opts": ["Title of English Khan and a mansab of 400 zat", "Title of Khan-i-Khanan", "Mansab of 7,000", "Title of Nadir-ul-Asr"], "ans": 0, "exp": "Hawkins received the title English Khan and a mansab of 400 zat."}, {"id": 30, "q": "Who visited Jahangir's court in 1612, according to the infographic?", "opts": ["Paul Canning and Edward Terry", "William Hawkins and Sir Thomas Roe", "Abul Hasan and Mansur", "Asaf Khan and Mahabat Khan"], "ans": 0, "exp": "Paul Canning and Edward Terry are shown as visitors to Jahangir's court in 1612."}, {"id": 31, "q": "In which year did Sir Thomas Roe come to Jahangir's court?", "opts": ["1608", "1612", "1615", "1617"], "ans": 2, "exp": "Sir Thomas Roe came to Jahangir's court in 1615 and obtained trade privileges."}, {"id": 32, "q": "When was the East India Company established, according to the infographic?", "opts": ["1600", "1608", "1615", "1617"], "ans": 0, "exp": "The infographic gives 1600 as the year of establishment of the East India Company."}, {"id": 33, "q": "Which Mughal–British agreement year is shown in the East India Company panel?", "opts": ["1600", "1608", "1615", "1627"], "ans": 2, "exp": "The panel lists a Mughal–British Treaty in 1615."}, {"id": 34, "q": "Where was the factory established in 1617, according to the infographic?", "opts": ["Surat", "Ahmedabad", "Agra", "Lahore"], "ans": 1, "exp": "The infographic identifies Ahmedabad as the location of the factory established in 1617."}, {"id": 35, "q": "What is the title of Jahangir's autobiography?", "opts": ["Akbarnama", "Tuzuk-i-Jahangiri", "Baburnama", "Humayun-nama"], "ans": 1, "exp": "Jahangir's autobiography is Tuzuk-i-Jahangiri, also known as Jahangirnama."}, {"id": 36, "q": "In which language was Tuzuk-i-Jahangiri written?", "opts": ["Arabic", "Persian", "Sanskrit", "Turkish"], "ans": 1, "exp": "The autobiography was written in Persian."}, {"id": 37, "q": "Who completed the remaining part of Tuzuk-i-Jahangiri?", "opts": ["Abul Fazl", "Mutamad Khan", "Faizi", "Abdur Rahim"], "ans": 1, "exp": "The infographic says Mutamad Khan completed the remaining part."}, {"id": 38, "q": "Which period of Jahangir's reign is described as the Golden Age of Painting?", "opts": ["His reign as a whole", "Only the year 1605", "The final year 1627", "The period before his coronation"], "ans": 0, "exp": "Jahangir's reign is described as the Golden Age of Painting."}, {"id": 39, "q": "Which painter received the title Nadir-ul-Asr?", "opts": ["Daulat", "Mansur", "Abul Hasan", "Bishandas"], "ans": 1, "exp": "Mansur was given the title Nadir-ul-Asr."}, {"id": 40, "q": "Which title did Jahangir give to Abul Hasan?", "opts": ["Nadir-ul-Asr", "Nadir-uz-Zaman", "English Khan", "Itimad-ud-Daulah"], "ans": 1, "exp": "Abul Hasan received the title Nadir-uz-Zaman."}, {"id": 41, "q": "Which of the following is listed among Jahangir's other painters?", "opts": ["Bishandas", "Tansen", "Basawan", "Daswanth"], "ans": 0, "exp": "Bishandas is one of the other painters listed, along with Daulat, Abul Hasan, Manohar and Farrukh Beg."}, {"id": 42, "q": "In which year did Jahangir die?", "opts": ["1621", "1622", "1626", "1627"], "ans": 3, "exp": "Jahangir died in 1627."}, {"id": 43, "q": "Where is Jahangir's tomb located?", "opts": ["Agra", "Lahore", "Delhi", "Sikandra"], "ans": 1, "exp": "The infographic gives Lahore as the location of Jahangir's tomb."}],KEY='jahangir_page18_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
