:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}header{background:#132d59;color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px}.sub,.muted,.small{font-size:14px;opacity:.8}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14284a12}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{color:#2366bd;font-weight:700;font-size:14px}.bar{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:14px 0 20px}.fill{height:100%;background:#2374d8;width:0}.question{font-size:19px;line-height:1.45;font-weight:700;margin:12px 0 18px}.option{display:flex;gap:12px;border:1.5px solid #dbe2ec;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:#2474d4;background:#eff6ff}input{accent-color:#1769c2}button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#1769c2;color:white}.secondary{background:#e9eef5;color:#1b2a42}button:disabled{opacity:.45}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.good{display:block;background:#eaf8ef;border:1px solid #b9e4c7}.feedback.bad{display:block;background:#fff3e8;border:1px solid #f2d0aa}.explain{font-size:14px;margin-top:5px}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;color:#1769c2}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-top:1px solid #e4e9f0}.small{text-align:center;color:#657189;margin-top:16px}@media(max-width:480px){body{padding:10px}.panel{padding:16px}.question{font-size:18px}}

<script>
const questions=[{"id": 1, "q": "How long did Firoz Shah Tughlaq rule?", "opts": ["27 years", "32 years", "37 years", "40 years"], "ans": 2, "exp": "The infographic states that Firoz Shah Tughlaq ruled for 37 years, from 1351 to 1388 AD."}, {"id": 2, "q": "Firoz Shah Tughlaq is considered to have had the second-longest reign in which polity?", "opts": ["Mughal Empire", "Delhi Sultanate", "Khilji Dynasty", "Bahmani Sultanate"], "ans": 1, "exp": "The infographic describes his reign as the second longest in the Delhi Sultanate."}, {"id": 3, "q": "What was Firoz Shah Tughlaq's real name?", "opts": ["Kamaluddin Firoz", "Ghazi Malik", "Jauna Khan", "Zafar Khan"], "ans": 0, "exp": "His real name is given as Kamaluddin Firoz."}, {"id": 4, "q": "Who was Firoz Shah Tughlaq's mother?", "opts": ["Deval Rani", "Bibi Naila", "Makhdu-ma-i-Jahan", "Turkan Begum"], "ans": 1, "exp": "The infographic names Bibi Naila (Hindu) as his mother."}, {"id": 5, "q": "How many times was Firoz Shah Tughlaq crowned?", "opts": ["Once", "Twice", "Three times", "Four times"], "ans": 1, "exp": "He was crowned twice: first at Thatta in March 1351 and again at Delhi in August 1351."}, {"id": 6, "q": "When did his second coronation take place in Delhi?", "opts": ["March 1351", "August 1351", "August 1359", "March 1368"], "ans": 1, "exp": "The second coronation took place in Delhi in August 1351."}, {"id": 7, "q": "How many taxes did Firoz Shah Tughlaq abolish?", "opts": ["14", "20", "24", "28"], "ans": 2, "exp": "The tax reforms panel says he abolished 24 taxes."}, {"id": 8, "q": "What proportion of agricultural produce was charged as Kharaj?", "opts": ["One-fourth", "One-third", "One-half", "One-tenth"], "ans": 1, "exp": "Kharaj was fixed at one-third of agricultural produce in the infographic."}, {"id": 9, "q": "Jizya was imposed even on which group during Firoz Shah Tughlaq's reign?", "opts": ["Soldiers", "Brahmins", "Artisans", "Foreign merchants"], "ans": 1, "exp": "The tax reforms panel specifically notes that Jizya was imposed even on Brahmins."}, {"id": 10, "q": "What proportion was charged as Khums in the infographic?", "opts": ["One-fifth of war booty", "One-third of agricultural produce", "One-tenth of income", "One-half of trade profit"], "ans": 0, "exp": "Khums is shown as one-fifth of war booty."}, {"id": 11, "q": "What was the irrigation tax called?", "opts": ["Haq-e-Sharb", "Kharaj", "Khums", "Zakat"], "ans": 0, "exp": "The infographic identifies the irrigation tax as Haq-e-Sharb and gives its rate as 10%."}, {"id": 12, "q": "What change did Firoz Shah Tughlaq make to the Iqta system?", "opts": ["Abolished it", "Reintroduced it and made it hereditary", "Replaced it with Mansabdari", "Restricted it to soldiers"], "ans": 1, "exp": "The infographic says he reintroduced the Iqta system and made it hereditary."}, {"id": 13, "q": "What was the scale of slavery during Firoz Shah Tughlaq's reign, according to the infographic?", "opts": ["The number of slaves declined", "The largest number of slaves existed", "Slavery was abolished", "Only foreign slaves were permitted"], "ans": 1, "exp": "The infographic states that the largest number of slaves existed during his reign."}, {"id": 14, "q": "What employment-related measure did Firoz Shah Tughlaq introduce?", "opts": ["Closed employment offices", "Opened Employment Offices", "Introduced compulsory military service", "Abolished government jobs"], "ans": 1, "exp": "The infographic states that he opened Employment Offices."}, {"id": 15, "q": "Which department recruited slaves?", "opts": ["Diwan-e-Bandagan", "Arz-e-Bandagan", "Diwan-e-Insha", "Diwan-e-Istihqaq"], "ans": 1, "exp": "Arz-e-Bandagan is listed as the department for recruitment of slaves."}, {"id": 16, "q": "Which department was established as a hospital?", "opts": ["Diwan-e-Shafa", "Diwan-e-Istihqaq", "Diwan-e-Risalat", "Diwan-e-Mustakhraj"], "ans": 0, "exp": "The infographic identifies Diwan-e-Shafa as the hospital department."}, {"id": 17, "q": "Which department provided pensions to the elderly?", "opts": ["Diwan-e-Istihqaq", "Diwan-e-Bandagan", "Arz-e-Bandagan", "Diwan-e-Khairat"], "ans": 0, "exp": "Diwan-e-Istihqaq was established to provide pensions to the elderly."}, {"id": 18, "q": "Which department collected revenue arrears?", "opts": ["Diwan-e-Mustakhraj", "Diwan-e-Bandagan", "Diwan-e-Istihqaq", "Arz-e-Bandagan"], "ans": 0, "exp": "Diwan-e-Mustakhraj was responsible for collecting revenue arrears."}, {"id": 19, "q": "How many major canals did Firoz Shah Tughlaq dig, according to the infographic?", "opts": ["3", "5", "7", "10"], "ans": 1, "exp": "The public works panel states that he dug five major canals."}, {"id": 20, "q": "How many dams did Firoz Shah Tughlaq construct?", "opts": ["25", "50", "75", "100"], "ans": 1, "exp": "The infographic says he constructed 50 dams."}, {"id": 21, "q": "Which city was established in memory of Muhammad bin Tughlaq / Jauna Khan?", "opts": ["Hisar", "Jaunpur", "Fatehabad", "Firoz Shah Kotla"], "ans": 1, "exp": "The infographic identifies Jaunpur as being established in memory of Muhammad bin Tughlaq / Jauna Khan."}, {"id": 22, "q": "Which coin did Firoz Shah Tughlaq introduce in silver?", "opts": ["Shahsagani", "Rupiya", "Tanka", "Dinar"], "ans": 0, "exp": "The coins panel names the silver Shahsagani coin."}, {"id": 23, "q": "In which year did Firoz Shah Tughlaq repair the Qutub Minar?", "opts": ["1353", "1360", "1368", "1387"], "ans": 2, "exp": "The repair panel gives 1368 as the year he repaired the Qutub Minar."}, {"id": 24, "q": "Who wrote Futuhat-i-Firozshahi?", "opts": ["Ziauddin Barani", "Firoz Shah Tughlaq", "Amir Khusro", "Isami"], "ans": 1, "exp": "Futuhat-i-Firozshahi is described as Firoz Shah Tughlaq's autobiography, written in Persian."}, {"id": 25, "q": "Who wrote Tarikh-i-Firozshahi during Firoz Shah Tughlaq's reign?", "opts": ["Ziauddin Barani", "Firoz Shah Tughlaq", "Ibn Battuta", "Amir Hasan Sijzi"], "ans": 0, "exp": "The infographic attributes Tarikh-i-Firozshahi to Ziauddin Barani."}, {"id": 26, "q": "Against whom was the Bengal Campaign fought?", "opts": ["Taghi", "Ilyas Shah", "Hammir Dev", "Bhanudeva III"], "ans": 1, "exp": "The Bengal Campaign panel names Ilyas Shah as the opponent; the campaign was unsuccessful."}, {"id": 27, "q": "In which year did the Jajnagar (Odisha) campaign take place?", "opts": ["1353", "1360", "1361", "1368"], "ans": 1, "exp": "The infographic dates the Jajnagar campaign to 1360 AD."}, {"id": 28, "q": "Which temple was invaded during the Jajnagar campaign?", "opts": ["Somnath Temple", "Jagannath Temple at Puri", "Brihadeeswara Temple", "Konark Sun Temple"], "ans": 1, "exp": "The campaign panel says the Jagannath Temple at Puri was invaded."}, {"id": 29, "q": "In which year did the Nagarkot Campaign take place?", "opts": ["1353", "1360", "1361", "1368"], "ans": 2, "exp": "The infographic gives 1361 AD for the Nagarkot Campaign."}, {"id": 30, "q": "Who translated the books obtained in the Nagarkot Campaign into Persian?", "opts": ["Ziauddin Barani", "Azizuddin Khan", "Amir Khusro", "Ibn Battuta"], "ans": 1, "exp": "The Nagarkot panel names Azizuddin Khan as the translator."}, {"id": 31, "q": "From where were the two Ashokan pillars brought to Delhi?", "opts": ["Sarnath and Sanchi", "Topra and Meerut", "Pataliputra and Vaishali", "Kausambi and Lumbini"], "ans": 1, "exp": "The infographic shows one pillar brought from Topra in Haryana and another from Meerut in Uttar Pradesh."}, {"id": 32, "q": "During which years did Firoz Shah Tughlaq's last years take place?", "opts": ["1351–1359", "1368–1375", "1387–1388", "1394–1395"], "ans": 2, "exp": "The last-years panel gives the period as 1387–1388."}, {"id": 33, "q": "Who did Firoz Shah Tughlaq declare as his successor?", "opts": ["His eldest son", "His third son, Muhammad Khan", "His grandson Abu Bakr", "Nasiruddin Mahmud Shah"], "ans": 1, "exp": "The infographic says he declared his third son, Muhammad Khan, as his successor."}, {"id": 34, "q": "Who established the Sharqi Dynasty at Jaunpur?", "opts": ["Malik Sarwar", "Timur", "Abu Bakr", "Nasiruddin Mahmud Shah"], "ans": 0, "exp": "The infographic says Malik Sarwar established the Sharqi Dynasty at Jaunpur."}, {"id": 35, "q": "In which year did Timur invade India, according to the infographic?", "opts": ["1394", "1398", "1401", "1414"], "ans": 1, "exp": "The infographic dates Timur's invasion of India to 1398 AD."}],KEY='firoz_shah_tughlaq_page10_quiz_v1';let state={index:0,answers:{},submitted:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.answers)state=old}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='Progress saved'}catch(e){$('saved').textContent='Progress saving unavailable'}}
function render(){let i=state.index,q=questions[i],chosen=state.answers[q.id];$('counter').textContent=`Question ${i+1} of ${questions.length}`;$('progress').style.width=((i+1)/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach((op,j)=>{let l=document.createElement('label');l.className='option'+(chosen===j?' selected':'');let r=document.createElement('input');r.type='radio';r.name='answer';r.checked=chosen===j;r.disabled=!!state.submitted[q.id];r.onchange=()=>{state.answers[q.id]=j;save();render()};let s=document.createElement('span');s.textContent=String.fromCharCode(65+j)+'. '+op;l.append(r,s);$('options').append(l)});let done=!!state.submitted[q.id];$('submit').classList.toggle('hidden',done);$('next').classList.toggle('hidden',!done);$('next').textContent=i===questions.length-1?'See results':'Next';$('prev').disabled=i===0;let fb=$('feedback');fb.className='feedback';fb.innerHTML='';if(done){fb.classList.add(state.answers[q.id]===q.ans?'good':'bad');let b=document.createElement('strong');b.textContent=state.answers[q.id]===q.ans?'Correct!':'Not quite.';let d=document.createElement('div');d.className='explain';d.textContent='Correct answer: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'. '+q.exp;fb.append(b,d)}}
$('submit').onclick=()=>{let q=questions[state.index];if(state.answers[q.id]===undefined){alert('Please select an option first.');return}state.submitted[q.id]=true;save();render()};$('prev').onclick=()=>{if(state.index>0){state.index--;save();render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;save();render()}else showResults()};$('reset').onclick=()=>{if(confirm('Reset all answers and start again?')){state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}};
function showResults(){let n=0,wrong=[];questions.forEach(q=>{if(state.submitted[q.id]&&state.answers[q.id]===q.ans)n++;else wrong.push(q)});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=n+' / '+questions.length;$('summary').textContent='Accuracy: '+Math.round(n/questions.length*100)+'% · Incorrect or unanswered: '+wrong.length;$('review').innerHTML='';wrong.forEach(q=>{let d=document.createElement('div');d.className='review-item';let b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;let p=document.createElement('p');p.textContent='Your answer: '+(state.answers[q.id]===undefined?'Not answered':q.opts[state.answers[q.id]])+' | Correct: '+q.opts[q.ans];let e=document.createElement('p');e.textContent=q.exp;d.append(b,p,e);$('review').append(d)})}
$('reviewBtn').onclick=()=>$('review').classList.toggle('hidden');$('retake').onclick=()=>{state={index:0,answers:{},submitted:{}};save();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
