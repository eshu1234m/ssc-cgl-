<script>
const original=[{"q": "According to the notes, what change affected the varna system during the Gupta period?", "options": ["The number of castes declined", "The proliferation of castes changed the varna system", "The varna system was abolished", "Only four occupational groups remained"], "answer": 1, "explanation": "The page says the varna system changed due to the proliferation of castes."}, {"q": "How were foreigners mainly assimilated into Indian society, according to the page?", "options": ["As Brahmanas", "As Kshatriyas", "As Vaishyas", "As Shudras"], "answer": 1, "explanation": "The notes state that foreigners were assimilated into society mainly as Kshatriyas."}, {"q": "Through what process were tribes absorbed into Brahmanical society, and what status did they mostly receive?", "options": ["Through trade; mainly Vaishyas", "Through land grants; mostly Shudras", "Through military service; mainly Kshatriyas", "Through temple service; mainly Brahmanas"], "answer": 1, "explanation": "The page says tribes were absorbed into Brahmanical society through land grants and mostly became Shudras."}, {"q": "What happened to craft guilds during the Gupta period, according to the notes?", "options": ["They became royal armies", "They transformed into castes as trade/urban centres declined and crafts became localised", "They disappeared because all crafts were mechanised", "They became village councils"], "answer": 1, "explanation": "The notes link the transformation of craft guilds into castes to the decline of trade and urban centres and the localisation of crafts."}, {"q": "What improvement in social status is mentioned for Shudras?", "options": ["They were allowed to hear Epics and Puranas and worship Krishna", "They were given exclusive rights to land grants", "They became members of the royal council", "They were exempted from all taxes"], "answer": 0, "explanation": "The page states that Shudra status improved, allowing them to hear the Epics and Puranas and worship Krishna."}, {"q": "From around which century did untouchability increase, according to the notes?", "options": ["1st century AD", "2nd century AD", "3rd century AD", "5th century AD"], "answer": 2, "explanation": "The notes say untouchability increased from around the 3rd century."}, {"q": "Who first used the term 'Aprasaya' for untouchables, according to the page?", "options": ["Patanjali", "Katyayana", "Kalidasa", "Varahamihira"], "answer": 1, "explanation": "The page attributes the first use of 'Aprasaya' for untouchables to Katyayana."}, {"q": "Which social practice is identified as the first recorded Sati in the notes?", "options": ["510 AD, Eran, Madhya Pradesh", "319 AD, Pataliputra, Bihar", "530 AD, Mandsaur, Madhya Pradesh", "78 AD, Ujjain, Madhya Pradesh"], "answer": 0, "explanation": "The notes identify the first recorded Sati as 510 AD at Eran in Madhya Pradesh."}, {"q": "The first recorded Sati is mentioned in whose inscription?", "options": ["Samudragupta's Prayaga inscription", "Bhanu Gupta's Eran inscription", "Rudradaman's Junagadh inscription", "Prabhavati Gupta's Poona plates"], "answer": 1, "explanation": "The page says the 510 AD Eran Sati is mentioned in Bhanu Gupta's Eran inscription."}, {"q": "What does the page say about women's position during the Gupta period?", "options": ["It improved significantly and polygamy disappeared", "It deteriorated and polygamy became common", "Women gained equal property rights", "Marriage customs were abolished"], "answer": 1, "explanation": "The notes state that women's position deteriorated and polygamy became common."}, {"q": "Which marriage practice is described as encouraged in the notes?", "options": ["Late marriages after adulthood", "Early/pre-puberty marriages", "Only inter-caste marriages", "Marriage only after royal approval"], "answer": 1, "explanation": "The page says early/pre-puberty marriages were encouraged."}, {"q": "What property rights did women generally have, according to the page?", "options": ["Equal rights over all family land", "No property rights except Stridhana, such as jewellery and garments", "Rights only over agricultural land", "Rights only over inherited houses"], "answer": 1, "explanation": "The notes state that women generally had no property rights except Stridhana, described as jewellery and garments."}, {"q": "Which religious tradition became highly popular under Gupta patronage?", "options": ["Shaivism", "Vaishnavism", "Jainism", "Ajivika"], "answer": 1, "explanation": "The page states that Vaishnavism became highly popular under Gupta patronage."}, {"q": "Which divine consort pairings are given in the religion section?", "options": ["Lakshmi–Shiva and Parvati–Vishnu", "Lakshmi–Vishnu and Parvati–Shiva", "Saraswati–Vishnu and Lakshmi–Shiva", "Parvati–Brahma and Lakshmi–Shiva"], "answer": 1, "explanation": "The notes associate Lakshmi with Vishnu and Parvati with Shiva."}, {"q": "Which Buddhist traditions or cults evolved during the Gupta period, according to the notes?", "options": ["Theravada and Zen", "Vajrayana and Buddhist Tantric cults", "Only Mahayana", "Pure Land and Zen"], "answer": 1, "explanation": "The page states that Vajrayana and Buddhist Tantric cults evolved during this period."}, {"q": "From which period onward did idol worship become a common feature of Hinduism, according to the notes?", "options": ["Mauryan period", "Gupta period", "Vedic period", "Sangam period"], "answer": 1, "explanation": "The notes say idol worship became a common feature of Hinduism from the Gupta period onward."}, {"q": "Which copper plate is cited as the strongest evidence for the state being the exclusive owner of land, according to many scholars?", "options": ["Poona Plates of Prabhavati Gupta", "Pahadpur Copper Plate of Buddhagupta", "Eran inscription of Bhanu Gupta", "Allahabad Pillar inscription"], "answer": 1, "explanation": "The page says many scholars consider the state the exclusive owner of land and cites the Pahadpur Copper Plate of Buddhagupta as the strongest evidence."}, {"q": "Into how many types was land classified in the Gupta economy section?", "options": ["Three", "Four", "Five", "Six"], "answer": 2, "explanation": "The notes classify land into five types."}, {"q": "What did Kshetra Bhoomi mean?", "options": ["Waste land", "Cultivable land", "Habitable land", "Pasture land"], "answer": 1, "explanation": "Kshetra Bhoomi means cultivable land."}, {"q": "Which land category referred to waste land?", "options": ["Kshila", "Vastu Bhoomi", "Charagah Bhoomi", "Aprahata Bhoomi"], "answer": 0, "explanation": "Khila is identified as waste land."}, {"q": "What was Vastu Bhoomi?", "options": ["Forest land", "Habitable land", "Pasture land", "Cultivable land"], "answer": 1, "explanation": "Vastu Bhoomi means habitable land."}, {"q": "Which type of land was used as pasture land?", "options": ["Charagah Bhoomi", "Aprahata Bhoomi", "Khila", "Kshetra Bhoomi"], "answer": 0, "explanation": "Charagah Bhoomi refers to pasture land."}, {"q": "What did Aprahata Bhoomi refer to?", "options": ["Cultivable land", "Waste land", "Forest land", "Habitable land"], "answer": 2, "explanation": "Aprahata Bhoomi means forest land."}, {"q": "Which records are mentioned as evidence of land surveys?", "options": ["Junagadh inscription and Eran inscription", "Poona Plates of Prabhavati Gupta and other inscriptions", "Allahabad Pillar and Pahadpur Copper Plate", "Hathigumpha inscription and Nasik inscription"], "answer": 1, "explanation": "The notes say land surveys are evidenced by the Poona Plates of Prabhavati Gupta and other inscriptions."}, {"q": "Who was the Pustapala?", "options": ["An officer maintaining records of all land transactions in the district", "A tax collector for customs duty", "A village military commander", "A royal priest"], "answer": 0, "explanation": "Pustapala was the officer who maintained records of all land transactions in the district."}, {"q": "What is stated about Gupta gold coinage?", "options": ["Guptas issued the largest number of gold coins in ancient India", "Guptas issued no gold coins", "Gupta gold coins were more pure than Kushana coins", "Gold coins were used only by common people"], "answer": 0, "explanation": "The page says the Guptas issued the largest number of gold coins in ancient India."}, {"q": "How did the purity of Gupta gold coins compare with Kushana gold coins?", "options": ["Gupta gold was purer", "Gupta gold was less pure", "Both had exactly equal purity", "The page gives no comparison"], "answer": 1, "explanation": "The notes state that Gupta gold coins were less pure than Kushana coins."}, {"q": "Which metal coins were also issued in large numbers for local exchange?", "options": ["Copper coins", "Silver coins", "Iron coins", "Tin coins"], "answer": 1, "explanation": "The page states that many silver coins were also issued for local exchange."}, {"q": "What was Uparikara?", "options": ["A tax on land surveys", "An extra tax on subjects", "A tax paid only by merchants", "A tax-free land grant"], "answer": 1, "explanation": "Uparikara is defined in the notes as an extra tax on subjects."}, {"q": "What does the page say about Gupta copper coins compared with Kushana copper coins?", "options": ["Gupta copper coins were more numerous", "Very few Gupta copper coins existed compared with Kushana coins", "Guptas issued only copper coins", "Gupta copper coins were used widely by all common people"], "answer": 1, "explanation": "The notes state that very few Gupta copper coins existed compared with Kushana coins."}, {"q": "What was the effect of limited money use on ordinary people, according to the key point?", "options": ["They relied on barter and local transactions", "They relied entirely on gold coins", "They used only Roman currency", "They stopped local exchange"], "answer": 0, "explanation": "The page says limited use of money meant common people relied on barter and local transactions."}, {"q": "What happened to long-distance trade during the Gupta period, according to the notes?", "options": ["It expanded rapidly", "It declined", "It was controlled only by the state", "It shifted entirely to Central Asia"], "answer": 1, "explanation": "The trade section states that long-distance trade declined during the Gupta period."}, {"q": "After which century AD did trade with the Roman Empire decline, according to the page?", "options": ["1st century AD", "2nd century AD", "3rd century AD", "5th century AD"], "answer": 2, "explanation": "The notes say trade with the Roman Empire declined after the 3rd century AD."}, {"q": "On which trade region did Indian merchants increasingly depend?", "options": ["South-East Asian trade", "Only Roman trade", "Only Central Asian trade", "Only West African trade"], "answer": 0, "explanation": "The page says Indian merchants increasingly depended on South-East Asian trade."}, {"q": "Which group contains only East Coast ports listed in the notes?", "options": ["Bharoch, Chaul, Kalyan, Cambay", "Tamralipti, Ghantasala, Kandura", "Muzris, Tondi, Barygaza", "Arikamedu, Bharoch, Barbaricum"], "answer": 1, "explanation": "The East Coast ports listed are Tamralipti, Ghantasala and Kandura."}, {"q": "Which group contains only West Coast ports listed in the notes?", "options": ["Tamralipti, Ghantasala, Kandura", "Bharoch, Chaul, Kalyan, Cambay", "Puhar, Muzris, Tondi", "Kandura, Kalyan, Tamralipti"], "answer": 1, "explanation": "The West Coast ports listed are Bharoch, Chaul, Kalyan and Cambay."}, {"q": "The East Coast ports listed were associated with trade with which region?", "options": ["Mediterranean and West Asia", "South-East Asia", "Central Asia", "East Africa"], "answer": 1, "explanation": "The page connects the East Coast ports with trade with South-East Asia."}, {"q": "The West Coast ports listed were associated with trade with which regions?", "options": ["South-East Asia only", "Mediterranean and West Asia", "China and Japan only", "Sri Lanka only"], "answer": 1, "explanation": "The notes connect the West Coast ports with trade with the Mediterranean and West Asia."}, {"q": "Which overall trend is given in the concluding line of the page?", "options": ["Rise in long-distance trade, decline of land grants and centralisation", "Decline in long-distance trade, rise of land grants and decentralisation, with major social and religious changes", "Complete collapse of agriculture and urban life", "End of social and religious change"], "answer": 1, "explanation": "The conclusion links the Gupta period with decline in long-distance trade, rise of land grants and decentralisation, and social and religious changes shaping medieval India."}];const KEY='ancient_gupta_society_economy_page10_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
