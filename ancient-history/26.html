<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ancient History – Mauryan Administration MCQ Quiz</title>
<style>
:root{--navy:#102c70;--blue:#1d4ed8;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--bg:#f3f6fb;--green:#137547;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(110deg,#071d58,#17439a);color:white;padding:24px 16px;text-align:center}
header h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0;transition:width .2s}
h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}
.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}
.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700}
@media(max-width:520px){.panel{padding:17px}.stats{grid-template-columns:1fr 1fr}.opt{font-size:15px}}
</style></head><body>
<header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Mauryan Administration · Notes Page 1 · 24 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz">
<div class="top"><span id="count">Question 1 of 24</span><span id="answered">Answered: 0 / 24</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="tag" id="difficulty" style="color:#3159a5">PAGE-BASED PRACTICE</div>
<h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div>
<div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div>
<p class="small">Your answers and progress are saved locally in this browser on this device.</p>
</section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score">0/24</strong>Score</div><div class="stat"><strong id="accuracy">0%</strong>Accuracy</div><div class="stat"><strong id="wrongCount">0</strong>Incorrect</div></div>
<div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original = [{"q": "According to Kautilya's Saptanga Theory, how many elements constitute the state?", "options": ["Five", "Six", "Seven", "Eight"], "answer": 2, "explanation": "The notes list seven elements: Raja, Amatya, Janapada, Durga, Kosha, Sena and Mitra."}, {"q": "In the Saptanga Theory, which element means territory?", "options": ["Amatya", "Janapada", "Durga", "Kosha"], "answer": 1, "explanation": "Janapada means territory. Durga means fort, while Kosha means treasury."}, {"q": "Which pair is correctly matched in the Saptanga Theory?", "options": ["Sena – Treasury", "Mitra – Army", "Durga – Fort", "Amatya – Friend"], "answer": 2, "explanation": "Durga means fort. Sena means army, Mitra means friend and Amatya means secretaries."}, {"q": "Which element was regarded as the soul of all seven elements?", "options": ["Amatya", "Raja (King)", "Kosha", "Mitra"], "answer": 1, "explanation": "The notes state that the King was regarded as the soul of all seven elements."}, {"q": "Who assisted the king as part of the Mantri Parishad?", "options": ["Only the Yuvaraja", "Yuvaraja, Purohita, Senapati and other ministers", "Only the Nagarak", "The provincial governors only"], "answer": 1, "explanation": "The Mantri Parishad assisted the king. The listed members/officials are Yuvaraja, Purohita, Senapati and other ministers."}, {"q": "What was the designation of the crown prince?", "options": ["Purohita", "Senapati", "Yuvaraja", "Nagarak"], "answer": 2, "explanation": "Yuvaraja means Crown Prince."}, {"q": "Match the official with the role: Purohita.", "options": ["Chief Priest", "Commander-in-Chief", "Crown Prince", "City Superintendent"], "answer": 0, "explanation": "Purohita was the Chief Priest. Senapati was Commander-in-Chief and Yuvaraja was Crown Prince."}, {"q": "Which province-capital pair is incorrect according to the notes?", "options": ["Uttarapatha – Taxila", "Avantirashtra – Ujjain", "Prachi – Tosali", "Dakshinapatha – Suvarnagiri"], "answer": 2, "explanation": "Prachi (East & Central) had Pataliputra as its capital. Kalinga had Tosali."}, {"q": "Which was the capital of Kalinga province?", "options": ["Taxila", "Tosali", "Ujjain", "Pataliputra"], "answer": 1, "explanation": "The notes list Kalinga (East) – Tosali."}, {"q": "Which province was headquartered at Suvarnagiri?", "options": ["Uttarapatha", "Avantirashtra", "Prachi", "Dakshinapatha"], "answer": 3, "explanation": "Dakshinapatha (South) had Suvarnagiri as its capital/headquarters."}, {"q": "According to the Junagadh Rock Edict information on the page, who governed Saurashtra during Chandragupta Maurya?", "options": ["Tushaspa", "Pushyagupta", "Megasthenes", "Yuvaraja"], "answer": 1, "explanation": "Pushyagupta (Vaishya) governed Saurashtra during Chandragupta Maurya."}, {"q": "Who governed Saurashtra during Ashoka, according to the notes?", "options": ["Pushyagupta", "Tushaspa", "Senapati", "Nagarak"], "answer": 1, "explanation": "The notes identify the Yavana king Tushaspa as the governor during Ashoka."}, {"q": "Who was the city superintendent, and what was his main duty?", "options": ["Senapati; army organisation", "Nagarak; law and order", "Purohita; religious duties", "Amatya; treasury"], "answer": 1, "explanation": "Nagarak means City Superintendent; the main duty noted is maintaining law and order."}, {"q": "According to Megasthenes, how was municipal administration organised?", "options": ["Four committees of six members", "Six committees of five members each", "Five committees of six members each", "Seven committees of five members each"], "answer": 1, "explanation": "Megasthenes described six committees, each consisting of five members."}, {"q": "Which municipal committee dealt with the registration of births and deaths?", "options": ["Industrial arts", "Entertainment of foreigners", "Third committee", "Trade and commerce"], "answer": 2, "explanation": "The third committee handled registration of births and deaths."}, {"q": "Which municipal committee was responsible for the public sale of manufactured goods?", "options": ["Second", "Fourth", "Fifth", "Sixth"], "answer": 2, "explanation": "The fifth committee dealt with the public sale of manufactured goods."}, {"q": "What tax was collected on sold goods by the sixth municipal committee?", "options": ["1/4 of purchase price", "1/6 of purchase price", "1/10 of purchase price", "1/12 of purchase price"], "answer": 2, "explanation": "The notes state that the sixth committee collected taxes on sold goods at 1/10 of the purchase price."}, {"q": "Megasthenes' army administration had how many officers divided into how many committees?", "options": ["30 officers; 6 committees", "30 officers; 5 committees", "25 officers; 5 committees", "35 officers; 7 committees"], "answer": 0, "explanation": "The page states that the army was managed by 30 officers, divided into six committees of five."}, {"q": "Which one is NOT among the six army committees listed?", "options": ["Infantry", "Cavalry", "Elephants", "Agriculture"], "answer": 3, "explanation": "The six listed committees were Infantry, Cavalry, Elephants, Chariots, Navy and Transport."}, {"q": "What was the difference between Sansthan and Sanchari Gudhapurushas?", "options": ["Sansthan were wandering; Sanchari stationary", "Sansthan were stationary; Sanchari wandering", "Both were stationary", "Both were commanders"], "answer": 1, "explanation": "The notes define Sansthan as stationary and Sanchari as wandering detectives."}, {"q": "According to the notes, peasant tax amounted to what fraction of produce?", "options": ["1/10 to 1/12", "1/4 to 1/6", "1/2 to 1/3", "1/6 to 1/8"], "answer": 1, "explanation": "The page gives the peasant tax as 1/4 to 1/6 of produce."}, {"q": "What were Setubandha and the water tax associated with?", "options": ["The state provided irrigation and charged water tax", "The army's transport committee", "Municipal sale of goods", "Port customs alone"], "answer": 0, "explanation": "The state provided irrigation (Setubandha) and charged water tax, according to the notes."}, {"q": "Which statement about Mauryan state monopoly is supported by the page?", "options": ["It was limited to textiles", "It included mining, forests, salt, liquor and arms manufacture, among others", "It applied only to ports", "It covered only agriculture"], "answer": 1, "explanation": "The notes list mining, forests, salt, liquor and arms manufacture among state-monopoly activities."}, {"q": "Which port-currency combination is correct according to the page?", "options": ["Tamralipti – Western Coast; punch-marked gold coins", "Bharukaccha/Bharoch and Sopara – Western Coast; punch-marked coins mostly silver", "Taxila – Eastern Coast; copper coins", "Tosali – Western Coast; silver ingots"], "answer": 1, "explanation": "Bharukaccha/Bharoch and Sopara are listed on the Western Coast; Tamralipti is on the Bengal/Eastern Coast. Common transaction currency was punch-marked coins, mostly silver."}];
const KEY='ancient_mauryan_admin_page1_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={}, index=0, mode='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,mode,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders){s.optionOrders.forEach(saved=>{let q=questions.find(x=>x.id===saved.id);if(q)q.options=saved.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}}catch(e){}}
function render(){
 const q=questions[index], chosen=answers[q.id];
 document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;
 document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;
 document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';
 document.getElementById('question').textContent=q.q;
 const area=document.getElementById('options');area.innerHTML='';
 q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;
 if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}
 b.onclick=()=>choose(j);area.appendChild(b);});
 const fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';
 if(chosen!==undefined){let correct=q.options[chosen].correct;fb.classList.add('show',correct?'good':'bad');fb.innerHTML='<strong>'+(correct?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
 document.getElementById('prev').disabled=index===0;
 document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';
}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}
function prev(){if(index>0){index--;save();render();}}
function showResults(){
 document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';
 let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length;
 let wrong=questions.length-correct, pct=Math.round(correct/questions.length*100);
 document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;
 document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for the questions you missed.`;
 let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';
 questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});
 save();
}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}
 questions=wrong;answers={};index=0;mode='wrong';document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;
load();render();
</script></body></html>
