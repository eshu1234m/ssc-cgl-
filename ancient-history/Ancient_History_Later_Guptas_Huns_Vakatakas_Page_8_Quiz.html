 as a great physician."}, {"q": "Who is associated with Panch Siddhantika, Brihat Samhita and Brihat Jataka?", "options": ["Kalidasa", "Varahamihira", "Amarsinh", "Shanku"], "answer": 1, "explanation": "Varahamihira is associated with these astronomical and astrological works."}, {"q": "Which Navaratna is described as a grammarian and Sanskrit scholar?", "options": ["Vararuchi", "Kshapanaka", "Velabhatt", "Ghatkhapara"], "answer": 0, "explanation": "Vararuchi is identified as a grammarian and Sanskrit scholar."}, {"q": "Which Navaratna is identified as an astrologer?", "options": ["Shanku", "Kshapanaka", "Velabhatt", "Dhanavantri"], "answer": 1, "explanation": "Kshapanaka is listed as an astrologer."}, {"q": "Who is listed as the magician among Chandragupta II's Navaratnas?", "options": ["Ghatkhapara", "Velabhatt", "Shanku", "Vararuchi"], "answer": 1, "explanation": "Velabhatt is identified as a magician."}, {"q": "Who succeeded Chandragupta II, and what was his reign period?", "options": ["Skandagupta, 455–467 AD", "Kumaragupta I, 415–455 AD", "Samudragupta, 335–380 AD", "Ramagupta, 380–414 AD"], "answer": 1, "explanation": "Kumaragupta I succeeded Chandragupta II and ruled from 415–455 AD."}, {"q": "Which deity was worshipped by Kumaragupta I, according to the notes?", "options": ["Shiva", "Kartikeya", "Vishnu", "Buddha"], "answer": 1, "explanation": "The page describes Kumaragupta I as a worshipper of Karttikeya."}, {"q": "Which major educational institution was founded by Kumaragupta I?", "options": ["Vallabhi Mahavihara", "Nalanda Mahavihara", "Taxila University", "Vikramashila Mahavihara"], "answer": 1, "explanation": "Kumaragupta I founded Nalanda Mahavihara, which later became a great centre of learning."}, {"q": "Which set of titles is associated with Kumaragupta I?", "options": ["Sakari, Vikramaditya", "Mahendraditya, Mahendra Singh, Ashvamedha Mahendra", "Kaviraja, Param Bhagavata", "Kramaditya, Shakrapalina"], "answer": 1, "explanation": "The notes list upied Central India and Malwa around 500 AD when Gupta resistance weakened."}, {"q": "Which Hun rulers are named as powerful rulers, and what dates are given?", "options": ["Toramana and Mihirkul, 500–530 AD", "Joramana and Mihirkul, 500–530 AD", "Mihirkul and Yashodharmana, 455–467 AD", "Toramana and Kanishka, 78–101 AD"], "answer": 1, "explanation": "The page names Joramana and his son Mihirkul as powerful rulers, with dates 500–530 AD."}, {"q": "Which religious description is given for Mihirkul?", "options": ["Buddhist; patronised monasteries", "Shaivite; persecuted Buddhism", "Jain; patronised Jain monks", "Vaishnavite; built Vishnu temples"], "answer": 1, "explanation": "The notes describe Mihirkul as Shaivite and say he persecuted Buddhism."}, {"q": "Who uprooted the Huns in 530 AD, according to the notes?", "options": ["Skandagupta", "Yashodharmana of Mandsaur", "Chandragupta II", "Pravarasena II"], "answer": 1, "explanation": "The page states that the Huns were uprooted in 530 AD by Yashodharmana of Mandsaur."}, {"q": "The Vakatakas were a major power in which region and period?", "options": ["North India, 4th–6th century AD", "Deccan and Central India, 3rd–5th century AD", "Western India, 1st–3rd century AD", "Kalinga, 1st century BC"], "answer": 1, "explanation": "The notes describe the Vakatakas as a major power in Deccan and Central India during the 3rd–5th centuries AD."}, {"q": "Who founded the Vakataka dynasty, and what dates are given?", "options": ["Pravarasena I, 275–335 AD", "Vindhyashakti, 255–275 AD", "Rudrasena I, 335–355 AD", "Rudrasena II, 380–414 AD"], "answer": 1, "explanation": "Vindhyashakti (255–275 AD) is identified as the founder."}, {"q": "Who was the son of Vindhyashakti and is described as the real founder of the Vakataka Empire?", "options": ["Rudrasena I", "Pravarasena I", "Pravarasena II", "Damodarsena"], "answer": 1, "explanation": "Pravarasena I (275–335 AD) was the son of Vindhyashakti and is described as the real founder of the Vakataka Empire."}, {"q": "How many Ashvamedha Yajnas did Pravarasena I perform?", "options": ["Two", "Three", "Four", "Five"], "answer": 2, "explanation": "The notes state that Pravarasena I performed four Ashvamedha Yajnas."}, {"q": "What happened to the Vakataka Empire after Pravarasena I's death?", "options": ["It remained united under one successor", "It was divided", "It was annexed by the Huns", "It moved its capital to Ujjain"], "answer": 1, "explanation": "The page states that the empire was divided after Pravarasena I's death."}, {"q": "Who ruled the Northern branch of the Vakatakas and was contemporary with Samudragupta?", "options": ["Rudrasena I", "Rudrasena II", "Prithivisena I", "Pravarasena II"], "answer": 0, "explanation": "Rudrasena I ruled the Northern branch and was contemporary with Samudragupta."}, {"q": "Who succeeded Rudrasena I, according to the Vakataka section?", "options": ["Prithivisena I", "Pravarasena II", "Damodarsena", "Vindhyashakti"], "answer": 0, "explanation": "The notes state that Rudrasena I was succeeded by Prithivisena I."}, {"q": "Who was the Vakataka ruler who married Chandragupta II's daughter Prabhavatigupta?", "options": ["Rudrasena I", "Rudrasena II", "Pravarasena I", "Pravarasena II"], "answer": 1, "explanation": "Rudrasena II married Prabhavatigupta, daughter of Chandragupta II."}, {"q": "How long did Rudrasena II rule, according to the notes?", "options": ["Three years", "Five years", "Ten years", "Twenty years"], "answer": 1, "explanation": "The page says Rudrasena II ruled only five years."}, {"q": "Which two minor sons of Rudrasena II are named in the notes?", "options": ["Divakarasena and Damodarsena", "Prithivisena and Vindhyashakti", "Rudrasena and Pravarasena", "Kumaragupta and Skandagupta"], "answer": 0, "explanation": "The two minor sons named are Divakarasena and Damodarsena."}, {"q": "Who ruled as regent after Rudrasena II?", "options": ["Kuberanaga", "Prabhavatigupta", "Dhruvadevi", "Kumaradevi"], "answer": 1, "explanation": "Prabhavatigupta ruled as regent after Rudrasena II."}, {"q": "Who later became known as Pravarasena II?", "options": ["Divakarasena", "Damodarsena", "Prithivisena I", "Rudrasena I"], "answer": 1, "explanation": "The notes state that Damodarsena later became Pravarasena II."}, {"q": "Which work is attributed to Pravarasena II, and in which script/language tradition is it described?", "options": ["Setubandh/Ravanaho, in Marathi script", "Meghadutam, in Sanskrit", "Tolkappiyam, in Tamil", "Brihat Samhita, in Prakrit"], "answer": 0, "explanation": "Pravarasena II composed Setubandh/Ravanaho, described in the notes as being in Marathi script."}];const KEY='ancient_later_guptas_huns_vakatakas_page8_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;

function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';

document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}

function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
