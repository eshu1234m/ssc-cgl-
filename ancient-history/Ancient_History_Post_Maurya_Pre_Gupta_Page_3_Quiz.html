.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stat </style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Post-Maurya / Pre-Gupta Period · Notes Page 3 · 34 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>

<script>
const original=[{"q": "When did the Sunga Dynasty rule, according to the notes?", "options": ["185–73 BC", "73–28 BC", "60 BC–225 AD", "1st century BC–3rd century AD"], "answer": 0, "explanation": "The Sunga Dynasty is dated 185–73 BC in the notes."}, {"q": "What was the capital of the Sunga Dynasty?", "options": ["Pataliputra", "Vidisha (Madhya Pradesh)", "Pratishthana", "Taxila"], "answer": 1, "explanation": "The Sunga capital is given as Vidisha (M.P.)."}, {"q": "Who founded the Sunga Dynasty?", "options": ["Agnimitra", "Vasudeva", "Pushyamitra Sunga", "Brihadratha"], "answer": 2, "explanation": "Pushyamitra Sunga, a Brahmin Commander-in-Chief, founded the Sunga Dynasty."}, {"q": "How did Pushyamitra Sunga establish his rule?", "options": ["He defeated Kharavela", "He killed the last Mauryan ruler Brihadratha in 185 BC", "He overthrew Devabhuti in 73 BC", "He defeated Nahapana"], "answer": 1, "explanation": "The notes state that Pushyamitra killed the last Mauryan ruler Brihadratha in 185 BC."}, {"q": "Which stupa was built during the Sunga period?", "options": ["Amaravati Stupa", "Bharhut Stupa", "Nagarjunakonda Stupa", "Dhamek Stupa"], "answer": 1, "explanation": "The Bharhut Stupa is specifically mentioned as having been built during the Sunga period."}, {"q": "Who succeeded Pushyamitra Sunga and is identified as the hero of Kalidasa's Malavikagnimitra?", "options": ["Vasumitra", "Agnimitra", "Bhagabhadra", "Devabhuti"], "answer": 1, "explanation": "Agnimitra succeeded Pushyamitra and is described as the hero of Kalidasa's Malavikagnimitra."}, {"q": "Which set contains the later Sunga rulers listed in the notes?", "options": ["Simuka, Hala, Yajna Sri", "Vasumitra, Vajramitra, Bhagabhadra, Devabhuti", "Vasudeva, Devabhuti, Kharavela", "Nahapana, Rudradaman, Pulamavi"], "answer": 1, "explanation": "The later Sunga rulers listed are Vasumitra, Vajramitra, Bhagabhadra and Devabhuti. The page characterises these later rulers as weak and says the dynasty declined."}, {"q": "Which religious development became important during the Sunga period?", "options": ["Bhagavata religion", "Only Ajivika religion", "Zoroastrianism", "Shaiva Siddhanta"], "answer": 0, "explanation": "The notes mention Brahmanical revival and the growing importance of Bhagavata religion."}, {"q": "Who authored the Mahabhashya and served as priest at Pushyamitra's two Ashvamedha Yajnas?", "options": ["Gunadhya", "Patanjali", "Hala", "Kalidasa"], "answer": 1, "explanation": "Patanjali is identified as the author of Mahabhashya and priest of Pushyamitra's two Ashvamedha Yajnas."}, {"q": "Which group of monuments is associated with Sunga art in the notes?", "options": ["Bharhut Stupa and Sanchi gateway railing", "Amaravati and Nagarjunakonda stupas only", "Barabar and Nagarjuni caves", "Udayagiri caves and Hathigumpha"], "answer": 0, "explanation": "Sunga art examples listed include Bharhut Stupa and Sanchi gateway railing. Other examples on the page are Bhaja Vihara, Chaitya and Stupa (Poona), Amaravati Stupa and Nasik Chaitya."}, {"q": "What was the capital of the Kanva Dynasty?", "options": ["Vidisha", "Pataliputra", "Pratishthana", "Kalinga"], "answer": 1, "explanation": "Pataliputra is given as the Kanva capital."}, {"q": "Who was the last Sunga ruler, murdered in 73 BC?", "options": ["Bhagabhadra", "Devabhuti", "Vasumitra", "Agnimitra"], "answer": 1, "explanation": "Devabhuti was the last Sunga ruler and was murdered in 73 BC."}, {"q": "Who murdered Devabhuti and founded the Kanva Dynasty?", "options": ["Kharavela", "Vasudeva", "Simuka", "Gautamiputra Satakarni"], "answer": 1, "explanation": "The notes state that Devabhuti was murdered by his minister Vasudeva, who founded the Kanva Dynasty."}, {"q": "What was the capital of the Satavahana Dynasty?", "options": ["Vidisha", "Pataliputra", "Pratishthana/Paithan, Maharashtra", "Tosali"], "answer": 2, "explanation": "The Satavahana capital is given as Pratishthana/Paithan in Maharashtra."}, {"q": "The Satavahanas are described as the most important native successors of the Mauryas in which region?", "options": ["North-West India", "Deccan and Central India", "Gangetic delta only", "Kashmir and Punjab"], "answer": 1, "explanation": "The notes describe them as the most important native successors of the Mauryas in Deccan and Central India."}, {"q": "The Satavahanas are identified with which people mentioned in the Puranas?", "options": ["Kalingas", "Andhras", "Yavanas", "Sakas"], "answer": 1, "explanation": "The notes identify the Satavahanas with the Andhras mentioned in the Puranas."}, {"q": "Where did the early Satavahana rulers appear, according to the notes?", "options": ["Andhra, not Maharashtra", "Maharashtra, not Andhra", "Kalinga", "Magadha"], "answer": 1, "explanation": "The page specifically states that early rulers appeared in Maharashtra, not Andhra."}, {"q": "Who founded the Satavahana Dynasty, and what dates are given for him?", "options": ["Simuka, 60–37 BC", "Satakarni I, 60–37 BC", "Hala, 106–130 AD", "Pulamavi III, 60–37 BC"], "answer": 0, "explanation": "Simuka (60–37 BC) is identified as the founder."}, {"q": "Which Satavahana ruler was the third ruler and expanded power through conquests?", "options": ["Hala", "Satakarni I", "Yajna Sri Satakarni", "Vasisthiputra Sri Satakarni"], "answer": 1, "explanation": "Satakarni I is identified as the third ruler and as having expanded power through conquests."}, {"q": "Who was the 17th Satavahana ruler and author of Gathasaptasati/Sattasai in Prakrit?", "options": ["Gunadhya", "Hala", "Patanjali", "Kalidasa"], "answer": 1, "explanation": "Hala was the 17th ruler and author of Gathasaptasati/Sattasai in Prakrit."}, {"q": "Who was contemporary with Hala and authored Brihat Katha?", "options": ["Gunadhya", "Patanjali", "Vasudeva", "Kharavela"], "answer": 0, "explanation": "Gunadhya was a contemporary of Hala and author of Brihat Katha."}, {"q": "Which Satavahana ruler revived Satavahana power and defeated the Saka Kshatrapa Nahapana?", "options": ["Satakarni I", "Gautamiputra Satakarni", "Yajna Sri Satakarni", "Pulamavi III"], "answer": 1, "explanation": "Gautamiputra Satakarni (106–130 AD) revived Satavahana power and defeated Saka Kshatrapa Nahapana. The notes call him the greatest Satavahana ruler."}, {"q": "Which ruler married Rudradaman's daughter but was defeated by him twice?", "options": ["Vasisthiputra Sri Satakarni", "Yajna Sri Satakarni", "Gautamiputra Satakarni", "Simuka"], "answer": 0, "explanation": "Vasisthiputra Sri Satakarni, the 24th ruler, married Rudradaman's daughter but was defeated by Rudradaman twice."}, {"q": "Who was the 27th Satavahana ruler and the last great ruler?", "options": ["Pulamavi III", "Yajna Sri Satakarni", "Hala", "Satakarni I"], "answer": 1, "explanation": "Yajna Sri Satakarni was the 27th ruler and the last great Satavahana ruler."}, {"q": "Who was the 30th and last Satavahana ruler?", "options": ["Yajna Sri Satakarni", "Vasisthiputra Sri Satakarni", "Pulamavi III", "Simuka"], "answer": 2, "explanation": "Pulamavi III was the 30th and last ruler."}, {"q": "Who succeeded the Satavahanas in the 3rd century AD, according to the notes?", "options": ["Kanvas", "Ikshvakus", "Sungas", "Chedis"], "answer": 1, "explanation": "The notes state that the Satavahanas were succeeded by the Ikshvakus in the 3rd century AD."}, {"q": "Which statement correctly combines the Satavahana-period land-grant developments in the notes?", "options": ["Land grants gave fiscal and administrative immunities to Brahmanas/Buddhist monks, later weakening royal authority; earliest inscriptional evidence is dated to the 1st century BC", "Land grants were made only to soldiers and strengthened the king; earliest evidence is 3rd century AD", "Land grants ended under the Satavahanas; earliest evidence is 1st century AD", "Land grants were limited to Jain monks and began in the Gupta period"], "answer": 0, "explanation": "The page states that land grants with fiscal and administrative immunities to Brahmanas/Buddhist monks later weakened royal authority, and gives the earliest inscriptional evidence in India as 1st century BC."}, {"q": "Which option correctly matches Satavahana cultural and material features from the page?", "options": ["Rock-cut sites: Nasik, Kanheri, Karle; stupas: Amaravati, Nagarjunakonda; language: Prakrit; coins: mainly lead, also copper, bronze and potin", "Rock-cut sites: Sanchi, Bharhut; stupas: Barabar, Nagarjuni; language: Sanskrit; coins: mainly gold", "Rock-cut sites: Udayagiri, Dhauli; stupas: Taxila, Mathura; language: Pali; coins: mainly silver", "Rock-cut sites: Taxila, Ujjain; stupas: Sarnath, Kalsi; language: Tamil; coins: mainly iron"], "answer": 0, "explanation": "The notes list Nasik, Kanheri and Karle as rock-cut Chaitya/Vihara sites; Amaravati and Nagarjunakonda as famous stupas; Prakrit as the official language; and mainly lead coins, with copper, bronze and potin also used."}, {"q": "What effect did land grants with fiscal and administrative immunities to Brahmanas and Buddhist monks eventually have?", "options": ["They strengthened royal authority permanently", "They later weakened royal authority", "They ended the use of Prakrit", "They shifted the capital to Vidisha"], "answer": 1, "explanation": "The notes state that land grants with fiscal and administrative immunities later weakened royal authority."}, {"q": "When did the Chedi/Cheti Dynasty of Kalinga probably rise?", "options": ["After Ashoka, probably in the 1st century BC", "During Chandragupta Maurya", "In the 3rd century AD", "In the 1st century AD"], "answer": 0, "explanation": "The page says the Chedi/Cheti dynasty rose in Kalinga probably in the 1st century BC, after Ashoka's death."}, {"q": "What is the main source for the Chedi/Cheti Dynasty mentioned in the notes?", "options": ["Junagadh Rock Edict", "Hathigumpha Inscription", "Allahabad Pillar Inscription", "Nasik Inscription"], "answer": 1, "explanation": "The Hathigumpha Inscription near Bhubaneswar, Odisha, is identified as the main source."}, {"q": "Which ruler is associated with the Hathigumpha Inscription?", "options": ["Pushyamitra", "Kharavela", "Vasudeva", "Gautamiputra Satakarni"], "answer": 1, "explanation": "The inscription belongs to Kharavela, identified as the third ruler."}, {"q": "Which religion did Kharavela follow, and whom did he patronise?", "options": ["Buddhism; Buddhist monks", "Jainism; Jain monks", "Vaishnavism; Brahmins", "Ajivika; Ajivikas"], "answer": 1, "explanation": "Kharavela is described as a follower of Jainism and a liberal patron of Jain monks."}, {"q": "Where did Kharavela build caves for Jain monks?", "options": ["Barabar Hill near Gaya", "Udayagiri Hill near Bhubaneswar, Odisha", "Kanheri Hill near Mumbai", "Sanchi Hill in Madhya Pradesh"], "answer": 1, "explanation": "The notes state that Kharavela built caves for Jain monks at Udayagiri Hill near Bhubaneswar, Odisha."}];const KEY='ancient_post_maurya_pre_gupta_page3_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
