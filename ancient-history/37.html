nswer": 0, "explanation": "The notes list Vishnu and Kankali Temples at Tigawa, Madhya Pradesh."}, {"q": "Where is the Parvati Temple listed in the architecture section?", "options": ["Khol", "Nachna-Kuthara", "Sirpur", "Bhitargaon"], "answer": 1, "explanation": "The Parvati Temple is listed at Nachna-Kuthara in Madhya Pradesh."}, {"q": "Which temple is identified as a brick temple in the notes?", "options": ["Laxman Temple, Sirpur", "Krishna Brick Temple, Bhitargaon", "Shiva Temple, Khol", "Dashavatara Temple, Deogarh"], "answer": 1, "explanation": "The Krishna Brick Temple at Bhitargaon, Uttar Pradesh, is identified as a brick temple."}, {"q": "Which temple is listed at Sirpur in Madhya Pradesh?", "options": ["Laxman Temple", "Parvati Temple", "Shiva Temple", "Kankali Temple"], "answer": 0, "explanation": "The Laxman Temple at Sirpur, Madhya Pradesh, is listed in the structural temple examples."}, {"q": "Where are the Vishnu and Varaha Temples mentioned in the page?", "options": ["Eran, Madhya Pradesh", "Deogarh, Uttar Pradesh", "Tigawa, Madhya Pradesh", "Ratnagiri, Odisha"], "answer": 0, "explanation": "The Vishnu and Varaha Temples are listed at Eran in Madhya Pradesh."}, {"q": "Which three stupas are listed in the Gupta architecture section?", "options": ["Mirpur Khas, Dhamekh and Ratnagiri", "Sanchi, Bharhut and Amaravati", "Ajanta, Ellora and Bagh", "Deogarh, Bhumra and Tigawa"], "answer": 0, "explanation": "The listed stupas are Mirpur Khas in Sindh, Dhamekh at Sarnath and Ratnagiri in Odisha."}, {"q": "Dhamekh Stupa is located at which place?", "options": ["Mirpur Khas", "Sarnath", "Ratnagiri", "Eran"], "answer": 1, "explanation": "The notes identify Dhamekh Stupa with Sarnath."}, {"q": "Which architectural style developed during the Gupta period?", "options": ["Dravida/Vimana", "Nagara/Shikhara", "Vesara", "Indo-Islamic"], "answer": 1, "explanation": "The page states that the Nagara or Shikhara style developed during the Gupta period."}, {"q": "The Shikhar ": ["Amarsinha", "Kalidasa", "Dhanavantri", "Aryabhatta"], "answer": 1, "explanation": "Kalidasa is described as the 'Shakespeare of India'."}, {"q": "What is Mrichchhakatika also known as?", "options": ["Institutes of Hindu Law", "The Clay Cart", "Sind Hind", "Brihat Samhita"], "answer": 1, "explanation": "Mrichchhakatika is identified as The Clay Cart."}, {"q": "Which characters and theme are associated with Mrichchhakatika in the notes?", "options": ["A love story of poor Brahmin Charudatta and courtesan Vasantasena", "A royal story of Chandragupta and Kumaradevi", "The adventures of Manimekalai", "The life of Buddha preaching Dhamma"], "answer": 0, "explanation": "The page describes Mrichchhakatika as a love story of poor Brahmin Charudatta and courtesan Vasantasena, with realistic city-life depiction."}, {"q": "Into which language was Brahmasiddhanta translated, according to the page?", "options": ["Persian as Sind Hind", "Arabic as Sind Hind", "Greek as Sind Hind", "English as Sind Hind"], "answer": 1, "explanation": "The notes say Brahmasiddhanta was translated into Arabic as Sind Hind."}, {"q": "Which set contains only arguments FOR describing the Gupta period as a Golden Age?", "options": ["Peace and prosperity; enlightened government; tolerance; flourishing Sanskrit, art and literature", "Feudatories; declining trade; urban decline; worsening status of women", "Land grants; serfdom; subinfeudation; social disorder", "Declining guilds; weak central army; rising varna divisions"], "answer": 0, "explanation": "The arguments for include peace and prosperity after foreign rule, enlightened government, religious tolerance and flourishing Sanskrit, art and literature."}, {"q": "Which personality group is given as evidence of flourishing intellectual life in the Gupta period?", "options": ["Kalidasa, Amarsinha, Dhanavantri, Aryabhatta and Varahamihira", "Kovalan, Madhavi, Ilango Adigal and Sittalai Sattanar", "Harisena, Kharavela, Patanjali and Panini", "Fa-Hien, ongside feudalism and gradual decline in trade and urban life", "Only military expansion and centralisation", "Only Buddhist sculpture and foreign trade"], "answer": 1, "explanation": "The exam-focus line balances Gupta achievements in art, literature, Vaishnavism and temple architecture with the rise of feudalism and gradual decline in trade and urban life."}];const KEY='ancient_gupta_art_culture_page11_v1';
