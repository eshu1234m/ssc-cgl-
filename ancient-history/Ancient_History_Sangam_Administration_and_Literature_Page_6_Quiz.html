<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ancient History – Sangam Administration & Literature</title>
<style>
:root{--navy:#102c70;--ink:#172033;--muted:#64748b;--line:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(110deg,#071d58,#17439a);color:white;padding:24px 16px;text-align:center}header h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stats{grid-template-columns:1fr 1fr}.opt{font-size:15px}}
</style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Sangam Administration & Literature · Notes Page 6 · 37 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score"></strong>Score</div><div class="stat"><strong id="accuracy"></strong>Accuracy</div><div class="stat"><strong id="wrongCount"></strong>Incorrect</div></div><div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original=[{"q": "What was the position of the king in Sangam administration?", "options": ["Head of the army only", "Centre of administration", "Head of the village council", "Chief tax collector"], "answer": 1, "explanation": "The notes state that the king was the centre of administration."}, {"q": "Which of the following is NOT a title used for the Sangam king in the notes?", "options": ["Ko", "Mannan", "Vendhan", "Perur"], "answer": 3, "explanation": "The king was called Ko, Mannan, Vendhan, Korravan and Iraivan. Perur means a big village in the kingdom divisions."}, {"q": "Which term in Sangam administration referred to the court of the crowned monarch?", "options": ["Avai", "Ur", "Var iyam", "Mandal am"], "answer": 0, "explanation": "Avai was the court of the crowned monarch."}, {"q": "How many officials formed the Panchamahasabha?", "options": ["Three", "Four", "Five", "Seven"], "answer": 2, "explanation": "Panchamahasabha consisted of five officials."}, {"q": "Which Panchamahasabha official was responsible for ministers?", "options": ["Purohitar", "Amaichchar", "Dutas", "Orar"], "answer": 1, "explanation": "Amaichchar means ministers."}, {"q": "Which official in the Panchamahasabha represented priests?", "options": ["Amaichchar", "Purohitar", "Senapatiyar", "Orar"], "answer": 1, "explanation": "Purohitar means priests."}, {"q": "In the Panchamahasabha, who were the Dutas?", "options": ["Spies", "Envoys", "Commanders", "Tax collectors"], "answer": 1, "explanation": "Dutas were envoys."}, {"q": "Which Panchamahasabha official was the commander?", "options": ["Senapatiyar", "Orar", "Dutas", "Amaichchar"], "answer": 0, "explanation": "Senapatiyar was the commander."}, {"q": "Who were the Orar in the Panchamahasabha?", "options": ["Priests", "Ministers", "Spies", "Envoys"], "answer": 2, "explanation": "Orar were spies."}, {"q": "Which sequence correctly shows the kingdom divisions from largest to smallest in the notes?", "options": ["Ur → Mandalam/Nadu → Sirur → Perur", "Mandalam/Nadu → Ur → Perur → Sirur", "Perur → Sirur → Ur → Mandalam/Nadu", "Mandalam/Nadu → Perur → Ur → Sirur"], "answer": 1, "explanation": "The sequence is Mandalam/Nadu (province), Ur (town), Perur (big village), Sirur (small village)."}, {"q": "What did Karai refer to in Sangam revenue administration?", "options": ["Customs duty", "Land tax", "War booty", "Tax collector"], "answer": 1, "explanation": "Karai was land tax."}, {"q": "Which revenue term referred to tribute from feudatories and war booty?", "options": ["Irai", "Ulgu", "Iravu", "Variyam"], "answer": 0, "explanation": "Irai referred to tribute from feudatories and war booty."}, {"q": "What was Ulgu?", "options": ["Land tax", "Customs duty", "Forced gift", "Tax-yielding territorial unit"], "answer": 1, "explanation": "Ulgu was customs duty."}, {"q": "Which term meant an extra demand or forced gift?", "options": ["Iravu", "Irai", "Variyar", "Karai"], "answer": 0, "explanation": "Iravu meant an extra demand or forced gift."}, {"q": "In the revenue system, what was Variyam?", "options": ["Tax collector", "Tax-yielding territorial unit", "Customs duty", "Land tax"], "answer": 1, "explanation": "Variyam was a tax-yielding territorial unit."}, {"q": "Who was the Variyar?", "options": ["Tax collector", "Commander", "Priest", "Envoy"], "answer": 0, "explanation": "Variyar meant tax collector."}, {"q": "Why was Chola territory especially fertile, according to the notes?", "options": ["It was watered by the Kaveri and had good irrigation", "It received heavy snowfall", "It was irrigated by the Vaigai alone", "It depended entirely on Roman imports"], "answer": 0, "explanation": "The notes link Chola fertility to the Kaveri and good irrigation."}, {"q": "What was a Sangam in the literary tradition described on the page?", "options": ["A royal army council", "An assembly of Tamil poets under Pandyan royal patronage at Madurai", "A tax collection office", "A Buddhist monastery"], "answer": 1, "explanation": "Sangam is described as an assembly of Tamil poets under Pandyan royal patronage at Madurai."}, {"q": "According to tradition in the notes, how long did the Sangam tradition last?", "options": ["999 years", "1,000 years", "9,990 years", "10,000 years"], "answer": 2, "explanation": "The traditional account on the page gives a duration of 9,990 years."}, {"q": "According to the traditional account, how many poets and Pandyan kings attended the Sangam tradition?", "options": ["8,598 poets and 197 Pandyan kings", "8,598 poets and 97 Pandyan kings", "859 poets and 197 Pandyan kings", "9,990 poets and 197 Pandyan kings"], "answer": 0, "explanation": "The notes give 8,598 poets and 197 Pandyan kings."}, {"q": "Who attended the First Sangam, according to the traditional account?", "options": ["Only Tamil kings", "Gods and legendary sages", "Only poets from Madurai", "Roman traders and Tamil poets"], "answer": 1, "explanation": "The First Sangam was attended by Gods and legendary sages; all its works were lost."}, {"q": "What is stated about the literary works of the First Sangam?", "options": ["All works survive", "Only Tolkappiyam survives", "All works were lost", "Only the eight anthologies survive"], "answer": 2, "explanation": "The notes state that all First Sangam works were lost."}, {"q": "Which work is identified as the only surviving work of the Second Sangam?", "options": ["Tirukkural", "Tolkappiyam", "Silappadikaram", "Manimekalai"], "answer": 1, "explanation": "Tolkappiyam, an early Tamil grammar by Tolakappiyar, is identified as the only surviving work of the Second Sangam."}, {"q": "Which statement about the Third Sangam is correct according to the notes?", "options": ["All works were lost", "Most works survive, including Ettutogai, Pattuppattu and Patinenkilkanakku", "Only Tolkappiyam survives", "It was attended only by Gods"], "answer": 1, "explanation": "The notes state that most Third Sangam works survive and list Ettutogai, Pattuppattu and Patinenkilkanakku."}, {"q": "How many anthologies are included in Ettutogai?", "options": ["Five", "Eight", "Ten", "Eighteen"], "answer": 1, "explanation": "Ettutogai means eight anthologies."}, {"q": "What does Pattuppattu refer to?", "options": ["Eight anthologies", "Ten idylls", "Eighteen didactic texts", "Eighteen minor works"], "answer": 1, "explanation": "Pattuppattu refers to ten idylls."}, {"q": "Patinenkilkanakku is described on the page as:", "options": ["Eight anthologies", "Ten idylls", "Eighteen didactic texts", "A collection of five epics"], "answer": 2, "explanation": "Patinenkilkanakku is described as eighteen didactic texts."}, {"q": "Which pair correctly matches the two broad Sangam literary groupings shown on the page?", "options": ["Ettutogai + Pattuppattu – Melakanakku; Patinenkilkanakku – Kilakanakku", "Ettutogai + Patinenkilkanakku – Kilakanakku; Pattuppattu – Melakanakku", "Tolkappiyam – Melakanakku; Silappadikaram – Kilakanakku", "Kural – Melakanakku; Manimekalai – Kilakanakku"], "answer": 0, "explanation": "Ettutogai and Pattuppattu are grouped as Melakanakku (18 major works), while Patinenkilkanakku is grouped as Kilakanakku (18 minor works), as shown in the notes."}, {"q": "Kural/Muppal by Tiruvalluvar belongs to which collection?", "options": ["Ettutogai", "Pattuppattu", "Patinenkilkanakku", "Tolkappiyam"], "answer": 2, "explanation": "The notes place Kural/Muppal in Patinenkilkanakku."}, {"q": "Why is Kural/Muppal called the 'Bible of Tamil Land' in the notes?", "options": ["It describes only warfare", "It deals with polity, ethics and social norms", "It narrates the life of Buddha", "It is a Tamil retelling of the Mahabharata"], "answer": 1, "explanation": "The page calls it the 'Bible of Tamil Land' and says it deals with polity, ethics and social norms."}, {"q": "Which three works are listed as the major epics?", "options": ["Tolkappiyam, Kural, Bharatam", "Silappadikaram, Manimekalai, Sivaga Sindamani", "Ettutogai, Pattuppattu, Patinenkilkanakku", "Ramayana, Mahabharata, Arthashastra"], "answer": 1, "explanation": "The major epics listed are Silappadikaram, Manimekalai and Sivaga Sindamani."}, {"q": "Who wrote Silappadikaram, and whose story does it narrate?", "options": ["Sittalai Sattanar; Manimekalai", "Ilango Adigal; Kovalan and Madhavi", "Tiruvalluvar; Kannagi and Kovalan", "Perundevanar; Karikala and Elara"], "answer": 1, "explanation": "Silappadikaram was written by Ilango Adigal and tells the story of Kovalan and Madhavi of Kaveripattinam."}, {"q": "Which description is associated with Silappadikaram?", "options": ["Bible of Tamil Land", "Iliad of Tamil poetry", "Tamil Mahabharata", "Early Tamil grammar"], "answer": 1, "explanation": "The notes call Silappadikaram the 'Iliad of Tamil poetry'."}, {"q": "Who authored Manimekalai?", "options": ["Ilango Adigal", "Sittalai Sattanar", "Jain Tiruttakkadevar", "Perundevanar"], "answer": 1, "explanation": "Manimekalai was written by Sittalai Sattanar."}, {"q": "Manimekalai is described as a sequel to which work, and is strongly linked to which religion?", "options": ["Silappadikaram; Buddhism", "Sivaga Sindamani; Jainism", "Bharatam; Hinduism", "Tolkappiyam; Buddhism"], "answer": 0, "explanation": "Manimekalai is a sequel to Silappadikaram, follows the adventures of Manimekalai (daughter of Kovalan and Madhavi), and is strongly linked to Buddhism."}, {"q": "Sivaga Sindamani (Jivaka Chintamani) is strongly linked to which religion?", "options": ["Buddhism", "Jainism", "Shaivism", "Vaishnavism"], "answer": 1, "explanation": "The notes state that Sivaga Sindamani by Jain Tiruttakkadevar is strongly linked to Jainism."}, {"q": "Who wrote Bharatam, described as a Tamil version or retelling of the Mahabharata?", "options": ["Tiruvalluvar", "Perundevanar", "Ilango Adigal", "Sittalai Sattanar"], "answer": 1, "explanation": "Bharatam was written by Perundevanar and is described as a Tamil version/retelling of the Mahabharata."}];const KEY='ancient_sangam_administration_literature_page6_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
