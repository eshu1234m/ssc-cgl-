<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ancient History – Mauryan Society & Art</title>
<style>
:root{--navy:#102c70;--ink:#172033;--muted:#64748b;--line:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(110deg,#071d58,#17439a);color:white;padding:24px 16px;text-align:center}header h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stats{grid-template-columns:1fr 1fr}.opt{font-size:15px}}
</style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Mauryan Society & Art · Notes Page 2 · 30 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score"></strong>Score</div><div class="stat"><strong id="accuracy"></strong>Accuracy</div><div class="stat"><strong id="wrongCount"></strong>Incorrect</div></div><div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original=[{"q": "According to the notes, whose view of the Varna system was less rigid than that of earlier Smriti writers?", "options": ["Megasthenes", "Kautilya (Chanakya/Vishnugupta)", "Ashoka", "Anand Coomaraswamy"], "answer": 1, "explanation": "The page states that Kautilya/Chanakya/Vishnugupta was less rigid about the Varna system than earlier Smriti writers."}, {"q": "How did the Arthashastra classify Shudras, according to the page?", "options": ["As Mlechchhas", "As Aryans, distinct from Mlechchhas", "As foreigners", "As a class outside society"], "answer": 1, "explanation": "The notes state that the Arthashastra considered Shudras as Aryans, distinct from Mlechchhas (non-Aryans)."}, {"q": "Which statement best describes the social change between Vaishyas and Shudras noted on the page?", "options": ["The gap increased", "The gap disappeared completely", "The gap decreased", "The two groups exchanged positions"], "answer": 2, "explanation": "The page explicitly notes that the gap between Vaishyas and Shudras decreased."}, {"q": "Which occupation pattern is given for Vaishyas?", "options": ["Mainly agriculture, some trade", "Mainly trade, some agriculture", "Only artisan work", "Mainly military service"], "answer": 1, "explanation": "The notes say Vaishyas were mainly engaged in trade, with some agriculture."}, {"q": "Which description of Shudras is given in the notes?", "options": ["Many became agriculturists and others artisans", "All became traders", "They were exclusively soldiers", "They were mainly priests"], "answer": 0, "explanation": "The page says many Shudras became agriculturists and others became artisans."}, {"q": "How many classes did Megasthenes describe in Mauryan society?", "options": ["Five", "Six", "Seven", "Eight"], "answer": 2, "explanation": "The page lists Megasthenes' seven classes."}, {"q": "Which of the following is NOT one of Megasthenes' seven classes listed on the page?", "options": ["Philosophers", "Farmers", "Merchants", "Magistrates"], "answer": 2, "explanation": "The seven listed classes are Philosophers, Farmers, Soldiers, Herdsmen, Artisans, Magistrates and Councillors. Merchants are not listed as a separate class here."}, {"q": "What important qualification does the page give about Megasthenes' seven classes?", "options": ["They were hereditary castes", "They were mainly economic rather than social classes", "They were military ranks", "They applied only to cities"], "answer": 1, "explanation": "The notes emphasise that these were mainly economic rather than social classes."}, {"q": "What does the page say about Megasthenes' statement that there was no slavery in India?", "options": ["It is accepted without qualification", "Indian sources confirm slavery existed; he likely meant slavery in the Western legal sense", "It refers only to women", "It proves slavery began after the Mauryas"], "answer": 1, "explanation": "The notes contrast Megasthenes' statement with Indian sources confirming slavery during Mauryan times, and suggest he likely meant slavery in the Western legal sense."}, {"q": "Which statement about women in Mauryan society is given on the page?", "options": ["Women had no public roles", "Women enjoyed a high position and considerable freedom", "Women could not remarry", "Women were excluded from royal service"], "answer": 1, "explanation": "The notes state that women enjoyed a high position and considerable freedom."}, {"q": "According to the notes, what did Kautilya permit women to do?", "options": ["Only inherit property", "Divorce and remarry", "Join only religious institutions", "Become provincial governors"], "answer": 1, "explanation": "The page states: Kautilya → women could divorce/remarry."}, {"q": "Which roles for women are specifically mentioned in the notes?", "options": ["Tax collectors and judges only", "King's bodyguards, spies and other jobs", "Only farmers and artisans", "Only royal teachers"], "answer": 1, "explanation": "The page says women worked as the king's bodyguards, spies and in other jobs."}, {"q": "Who is associated with the classification of Mauryan art into Royal/Court Art and Folk/Popular Art?", "options": ["Megasthenes", "Anand Coomaraswamy", "Kautilya", "Dasharatha"], "answer": 1, "explanation": "The heading on the page attributes this classification to Anand Coomaraswamy."}, {"q": "Which example is placed under Royal/Court Art?", "options": ["Parkham Yaksha", "Terracotta toys", "Chandragupta Maurya's palace at Kumrahar", "Besanagar Yakshini"], "answer": 2, "explanation": "The Royal/Court Art list includes Chandragupta Maurya's palace at Kumrahar (Patna), Pataliputra, Ashokan pillars, caves and stupas."}, {"q": "Where was Chandragupta Maurya's palace located according to the page?", "options": ["Taxila", "Kumrahar (Patna)", "Sanchi", "Kanaganahalli"], "answer": 1, "explanation": "The notes identify Chandragupta Maurya's palace at Kumrahar (Patna)."}, {"q": "Which group of examples belongs to Folk/Popular Art in the page's classification?", "options": ["Ashokan pillars, caves and stupas", "Yaksha-Yakshini sculptures and terracotta objects", "The palace at Kumrahar and Pataliputra", "Only the Sarnath capital"], "answer": 1, "explanation": "Folk/Popular Art includes Yaksha-Yakshini sculptures and terracotta objects."}, {"q": "Parkham Yaksha is associated with which place?", "options": ["Mathura", "Patna", "Madhya Pradesh", "Karnataka"], "answer": 0, "explanation": "The page lists Parkham Yaksha → Mathura."}, {"q": "Besanagar/Vidisha Yakshini is associated with which state abbreviation shown in the notes?", "options": ["Uttar Pradesh", "Bihar", "Madhya Pradesh", "Karnataka"], "answer": 2, "explanation": "The notes give Besanagar/Vidisha Yakshini → M.P. (Madhya Pradesh)."}, {"q": "Where is the Didarganj Chamar-bearing Yakshini associated with?", "options": ["Mathura", "Patna", "Gaya", "Sarnath"], "answer": 1, "explanation": "The page lists Didarganj Chamar-bearing Yakshini → Patna."}, {"q": "The Ashoka portrait/relief mentioned on the page is located at:", "options": ["Dhauli, Odisha", "Kanaganahalli, Karnataka", "Kumrahar, Bihar", "Sopara, Maharashtra"], "answer": 1, "explanation": "The notes associate the Ashoka portrait/relief with Kanaganahalli, Karnataka."}, {"q": "What major development in stone construction is attributed to the Mauryas, especially under Ashoka?", "options": ["Introduction of brick temples", "Large-scale stone masonry", "Use of iron pillars", "Construction of rock-cut stupas only"], "answer": 1, "explanation": "The page states that the Mauryas introduced large-scale stone masonry, especially under Ashoka."}, {"q": "What material and construction feature are highlighted for Mauryan pillars?", "options": ["Multiple sandstone blocks joined together", "Single-piece sandstone shafts with lion/bull capitals", "Wooden shafts with copper capitals", "Granite pillars with horse capitals"], "answer": 1, "explanation": "The notes describe Mauryan pillars as single-piece sandstone, with capitals of lions or bulls attached at the top."}, {"q": "When was the Sarnath Four-Lion Capital adopted as the National Emblem of India?", "options": ["15 August 1947", "26 January 1950", "2 October 1950", "26 November 1949"], "answer": 1, "explanation": "The page gives 26 January 1950 as the date of adoption of the Sarnath Four-Lion Capital as India's National Emblem."}, {"q": "Which pair of places is associated with single-lion capitals in the notes?", "options": ["Sarnath and Dhauli", "Rampurva and Lauriya Nandangarh", "Kalsi and Bharhut", "Sanchi and Kumrahar"], "answer": 1, "explanation": "The notes list single-lion capitals at Rampurva and Lauriya Nandangarh."}, {"q": "Which place is associated with the single-bull capital?", "options": ["Rampurva", "Sarnath", "Dhauli", "Bharhut"], "answer": 0, "explanation": "The page identifies the single-bull capital at Rampurva."}, {"q": "Which statement correctly matches the elephant artworks and cave sites listed on the page?", "options": ["Elephant carved at Kalsi and engraved at Dhauli; Barabar caves built by Dasharatha", "Elephant carved at Dhauli and engraved at Kalsi; Barabar caves at Jehanabad associated with Ashoka", "Elephant carved at Sanchi and engraved at Bharhut; Barabar caves at Taxila", "Elephant carved at Kanaganahalli and engraved at Kumrahar; Barabar caves at Patna"], "answer": 1, "explanation": "The notes state that an elephant was carved at Dhauli and engraved at Kalsi. They list the Barabar Caves at Jehanabad under Ashoka, including Sudama, World Hut, Chaupad/Karna Chaupar and Rishi Lomesh."}, {"q": "Which ruler is associated with the Nagarjuni Caves at Gaya in the notes?", "options": ["Chandragupta Maurya", "Ashoka", "Dasharatha", "Bindusara"], "answer": 2, "explanation": "The page states: Nagarjuni Caves, Gaya → Dasharatha."}, {"q": "What purpose of stupas is stated on the page, and which two famous examples are named?", "options": ["To store royal weapons; Taxila and Ujjain", "To preserve Buddha's relics; Sanchi and Bharhut", "To house monks; Barabar and Nagarjuni", "To mark trade routes; Sopara and Tamralipti"], "answer": 1, "explanation": "The notes say stupas were built across the empire to preserve Buddha's relics and name Sanchi and Bharhut as famous stupas."}, {"q": "What notable structure is specifically mentioned among the remains at Kumrahar (Patna)?", "options": ["A 40-pillared hall", "An 80-pillared hall", "A 100-pillared hall", "A 200-pillared hall"], "answer": 1, "explanation": "The notes identify the remains of an 80-pillared hall at Kumrahar (Patna)."}, {"q": "Which city is identified as the capital city in the Mauryan art section of the notes?", "options": ["Taxila", "Ujjain", "Pataliputra", "Suvarnagiri"], "answer": 2, "explanation": "The notes explicitly identify Pataliputra as the capital city."}];const KEY='ancient_mauryan_society_art_page2_v2';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0,mode='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,mode,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;mode='wrong';document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
