<style>

.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stats{grid-template-columns:1fr 1fr}.opt{font-size:15px}}

<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score"></strong>Score</div><div class="stat"><strong id="accuracy"></strong>Accuracy</div><div class="stat"><strong id="wrongCount"></strong>Incorrect</div></div><div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original=[{"q": "Compared with Mauryan rule, how was Gupta control described?", "options": ["More centralized", "Less centralized", "Completely absent", "Strictly city-based"], "answer": 1, "explanation": "The notes state that Gupta control was less centralized than Mauryan rule."}, {"q": "What broad change took place in Gupta administration?", "options": ["It became highly centralized", "It became highly decentralized, reflecting a quasi-feudal economy", "It was replaced by village republics", "It became entirely military"], "answer": 1, "explanation": "The page describes Gupta administration as highly decentralized and reflective of a quasi-feudal economy."}, {"q": "Which territories were included in the Gupta Empire besides directly governed areas?", "options": ["Only independent republics", "Self-governing tribes and tributary kingdoms", "Only foreign colonies", "Only coastal trading towns"], "answer": 1, "explanation": "The notes say the empire included self-governing tribes and tributary kingdoms, whose chiefs often represented imperial authority."}, {"q": "Which set contains imperial titles used by Gupta kings in the notes?", "options": ["Maharadhiraja, Samrat, Ekadhiraja, Chakravartin", "Ko, Mannan, Vendhan, Iraivan", "Sakari, Vikramaditya, Kaviraja, Mahendraditya", "Maharaja, Senapati, Duta, Orar"], "answer": 0, "explanation": "The listed Gupta imperial titles are Mahadhiraja, Samrat, Ekadhiraja and Chakravartin."}, {"q": "Which system became common during the Gupta period?", "options": ["Elected king system", "Crown Prince (Kumara) system", "Rotating village leadership", "Republican succession"], "answer": 1, "explanation": "The notes state that the Crown Prince (Kumara) system became common."}, {"q": "Who assisted the Gupta king in administration?", "options": ["A council of ministers", "Only village headmen", "A body of foreign envoys", "The city merchants alone"], "answer": 0, "explanation": "The king was assisted by a Council of Ministers called Mantriparishad or Mantrimandalam."}, {"q": "What was the council of ministers called?", "options": ["Paura", "Mantriparishad / Mantrimandalam", "Panchamahasabha", "Sabha of merchants"], "answer": 1, "explanation": "The notes give the names Mantriparishad and Mantrimandalam for the Council of Ministers."}, {"q": "What does the Prayaga/Allahabad Pillar Inscription mention in connection with Samudragupta?", "options": ["Paura members selecting the king", "Sabhyas (council members) and their role in selecting Samudragupta", "Village headmen electing provincial governors", "Merchants choosing the chief minister"], "answer": 1, "explanation": "The notes say the inscription mentions Sabhyas, council members, and their role in selecting Samudragupta."}, {"q": "What was the role of a Kumaramatya?", "options": ["Chief police officer", "Chief cadre for high officials", "Minister of peace and war", "Chief usher of the royal palace"], "answer": 1, "explanation": "Kumaramatya is described as the chief cadre for high officials."}, {"q": "Which official was the minister of peace and war?", "options": ["Mahadandanayaka", "Sandhivigrahika", "Mahapratihari", "Dandapashika"], "answer": 1, "explanation": "Sandhivigrahika was the minister of peace and war."}, {"q": "What was the role of the Mahadandanayaka?", "options": ["Minister/Officer of Justice", "Chief of elephant corps", "Chief accountant", "Chief merchant-guild representative"], "answer": 0, "explanation": "The notes identify Mahadandanayaka as Minister/Officer of Justice."}, {"q": "Which office did Harishena hold under Samudragupta?", "options": ["Kumaramatya", "Sandhivigrahika", "Mahapratihari", "Vinayasthitisthapak"], "answer": 1, "explanation": "Harishena, under Samudragupta, held the post of Sandhivigrahika."}, {"q": "Who was the Mahapratihari?", "options": ["Chief usher of the royal palace", "Chief police officer", "Chief of cavalry", "Chief of elephant corps"], "answer": 0, "explanation": "Mahapratihari means chief usher of the royal palace."}, {"q": "Which official was the chief police officer?", "options": ["Mahashvapati", "Dandapashika", "Mahipulapati", "Mahapratihari"], "answer": 1, "explanation": "Dandapashika was the chief police officer."}, {"q": "Who was responsible for religious affairs as chief officer?", "options": ["Vinayasthitisthapak", "Sandhivigrahika", "Kumaramatya", "Mahadandanayaka"], "answer": 0, "explanation": "Vinayasthitisthapak was the chief officer of religious affairs."}, {"q": "Which official was the chief of elephant corps?", "options": ["Mahashvapati", "Mahipulapati", "Dandapashika", "Mahapratihari"], "answer": 1, "explanation": "Mahipulapati was the chief of elephant corps."}, {"q": "Which official was the chief of cavalry?", "options": ["Mahashvapati", "Mahipulapati", "Vinayasthitisthapak", "Kumaramatya"], "answer": 0, "explanation": "Mahashvapati was the chief of cavalry."}, {"q": "What were the provinces called in Gupta administration, according to the page?", "options": ["Bhuktis", "Nadus", "Ur", "Vishayas"], "answer": 0, "explanation": "The notes identify provinces as Bhuktis."}, {"q": "What was the name of the council governing a city?", "options": ["Mantriparishad", "Paura", "Sabhyas", "Kumaramatya"], "answer": 1, "explanation": "The city was governed by the Paura council."}, {"q": "Which group is listed as members of the city Paura council?", "options": ["President of city corporation, chief merchant-guild representative, artisan representative and chief accountant", "King, crown prince, chief priest and commander", "Village headman, cavalry chief, elephant chief and police officer", "Only ministers and religious officials"], "answer": 0, "explanation": "The listed Paura members were the president of the city corporation, chief merchant-guild representative, artisan representative and chief accountant."}, {"q": "How did Gupta city administration differ from the Mauryan arrangement described in the notes?", "options": ["Guptas used a government-appointed city committee, while Mauryas used local representatives", "Mauryas used a government-appointed city committee, while Guptas involved local representatives", "Both systems used only royal officers", "Neither system had city administration"], "answer": 1, "explanation": "The notes contrast Mauryan government-appointed city committees with Gupta city administration involving local representatives."}, {"q": "Which development began during the Gupta period, according to the city administration section?", "options": ["Centralisation", "Decentralisation", "Abolition of city councils", "Replacement of towns by villages"], "answer": 1, "explanation": "The page explicitly states that decentralisation began during the Gupta period."}, {"q": "What happened to the position of the village headman during Gupta rule?", "options": ["It became less important", "It became more important", "It was abolished", "It was replaced by the Paura council"], "answer": 1, "explanation": "The notes say the village headman became more important during Gupta rule."}, {"q": "How is Gupta military organisation characterised?", "options": ["Entirely professional and non-feudal", "Feudal in character, although the emperor maintained a large standing army", "Based only on tribal levies", "Without a standing army"], "answer": 1, "explanation": "The page describes Gupta military organisation as feudal in character, though the emperor maintained a large standing army."}, {"q": "Which legal development is highlighted for the Gupta period?", "options": ["Civil and criminal laws were clearly separated for the first time", "Civil and criminal laws were combined", "Only religious law was used", "There was no written legal distinction"], "answer": 0, "explanation": "The notes state that civil and criminal laws were clearly separated for the first time."}, {"q": "What proportion of produce is given as land revenue in the Gupta period?", "options": ["One-tenth to one-twentieth", "One-fourth to one-sixth", "One-half to one-third", "One-fifth to one-eighth"], "answer": 1, "explanation": "The page gives land revenue as one-fourth to one-sixth of produce."}, {"q": "What was Senabhakta?", "options": ["A tax on imported goods", "People had to feed the army when it passed through their area", "Forced labour for royal officials", "A grant of tax-free land"], "answer": 1, "explanation": "Senabhakta meant that people had to feed the army when it passed through their area."}, {"q": "What did Vishti refer to?", "options": ["Land tax", "Forced labour imposed on villagers for the royal army and officials", "Tribute from feudatories", "A tax-yielding territorial unit"], "answer": 1, "explanation": "The notes define Vishti as forced labour imposed on villagers for the royal army and officials."}, {"q": "Which two types of grants are identified as excessive land grants in the notes?", "options": ["Brahmadeya and Devadana", "Agrahara and Devagrahara", "Irai and Ulgu", "Bhukti and Vishaya"], "answer": 1, "explanation": "The page names Agrahara and Devagrahara grants."}, {"q": "What royal rights could land grants transfer, according to the notes?", "options": ["Rights over salt and mines", "Rights over ports and ships", "Rights over forests and elephants only", "Rights over city councils"], "answer": 0, "explanation": "The notes state that land grants could transfer royal rights over salt and mines, which had been royal monopolies under the Mauryas."}, {"q": "Which combination summarises key features of Gupta administration shown at the bottom of the page?", "options": ["Centralised rule, no local government, cash-only revenue", "Decentralised administration, local self-government, capable ministers, land grants, feudal military character and land-tax revenue", "Republican rule, elected kings and no land grants", "Military rule, abolition of ministers and uniform village taxes"], "answer": 1, "explanation": "The summary lists decentralised administration, growth of local self-government, capable ministers and officials, land grants creating landed elites, feudal military character and stable land-tax revenue."}];const KEY='ancient_gupta_administration_page9_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
