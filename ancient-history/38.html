ha's other name?", "options": ["Siladitya", "Vikramaditya", "Sakari", "Mahendraditya"], "answer": 0, "explanation": "Harsha was also known as Siladitya."}, {"q": "When did Harsha ascend the throne, and what era began?", "options": ["606 AD; Harsha Era", "647 AD; Gupta Era", "580 AD; Vikrama Era", "630 AD; Chalukya Era"], "answer": 0, "explanation": "Harsha ascended the throne in 606 AD, marking the beginning of the Harsha Era."}, {"q": "What did Harsha first do to save his sister Rajyashri?", "options": ["Sent her to Kannauj", "Rescued her from the Vindhyan forest when she was about to commit self-immolation", "Married her to Shashanka", "Asked Pulakeshin II to rescue her"], "answer": 1, "explanation": "The notes state that Harsha rescued his widowed sister Rajyashri from the Vindhyan forest when she was about to commit self-immolation."}, {"q": "Which two territories did Harsha unite?", "options": ["Kannauj and Thanesar", "Vatapi and Kanchi", "Gauda and Malwa", "Valabhi and Kalinga"], "answer": 0, "explanation": "Harsha united Kannauj and Thanesar and made Kannauj his capital."}, {"q": "Against whom did Harsha move east to avenge Rajyavardhana and Grahavarman?", "options": ["Pulakeshin II", "Shashanka", "Narasimhavarman I", "Rudrasena II"], "answer": 1, "explanation": "Harsha moved east against Shashanka to avenge Rajyavardhana and Grahavarman."}, {"q": "What was the result of Harsha's first expedition against Gauda?", "options": ["A decisive victory", "Failure", "Annexation of Gauda", "A peace treaty with Pulakeshin II"], "answer": 1, "explanation": "The notes state that Harsha's first expedition against Gauda failed."}, {"q": "Whom did Harsha defeat to restore Dhruvasena II?", "options": ["Pulakeshin II", "Dhruvasena II's father", "Maitraka ruler of Valabhi", "Shashanka"], "answer": 2, "explanation": "The notes say Harsha defeated Dhruvasena II, the Maitraka ruler of Valabhi, and reinstated him."}, {"q": "What diplomatic arrangement followed Harsha's reinstatement of Dhruvasena II?", "options": ["Dhruvasena II married Harsha's daughter and became a feudatory vassal", "Harsha married Dhruvasena II's daughter and annexed Valabhi", "Dhruvasena II became Harsha's crown prince", "Valabhi became the capital of Harsha's empire"], "answer": 0, "explanation": "Harsha reinstated Dhruvasena II and married his daughter to him, making him a feudatory vassal."}, {"q": "Which ruler decisively defeated Harsha's Deccan expedition on the Narmada?", "options": ["Narasimhavarman I", "Pulakeshin II of the Chalukyas of Vatapi", "Shashanka", "Prabhakaravardhana"], "answer": 1, "explanation": "Pulakeshin II defeated Harsha on the Narmada."}, {"q": "What is notable about Harsha's defeat by Pulakeshin II?", "options": ["It was the only defeat of Harsha's victorious career", "It ended the Chalukya dynasty", "It resulted in Harsha conquering Vatapi", "It led to Harsha moving his capital to Kanchi"], "answer": 0, "explanation": "The notes identify this as the only defeat of Harsha's otherwise victorious career."}, {"q": "What title did the Chalukyas give Harsha after his defeat?", "options": ["Lord of the Deccan", "Lord of the whole of Northern country", "Conqueror of Vatapi", "Siladitya of the South"], "answer": 1, "explanation": "The Chalukyas called Harsha 'Lord of the whole of Northern country'."}, {"q": "Which Chinese emperor received an envoy sent by Harsha in 641 AD?", "options": ["Tai-Tsung, Tang emperor of China", "Kublai Khan", "Ming Taizu", "Emperor Wu of Han"], "answer": 0, "explanation": "Harsha sent an envoy to Tai-Tsung, the Tang emperor of China, in 641 AD."}, {"q": "How long did the Chinese pilgrim Hiuen-Tsang stay in Harsha's dominions?", "options": ["About 3 years", "About 5 years", "About 8 years (635–643 AD)", "About 12 years"], "answer": 2, "explanation": "The notes state that Hiuen-Tsang stayed in Harsha's dominions for about eight years, 635–643 AD."}, {"q": "Which two famous assemblies are associated with Harsha in the notes?", "options": ["Kannauj Assembly and Prayaga Assembly", "Thanesar Assembly and Vatapi Assembly", "Nalanda Assembly and Kanchi Assembly", "Gauda Assembly and Valabhi Assembly"], "answer": 0, "explanation": "The page lists the Kannauj Assembly and Prayaga Assembly."}, {"q": "When was the Kannauj Assembly held, and what was its purpose?", "options": ["643 AD; to honour Hiuen-Tsang and promote Mahayana Buddhism", "641 AD; to receive the Chinese envoy", "637 AD; to celebrate Shashanka's death", "643–644 AD; to begin the Kumbha Fair"], "answer": 0, "explanation": "The Kannauj Assembly was held in 643 AD to honour Hiuen-Tsang and promote Mahayana Buddhism."}, {"q": "When was the Prayaga Assembly held?", "options": ["606–607 AD", "637–638 AD", "643–644 AD", "646–647 AD"], "answer": 2, "explanation": "The notes date the Prayaga Assembly to 643–644 AD."}, {"q": "How often was the Prayaga religious festival held, and where?", "options": ["Every 3 years at Kannauj", "Every 5 years at Prayaga, at the Ganga–Yamuna–Saraswati confluence", "Every 12 years at Ujjain", "Every year at Thanesar"], "answer": 1, "explanation": "The Prayaga festival was held every five years at the Ganga–Yamuna–Saraswati confluence and was traditionally linked to the beginning of the Kumbha Fair."}, {"q": "How did Hiuen-Tsang describe Harsha?", "options": ["As a liberal Mahayana Buddhist who also honoured other sects", "As a strict Shaivite who persecuted Buddhists", "As a Jain monk", "As a ruler hostile to all foreign visitors"], "answer": 0, "explanation": "Hiuen-Tsang described Harsha as a liberal Mahayana Buddhist who also honoured other sects."}, {"q": "How many villages were granted by Harshavardhana to support Nalanda University?", "options": ["50", "75", "100", "200"], "answer": 2, "explanation": "The page says Nalanda University was supported by revenue from 100 villages granted by Harshavardhana."}, {"q": "When did Harsha die, and who usurped the throne?", "options": ["637 AD; Shashanka", "647 AD; his minister Arunashva", "643 AD; Pulakeshin II", "606 AD; Rajyavardhana"], "answer": 1, "explanation": "Harsha died in 647 AD without an apparent heir; his minister Arunashva usurped the throne."}, {"q": "Which three Sanskrit plays are attributed to Harsha?", "options": ["Nagananda, Ratnavali and Priyadarshika", "Meghadutam, Raghuvamsham and Shakuntalam", "Mrichchhakatika, Mudrarakshasa and Malavikagnimitra", "Silappadikaram, Manimekalai and Sivaga Sindamani"], "answer": 0, "explanation": "The notes list Nagananda, Ratnavali and Priyadarshika as Harsha's Sanskrit plays."}, {"q": "Which two works are attributed to Banabhatta?", "options": ["Harshacharita and Kadambari", "Mayur Shataka and Surya Shataka", "Nagananda and Ratnavali", "Raghuvamsham and Meghadutam"], "answer": 0, "explanation": "Banabhatta is associated with Harshacharita and Kadambari."}, {"q": "Which works are attributed to Mayur?", "options": ["Harshacharita and Kadambari", "Mayur Shataka and Surya Shataka", "Nagananda and Priyadarshika", "Brihat Samhita and Brihat Jataka"], "answer": 1, "explanation": "The scholars-at-court section attributes Mayur Shataka and Surya Shataka to Mayur."}, {"q": "What broad administrative trend is noted for Harsha's period?", "options": ["The Gupta model continued but became more feudal and decentralised", "The Mauryan model was restored in a highly centralised form", "All feudatories and land grants were abolished", "Administration became entirely urban and commercial"], "answer": 0, "explanation": "The page states that administration followed the Gupta model but became more feudal and decentralised."}, {"q": "What was the capital of the Chalukyas of Vatapi/Vadami?", "options": ["Kanchi", "Vatapi/Badami in Karnataka", "Kannauj", "Thanesar"], "answer": 1, "explanation": "The notes identify Vatapi/Badami in Karnataka as the Chalukya capital."}, {"q": "What was the reign period given for the Chalukyas of Vatapi/Badami?", "options": ["543–755 AD", "550–647 AD", "575–897 AD", "609–642 AD"], "answer": 0, "explanation": "The page gives the Chalukyas of Vatapi/Badami as 543–755 AD."}, {"q": "Who was the Chalukya ruler who stopped Harsha's Deccan expansion?", "options": ["Pulakeshin I", "Pulakeshin II", "Vikramaditya I", "Narasimhavarman I"], "answer": 1, "explanation": "Pulakeshin II (609–642 AD) stopped Harsha's Deccan expansion."}, {"q": "What is the Aihole inscription described as?", "options": ["A royal edict by Harsha", "An eulogy written by court poet Ravikirti", "A Buddhist text by Hiuen-Tsang", "A treaty written by Pulakeshin II"], "answer": 1, "explanation": "The Aihole inscription is described as an eulogy written by court poet Ravikirti."}, {"q": "Which Chinese pilgrim visited the Chalukya kingdom?", "options": ["Fa-Hien", "Hiuen-Tsang", "I-Tsing", "Song Yun"], "answer": 1, "explanation": "The page states that Hiuen-Tsang visited the Chalukya kingdom."}, {"q": "Who defeated Pulakeshin II and captured Vatapi around 642 AD?", "options": ["Harsha", "Narasimhavarman I of the Pallavas", "Prabhakaravardhana", "Dhruvasena II"], "answer": 1, "explanation": "Narasimhavarman I of the Pallavas invaded Chalukya territory, killed Pulakeshin II and captured Vatapi around 642 AD."}, {"q": "What title did Narasimhavarman I assume after capturing Vatapi?", "options": ["Siladitya", "Vatapikonda, meaning Conqueror of Vatapi", "Sakari", "Lord of the whole of Northern country"], "answer": 1, "explanation": "Narasimhavarman I assumed the title Vatapikonda, meaning Conqueror of Vatapi."}, {"q": "What happened to Chalukya power in 757 AD?", "options": ["It was restored by Harsha", "It was overthrown by their feudatories, the Rashtrakutas", "It was conquered by the Huns", "It shifted its capital to Kanchi"], "answer": 1, "explanation": "The notes state that in 757 AD the Chalukyas were overthrown by their feudatories, the Rashtrakutas."}, {"q": "What dates are given for the Pallavas of Kanchi?", "options": ["543–755 AD", "550–647 AD", "575–897 AD", "606–647 AD"], "answer": 2, "explanation": "The page gives the Pallavas of Kanchi as 575–897 AD."}, {"q": "What is stated about the origin of the Pallavas?", "options": ["Their origin is certain and traced to the Guptas", "Their origin is controversial; they were possibly a local tribe", "They originated in Persia", "They were founded by the Chalukyas"], "answer": 1, "explanation": "The notes say the Pallavas' origin is controversial and they were possibly a local tribe."}, {"q": "Which religious description is given for the Pallavas?", "options": ["Orthodox Brahmanical Hindus", "Only Buddhist rulers", "Jain rulers", "Zoroastrian rulers"], "answer": 0, "explanation": "The page describes the Pallavas as orthodox Brahmanical Hindus."}, {"q": "What influence did Pallava culture have in South-East Asia?", "options": ["It helped spread Indian culture; Pallava influence was dominant in Cambodia by the 8th century AD", "It ended Indian cultural influence in Cambodia", "It was limited to Sri Lanka", "It introduced Persian architecture into Java"], "answer": 0, "explanation": "The page says Pallavas helped spread Indian culture in South-East Asia and that Pallava influence was dominant in Cambodia by the 8th century AD."}, {"q": "Where are Pallava-type Shikhara found, according to the page?", "options": ["Java, Cambodia and Annam", "Persia, Arabia and Egypt", "China, Korea and Japan", "Sri Lanka, Nepal and Tibet"], "answer": 0, "explanation": "The notes state that Pallava-type Shikhara are found in temples of Java, Cambodia and Annam."}, {"q": "Which architectural style did the Chalukyas of Vatapi develop?", "options": ["Nagara only", "Vesara/Deccan style", "Pure Dravidian only", "Indo-Islamic"], "answer": 1, "explanation": "The Chalukyas began the Vesara/Deccan style of structural temples."}, {"q": "Which group contains the Vesara/Deccan examples listed at Aihole?", "options": ["Jinendra/Meguti, Vishnu, Ladh Khan and Durga Temples", "Papanatha, Virupaksha and Sangamesvara Temples", "Kailasanatha, Shore and Vaikuntha Perumal Temples", "Dashavatara, Bhumra and Tigawa Temples"], "answer": 0, "explanation": "The notes list Jinendra/Meguti, Vishnu, Ladh Khan and Durga Temples at Aihole as Vesara/Deccan examples."}, {"q": "Why is Aihole called the 'Town of Temples'?", "options": ["It had about 70 temples", "It was the capital of Harsha", "It contained 100 Buddhist villages", "It was the birthplace of Kalidasa"], "answer": 0, "explanation": "The page calls Aihole the 'Town of Temples' and notes that it had about 70 temples."}, {"q": "Which temple is listed under the Nagara style at Pattadakal?", "options": ["Papanatha Temple", "Virupaksha Temple", "Sangamesvara Temple", "Ladh Khan Temple"], "answer": 0, "explanation": "Papanatha Temple at Pattadakal is listed as a Nagara-style example."}, {"q": "Which temples are listed as Dravidian-style examples at Pattadakal?", "options": ["Virupaksha and Sangamesvara Temples", "Papanatha and Ladh Khan Temples", "Jinendra and Meguti Temples", "Vishnu and Durga Temples at Aihole"], "answer": 0, "explanation": "The notes list Virupaksha Temple and Sangamesvara Temple at Pattadakal under Dravidian style."}, {"q": "Which architectural tradition did the Pallavas begin, later reaching its culmination under the Cholas?", "options": ["Nagara temple architecture", "Dravidian temple architecture", "Vesara temple architecture", "Stupa architecture"], "answer": 1, "explanation": "The page says the Pallavas began Dravidian temple architecture, which reached its culmination under the Cholas."}, {"q": "In which field did the Pallavas make a major contribution to South Indian art?", "options": ["Sculpture", "Coin minting", "Metal casting only", "Manuscript translation"], "answer": 0, "explanation": "The notes highlight the Pallavas' major contribution to South Indian sculpture."}, {"q": "Which tradition strongly influenced Pallava sculpture?", "options": ["Buddhist tradition", "Greek tradition", "Persian tradition", "Roman tradition"], "answer": 0, "explanation": "The page states that Pallava sculpture was strongly influenced by Buddhist tradition."}, {"q": "How is the Pallava sculptural style characterised?", "options": ["Monumental and linear, avoiding excessive Deccan ornamentation", "Small, highly ornate and densely decorated", "Entirely made of bronze", "Strictly abstract and without figures"], "answer": 0, "explanation": "The notes describe the style as monumental and linear, avoiding excessive Deccan ornamentation."}, {"q": "What is identified as the best example of Pallava art?", "options": ["Descent of the Ganges/Arjuna's Penance at Mamallapuram", "Aihole inscription", "Dashavatara Temple at Deogarh", "Dhamekh Stupa at Sarnath"], "answer": 0, "explanation": "The page identifies the Descent of the Ganges, also called Arjuna's Penance, at Mamallapuram as the best example."}, {"q": "According to the exam-focus line, which dynasties and themes are especially important for competitive exams?", "options": ["Vardhana dynasty, Chalukyas and Pallavas; chronology, rulers, conquests, art, literature and administration", "Only Mauryan rulers and Buddhist councils", "Only Gupta coinage and Roman trade", "Only Sangam literature and Tamil grammar"], "answer": 0, "explanation": "The exam-focus line highlights the Vardhana dynasty, Chalukyas and Pallavas, with emphasis on chronology, rulers, conquests, art, literature and administration."}];const KEY='ancient_post_gupta_vardhana_page12_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
