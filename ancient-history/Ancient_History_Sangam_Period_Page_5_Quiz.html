<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ancient History – Sangam Period Quiz</title>
<style>
:root{--navy:#102c70;--ink:#172033;--muted:#64748b;--line:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(110deg,#071d58,#17439a);color:white;padding:24px 16px;text-align:center}header h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stats{grid-template-columns:1fr 1fr}.opt{font-size:15px}}
</style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Sangam Period · Notes Page 5 · 32 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score"></strong>Score</div><div class="stat"><strong id="accuracy"></strong>Accuracy</div><div class="stat"><strong id="wrongCount"></strong>Incorrect</div></div><div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original=[{"q": "The Sangam Period covered which centuries, according to the notes?", "options": ["1st–3rd century BC", "1st–3rd century AD", "4th–6th century AD", "3rd–5th century BC"], "answer": 1, "explanation": "The page dates the Sangam Period to the 1st–3rd century AD."}, {"q": "Which symbols are associated with the three early Tamil kingdoms?", "options": ["Cheras–Tiger; Cholas–Fish; Pandyas–Bow", "Cheras–Bow; Cholas–Tiger; Pandyas–Fish", "Cheras–Fish; Cholas–Bow; Pandyas–Tiger", "Cheras–Tiger; Cholas–Bow; Pandyas–Fish"], "answer": 1, "explanation": "The symbols shown are Cheras—Bow, Cholas—Tiger and Pandyas—Fish."}, {"q": "Which regions formed the territory of the Cheras, according to the page?", "options": ["Parts of Kerala and Tamil Nadu", "Only modern Andhra Pradesh", "Modern Karnataka and Maharashtra", "Only northern Tamil Nadu"], "answer": 0, "explanation": "The notes give the Chera territory as parts of Kerala and Tamil Nadu."}, {"q": "What was the capital of the Cheras?", "options": ["Madurai", "Uraiyur", "Vanji", "Puhar"], "answer": 2, "explanation": "Vanji is identified as the Chera capital."}, {"q": "Which two ports are listed as the main ports of the Cheras?", "options": ["Puhar and Arikamedu", "Muzris and Tondi", "Barygaza and Barbaricum", "Kaveripattinam and Tondi"], "answer": 1, "explanation": "The main Chera ports listed are Muzris and Tondi."}, {"q": "What did the Romans establish at Muzris, according to the notes?", "options": ["Two regiments and a Temple of Augustus", "A naval dockyard and a Buddhist monastery", "A mint and a palace", "A fort and a Jain cave"], "answer": 0, "explanation": "The page states that Romans established two regiments at Muzris and built a Temple of Augustus there."}, {"q": "Who is identified as an early famous Chera ruler, traditionally said to have had both armies of the Kurukshetra War?", "options": ["Senguttuvan", "Udayangeral", "Karikala", "Nedunjeliyan"], "answer": 1, "explanation": "Udayangeral is described as an early famous Chera ruler, traditionally said to have fed both armies of the Kurukshetra War."}, {"q": "Who was known as the Red Chera and regarded as the greatest Chera king?", "options": ["Udayangeral", "Senguttuvan", "Elara", "Muduku-dumi"], "answer": 1, "explanation": "Senguttuvan is identified as the Red Chera and greatest Chera king."}, {"q": "Which major achievement is attributed to Senguttuvan?", "options": ["He founded Puhar", "He invaded the North and crossed the Ganges", "He built a 160-km Kaveri embankment", "He conquered Sri Lanka"], "answer": 1, "explanation": "The notes state that Senguttuvan invaded the North and crossed the Ganges."}, {"q": "Which cult did Senguttuvan found, and whom did it worship?", "options": ["Bhagavata cult; Krishna", "Pattini cult; Kannagi, goddess of chastity", "Shaiva cult; Shiva", "Buddhist cult; Buddha"], "answer": 1, "explanation": "Senguttuvan founded the Pattini cult, worshipping Kannagi as the goddess of chastity."}, {"q": "Cholamandalam was located in which direction of the Pandya kingdom, between which rivers?", "options": ["South-west, between Kaveri and Vaigai", "North-east, between Pennar and Vellar", "North-west, between Krishna and Godavari", "South-east, between Palar and Kaveri"], "answer": 1, "explanation": "The notes locate Cholamandalam to the north-east of the Pandya kingdom, between the Pennar and Vellar rivers."}, {"q": "Cholamandalam corresponded to which modern places?", "options": ["Madurai and Tirunelveli", "Tanjore and Tiruchirapalli", "Kochi and Kozhikode", "Chennai and Vellore"], "answer": 1, "explanation": "The page says Cholamandalam corresponded to modern Tanjore and Tiruchirapalli."}, {"q": "What was the inland capital of the Cholas, famous for cotton trade?", "options": ["Uraiyur", "Vanji", "Madurai", "Puhar"], "answer": 0, "explanation": "Uraiyur was the inland capital and was famous for cotton trade."}, {"q": "What was the main port of the Cholas, also called Kaveripattinam?", "options": ["Muzris", "Puhar", "Tondi", "Arikamedu"], "answer": 1, "explanation": "Puhar, also called Kaveripattinam, was the main Chola port."}, {"q": "Who is identified as the earliest known Chola ruler, who conquered Sri Lanka and ruled nearly 50 years?", "options": ["Karikala", "Elara", "Senguttuvan", "Nedunjeliyan"], "answer": 1, "explanation": "Elara is named as the earliest known Chola ruler; the notes say he conquered Sri Lanka and ruled nearly 50 years."}, {"q": "Who was regarded as the greatest Chola king and was known as the man with the charred leg?", "options": ["Elara", "Karikala", "Udayangeral", "Muduku-dumi"], "answer": 1, "explanation": "Karikala is identified as the greatest Chola king and glossed as 'man with charred leg'."}, {"q": "What major irrigation/engineering work is attributed to Karikala?", "options": ["A 160-km embankment along the Kaveri", "A dam across the Vaigai", "A canal from Pennar to Vellar", "A port embankment at Muzris"], "answer": 0, "explanation": "The notes say Karikala built a 160-km embankment along the Kaveri using 12,000 Sri Lankan slaves."}, {"q": "According to the page, what labour force was used to build Karikala's Kaveri embankment?", "options": ["12,000 Roman soldiers", "12,000 Sri Lankan slaves", "5,000 Chera prisoners", "10,000 Pandya workers"], "answer": 1, "explanation": "The notes specifically mention 12,000 Sri Lankan slaves."}, {"q": "Which naval capability is attributed to Karikala?", "options": ["He maintained an efficient navy", "He abolished the navy", "He controlled only river boats", "He built the first Roman fleet"], "answer": 0, "explanation": "The page states that Karikala maintained an efficient navy."}, {"q": "Who defeated or wiped out the later Cholas from the North, according to the notes?", "options": ["Sakas", "Pallavas", "Kushans", "Cheras"], "answer": 1, "explanation": "The notes state that later Cholas were defeated/wiped out by the Pallavas from the North."}, {"q": "By whom were the Pandyas first mentioned, and what were they famous for?", "options": ["Megasthenes; pearls", "Pliny; horses", "Ptolemy; cotton", "Strabo; spices"], "answer": 0, "explanation": "The Pandyas were first mentioned by Megasthenes and were famous for pearls."}, {"q": "Which areas are listed as Pandya territory?", "options": ["Modern Tirunelveli, Ramanathapuram and Madurai", "Modern Tanjore and Tiruchirapalli", "Parts of Kerala and Tamil Nadu", "Only the Kaveri delta"], "answer": 0, "explanation": "The notes give Pandya territory as modern Tirunelveli, Ramanathapuram and Madurai."}, {"q": "What was the capital of the Pandyas, and on which river was it situated?", "options": ["Vanji on Periyar", "Madurai on Vaigai", "Uraiyur on Kaveri", "Puhar on Pennar"], "answer": 1, "explanation": "Madurai was the Pandya capital, situated on the Vaigai River."}, {"q": "With which Roman emperors did the Pandyas send emissaries?", "options": ["Julius Caesar and Nero", "Augustus and Trajan", "Hadrian and Constantine", "Tiberius and Claudius"], "answer": 1, "explanation": "The notes state that the Pandyas sent emissaries to Roman emperors Augustus and Trajan."}, {"q": "In which two epics are the Pandyas mentioned, according to the page?", "options": ["Ramayana and Mahabharata", "Silappadikaram and Manimekalai", "Iliad and Odyssey", "Arthashastra and Indica"], "answer": 0, "explanation": "The page states that the Pandyas are mentioned in the Ramayana and Mahabharata."}, {"q": "Who is identified as the earliest known Pandya ruler?", "options": ["Nedunjeliyan", "Muduku-dumi", "Karikala", "Senguttuvan"], "answer": 1, "explanation": "Muduku-dumi is listed as the earliest known Pandya ruler."}, {"q": "Who is identified as the greatest Pandya king?", "options": ["Muduku-dumi", "Nedunjeliyan", "Elara", "Udayangeral"], "answer": 1, "explanation": "Nedunjeliyan is identified as the greatest Pandya king."}, {"q": "In the Kannagi story on the page, whom did Nedunjeliyan accuse of theft?", "options": ["Kannagi", "Kovalan", "Senguttuvan", "Karikala"], "answer": 1, "explanation": "The notes say Nedunjeliyan accused Kovalan of theft."}, {"q": "How did Kannagi respond, according to the page?", "options": ["She founded the Pattini cult", "She cursed Madurai", "She built the Kaveri embankment", "She crossed the Ganges"], "answer": 1, "explanation": "The page states that Kannagi, Kovalan's wife, cursed Madurai."}, {"q": "What was the chief source of wealth of the Pandya kingdom?", "options": ["Cotton", "Pearls", "Iron", "Horses"], "answer": 1, "explanation": "The notes identify pearls as the chief wealth of the Pandya kingdom."}, {"q": "What did Roman trade bring to the Pandyas?", "options": ["Political control over Rome", "Great wealth", "A new capital", "A new royal dynasty"], "answer": 1, "explanation": "The page states that Roman trade brought great wealth to the Pandyas."}, {"q": "Which set contains the exports listed for the Pandyas?", "options": ["Pearls, spices, ivory, fine cotton and precious stones", "Silk, horses, glass and wine", "Iron, timber, rice and salt only", "Gold, silver, copper and lead"], "answer": 0, "explanation": "The listed exports are pearls, spices, ivory, fine cotton and precious stones."}];const KEY='ancient_sangam_period_page5_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
