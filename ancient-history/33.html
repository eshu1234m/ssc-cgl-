</style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Gupta Period · Notes Page 7 · 39 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>

<script>
const original=[{"q": "In which century did the Guptas rise in Magadha, according to the notes?", "options": ["2nd century AD", "3rd century AD", "4th century AD", "5th century AD"], "answer": 2, "explanation": "The notes state that the Guptas rose in Magadha in the 4th century AD."}, {"q": "For approximately how long did the Guptas rule most of Northern India?", "options": ["100 years", "200 years", "300 years", "400 years"], "answer": 1, "explanation": "The page says they ruled most of Northern India for 200+ years."}, {"q": "The Gupta period is known as which age of ancient India?", "options": ["Dark Age", "Classical Age / Golden Age", "Vedic Age", "Sangam Age"], "answer": 1, "explanation": "The notes describe the Gupta period as the Classical Age or Golden Age of ancient India."}, {"q": "Who is identified as the founder of the Gupta dynasty, and what title did he hold?", "options": ["Ghatotkacha – Maharajadhiraja", "Gupta – Maharaja", "Chandragupta I – Vikramaditya", "Samudragupta – Sarva-raj-ochhetta"], "answer": 1, "explanation": "The founder is named Gupta, with the title Maharaja."}, {"q": "Who succeeded Gupta, and what title did he also hold?", "options": ["Ghatotkacha – Maharaja", "Chandragupta I – Maharaja", "Samudragupta – Maharaja", "Ramagupta – Maharaja"], "answer": 0, "explanation": "Ghatotkacha succeeded Gupta and was also titled Maharaja."}, {"q": "What was the reign period of Chandragupta I?", "options": ["319–334 AD", "335–380 AD", "380–414 AD", "414–455 AD"], "answer": 0, "explanation": "The page gives Chandragupta I's reign as 319–334 AD."}, {"q": "Which Gupta ruler was the first to assume the title Maharajadhiraja?", "options": ["Gupta", "Ghatotkacha", "Chandragupta I", "Samudragupta"], "answer": 2, "explanation": "Chandragupta I was the first Gupta ruler to assume the title Maharajadhiraja."}, {"q": "Whom did Chandragupta I marry to gain power, resources and prestige?", "options": ["Dhruvadevi", "Kuberanaga", "Kumaradevi", "Prabhavatigupta"], "answer": 2, "explanation": "Chandragupta I married Kumaradevi, a Licchhavi princess."}, {"q": "Chandragupta I established authority over which three areas listed in the notes?", "options": ["Magadha, Prayaga and Saketa", "Ujjain, Taxila and Mathura", "Kalinga, Avanti and Gandhara", "Pataliputra, Vaishali and Kashi"], "answer": 0, "explanation": "The page lists Magadha, Prayaga and Saketa."}, {"q": "When did Chandragupta I start the Gupta Era, according to the notes?", "options": ["78 AD", "319–20 AD", "335 AD", "380 AD"], "answer": 1, "explanation": "The notes say Chandragupta I started the Gupta Era in 319–20 AD."}, {"q": "What type of gold coin of Chandragupta I is shown on the page?", "options": ["Ashvamedha type", "Kumaradevi type (Dinaras)", "Saka victory type", "Lion-slayer type"], "answer": 1, "explanation": "The coin caption identifies the gold coin as Chandragupta I–Kumaradevi type (Dinaras)."}, {"q": "What was the reign period of Samudragupta?", "options": ["319–334 AD", "335–380 AD", "380–414 AD", "414–455 AD"], "answer": 1, "explanation": "The page gives Samudragupta's reign as 335–380 AD."}, {"q": "Which inscription is the main source for Samudragupta's achievements, and who composed it?", "options": ["Junagadh inscription by Rudradaman", "Prayaga Prasasti/Allahabad Pillar Inscription by Harisena", "Hathigumpha inscription by Kharavela", "Nasik inscription by Gautamiputra"], "answer": 1, "explanation": "Samudragupta is known mainly through the Prayaga Prasasti/Allahabad Pillar Inscription composed by court poet Harisena."}, {"q": "Who called Samudragupta the 'Indian Napoleon'?", "options": ["Harisena", "V.A. Smith", "Kalidasa", "Fa-Hien"], "answer": 1, "explanation": "The notes attribute the title 'Indian Napoleon' to V.A. Smith."}, {"q": "What did Samudragupta do with the territories of defeated rulers in the Ganga Valley and Central India?", "options": ["Returned all territories", "Annexed the territories", "Created independent republics", "Gave them to the Vakatakas"], "answer": 1, "explanation": "The notes state that defeated rulers' territories in the Ganga Valley and Central India were annexed."}, {"q": "What was Samudragupta's policy towards the rulers of South India?", "options": ["Defeated and annexed all their territories", "Defeated them but did not annex their territories", "Made them all governors of Magadha", "Avoided all military campaigns"], "answer": 1, "explanation": "The page says South Indian rulers were defeated, but their territories were not annexed."}, {"q": "Samudragupta's empire extended towards which north-western and Deccan powers/territories?", "options": ["Kushans in the north-west and Vakatakas in the Deccan", "Sakas in the north-west and Cholas in the Deccan", "Parthians in the north-west and Pandyas in the Deccan", "Huns in the north-west and Pallavas in the Deccan"], "answer": 0, "explanation": "The notes say the empire extended to areas bordering Kushan territory in the north-west and the Vakatakas in the Deccan."}, {"q": "References to Java, Sumatra and Malaya in Samudragupta's account indicate what?", "options": ["Land revenue reforms", "Naval power", "Coinage reform", "Marriage alliances"], "answer": 1, "explanation": "The page says references to Java, Sumatra and Malaya indicate naval power."}, {"q": "What is described as Samudragupta's greatest achievement?", "options": ["Conquest of Sri Lanka", "Political unification of much of Aryavarta", "Construction of Ujjain", "Defeat of the Sakas"], "answer": 1, "explanation": "The notes identify political unification of much of Aryavarta as his greatest achievement."}, {"q": "Which title of Samudragupta means 'King of poets'?", "options": ["Vikrama", "Kaviraja", "Param Bhagavata", "Sarva-raj-ochhetta"], "answer": 1, "explanation": "Kaviraja means King of poets."}, {"q": "Which title is associated with the Nalanda Copper Plate?", "options": ["Kaviraja", "Param Bhagavata", "Ashvamedha-parakrama", "Sakari"], "answer": 1, "explanation": "The notes associate Param Bhagavata with the Nalanda Copper Plate."}, {"q": "Ashvamedha-parakrama is associated with which type of coin?", "options": ["Silver coin", "Copper coin", "Horse-sacrifice coin", "Lion coin"], "answer": 2, "explanation": "The page labels Ashvamedha-parakrama as a horse-sacrifice coin."}, {"q": "What does the title Vikrama signify in the list of Samudragupta's titles?", "options": ["King of poets", "Prowess", "Uprooter of all kings", "Devotee of Vishnu"], "answer": 1, "explanation": "The page explains Vikrama as prowess."}, {"q": "What is the meaning given for Samudragupta's title Sarva-raj-ochhetta?", "options": ["King of poets", "Prowess", "Uprooter of all kings", "Great devotee"], "answer": 2, "explanation": "The notes explain Sarva-raj-ochhetta as 'Uprooter of all kings'."}, {"q": "Which Gupta ruler is identified as the only one with the title Sarva-raj-ochhetta?", "options": ["Chandragupta I", "Samudragupta", "Chandragupta II", "Ramagupta"], "answer": 1, "explanation": "The page states that only Gupta ruler with the title Sarva-raj-ochhetta was Samudragupta."}, {"q": "Which religious description is given for Samudragupta?", "options": ["Buddhist", "Jain", "Vaishnavite", "Shaivite"], "answer": 2, "explanation": "The notes describe Samudragupta as Vaishnavite."}, {"q": "Which Sri Lankan king sent an embassy seeking permission to build a Buddhist monastery at Bodh Gaya?", "options": ["Meghavarna", "Rudrasena II", "Nahapana", "Kanishka"], "answer": 0, "explanation": "The page says Sri Lankan king Meghavarna sent an embassy seeking permission to build a Buddhist monastery at Bodh Gaya."}, {"q": "What was the reign period of Chandragupta II, also known as Vikramaditya?", "options": ["335–380 AD", "380–414 AD", "414–455 AD", "319–334 AD"], "answer": 1, "explanation": "The page gives Chandragupta II's reign as 380–414 AD."}, {"q": "According to Devichandragupta by Vishakhadatta, who briefly succeeded Samudragupta?", "options": ["Ramagupta", "Ghatotkacha", "Kumaragupta", "Skandagupta"], "answer": 0, "explanation": "The notes state that Ramagupta briefly succeeded Samudragupta, according to Devichandragupta by Vishakhadatta."}, {"q": "What is distinctive about Ramagupta's coinage in the notes?", "options": ["Only Gupta ruler known to issue copper coins", "First Gupta ruler to issue silver coins", "First ruler to issue gold coins", "Only ruler to issue horse-sacrifice coins"], "answer": 0, "explanation": "The page describes Ramagupta as the only Gupta ruler known to issue copper coins."}, {"q": "What did Ramagupta agree to do to appease the Saka ruler?", "options": ["Surrender Ujjain", "Surrender queen Dhruvadevi", "Pay tribute to the Kushans", "Give up the Gupta Era"], "answer": 1, "explanation": "The notes state that Ramagupta agreed to surrender queen Dhruvadevi to a Saka ruler."}, {"q": "How did Chandragupta II respond to the Saka ruler's demand, according to the notes?", "options": ["He sent Ramagupta in disguise", "He disguised himself as the queen, entered the enemy camp and killed the Saka ruler", "He paid the demanded tribute", "He abandoned the campaign"], "answer": 1, "explanation": "The page says Chandragupta II disguised himself as the queen, entered the enemy camp and killed the Saka ruler."}, {"q": "What happened to Ramagupta after the Saka ruler was killed?", "options": ["He became emperor again", "Chandragupta II later killed Ramagupta, took the throne and married Dhruvadevi", "He became governor of Ujjain", "He founded the Vakataka dynasty"], "answer": 1, "explanation": "The notes state that Chandragupta II later killed Ramagupta, took the throne and married Dhruvadevi."}, {"q": "Whom did Chandragupta II marry from the Naga dynasty?", "options": ["Kumaradevi", "Kuberanaga", "Dhruvadevi", "Prabhavatigupta"], "answer": 1, "explanation": "The expansion and achievements section lists his marriage to Kuberanaga of the Naga dynasty."}, {"q": "Whom did Chandragupta II's daughter Prabhavatigupta marry?", "options": ["Rudrasena II, a Vakataka prince", "Meghavarna, a Sri Lankan king", "Harisena, his court poet", "Rudradaman, a Saka ruler"], "answer": 0, "explanation": "The notes say his daughter Prabhavatigupta married Vakataka prince Rudrasena II."}, {"q": "Which people did Chandragupta II defeat in Western India, extending the empire to the Arabian Sea?", "options": ["Kushans", "Sakas", "Parthians", "Yuezhis"], "answer": 1, "explanation": "The notes state that Chandragupta II defeated the Sakas in Western India and extended the empire to the Arabian Sea."}, {"q": "What was the significance of Chandragupta II's silver coinage?", "options": ["He was the first Gupta ruler to issue silver coins", "He was the only Gupta ruler to issue copper coins", "He introduced the Gupta Era", "He issued the first gold coins in India"], "answer": 0, "explanation": "The page identifies Chandragupta II as the first Gupta ruler to issue silver coins."}, {"q": "Which titles did Chandragupta II receive after defeating the Sakas?", "options": ["Kaviraja and Param Bhagavata", "Sakari and Vikramaditya", "Maharaja and Maharajadhiraja", "Indian Napoleon and Sarva-raj-ochhetta"], "answer": 1, "explanation": "The notes list Sakari and Vikramaditya as his titles."}, {"q": "Which city became the second capital during Chandragupta II's reign?", "options": ["Pataliputra", "Prayaga", "Ujjain", "Mathura"], "answer": 2, "explanation": "The page states that Ujjain became the second capital."}];const KEY='ancient_gupta_period_page7_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
