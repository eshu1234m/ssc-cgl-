<style>

.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #102c7010}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}h2{font-size:21px;line-height:1.45;margin:12px 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#5483e7;background:#f7faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#15945b;background:#eaf8f0;color:#075b35}.opt.wrong{border-color:#d64545;background:#fff0f0;color:#922020}.feedback{display:none;margin-top:17px;padding:15px;border-radius:11px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;border:1px solid #a8dfbf}.feedback.bad{background:#fff1f0;border:1px solid #f1b8b3}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button.action{border:0;border-radius:9px;padding:11px 17px;background:var(--navy);color:white;font-weight:650;font-size:14px;cursor:pointer}button.action.secondary{background:#e9eef7;color:#1e3158}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:var(--muted);font-size:13px;margin-top:14px}.result{display:none}.result h2{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3f6fb;padding:15px;border-radius:10px;text-align:center}.stat strong{display:block;font-size:24px;color:var(--navy)}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item b{display:block;margin-bottom:6px}.tag{font-size:12px;font-weight:700;color:#3159a5}@media(max-width:520px){.panel{padding:17px}.stat </style></head><body><header><h1>ANCIENT HISTORY MCQ QUIZ</h1><p>Foreign Successors of the Mauryas · Notes Page 4 · 40 Questions</p></header>
<div class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tag">PAGE-BASED PRACTICE</div><h2 id="question"></h2><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="action secondary" id="prev">← Previous</button><button class="action" id="next">Next →</button></div><p class="small">Answers and progress are saved locally in this browser on this device.</p></section>
<section class="panel result" id="result"><h2>Quiz completed!</h2><p id="summary"></p><div class="stats"><div class="stat"><strong id="score"></strong>Score</div><div class="stat"><strong id="accuracy"></strong>Accuracy</div><div class="stat"><strong id="wrongCount"></strong>Incorrect</div></div><div class="controls"><button class="action" id="retryWrong">Revise incorrect answers</button><button class="action secondary" id="restart">Restart full quiz</button></div><div id="review"></div></section></div>
<script>
const original=[{"q": "Who were the first foreign rulers of North-West India in the post-Mauryan period, according to the notes?", "options": ["Sakas", "Indo-Greeks", "Parthians", "Kushans"], "answer": 1, "explanation": "The page identifies the Indo-Greeks as the first foreign rulers of North-West India in the post-Mauryan period."}, {"q": "Who was the most famous Indo-Greek ruler, also known as Milinda?", "options": ["Gondophares", "Menander", "Rudradaman", "Kanishka"], "answer": 1, "explanation": "Menander, also known as Milinda, is identified as the most famous Indo-Greek ruler."}, {"q": "What dates are given for Menander's reign?", "options": ["185–73 BC", "165–145 BC", "130–150 AD", "78–101 AD"], "answer": 1, "explanation": "The notes give Menander's dates as 165–145 BC."}, {"q": "According to the notes, Menander converted to Buddhism under whose influence?", "options": ["Ashvaghosha", "Nagasena/Nagarjuna", "Parshva", "Charaka"], "answer": 1, "explanation": "The page states that Menander converted to Buddhism by Nagasena/Nagarjuna."}, {"q": "Which language pair is shown on the bilingual silver coin of Menander?", "options": ["Greek–Brahmi", "Greek–Kharoshthi", "Prakrit–Sanskrit", "Greek–Pali"], "answer": 1, "explanation": "The caption identifies Menander's silver coin as bilingual: Greek–Kharoshthi."}, {"q": "Which foreign rulers are described as the first Indian rulers whose coins can be definitely attributed to kings?", "options": ["Sakas", "Indo-Greeks", "Parthians", "Kushans"], "answer": 1, "explanation": "The Indo-Greeks are credited on the page with being the first Indian rulers whose coins can be definitely attributed to kings."}, {"q": "Which coinage achievement is attributed to the Indo-Greeks in the notes?", "options": ["First to issue silver coins", "First to issue gold coins", "First to issue copper coins", "First to issue potin coins"], "answer": 1, "explanation": "The notes state that Indo-Greeks were the first to issue gold coins."}, {"q": "Which artistic influence did the Indo-Greeks introduce, according to the page?", "options": ["Persian art features leading to Mathura School", "Greek (Hellenic) art features leading to Gandhara School", "Roman art features leading to Amaravati School", "Chinese art features leading to Sanchi School"], "answer": 1, "explanation": "The page links Greek (Hellenic) art features with the Gandhara School."}, {"q": "The Sakas were also known by which name?", "options": ["Yuezhis", "Scythians", "Pahlavas", "Andhras"], "answer": 1, "explanation": "The Sakas are also called Scythians in the notes."}, {"q": "Which group did the Sakas replace?", "options": ["Mauryas", "Indo-Greeks", "Parthians", "Kushans"], "answer": 1, "explanation": "The notes state that the Sakas replaced the Indo-Greeks."}, {"q": "How many Saka branches are mentioned, and which region did the most important branch rule until the 4th century AD?", "options": ["Three; Eastern India", "Five; Western India", "Four; Central India", "Seven; North India"], "answer": 1, "explanation": "The page mentions five branches and says the most important ruled Western India until the 4th century AD."}, {"q": "Who is identified as the greatest Saka ruler, with dates 130–150 AD?", "options": ["Nahapana", "Rudradaman", "Chashtana", "Ushavadeva"], "answer": 1, "explanation": "Rudradaman (130–150 AD) is identified as the greatest Saka ruler."}, {"q": "Which lake did Rudradaman repair?", "options": ["Pushkar Lake", "Sudarshana Lake", "Dal Lake", "Chilika Lake"], "answer": 1, "explanation": "The notes state that Rudradaman repaired Sudarshana Lake."}, {"q": "Which inscription is described as the first long inscription in chaste Sanskrit?", "options": ["Hathigumpha Inscription", "Junagadh Rock Inscription of Rudradaman", "Rabatak Inscription", "Nasik Inscription"], "answer": 1, "explanation": "The Junagadh Rock Inscription of Rudradaman is described as the first long inscription in chaste Sanskrit."}, {"q": "Which of the following is listed as another Saka ruler besides Rudradaman?", "options": ["Chashtana", "Vima Kadphises", "Gondophares", "Menander"], "answer": 0, "explanation": "Other Saka rulers listed are Nahapana, Ushavadeva, Ghamatika and Chashtana."}, {"q": "58 BC is traditionally associated with which event/person in the Saka section?", "options": ["Kanishka's accession", "Vikramaditya of Ujjain defeating the Sakas", "Rudradaman repairing Sudarshana Lake", "Menander's conversion to Buddhism"], "answer": 1, "explanation": "The notes say 58 BC is traditionally associated with Vikramaditya of Ujjain defeating the Sakas."}, {"q": "From which year does Vikrama Samvat begin, according to the page?", "options": ["78 AD", "58 BC", "130 AD", "46 AD"], "answer": 1, "explanation": "The page states that Vikrama Samvat begins from 58 BC."}, {"q": "The Parthians originally came from which region?", "options": ["Central Asia", "Iran", "China", "North-West India"], "answer": 1, "explanation": "The notes state that the Parthians originally came from Iran."}, {"q": "Which group did the Parthians replace in North-West India?", "options": ["Indo-Greeks", "Sakas", "Mauryas", "Kushans"], "answer": 1, "explanation": "The Parthians replaced the Sakas in North-West India, but controlled a smaller area."}, {"q": "Who was the famous Parthian ruler mentioned in the notes?", "options": ["Gondophares", "Kujula Kadphises", "Nahapana", "Vasudeva I"], "answer": 0, "explanation": "Gondophares is named as the famous Parthian ruler."}, {"q": "During whose reign is St. Thomas traditionally said to have come to India to spread Christianity?", "options": ["Menander", "Gondophares", "Rudradaman", "Kanishka"], "answer": 1, "explanation": "The notes state that St. Thomas is traditionally said to have come to India during Gondophares' reign."}, {"q": "The Kushans were one of the five clans of which Central Asian people?", "options": ["Sakas", "Yuezhi (Yuezhis)", "Parthians", "Indo-Greeks"], "answer": 1, "explanation": "The Kushans are described as one of the five Yuezhi clans of Central Asia."}, {"q": "Which dynasty did the Kushans replace in North-West India?", "options": ["Sakas", "Parthians", "Indo-Greeks", "Mauryas"], "answer": 1, "explanation": "The notes state that the Kushans replaced the Parthians in North-West India."}, {"q": "Who founded the Kushan Dynasty?", "options": ["Vima Kadphises", "Kujula Kadphises", "Kanishka", "Vasudeva I"], "answer": 1, "explanation": "Kujula Kadphises is identified as the founder of the Kushan Dynasty."}, {"q": "Who was the second Kushan ruler and issued gold coins?", "options": ["Kujula Kadphises", "Vima Kadphises", "Kanishka", "Vasudeva I"], "answer": 1, "explanation": "Vima Kadphises was the second ruler and issued gold coins."}, {"q": "According to the Rabatak Inscription, Kanishka was the son of whom?", "options": ["Kujula Kadphises", "Vima Kadphises", "Gondophares", "Vasudeva I"], "answer": 1, "explanation": "The page states that Kanishka was the son of Vima Kadphises according to the Rabatak Inscription."}, {"q": "Which two cities are given as the Kushan capitals?", "options": ["Taxila and Ujjain", "Purushapura (Peshawar) and Mathura", "Pataliputra and Vidisha", "Bharuch and Arikamedu"], "answer": 1, "explanation": "The notes list Purushapura (Peshawar) and Mathura as the Kushan capitals."}, {"q": "What dates are given for Kanishka's reign?", "options": ["60–37 BC", "130–150 AD", "78–101 AD", "106–130 AD"], "answer": 2, "explanation": "The page gives Kanishka's reign as 78–101 AD and calls him the 'Second Ashoka'."}, {"q": "Which era did Kanishka establish in 78 AD, according to the notes?", "options": ["Vikrama Samvat", "Saka Era", "Gupta Era", "Kali Era"], "answer": 1, "explanation": "The notes state that Kanishka began the Saka Era in 78 AD, which was used by the Government of India."}, {"q": "Kanishka was a great patron of which form of Buddhism?", "options": ["Theravada Buddhism", "Mahayana Buddhism", "Vajrayana only", "Hinayana only"], "answer": 1, "explanation": "The page identifies Kanishka as a great patron of Mahayana Buddhism."}, {"q": "Where was the Fourth Buddhist Council held under Kanishka, according to the notes?", "options": ["Vaishali, Bihar", "Kundalavana, Kashmir", "Sarnath, Uttar Pradesh", "Pataliputra, Bihar"], "answer": 1, "explanation": "The notes place the Fourth Buddhist Council at Kundalavana in Kashmir, where Mahayana doctrines were finalised."}, {"q": "Who is identified as the last great Kushan ruler?", "options": ["Kujula Kadphises", "Vima Kadphises", "Vasudeva I", "Kanishka"], "answer": 2, "explanation": "The page identifies Vasudeva I as the last great Kushan ruler."}, {"q": "The Kushans controlled which major trade route, providing a major source of income?", "options": ["Spice Route from South India to Rome", "Silk Route from China through Kushan territory to Iran and Western Asia", "Uttarapatha from Bengal to Taxila only", "Dakshinapatha from Ujjain to Kalinga"], "answer": 1, "explanation": "The notes state that Kushans controlled the Silk Route from China through their territory to Iran and Western Asia, a major source of income."}, {"q": "Which Indian rulers are credited on the page with issuing gold coins on a wide scale for the first time?", "options": ["Indo-Greeks", "Sakas", "Kushans", "Parthians"], "answer": 2, "explanation": "The Kanishka section states that Kushans were the first Indian rulers to issue gold coins on a wide scale."}, {"q": "Which of the following is listed as a scholar at Kanishka's court?", "options": ["Patanjali", "Charaka", "Gunadhya", "Kalidasa"], "answer": 1, "explanation": "The scholars listed at Kanishka's court are Parshva, Vasumitra, Ashvaghosha, Nagarjuna, Charaka and Mathara."}, {"q": "Which group contains only scholars listed at Kanishka's court?", "options": ["Parshva, Vasumitra, Ashvaghosha, Nagarjuna", "Patanjali, Hala, Gunadhya, Kalidasa", "Nagasena, Rudradaman, Chashtana, Nahapana", "Kujula, Vima, Kanishka, Vasudeva"], "answer": 0, "explanation": "The page lists Parshva, Vasumitra, Ashvaghosha, Nagarjuna, Charaka and Mathara as scholars at Kanishka's court."}, {"q": "Who discovered the monsoon sea route from West Asia to India, according to the notes?", "options": ["Menander", "Greek sailor Hippalus", "Gondophares", "Rudradaman"], "answer": 1, "explanation": "The notes state that Greek sailor Hippalus discovered the monsoon sea route from West Asia to India in 46–47 AD."}, {"q": "What date is given for Hippalus' discovery of the monsoon sea route?", "options": ["58 BC", "78 AD", "46–47 AD", "130–150 AD"], "answer": 2, "explanation": "The page gives the date as 46–47 AD."}, {"q": "Which port pair is correctly matched with the Western Coast?", "options": ["Arikamedu and Poduke", "Barygaza (Bharuch) and Barbaricum", "Mathura and Purushapura", "Nasik and Kanheri"], "answer": 1, "explanation": "The notes list Barygaza (Bharuch) and Barbaricum as ports on the Western Coast."}, {"q": "Arikamedu (Poduke) is located on which coast, near which present-day place?", "options": ["Western Coast near Bharuch", "Eastern Coast near present-day Puducherry", "Northern Coast near Peshawar", "Southern Coast near Kanyakumari"], "answer": 1, "explanation": "The page identifies Arikamedu (Poduke) as an Eastern Coast port near present-day Puducherry."}];const KEY='ancient_foreign_successors_mauryas_page4_v1';
let questions=original.map((x,i)=>({...x,id:i,options:x.options.map((v,j)=>({text:v,correct:j===x.answer})).sort(()=>Math.random()-.5)}));
let answers={},index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,index,optionOrders:questions.map(q=>({id:q.id,options:q.options.map(o=>o.text)}))}));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers){answers=s.answers;index=Math.min(s.index||0,questions.length-1);if(s.optionOrders)s.optionOrders.forEach(z=>{let q=questions.find(x=>x.id===z.id);if(q)q.options=z.options.map(t=>({text:t,correct:t===q.options.find(o=>o.correct).text}));});}}catch(e){}}
function render(){let q=questions[index],chosen=answers[q.id];document.getElementById('count').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('answered').textContent=`Answered: ${Object.keys(answers).length} / ${questions.length}`;document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';document.getElementById('question').textContent=q.q;let area=document.getElementById('options');area.innerHTML='';
q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o.text;if(chosen!==undefined){b.disabled=true;if(o.correct)b.classList.add('correct');else if(chosen===j)b.classList.add('wrong');}b.onclick=()=>choose(j);area.appendChild(b);});
let fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';if(chosen!==undefined){let ok=q.options[chosen].correct;fb.classList.add('show',ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+q.explanation;}
document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'See results':'Next →';}
function choose(j){if(answers[questions[index].id]!==undefined)return;answers[questions[index].id]=j;save();render();}
function next(){if(index<questions.length-1){index++;save();render();}else showResults();}function prev(){if(index>0){index--;save();render();}}
function showResults(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let correct=questions.filter(q=>answers[q.id]!==undefined&&q.options[answers[q.id]].correct).length,wrong=questions.length-correct,pct=Math.round(correct/questions.length*100);document.getElementById('score').textContent=correct+'/'+questions.length;document.getElementById('accuracy').textContent=pct+'%';document.getElementById('wrongCount').textContent=wrong;document.getElementById('summary').textContent=wrong===0?'Excellent — all answers are correct.':`You answered ${correct} correctly. Review the explanations for missed questions.`;let r=document.getElementById('review');r.innerHTML='<h3>Answer review</h3>';questions.forEach((q,i)=>{let a=answers[q.id],ok=a!==undefined&&q.options[a].correct;if(!ok){let d=document.createElement('div');d.className='review-item';d.innerHTML='<b>Q'+(i+1)+'. '+q.q+'</b><div>Your answer: '+(a===undefined?'Not answered':q.options[a].text)+'</div><div>Correct answer: <strong>'+q.options.find(o=>o.correct).text+'</strong></div><div class="small">'+q.explanation+'</div>';r.appendChild(d);}});save();}
function startWrong(){let wrong=questions.filter(q=>answers[q.id]===undefined||!q.options[answers[q.id]].correct);if(!wrong.length){alert('No incorrect answers to revise.');return;}questions=wrong;answers={};index=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('restart').onclick=restart;document.getElementById('retryWrong').onclick=startWrong;load();render();
</script></body></html>
